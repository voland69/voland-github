<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0e14;color:#d8d2b8;font-family:Inter,Arial,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0;background:url("./assets/heroes/bg-battlefield.webp") center/cover no-repeat fixed}
.bg:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.6)}
.wrap{position:fixed;inset:0;display:flex;z-index:2}
.left-nav{width:68px;min-width:68px;background:rgba(18,24,30,.9);border-right:1px solid #2a3a4a;display:flex;flex-direction:column;justify-content:space-between;height:100%;padding:12px 6px;backdrop-filter:blur(4px)}
.nav-top{display:flex;flex-direction:column;gap:16px;align-items:center}
.nav-bottom{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center}
.nav-group{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.nav-item{width:48px;height:48px;background:#1a252f;border:1px solid #2a3a4a;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;opacity:.6;transition:.2s}
.nav-item.active{border-color:#e6d5a0;opacity:1;background:#1e2f3e;box-shadow:0 0 12px rgba(230,213,160,.3)}
.nav-label{font-size:7px;color:#6a7a8a;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-align:center}
.nav-group.active .nav-label{color:#e6d5a0}
.center{flex:1;padding:20px;overflow:auto;display:flex;flex-direction:column;align-items:center}
.miss-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%;max-width:1100px;margin-top:16px}
.miss-card{background:rgba(20,26,34,.9);border:1px solid rgba(122,144,168,.2);border-radius:12px;padding:14px;transition:.2s}
.miss-card:hover{border-color:#e6d5a0;transform:translateY(-2px)}
.miss-card.done{border-color:#3ad080;opacity:.6}
.miss-card.locked{opacity:.9;background:rgba(18,18,18,.9);border-style:dashed;pointer-events:none}
.miss-card.ready{border-color:#e6d5a0;box-shadow:0 0 18px rgba(230,213,160,.4)}
.miss-card.progress{border-color:#5a6a7a;opacity:.85}
.claim-btn{margin-top:10px;width:100%;height:32px;background:linear-gradient(180deg,#e6d5a0,#c9b86e);border:1px solid #e6d5a0;border-radius:8px;color:#0a0e14;font:800 10px 'JetBrains Mono',monospace;cursor:pointer}
.claim-btn:disabled{background:#2a2a2a;border-color:#444;color:#666;cursor:not-allowed}
.miss-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.miss-icon{font-size:22px}
.miss-title{font:700 12px 'Cinzel Decorative',serif;color:#e6d5a0}
.miss-desc{font-size:11px;color:#a8a090;margin:6px 0}
.miss-reward{font-size:10px;color:#ffd700}
.miss-progress{margin-top:8px;height:6px;background:#1a1a1a;border-radius:3px;overflow:hidden}
.miss-progress-fill{height:100%;background:linear-gradient(90deg,#e6d5a0,#c9b86e);transition:.3s}
.miss-progress-text{font-size:9px;color:#8a9aaa;margin-top:4px;font-family:'JetBrains Mono',monospace}

.main,.center,.center-col,.hero-panel{
  position:relative !important;
  z-index:1 !important;
}

.nav-label{

  border-radius:6px !important;

  letter-spacing:.15em !important;
  white-space:nowrap !important;
  opacity:0 !important;
  pointer-events:none !important;
  transition:.18s !important;
  z-index:30 !important;
  box-shadow:0 4px 16px rgba(0,0,0,.5) !important;
}
.nav-group:hover .nav-label{
  opacity:1 !important;
  transform:translateY(-50%) translateX(0) !important;

.wrap{

</style>

<script>
const FALLBACK_MISSIONS=[
{id:1,name:'ПЕСЧАНАЯ РЕЗНЯ I',icon:'🏜️',prev:null,type:'kill_mob',loc:1,target:20,reward:{gold:100,xp:200},desc:'Убей 20 мобов в Пустыне'},
{id:2,name:'ПЕСЧАНАЯ РЕЗНЯ II',icon:'🏜️',prev:1,type:'kill_mob',loc:1,target:50,reward:{gold:250,xp:500},desc:'Убей 50 мобов в Пустыне'},
{id:3,name:'ПЕСЧАНАЯ РЕЗНЯ III',icon:'🏜️',prev:2,type:'kill_mob',loc:1,target:100,reward:{gold:500,xp:1000},desc:'Убей 100 мобов в Пустыне'},
{id:4,name:'ЛЕСНОЙ ОХОТНИК I',icon:'🌲',prev:null,type:'kill_mob',loc:2,target:20,reward:{gold:120,xp:300},desc:'Убей 20 мобов в Лесу'},
{id:5,name:'ЛЕСНОЙ ОХОТНИК II',icon:'🌲',prev:4,type:'kill_mob',loc:2,target:50,reward:{gold:300,xp:750},desc:'Убей 50 мобов в Лесу'},
{id:6,name:'ЛЕСНОЙ ОХОТНИК III',icon:'🌲',prev:5,type:'kill_mob',loc:2,target:100,reward:{gold:600,xp:1500},desc:'Убей 100 мобов в Лесу'},
{id:7,name:'МОРОЗНЫЙ УБИЙЦА I',icon:'❄️',prev:null,type:'kill_mob',loc:3,target:20,reward:{gold:150,xp:400},desc:'Убей 20 мобов в Льдах'},
{id:8,name:'МОРОЗНЫЙ УБИЙЦА II',icon:'❄️',prev:7,type:'kill_mob',loc:3,target:50,reward:{gold:350,xp:1000},desc:'Убей 50 мобов в Льдах'},
{id:9,name:'МОРОЗНЫЙ УБИЙЦА III',icon:'❄️',prev:8,type:'kill_mob',loc:3,target:100,reward:{gold:700,xp:2000},desc:'Убей 100 мобов в Льдах'},
{id:10,name:'ПЕРВЫЙ ТРОФЕЙ',icon:'👹',prev:null,type:'kill_boss',target:1,reward:{gold:200,xp:500},desc:'Убей 1 босса'},
{id:11,name:'ОХОТНИК НА БОССОВ',icon:'💀',prev:10,type:'kill_boss_diff',target:3,reward:{gold:400,xp:1000},desc:'Убей 3 боссов'},
{id:12,name:'ПОВЕЛИТЕЛЬ БОССОВ',icon:'👑',prev:11,type:'kill_boss',target:20,reward:{gold:1000,xp:2500},desc:'Убей 20 боссов'},
{id:13,name:'НОВИЧОК',icon:'📅',prev:null,type:'login',target:7,reward:{gold:150,xp:300},desc:'Зайди 7 дней'},
{id:14,name:'ВЕТЕРАН',icon:'📅',prev:13,type:'login',target:30,reward:{gold:800,xp:2000},desc:'Зайди 30 дней'},
{id:15,name:'СОБИРАТЕЛЬ',icon:'🟢',prev:null,type:'collect_green',target:5,reward:{gold:300,xp:600},desc:'Собери зеленый сет'},
{id:16,name:'КОЛЛЕКЦИОНЕР',icon:'🔵',prev:15,type:'collect_blue',target:6,reward:{gold:600,xp:1200},desc:'Собери синий сет'},
{id:17,name:'ЛЕГЕНДА',icon:'🟣',prev:16,type:'collect_legend',target:1,reward:{gold:1000,xp:2500},desc:'Собери легенду'},
{id:18,name:'ОРУЖЕЙНИК',icon:'⚔️',prev:17,type:'equip_dmg',target:100,reward:{gold:500,xp:1000},desc:'Надень +100 DMG'},
{id:19,name:'УЧЕНИК МАГИИ I',icon:'🌌',prev:null,type:'ult',target:20,reward:{gold:150,xp:400},desc:'Используй ульту 20 раз'},
{id:20,name:'УЧЕНИК МАГИИ II',icon:'🌌',prev:19,type:'ult',target:50,reward:{gold:350,xp:900},desc:'50 ульт'},
{id:21,name:'УЧЕНИК МАГИИ III',icon:'🌌',prev:20,type:'ult',target:100,reward:{gold:700,xp:1800},desc:'100 ульт'},
{id:22,name:'НЕУЯЗВИМЫЙ',icon:'🛡️',prev:21,type:'win_streak',target:10,reward:{gold:1200,xp:3000},desc:'10 побед подряд'}
];
function getMissions(){try{if(typeof VOLAND_MISSIONS!=='undefined'&&VOLAND_MISSIONS.length>0)return VOLAND_MISSIONS;}catch(e){}return FALLBACK_MISSIONS;}
function isLocked(m){
  try{
    let done=[];
    try{done=typeof volandGetMissionsDone==='function'?volandGetMissionsDone():[];}catch(e){}
    if(typeof volandIsMissionUnlocked==='function'){
      try{let res=volandIsMissionUnlocked(m, done);if(typeof res==='boolean'&&!res)return true;}catch(e){}
      try{let res=volandIsMissionUnlocked(m.id, done);if(typeof res==='boolean'&&!res)return true;}catch(e){}
    }
    if(m.prev){return !done.includes(m.prev);}
    return false;
  }catch(e){return false;}
}
function isDone(m){try{return volandGetMissionsDone().includes(m.id);}catch(e){return false;}}
function getProgress(m){try{if(typeof volandGetMissionProgress==='function')return volandGetMissionProgress(m);}catch(e){}return 0;}
function render(){
  let g=document.getElementById('missGrid');g.innerHTML='';
  getMissions().forEach(m=>{
    let locked=isLocked(m);
    let done=isDone(m);
    let prog=getProgress(m);
    let target=m.target||1;
    let pct=Math.min(100, Math.floor((prog/target)*100));
    let c=document.createElement('div');
    if(done){c.className='miss-card done';}
    else if(locked){c.className='miss-card locked';}
    else if(prog>=target){c.className='miss-card ready';}
    else{c.className='miss-card progress';}
    let html=`<div class="miss-top"><div class="miss-icon">${m.icon}</div><div class="miss-title">${m.name}</div></div><div class="miss-desc">${m.desc}</div><div class="miss-reward">💰 ${m.reward.gold} • XP ${m.reward.xp}</div>`;
    if(!done){
      html+=`<div class="miss-progress"><div class="miss-progress-fill" style="width:${pct}%"></div></div><div class="miss-progress-text">${prog}/${target} (${pct}%)</div>`;
    }
    if(done){
      html+=`<div style="color:#3ad080;font-size:10px;margin-top:6px">✅ DONE</div>`;
    }else if(locked){
      html+=`<div style="color:#666;font-size:10px;margin-top:6px">🔒 LOCKED — нужен ${m.prev||'prev'}</div>`;
    }else if(prog>=target){
      html+=`<button class="claim-btn" onclick="claim(${m.id})">CLAIM</button>`;
    }else{
      html+=`<button class="claim-btn" disabled>${prog}/${target}</button>`;
    }
    c.innerHTML=html;
    g.appendChild(c);
  });
}
function claim(id){
  try{
    let missions=getMissions();
    let m=missions.find(x=>x.id===id);
    if(m){
      let prog=getProgress(m);
      if(prog < m.target){console.log('Not enough', prog, m.target);return;}
    }
    if(typeof volandClaimMission==='function'){if(volandClaimMission(id))render();}
    else{let d=volandGetMissionsDone();if(!d.includes(id)){d.push(id);volandSaveMissionsDone(d);}render();}
  }catch(e){console.log(e);}
}
document.addEventListener('DOMContentLoaded',()=>{
  try{volandMigrate();}catch(e){}
  render();
  // active nav
  let path=location.pathname.toLowerCase();
  document.querySelectorAll('.nav-item').forEach(el=>{
    let pg=el.dataset.page;
    if(pg && path.includes(pg)){
      el.classList.add('active');
      el.closest('.nav-group')?.classList.add('active');
    }
  });
});
</script>
