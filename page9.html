*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:url("./assets/heroes/bg-battlefield.webp") center/cover no-repeat fixed #0a0e14;color:#d8d2b8;font-family:Inter,Arial,sans-serif;overflow:hidden}

.wrap{position:fixed;inset:0;display:flex;z-index:2}
.left-nav{width:68px;min-width:68px;background:rgba(18,24,30,.85);border-right:1px solid rgba(30,42,50,.5);display:flex;flex-direction:column;align-items:center;padding:12px 6px;gap:18px;backdrop-filter:blur(4px)}
.nav-group{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.nav-item{width:48px;height:48px;background:#1a252f;border:1px solid #2a3a4a;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;opacity:.6;transition:.2s}
.nav-item.active{background:#1e2f3e;border-color:#e6d5a0;opacity:1;box-shadow:0 0 12px rgba(230,213,160,.3)}

.center{flex:1;padding:20px 16px;overflow:auto;background:rgba(16,22,30,.12);backdrop-filter:blur(2px);display:flex;flex-direction:column;align-items:center;width:100%}
.miss-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%;max-width:1100px;margin-top:12px}
.miss-card{background:rgba(20,26,34,.88);border:1px solid rgba(122,144,168,.22);border-radius:12px;padding:14px 12px;backdrop-filter:blur(10px);box-shadow:0 8px 24px rgba(0,0,0,.4);transition:.2s;position:relative}
.miss-card:hover{border-color:#e6d5a0;transform:translateY(-1px)}
.miss-card.done{border-color:#3ad080;background:rgba(20,34,26,.6);opacity:.6}
.miss-card.locked{opacity:.9;background:rgba(18,18,18,.85);border-color:#333;border-style:dashed;pointer-events:none}
.miss-card.ready{border-color:#e6d5a0;background:rgba(34,30,20,.92);box-shadow:0 0 20px rgba(230,213,160,.45);animation:readyGlow 1.5s infinite}
@keyframes readyGlow{0%,100%{box-shadow:0 0 12px rgba(230,213,160,.3)}50%{box-shadow:0 0 24px rgba(230,213,160,.6)}}
.claim-btn{margin-top:8px;width:100%;height:32px;background:linear-gradient(180deg,#e6d5a0,#c9b86e);border:1px solid #e6d5a0;border-radius:8px;color:#0a0e14;font:800 9px 'JetBrains Mono',monospace;cursor:pointer;letter-spacing:.1em;transition:.15s}
.claim-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(230,213,160,.4)}
.miss-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.miss-icon{font-size:22px}
.miss-title{font:700 12px 'Cinzel Decorative',serif;color:#e6d5a0}
.miss-desc{font-size:11px;color:#a8a090;margin:6px 0;line-height:1.3}
.miss-reward{font-size:10px;color:#ffd700;margin-top:4px}

<script>

{id:8,name:'МОРОЗНЫЙ УБИЙЦА II',eng:'Frost Slayer II',icon:'❄️',chain:'frost',prev:7,type:'kill_mob',loc:3,target:50,reward:{gold:350,xp:1000},desc:'Убей 50 мобов в Ледяных Землях'},
{id:9,name:'МОРОЗНЫЙ УБИЙЦА III',eng:'Frost Slayer III',icon:'❄️',chain:'frost',prev:8,type:'kill_mob',loc:3,target:100,reward:{gold:700,xp:2000,title:'Ледяной Палач'},desc:'Убей 100 мобов в Ледяных Землях'},
{id:10,name:'ПЕРВЫЙ ТРОФЕЙ',eng:'First Trophy',icon:'👹',chain:'boss',prev:null,type:'kill_boss',target:1,reward:{gold:200,xp:500},desc:'Убей 1 босса'},
{id:11,name:'ОХОТНИК НА БОССОВ',eng:'Boss Hunter',icon:'💀',chain:'boss',prev:10,type:'kill_boss_diff',target:3,reward:{gold:400,xp:1000},desc:'Убей 3 разных боссов'},

{id:15,name:'СОБИРАТЕЛЬ',eng:'Collector',icon:'🟢',chain:'equip',prev:null,type:'collect_green',target:5,reward:{gold:300,xp:600},desc:'Собери полный зеленый сет'},

{id:21,name:'УЧЕНИК МАГИИ III',eng:'Apprentice III',icon:'🌌',chain:'ult',prev:20,type:'ult',target:100,reward:{gold:700,xp:1800,title:'Архимаг'},desc:'Используй ульту 100 раз'},
{id:22,name:'НЕУЯЗВИМЫЙ',eng:'Untouchable',icon:'🛡️',chain:'streak',prev:21,type:'win_streak',target:10,reward:{gold:1200,xp:3000,title:'Неуязвимый'},desc:'Выиграй 10 боев подряд'}
];
function getMissions(){
  try{
    if(typeof VOLAND_MISSIONS!=='undefined' && VOLAND_MISSIONS.length>0) return VOLAND_MISSIONS;
  }catch(e){}
  return FALLBACK_MISSIONS;
}
function isLocked(m){
  try{
    if(typeof volandIsMissionUnlocked==='function') return !volandIsMissionUnlocked(m.id);
    if(m.prev){
      let done = typeof volandGetMissionsDone==='function' ? volandGetMissionsDone() : [];
      if(!done.includes(m.prev)) return true;
    }
    return false;
  }catch(e){ return false; }
}
function isDone(m){
  try{
    let done = typeof volandGetMissionsDone==='function' ? volandGetMissionsDone() : [];
    return done.includes(m.id);
  }catch(e){ return false; }
}
function renderMissions(){
  let grid=document.getElementById('missGrid');
  if(!grid) return;
  grid.innerHTML='';
  let missions=getMissions();
  missions.forEach(m=>{
    let locked=isLocked(m);
    let done=isDone(m);
    let card=document.createElement('div');
    card.className='miss-card'+(done?' done':'')+(locked?' locked':'')+(!done&&!locked?' ready':'');
    let rewardGold = (m.reward&&m.reward.gold)||0;
    let rewardXp = (m.reward&&m.reward.xp)||0;
    card.innerHTML='<div class="miss-top"><div class="miss-icon">'+m.icon+'</div><div class="miss-title">'+m.name+'</div></div><div class="miss-desc">'+m.desc+'</div><div class="miss-reward">💰 '+rewardGold+' • XP '+rewardXp+'</div>'+(done?'<div style="color:#3ad080;font-size:10px;margin-top:6px">✅ DONE</div>':locked?'<div style="color:#666;font-size:10px;margin-top:6px">🔒 LOCKED LVL '+((m.requireLevel||m.prev||1))+'</div>':'<button class="claim-btn" onclick="claimMission('+m.id+')">CLAIM</button>');
    grid.appendChild(card);
  });
}
function claimMission(id){
  try{
    if(typeof volandClaimMission==='function'){
      let ok=volandClaimMission(id);
      if(ok){ renderMissions(); }
    } else {
      let done = typeof volandGetMissionsDone==='function' ? volandGetMissionsDone() : [];
      if(!done.includes(id)){ done.push(id); if(typeof volandSaveMissionsDone==='function') volandSaveMissionsDone(done); }
      renderMissions();
    }
  }catch(e){ console.log(e); }
}
document.addEventListener('DOMContentLoaded',function(){
  try{ if(typeof volandMigrate==='function') volandMigrate(); }catch(e){}
  renderMissions();
});
</script>
