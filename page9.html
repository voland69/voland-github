<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOLAND - MISSIONS</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0e14;color:#d8d2b8;font-family:Inter,Arial,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0;background:url("./assets/heroes/bg-battlefield.webp") center/cover no-repeat fixed}
.bg:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.6)}
.wrap{position:fixed;inset:0;display:flex;z-index:2}
.left-nav{width:68px;background:rgba(18,24,30,.9);border-right:1px solid #2a3a4a;display:flex;flex-direction:column;align-items:center;padding:12px 6px;gap:16px}
.nav-group{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.nav-item{width:48px;height:48px;background:#1a252f;border:1px solid #2a3a4a;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;opacity:.6;transition:.2s}
.nav-item.active{border-color:#e6d5a0;opacity:1;background:#1e2f3e;box-shadow:0 0 12px rgba(230,213,160,.3)}
.nav-label{font-size:7px;color:#6a7a8a;font-family:'JetBrains Mono',monospace;letter-spacing:.1em}
.nav-group.active .nav-label{color:#e6d5a0}
.center{flex:1;padding:20px;overflow:auto;display:flex;flex-direction:column;align-items:center}
.miss-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%;max-width:1100px;margin-top:16px}
.miss-card{background:rgba(20,26,34,.9);border:1px solid rgba(122,144,168,.2);border-radius:12px;padding:14px;transition:.2s}
.miss-card:hover{border-color:#e6d5a0;transform:translateY(-2px)}
.miss-card.done{border-color:#3ad080;opacity:.6}
.miss-card.locked{opacity:.9;background:rgba(18,18,18,.9);border-style:dashed;pointer-events:none}
.miss-card.ready{border-color:#e6d5a0;box-shadow:0 0 18px rgba(230,213,160,.4)}
.claim-btn{margin-top:10px;width:100%;height:32px;background:linear-gradient(180deg,#e6d5a0,#c9b86e);border:1px solid #e6d5a0;border-radius:8px;color:#0a0e14;font:800 10px 'JetBrains Mono',monospace;cursor:pointer}
.miss-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.miss-icon{font-size:22px}
.miss-title{font:700 12px 'Cinzel Decorative',serif;color:#e6d5a0}
.miss-desc{font-size:11px;color:#a8a090;margin:6px 0}
.miss-reward{font-size:10px;color:#ffd700}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
<div class="left-nav">
<div class="nav-group" onclick="location.href='./page3.html'"><div class="nav-item">🦁</div><div class="nav-label">HERO</div></div>
<div class="nav-group" onclick="location.href='./page4.html'"><div class="nav-item">🎒</div><div class="nav-label">BAG</div></div>
<div class="nav-group" onclick="location.href='./page5.html'"><div class="nav-item">⚔️</div><div class="nav-label">SKILLS</div></div>
<div class="nav-group" onclick="location.href='./page6.html'"><div class="nav-item">⚔️</div><div class="nav-label">BATTLE</div></div>
<div class="nav-group active"><div class="nav-item active">📜</div><div class="nav-label">MISSIONS</div></div>
</div>
<div class="center">
<h1 style="font:900 24px 'Cinzel Decorative';color:#e6d5a0">MISSIONS • 22</h1>
<div id="missGrid" class="miss-grid"></div>
</div>
</div>
<script src="./assets/js/db.js"></script>
<script src="./assets/js/storage.js"></script>
<script>
const FALLBACK_MISSIONS=[
{id:1,name:'ПЕСЧАНАЯ РЕЗНЯ I',icon:'🏜️',prev:null,reward:{gold:100,xp:200},desc:'Убей 20 мобов в Пустыне'},
{id:2,name:'ПЕСЧАНАЯ РЕЗНЯ II',icon:'🏜️',prev:1,reward:{gold:250,xp:500},desc:'Убей 50 мобов в Пустыне'},
{id:3,name:'ПЕСЧАНАЯ РЕЗНЯ III',icon:'🏜️',prev:2,reward:{gold:500,xp:1000},desc:'Убей 100 мобов в Пустыне'},
{id:4,name:'ЛЕСНОЙ ОХОТНИК I',icon:'🌲',prev:null,reward:{gold:120,xp:300},desc:'Убей 20 мобов в Лесу'},
{id:5,name:'ЛЕСНОЙ ОХОТНИК II',icon:'🌲',prev:4,reward:{gold:300,xp:750},desc:'Убей 50 мобов в Лесу'},
{id:6,name:'ЛЕСНОЙ ОХОТНИК III',icon:'🌲',prev:5,reward:{gold:600,xp:1500},desc:'Убей 100 мобов в Лесу'},
{id:7,name:'МОРОЗНЫЙ УБИЙЦА I',icon:'❄️',prev:null,reward:{gold:150,xp:400},desc:'Убей 20 мобов в Льдах'},
{id:8,name:'МОРОЗНЫЙ УБИЙЦА II',icon:'❄️',prev:7,reward:{gold:350,xp:1000},desc:'Убей 50 мобов в Льдах'},
{id:9,name:'МОРОЗНЫЙ УБИЙЦА III',icon:'❄️',prev:8,reward:{gold:700,xp:2000},desc:'Убей 100 мобов в Льдах'},
{id:10,name:'ПЕРВЫЙ ТРОФЕЙ',icon:'👹',prev:null,reward:{gold:200,xp:500},desc:'Убей 1 босса'},
{id:11,name:'ОХОТНИК НА БОССОВ',icon:'💀',prev:10,reward:{gold:400,xp:1000},desc:'Убей 3 боссов'},
{id:12,name:'ПОВЕЛИТЕЛЬ БОССОВ',icon:'👑',prev:11,reward:{gold:1000,xp:2500},desc:'Убей 20 боссов'},
{id:13,name:'НОВИЧОК',icon:'📅',prev:null,reward:{gold:150,xp:300},desc:'Зайди 7 дней'},
{id:14,name:'ВЕТЕРАН',icon:'📅',prev:13,reward:{gold:800,xp:2000},desc:'Зайди 30 дней'},
{id:15,name:'СОБИРАТЕЛЬ',icon:'🟢',prev:null,reward:{gold:300,xp:600},desc:'Собери зеленый сет'},
{id:16,name:'КОЛЛЕКЦИОНЕР',icon:'🔵',prev:15,reward:{gold:600,xp:1200},desc:'Собери синий сет'},
{id:17,name:'ЛЕГЕНДА',icon:'🟣',prev:16,reward:{gold:1000,xp:2500},desc:'Собери легенду'},
{id:18,name:'ОРУЖЕЙНИК',icon:'⚔️',prev:17,reward:{gold:500,xp:1000},desc:'Надень +100 DMG'},
{id:19,name:'УЧЕНИК МАГИИ I',icon:'🌌',prev:null,reward:{gold:150,xp:400},desc:'Используй ульту 20 раз'},
{id:20,name:'УЧЕНИК МАГИИ II',icon:'🌌',prev:19,reward:{gold:350,xp:900},desc:'50 ульт'},
{id:21,name:'УЧЕНИК МАГИИ III',icon:'🌌',prev:20,reward:{gold:700,xp:1800},desc:'100 ульт'},
{id:22,name:'НЕУЯЗВИМЫЙ',icon:'🛡️',prev:21,reward:{gold:1200,xp:3000},desc:'10 побед подряд'}
];
function getMissions(){try{if(typeof VOLAND_MISSIONS!=='undefined'&&VOLAND_MISSIONS.length>0)return VOLAND_MISSIONS;}catch(e){}return FALLBACK_MISSIONS;}
function isLocked(m){try{if(typeof volandIsMissionUnlocked==='function')return!volandIsMissionUnlocked(m.id);if(m.prev){let d=volandGetMissionsDone();return !d.includes(m.prev);}return false;}catch(e){return false;}}
function isDone(m){try{return volandGetMissionsDone().includes(m.id);}catch(e){return false;}}
function render(){let g=document.getElementById('missGrid');g.innerHTML='';getMissions().forEach(m=>{let locked=isLocked(m);let done=isDone(m);let c=document.createElement('div');c.className='miss-card'+(done?' done':'')+(locked?' locked':'')+(!done&&!locked?' ready':'');c.innerHTML=`<div class="miss-top"><div class="miss-icon">${m.icon}</div><div class="miss-title">${m.name}</div></div><div class="miss-desc">${m.desc}</div><div class="miss-reward">💰 ${m.reward.gold} • XP ${m.reward.xp}</div>${done?'<div style="color:#3ad080;font-size:10px;margin-top:6px">✅ DONE</div>':locked?'<div style="color:#666;font-size:10px;margin-top:6px">🔒 LOCKED</div>':`<button class="claim-btn" onclick="claim(${m.id})">CLAIM</button>`}`;g.appendChild(c);});}
function claim(id){try{if(typeof volandClaimMission==='function'){if(volandClaimMission(id))render();}else{let d=volandGetMissionsDone();if(!d.includes(id)){d.push(id);volandSaveMissionsDone(d);}render();}}catch(e){console.log(e);}}
document.addEventListener('DOMContentLoaded',()=>{try{volandMigrate();}catch(e){}render();});
</script>
</body>
</html>
