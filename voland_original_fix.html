<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOLAND CHRONICLES — Choose Your Champion</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--beige:#f2e6c9;--gold:#c9a96e;--gold-light:#f2d492;--gold-dim:#8a806e;--bg:#0e1218;--bg-deep:#080a0d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"JetBrains Mono",monospace;
  background:
    radial-gradient(ellipse 900px 520px at 50% -10%, rgba(90,115,145,.22) 0%, rgba(70,90,120,.08) 38%, transparent 72%),
    radial-gradient(ellipse 800px 600px at 12% 25%, rgba(45,70,100,.18) 0%, transparent 60%),
    radial-gradient(ellipse 700px 500px at 88% 35%, rgba(35,55,80,.14) 0%, transparent 60%),
    linear-gradient(180deg,#131a23 0%,#0f141c 18%,#0e1218 42%,#0a0d11 100%),
    url('./assets/heroes/battle-bg.webp');
  background-color:#0e1218;
  background-size:cover;
  background-attachment:fixed;
  background-position:center top;
  color:var(--beige);
  overflow-x:hidden;
  position:relative;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    linear-gradient(180deg, rgba(8,10,13,.1) 0%, rgba(8,10,13,.65) 100%),
    radial-gradient(ellipse at 50% 80%, rgba(14,18,24,0) 30%, rgba(8,10,13,.9) 100%);
}
.wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.header{padding:56px 20px 24px;text-align:center;width:100%;max-width:1400px}
.title{
  font-family:"Cinzel",serif;font-weight:900;letter-spacing:.35em;line-height:.95;
  font-size:clamp(28px,4.2vw,52px);text-transform:uppercase;
}
.title .voland{color:var(--beige);display:block;text-shadow:0 2px 30px rgba(242,230,201,.25)}
.title .chron{color:var(--gold);display:block;margin-top:2px;text-shadow:0 2px 24px rgba(201,169,110,.35)}
.subtitle{
  margin-top:18px;font-size:10px;letter-spacing:.42em;color:var(--gold-dim);
  text-transform:uppercase;opacity:.9
}
.filters{
  margin-top:28px;display:inline-flex;align-items:center;gap:6px;
  padding:6px;background:rgba(10,12,15,.85);
  border:1px solid rgba(201,169,110,.2);border-radius:999px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 10px 30px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06)
}
.fbtn{
  border:0;cursor:pointer;border-radius:999px;padding:9px 18px;
  font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.14em;font-weight:700;
  color:var(--gold-dim);background:transparent;transition:.22s;
}
.fbtn.active{
  background:linear-gradient(180deg,var(--gold-light) 0%, var(--gold) 100%);
  color:#1a140a;box-shadow:0 2px 12px rgba(201,169,110,.45), inset 0 1px 0 rgba(255,255,255,.6)
}
.fbtn:hover{color:var(--beige)}
.grid{
  width:100%;max-width:1400px;padding:40px 20px 80px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px;
}
.card{
  position:relative;aspect-ratio:3/4.6;overflow:hidden;
  border:1px solid rgba(255,255,255,.08);border-radius:6px;
  background:linear-gradient(180deg, rgba(20,25,32,.2) 0%, rgba(10,12,15,.4) 100%);
  cursor:pointer;transform:translateZ(0);
  transition:transform .45s cubic-bezier(.16,1,.3,1), box-shadow .45s, border-color .3s;
  box-shadow:0 8px 24px rgba(0,0,0,.5);
}
.card:hover{transform:translateY(-8px) scale(1.04);box-shadow:0 20px 40px rgba(0,0,0,.8);border-color:rgba(201,169,110,.35);z-index:2}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;filter:contrast(1.05) saturate(.95) brightness(.92)}
.card:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(0,0,0,0) 28%, rgba(0,0,0,.15) 55%, rgba(0,0,0,.88) 92%);
  pointer-events:none
}
.badge{
  position:absolute;top:10px;right:10px;z-index:2;
  width:28px;height:28px;display:grid;place-items:center;
  border-radius:50%;background:rgba(10,12,15,.85);border:1px solid rgba(255,255,255,.12);
  font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--beige);
  backdrop-filter:blur(6px);box-shadow:0 2px 10px rgba(0,0,0,.5)
}
.info{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:18px 16px 14px}
.info h3{font-family:"Cinzel",serif;font-size:14px;letter-spacing:.14em;color:var(--beige);font-weight:700;line-height:1.1;text-transform:uppercase}
.info p{margin-top:6px;font-size:9px;letter-spacing:.28em;color:var(--gold);text-transform:uppercase;opacity:.95}
.info .line{margin-top:12px;height:1px;background:linear-gradient(90deg, rgba(201,169,110,.5) 0%, rgba(201,169,110,0) 100%)}
.vignette{position:absolute;inset:0;box-shadow:inset 0 0 80px rgba(0,0,0,.6);pointer-events:none;z-index:1}
/* Modal etalon */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(4,6,8,.82);backdrop-filter:blur(18px)}
.modal.open{display:flex}
.modal-box{
  width:min(1020px,100%);background:#0c0e12;border:1px solid rgba(201,169,110,.18);border-radius:8px;
  overflow:hidden;display:grid;grid-template-columns:78px 1fr 340px;min-height:560px;
  box-shadow:0 30px 80px rgba(0,0,0,.9)
}
.m-left{background:rgba(255,255,255,.02);border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;align-items:center;padding:18px 0;gap:18px}
.m-left b{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:.4em;color:var(--gold-dim)}
.m-center{position:relative;overflow:hidden;background:#0a0c10}
.m-center img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.92}
.m-center:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg, rgba(12,14,18,.2) 0%, rgba(12,14,18,.75) 100%)}
.m-right{padding:28px 26px;background:linear-gradient(180deg, #12151b 0%, #0e1116 100%);display:flex;flex-direction:column}
.m-right h2{font-family:"Cinzel",serif;font-size:28px;letter-spacing:.12em;color:var(--beige)}
.m-right .role{margin-top:6px;font-size:10px;letter-spacing:.32em;color:var(--gold)}
.stats{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat{border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);border-radius:6px;padding:12px 14px}
.stat label{display:block;font-size:8px;letter-spacing:.3em;color:var(--gold-dim);margin-bottom:6px}
.stat b{font-size:18px;color:var(--beige);font-weight:700}
.close{position:absolute;top:14px;right:14px;z-index:5;width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.5);color:var(--beige);cursor:pointer}
@media(max-width:900px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;padding:24px 14px 60px}
  .modal-box{grid-template-columns:1fr;min-height:auto;max-height:90vh;overflow:auto}
  .m-left{display:none}.m-center{aspect-ratio:3/4}.m-right{padding:20px}
}
@media(max-width:390px){
  .filters{transform:scale(.92)}
  .title{letter-spacing:.22em}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <div class="title"><span class="voland">VOLAND</span><span class="chron">CHRONICLES</span></div>
    <div class="subtitle">CHOOSE YOUR CHAMPION — 8 HEROES</div>
    <div style="margin-top:22px;display:flex;justify-content:center">
      <div class="filters" id="filters">
        <button class="fbtn active" data-f="all">ALL 08</button>
        <button class="fbtn" data-f="male">MALE 04</button>
        <button class="fbtn" data-f="female">FEMALE 04</button>
      </div>
    </div>
  </header>
  <main class="grid" id="grid"></main>
  <div style="padding:0 20px 40px;max-width:1400px;width:100%;text-align:center">
    <div style="height:1px;background:linear-gradient(90deg, transparent, rgba(201,169,110,.18), transparent)"></div>
    <div style="margin-top:16px;font-size:9px;letter-spacing:.35em;color:#5a564f">ORIGINAL ATMOSPHERE RESTORED • NO EMOJI • FULL ART • CINEMATIC FOG</div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <button class="close" id="closeM">✕</button>
    <div class="m-left"><b>VOLAND CHRONICLES</b><div style="width:1px;height:120px;background:linear-gradient(180deg, transparent, var(--gold), transparent)"></div><span style="font-size:9px;letter-spacing:.2em;color:var(--gold-dim)">EST. MMXXIV</span></div>
    <div class="m-center"><img id="mImg" src="" alt=""></div>
    <div class="m-right">
      <h2 id="mName">IRON VOW</h2>
      <div class="role" id="mRole">WARRIOR • STEEL</div>
      <div style="margin-top:18px;height:1px;background:linear-gradient(90deg, var(--gold) 0%, transparent 100%)"></div>
      <div class="stats" id="mStats"></div>
      <div style="margin-top:auto;padding-top:24px;display:flex;gap:10px">
        <button style="flex:1;padding:12px;border-radius:999px;border:0;background:linear-gradient(180deg,var(--gold-light),var(--gold));color:#1a140a;font-weight:800;letter-spacing:.18em;font-size:11px;cursor:pointer">SELECT CHAMPION</button>
        <button id="mClose2" style="padding:12px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:transparent;color:var(--beige);letter-spacing:.18em;font-size:11px;cursor:pointer">CLOSE</button>
      </div>
    </div>
  </div>
</div>

<script>
const CHAMPIONS_DATA = [
  {id:"archer-m", name:"DARK RANGER", role:"ARCHER • SHADOW", hp:920, atk:115, def:185, mag:210, spd:26, crit:19, gender:"male", file:"archer-m.webp", tagline:"Warden of the twilight thicket"},
  {id:"warrior-m", name:"LION WARDEN", role:"WARRIOR • LIGHT", hp:1550, atk:320, def:145, mag:80, spd:10, crit:5, gender:"male", file:"warrior-m.webp", tagline:"The wall that never breaks"},
  {id:"archmage-m", name:"AZURE SAGE", role:"MAGE • FROST", hp:680, atk:75, def:235, mag:380, spd:31, crit:12, gender:"male", file:"archmage-m.webp", tagline:"Keeper of the frozen library"},
  {id:"necro-m", name:"GRAVELORD", role:"NECROMANCER • DEATH", hp:810, atk:98, def:205, mag:320, spd:22, crit:10, gender:"male", file:"necro-m.webp", tagline:"Whispers from the barrow"},
  {id:"archer-f", name:"WILD PATH", role:"ARCHER • NATURE", hp:860, atk:108, def:178, mag:190, spd:29, crit:21, gender:"female", file:"archer-f.webp", tagline:"Arrow that finds the wind"},
  {id:"warrior-f", name:"IRON VOW", role:"WARRIOR • STEEL", hp:1420, atk:290, def:152, mag:110, spd:13, crit:8, gender:"female", file:"warrior-f.webp", tagline:"Oathbound until the last gate"},
  {id:"mage-f-new", name:"VOLCANIC", role:"MAGE • FLAME", hp:730, atk:85, def:250, mag:400, spd:35, crit:11, gender:"female", file:"mage-f-new.webp", tagline:"Where earth cracks, she stands"},
  {id:"necro-f-new", name:"AMETHYST", role:"NECROMANCER • VOID", hp:840, atk:102, def:215, mag:340, spd:25, crit:9, gender:"female", file:"necro-f-new.webp", tagline:"Jewel that drinks light"},
];

const FALLBACK_ART = {
  "archer-m":"https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=800&auto=format&fit=crop",
  "warrior-m":"https://images.unsplash.com/photo-1599707367072-cd6ada2bc375?q=80&w=800&auto=format&fit=crop",
  "archmage-m":"https://images.unsplash.com/photo-1535666669445-7495384c8edf?q=80&w=800&auto=format&fit=crop",
  "necro-m":"https://images.unsplash.com/photo-1514539079130-25950c84af65?q=80&w=800&auto=format&fit=crop",
  "archer-f":"https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=800&auto=format&fit=crop",
  "warrior-f":"https://images.unsplash.com/photo-1578662996442-48f60103fc96?q=80&w=800&auto=format&fit=crop",
  "mage-f-new":"https://images.unsplash.com/photo-1516331138075-f3adc1e149cd?q=80&w=800&auto=format&fit=crop",
  "necro-f-new":"https://images.unsplash.com/photo-1519608487953-e999c86e7455?q=80&w=800&auto=format&fit=crop"
};

let activeFilter = "all";
const grid = document.getElementById("grid");
  const modal = document.getElementById("modal");

function render(){
  const list = activeFilter==="all" ? CHAMPIONS_DATA : CHAMPIONS_DATA.filter(h=>h.gender===activeFilter);
  grid.innerHTML = list.map(h => `
    <div class="card" data-id="${h.id}">
      <img src="./assets/heroes/${h.file}" alt="${h.name}" loading="lazy" onerror="this.onerror=null;this.src='${FALLBACK_ART[h.id]}'">
      <div class="vignette"></div>
      <div class="badge">${h.gender==="male"?"M":"F"}</div>
      <div class="info"><h3>${h.name}</h3><p>${h.role}</p><div class="line"></div></div>
    </div>
  `).join("");
  grid.querySelectorAll(".card").forEach(el=>{
    el.addEventListener("click",()=> openHero(el.dataset.id));
  });
}

function openHero(id){
  const h = CHAMPIONS_DATA.find(x=>x.id===id);
  if(!h) return;
  document.getElementById("mName").textContent = h.name;
  document.getElementById("mRole").textContent = h.role;
  const img = document.getElementById("mImg");
  img.src = "./assets/heroes/" + h.file;
  img.alt = h.name;
  img.onerror = function(){ this.onerror=null; this.src = FALLBACK_ART[h.id]; };
  // force fallback check if local missing - try to keep local first
  // setTimeout fallback if error not triggered quickly is handled by onerror
  document.getElementById("mStats").innerHTML = `
    <div class="stat"><label>HP</label><b>${h.hp}</b></div>
    <div class="stat"><label>ATK</label><b>${h.atk}</b></div>
    <div class="stat"><label>DEF</label><b>${h.def}</b></div>
    <div class="stat"><label>MAG</label><b>${h.mag}</b></div>
    <div class="stat"><label>SPD</label><b>${h.spd}</b></div>
    <div class="stat"><label>CRIT</label><b>${h.crit}%</b></div>
  `;
  modal.classList.add("open");
}

function closeModal(){ modal.classList.remove("open"); }

document.getElementById("filters").addEventListener("click", (e)=>{
  const btn = e.target.closest(".fbtn"); if(!btn) return;
  document.querySelectorAll(".fbtn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  activeFilter = btn.dataset.f;
  render();
});

document.getElementById("closeM").addEventListener("click", closeModal);
document.getElementById("mClose2").addEventListener("click", closeModal);
modal.addEventListener("click", (e)=>{ if(e.target===modal) closeModal(); });
document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closeModal(); });

render();
</script>
</body>
</html>
