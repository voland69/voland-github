html,body{height:100%;background:#0a0e14;color:#d8d2b8;font-family:Inter,Arial,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0;background:transparent}
.bg img{width:100%;height:100%;object-fit:cover;opacity:0.08}
.bg:after{content:"";position:absolute;inset:0;background:transparent}
.wrap{position:fixed;inset:0;display:flex;z-index:2}
.left-nav{width:68px;min-width:68px;background:#12181e;border-right:1px solid #1e2a32;display:flex;flex-direction:column;align-items:center;padding:12px 6px;gap:18px}
.nav-item{width:48px;height:48px;background:#1a252f;border:1px solid #2a3a4a;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0.6;transition:.2s;font-size:20px}

.hero-panel{width:380px;min-width:380px;background:#141c24;border-right:1px solid #1e2a32;display:flex;flex-direction:column;overflow:hidden}
.hero-img-wrap{flex:1;background:#0a0e12;display:flex;align-items:center;justify-content:center;padding:0;position:relative;overflow:hidden}
.hero-img-wrap img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.hero-info{padding:18px 16px;background:#111821;border-top:1px solid #1e2a32;text-align:center}
.hero-name{font-family:'Cinzel Decorative',serif;font-size:16px;letter-spacing:.3em;color:#e6d5a0;font-weight:900}
.hero-sub{margin-top:6px;font-size:10px;letter-spacing:.15em;color:#8a9a6a;font-family:'JetBrains Mono',monospace;text-transform:uppercase}
.hero-role{margin-top:10px;font-size:8px;letter-spacing:.15em;color:#c9b47a;font-family:'JetBrains Mono',monospace;text-transform:uppercase}
.main{flex:1;display:flex;flex-direction:column;background:rgba(16,22,30,.90);overflow:auto;padding:0}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px;background:#131a22;border-bottom:1px solid #1e2a32}
