<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOLAND - HERO</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background: url("./assets/heroes/bg-battlefield.webp") center/cover no-repeat fixed #0a0e14;color:#d8d2b8;font-family:Inter,Arial,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0}.bg img{width:100%;height:100%;object-fit:cover;opacity:1}.bg:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.42)}
.wrap{position:fixed;inset:0;display:flex;z-index:2}
.left-nav{width:68px;min-width:68px;background:rgba(18,24,30,.35);border-right:1px solid rgba(30,42,50,.5);display:flex;flex-direction:column;align-items:center;padding:12px 6px;gap:18px;backdrop-filter: blur(2px)}
.nav-item{width:48px;height:48px;background:#1a252f;border:1px solid #2a3a4a;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0.6;transition:.2s;font-size:20px}
.nav-item.active{background:#1e2f3e;border-color:#3a4a5a;opacity:1;box-shadow:0 0 12px rgba(230,213,160,.2)}
.nav-label{font-size:7px;letter-spacing:.15em;color:#6a7a8a;margin-top:4px;text-align:center;font-family:'JetBrains Mono',monospace}
.hero-panel{width:380px;min-width:380px;background:rgba(20,28,36,.45);border-right:1px solid rgba(30,42,50,.5);display:flex;flex-direction:column;overflow:hidden;backdrop-filter: blur(2px)}
.hero-img-wrap{flex:1;background:#0a0e12;display:flex;align-items:center;justify-content:center;padding:12px;position:relative;overflow:hidden}
.hero-img-wrap img{width:100%;height:100%;object-fit:cover;object-position:top center;border-radius:4px;max-height:72vh}
.hero-info{padding:18px 16px;background:#111821;border-top:1px solid #1e2a32;text-align:center}
.hero-name{font-family:'Cinzel Decorative',serif;font-size:16px;letter-spacing:.3em;color:#e6d5a0;font-weight:900}
.hero-class{margin-top:8px;font-size:10px;letter-spacing:.15em;color:#8a9a6a;font-family:'JetBrains Mono',monospace;text-transform:uppercase}
.main{flex:1;display:flex;flex-direction:column;background:rgba(16,22,30,.25);backdrop-filter: blur(2px);overflow:auto;padding:28px 0;gap:28px;justify-content:flex-start}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px;background:rgba(19,26,34,.35);border-bottom:1px solid rgba(30,42,50,.5);backdrop-filter: blur(2px)}
.stat-card{background:#1a242f;border:1px solid #2a3a4a;border-radius:8px;padding:14px 10px;text-align:center}
.stat-label{font-size:8px;letter-spacing:.2em;color:#6a7a8a;font-family:'JetBrains Mono',monospace}
.stat-value{margin-top:6px;font-size:22px;font-weight:800;color:#e6d5a0;font-family:'JetBrains Mono',monospace}
.bars-panel{padding:18px 20px;background:rgba(17,24,33,.25);display:flex;flex-direction:column;gap:14px;backdrop-filter: blur(2px)}
.stats-extra-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 20px 18px;background:rgba(17,24,33,.25);backdrop-filter:blur(2px)}
.extra-card{background:#1a242f;border:1px solid #2a3a4a;border-radius:10px;padding:14px 12px;text-align:center;position:relative;overflow:hidden}
.extra-card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#2a3a4a,#e6d5a0)}
.extra-icon{font-size:18px;margin-bottom:6px}
.extra-label{font-size:7px;letter-spacing:.2em;color:#6a7a8a;font-family:'JetBrains Mono',monospace;text-transform:uppercase}
.extra-value{margin-top:6px;font-size:18px;font-weight:800;color:#e6d5a0;font-family:'JetBrains Mono',monospace}
.extra-sub{margin-top:4px;font-size:8px;color:#8a9a6a;font-family:'JetBrains Mono',monospace}

.bar-row{display:flex;align-items:center;gap:12px}
.bar-label{width:60px;font-size:9px;letter-spacing:.15em;color:#6a7a8a;text-align:right;font-family:'JetBrains Mono',monospace}
.bar-track{flex:1;height:18px;background:#0a0e14;border-radius:3px;overflow:hidden;border:1px solid #1e2a32;position:relative;display:flex;align-items:center;justify-content:center}
.bar-fill{position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;justify-content:flex-start;font-size:9px;font-weight:700;font-family:'JetBrains Mono',monospace;transition:width .3s ease}
.bar-text{position:relative;z-index:2;font-size:9px;font-weight:700;font-family:'JetBrains Mono',monospace;color:#fff;text-align:center;pointer-events:none;width:100%;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.bar-fill.hp{background:linear-gradient(90deg,#b33030,#e05050);color:#fff}
.bar-fill.mana{background:linear-gradient(90deg,#1a4a9a,#2a6ad0);color:#fff}
.bar-fill.stamina{background:linear-gradient(90deg,#1a7a4a,#3ad080);color:#fff}
.bar-fill.xp{background:linear-gradient(90deg,#8a6a1a,#d0b040);color:#fff}
.right{width:200px;min-width:200px;background:rgba(14,20,26,.9);border-left:1px solid rgba(30,42,50,.5);display:flex;flex-direction:column;backdrop-filter: blur(2px)}
.chat-header{padding:12px;border-bottom:1px solid #1e2a32;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#3ad080;box-shadow:0 0 6px #3ad080}
.chat-title{font-size:9px;letter-spacing:.2em;color:#6a7a8a;font-family:'JetBrains Mono',monospace}
.chat-body{flex:1;padding:10px;overflow:auto}
.sys-msg{background:#1a242f;border-left:2px solid #d0b040;padding:8px;font-size:10px;color:#9a9a7a;line-height:1.4;border-radius:0 6px 6px 0}
.chat-input{padding:8px;border-top:1px solid #1e2a32;display:flex;gap:6px}
.chat-input input{flex:1;background:#0a0e14;border:1px solid #1e2a32;border-radius:6px;padding:8px;font-size:11px;color:#d8d2b8}
.chat-input button{width:32px;background:#e6d5a0;border:none;border-radius:6px;cursor:pointer;font-weight:800}

.left-nav{display:flex;flex-direction:column;justify-content:space-between;height:100%;}
.nav-top{display:flex;flex-direction:column;gap:16px;align-items:center;}
.nav-bottom{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;align-items:center;}

.stat-points-panel{margin:0 20px 0 20px;background:rgba(19,26,34,.88);border:1px solid #e6d5a0;border-radius:10px;padding:16px;backdrop-filter:blur(4px)}

.stat-points-strip-title{font:900 11px 'Cinzel Decorative',serif;color:#e6d5a0;letter-spacing:.1em}

<script src="./assets/js/db/items.js"></script>

<script>
let heroId = volandGetHeroId();
if(!VOLAND_HEROES[heroId]) heroId='necro-f-new';
let heroData = VOLAND_HEROES[heroId];
let profileName = volandGetName();
let calc = volandCalcStats();
let cur = calc.cur;
let bonus = calc.bonus;

document.getElementById('heroImg').src = heroData.img;
let lvlForName = (typeof volandGetCurrentLevelInfo==='function' ? volandGetCurrentLevelInfo().lvl : lvlInfo.lvl);
document.getElementById('heroName').textContent = profileName.toUpperCase() + ' LVL ' + lvlForName;
document.getElementById('heroClass').textContent = heroData.n + ' • ' + heroData.role;

function fmtBonus(v, isPct){ if(!v) return ''; let s = (Math.round(v*100)/100); return (s>0?'+':'') + s + (isPct?'%':''); }
let gear = calc.equipBonus || {};
let ptsB = calc.pointsBonus || {};
let baseWithAuto = calc.baseWithAuto || {};
function card(label, total, gearV, ptsV, isPct){
  let gearHtml = gearV ? `<span class="stat-bonus-gear">Шмот ${fmtBonus(gearV, isPct)}</span>` : '';
  let ptsHtml = ptsV ? `<span class="stat-bonus-points">Очки ${fmtBonus(ptsV, isPct)}</span>` : '';
  let sep = (gearV && ptsV) ? ' • ' : '';
  let wrap = (gearV || ptsV) ? `<div class="stat-bonus-wrap">${gearHtml}${sep}${ptsHtml}</div>` : `<div class="stat-bonus-wrap" style="color:#6a7a8a">База ${Math.round((baseWithAuto[label]||total)*100)/100}${isPct?'%':''} (с лвлом)</div>`;
  return `<div class="stat-card"><div class="stat-label">${label}</div><div class="stat-value">${total}${isPct?'%':''}</div>${wrap}</div>`;
}
let isParry = cur.PARRY>0;
document.getElementById('statsGrid').innerHTML = `
  ${card('HP', cur.HP, gear.HP, ptsB.HP, false)}
  ${card('DEF', cur.DEF, gear.DEF, ptsB.DEF, false)}
  ${card('DAMAGE', cur.DMG, gear.DMG, ptsB.DMG, false)}
  ${card('MANA', cur.MANA, gear.MANA, ptsB.MANA, false)}
  ${card('CRIT', cur.CRIT, gear.CRIT, ptsB.CRIT, true)}
  ${card(isParry?'PARRY':'DODGE', isParry?cur.PARRY:cur.DODGE, isParry?gear.PARRY:gear.DODGE, isParry?ptsB.PARRY:ptsB.DODGE, true)}
`;

// ===== STAT POINTS UI v7 — узкая полоска + фикс пропущенных очков =====
let tempAlloc = null;
let pointsExpanded = false;
try{ if(typeof volandFixMissingStatPoints==='function') volandFixMissingStatPoints(); }catch(e){}
try{ if(typeof volandClaimMissedMilestones==='function') volandClaimMissedMilestones(); }catch(e){}
try{ if(typeof volandFixMissingStatPoints==='function') volandFixMissingStatPoints(); }catch(e){}
function getTempAlloc(){
  if(!tempAlloc){
    try{ tempAlloc = (typeof volandGetStatAlloc==='function') ? volandGetStatAlloc() : {HP:0,DEF:0,DMG:0,MANA:0,CRIT:0,DODGE:0,PARRY:0}; }catch(e){ tempAlloc = {HP:0,DEF:0,DMG:0,MANA:0,CRIT:0,DODGE:0,PARRY:0}; }
  }
  return tempAlloc;
}
function getRemainingForUI(){
  let savedAlloc = {HP:0,DEF:0,DMG:0,MANA:0,CRIT:0,DODGE:0,PARRY:0};
  try{ savedAlloc = volandGetStatAlloc(); }catch(e){}
  let savedSpent = 0; for(let k in savedAlloc) savedSpent += parseInt(savedAlloc[k]||0)||0;
  let temp = getTempAlloc();
  let tempSpent = 0; for(let k in temp) tempSpent += parseInt(temp[k]||0)||0;
  let remaining = 0; try{ remaining = volandGetStatPointsRemaining(); }catch(e){}
  return remaining - (tempSpent - savedSpent);
}
function renderStatPoints(){
  let heroId2 = heroId;
  // Узкая полоска — если свёрнуто, показываем только полоску
  if(!pointsExpanded){
    let remaining0 = getRemainingForUI();
    let temp0 = getTempAlloc();
    let spent0 = 0; for(let k in temp0) spent0 += parseInt(temp0[k]||0)||0;
    let allocStr = ['HP','DEF','DMG','MANA','CRIT'].map(k=>k+' '+ (parseInt(temp0[k]||0)||0)).join(' • ');
    document.getElementById('statPointsPanel').innerHTML = `
      <div class="stat-points-strip" onclick="pointsExpanded=true; renderStatPoints();">
        <div><span class="stat-points-strip-title">⭐ ОЧКИ • РАСПРЕДЕЛЕНИЕ</span> <span class="stat-points-strip-info">Осталось: ${remaining0} • Вложено: ${spent0} • ${allocStr}</span></div>
        <div style="font:700 10px 'JetBrains Mono',monospace;color:#e6d5a0">РАЗВЕРНУТЬ ▼</div>
      </div>
    `;
    return;
  }
  let isParryHero = (cur.PARRY||0) > 0 || (VOLAND_HEROES[heroId2]?.st?.PARRY||0) > 0;
  let remaining = getRemainingForUI();
  let temp = getTempAlloc();
  let autoLabel = 'База уже с лвлом: оригинал + (уровень-1)*бонус';
  // Автомат не расписываем отдельно — он уже в базе, как ты сказал
  let critTh = null;
  try{ critTh = volandGetCritThresholds(heroId2); }catch(e){ critTh = {threshold:30, cap:40}; }
  let respecUsed = false; try{ respecUsed = volandGetStatRespecUsed(); }catch(e){}
  let respecCost = 200; try{ respecCost = volandGetStatRespecCost(); }catch(e){}
  let rows = [
    {key:'HP', name:'HP', per:'1 очко = +30 HP', max:20},
    {key:'DEF', name:'DEF', per:'1 очко = +5 DEF', max:20},
    {key:'DMG', name:'DMG', per:'1 очко = +10 DMG', max:20},
    {key:'MANA', name:'MANA', per:'1 очко = +20 MANA', max:20},
    {key:'CRIT', name:'CRIT', per:'1 очко = +0,5% CRIT', max:20},
    {key: isParryHero ? 'PARRY' : 'DODGE', name: isParryHero ? 'PARRY' : 'DODGE', per:'1 очко = +0,5% ' + (isParryHero ? 'PARRY' : 'DODGE'), max:20},
  ];
  let rowsHtml = rows.map(r=>{
    let v = parseInt(temp[r.key]||0)||0;
    return `<div class="stat-row"><div class="stat-row-name">${r.name}</div><div class="stat-row-info">${r.per} • Вложено: ${v} / ${r.max}<br><span style="color:#6a7a8a">Бонус: ${r.key==='CRIT'||r.key==='DODGE'||r.key==='PARRY' ? (v*0.5).toFixed(1)+'%' : (r.key==='HP' ? v*30 : r.key==='DEF' ? v*5 : r.key==='DMG' ? v*10 : v*20)}</span></div><div class="stat-row-pts">${v}</div><button class="stat-btn" onclick="changeStatPoint('${r.key}', -1)" ${v<=0?'disabled':''}>−</button><button class="stat-btn plus" onclick="changeStatPoint('${r.key}', 1)" ${remaining<=0 || v>=r.max ? 'disabled' : ''}>+</button></div>`;
  }).join('');
  let hasChanges = false;
  try{
    let saved = volandGetStatAlloc();
    for(let k in temp){ if((parseInt(temp[k]||0)||0) !== (parseInt(saved[k]||0)||0)) hasChanges = true; }
  }catch(e){}
  document.getElementById('statPointsPanel').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center"><div class="stat-points-title">⭐ ОЧКИ • РАСПРЕДЕЛЕНИЕ</div><button class="points-btn secondary" onclick="pointsExpanded=false; renderStatPoints();" style="padding:6px 10px;font-size:9px">СВЕРНУТЬ ▲</button></div>
    <div class="stat-points-sub">Осталось очков: <b style="color:#e6d5a0;font-size:12px">${remaining}</b> • Уровень: ${lvlForName} • ${autoLabel}<br>Предохранители: CRIT — порог ${critTh.threshold}% / кап ${critTh.cap}% • DODGE/PARRY — порог 20% / кап 30% • После порога %/2 • Дебаф Вариант А — минус пункты от эффективного значения<br>Милстоуны: каждые 10 уровней +1 очко + золото (10 ур. +500G, 20 ур. +1000G, 30 ур. +1500G...)<br><span style="color:#e6d5a0">СБРОС сбрасывает только жёлтое — очки. База (с лвлом) и шмот остаются.</span></div>
    <div style="margin-top:12px">${rowsHtml}</div>
    <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="points-btn" onclick="saveStatPoints()" ${!hasChanges?'disabled':''}>СОХРАНИТЬ</button>
      <button class="points-btn secondary" onclick="resetStatPointsUI()">${respecUsed ? 'СБРОС — ' + respecCost + 'G' : 'СБРОС — БЕСПЛАТНО (1 раз)'}</button>
    </div>
    <div id="statPointsMsg" style="margin-top:8px;font:400 9px 'JetBrains Mono',monospace;color:#3ad080"></div>
  `;
}
function changeStatPoint(key, delta){
  let temp = getTempAlloc();
  let v = parseInt(temp[key]||0)||0;
  let nv = v + delta;
  if(nv<0) return;
  if(nv>20) return;
  if(delta>0){
    let remaining = getRemainingForUI();
    if(remaining<=0) return;
  }
  temp[key] = nv;
  renderStatPoints();
}
function saveStatPoints(){
  let temp = getTempAlloc();
  let res = null;
  try{ res = volandSpendStatPoints(temp); }catch(e){ res = {ok:false, reason:String(e)}; }
  let msg = document.getElementById('statPointsMsg');
  if(res && res.ok){
    if(msg) msg.textContent = 'Сохранено! Перезагружаю...';
    setTimeout(()=>location.reload(), 500);
  } else {
    if(msg) { msg.style.color = '#e05050'; msg.textContent = 'Ошибка: ' + (res ? res.reason : 'неизвестно'); }
  }
}
function resetStatPointsUI(){
  let used = false; try{ used = volandGetStatRespecUsed(); }catch(e){}
  let cost = 200; try{ cost = volandGetStatRespecCost(); }catch(e){}
  let text = used ? 'Сброс стоит ' + cost + 'G. Сбросить все очки?' : 'Первый сброс — бесплатно. Сбросить все очки?';
  if(!confirm(text)) return;
  let res = null;
  try{ res = volandResetStatPoints(); }catch(e){ res = {ok:false, reason:String(e)}; }
  let msg = document.getElementById('statPointsMsg');
  if(res && res.ok){
    if(msg) msg.textContent = 'Сброшено! Перезагружаю...';
    tempAlloc = null;
    setTimeout(()=>location.reload(), 500);
  } else {
    if(msg) { msg.style.color = '#e05050'; msg.textContent = 'Ошибка: ' + (res ? res.reason : 'неизвестно'); }
  }
}
renderStatPoints();

let totalXp = 0;
try{ totalXp = typeof volandGetXp==='function' ? volandGetXp() : 0; }catch(e){}
let lvlInfo = typeof volandGetLevelInfo==='function' ? volandGetLevelInfo(totalXp) : {lvl:1,cur:0,need:1000,pct:0,total:totalXp};

function renderBarsStamina(){
  try{
    let curHP = cur.HP, curMANA = cur.MANA, curSTAM = 100, maxSTAM = 100, stamPct = 100;
    try{
      if(typeof volandGetCurrentHP==='function') curHP = volandGetCurrentHP();
      if(typeof volandGetCurrentMANA==='function') curMANA = volandGetCurrentMANA();
      if(typeof volandGetStaminaInfo==='function'){
        let sinfo = volandGetStaminaInfo();
        curSTAM = sinfo.cur; maxSTAM = sinfo.max; stamPct = sinfo.pct;
      } else if(typeof volandGetStamina==='function'){
        curSTAM = volandGetStamina(); maxSTAM = volandGetStaminaMax();
        stamPct = Math.round(curSTAM/maxSTAM*100);
      }
    }catch(e){}
    let hpPct = Math.max(0, Math.min(100, Math.round(curHP/cur.HP*100)));
    let manaPct = Math.max(0, Math.min(100, Math.round(curMANA/cur.MANA*100)));
    document.getElementById('barsPanel').innerHTML = `
      <div class="bar-row"><div class="bar-label">HP</div><div class="bar-track"><div class="bar-fill hp" style="width:${hpPct}%"></div><div class="bar-text">${curHP} / ${cur.HP}</div></div></div>
      <div class="bar-row"><div class="bar-label">MANA</div><div class="bar-track"><div class="bar-fill mana" style="width:${manaPct}%"></div><div class="bar-text">${curMANA} / ${cur.MANA}</div></div></div>
      <div class="bar-row"><div class="bar-label">STAMINA</div><div class="bar-track"><div class="bar-fill stamina" style="width:${stamPct}%"></div><div class="bar-text">${curSTAM} / ${maxSTAM}</div></div></div>
      <div class="bar-row"><div class="bar-label">XP</div><div class="bar-track"><div class="bar-fill xp" style="width:${lvlInfo.pct}%"></div><div class="bar-text">${lvlInfo.cur} / ${lvlInfo.need}</div></div></div>
    `;
  }catch(e){
    document.getElementById('barsPanel').innerHTML = `
      <div class="bar-row"><div class="bar-label">HP</div><div class="bar-track"><div class="bar-fill hp" style="width:100%"></div><div class="bar-text">${cur.HP} / ${cur.HP}</div></div></div>
      <div class="bar-row"><div class="bar-label">MANA</div><div class="bar-track"><div class="bar-fill mana" style="width:100%"></div><div class="bar-text">${cur.MANA} / ${cur.MANA}</div></div></div>
      <div class="bar-row"><div class="bar-label">STAMINA</div><div class="bar-track"><div class="bar-fill stamina" style="width:100%"></div><div class="bar-text">100 / 100</div></div></div>
      <div class="bar-row"><div class="bar-label">XP</div><div class="bar-track"><div class="bar-fill xp" style="width:${lvlInfo.pct}%"></div><div class="bar-text">${lvlInfo.cur} / ${lvlInfo.need}</div></div></div>
    `;
  }
}
renderBarsStamina();
setInterval(renderBarsStamina, 1000);

let playText = playHours<1 ? '<1h' : playHours+'h';

let kills = volandGetKills();

  <div class="extra-card">
    <div class="extra-icon">⏱️</div>
    <div class="extra-label">TIME PLAYED</div>
    <div class="extra-value">${playText}</div>

  <div class="extra-card" onclick="location.href='./page9.html'" style="cursor:pointer">

`;
