<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOLAND - HERO</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0e14;color:#d8d2b8;font-family:Inter,Arial,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0}.bg img{width:100%;height:100%;object-fit:cover;opacity:0.9}.bg:after{content:"";position:absolute;inset:0;background:rgba(10,14,20,.78)}
.wrap{position:fixed;inset:0;display:flex;z-index:2}
.left-nav{width:68px;min-width:68px;background:#12181e;border-right:1px solid #1e2a32;display:flex;flex-direction:column;align-items:center;padding:12px 6px;gap:18px}
.nav-item{width:48px;height:48px;background:#1a252f;border:1px solid #2a3a4a;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0.6;transition:.2s;font-size:20px}
.nav-item.active{background:#1e2f3e;border-color:#3a4a5a;opacity:1;box-shadow:0 0 12px rgba(230,213,160,.2)}
.nav-item:hover{opacity:1;border-color:#e6d5a0}
.nav-label{font-size:7px;letter-spacing:.15em;color:#6a7a8a;margin-top:4px;text-align:center;font-family:'JetBrains Mono',monospace}
.hero-panel{width:380px;min-width:380px;background:#141c24;border-right:1px solid #1e2a32;display:flex;flex-direction:column;overflow:hidden}
.hero-img-wrap{flex:1;background:#0a0e12;display:flex;align-items:center;justify-content:center;padding:12px;position:relative;overflow:hidden}
.hero-img-wrap img{width:100%;height:100%;object-fit:cover;object-position:top center;border-radius:4px;max-height:72vh}
.hero-info{padding:18px 16px;background:#111821;border-top:1px solid #1e2a32;text-align:center}
.hero-name{font-family:'Cinzel Decorative',serif;font-size:16px;letter-spacing:.3em;color:#e6d5a0;font-weight:900}
.hero-class{margin-top:8px;font-size:10px;letter-spacing:.15em;color:#8a9a6a;font-family:'JetBrains Mono',monospace;text-transform:uppercase}
.main{flex:1;display:flex;flex-direction:column;background:rgba(16,22,30,.92);overflow:auto;padding:0}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px;background:#131a22;border-bottom:1px solid #1e2a32}
.stat-card{background:#1a242f;border:1px solid #2a3a4a;border-radius:8px;padding:14px 10px;text-align:center}
.stat-label{font-size:8px;letter-spacing:.2em;color:#6a7a8a;font-family:'JetBrains Mono',monospace}
.stat-value{margin-top:6px;font-size:22px;font-weight:800;color:#e6d5a0;font-family:'JetBrains Mono',monospace}
.stat-bonus{font-size:8px;color:#3ad080;margin-top:2px}
.bars-panel{padding:18px 20px;background:#111821;display:flex;flex-direction:column;gap:14px;flex:1}
.bar-row{display:flex;align-items:center;gap:12px}
.bar-label{width:60px;font-size:9px;letter-spacing:.15em;color:#6a7a8a;text-align:right;font-family:'JetBrains Mono',monospace}
.bar-track{flex:1;height:18px;background:#0a0e14;border-radius:3px;overflow:hidden;border:1px solid #1e2a32;position:relative}
.bar-fill{height:100%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;font-family:'JetBrains Mono',monospace}
.bar-fill.hp{background:linear-gradient(90deg,#b33030,#e05050);color:#fff}
.bar-fill.mana{background:linear-gradient(90deg,#1a4a9a,#2a6ad0);color:#fff}
.bar-fill.stamina{background:linear-gradient(90deg,#1a7a4a,#3ad080);color:#fff}
.bar-fill.xp{background:linear-gradient(90deg,#8a6a1a,#d0b040);color:#fff}
.right{width:200px;min-width:200px;background:#0e141a;border-left:1px solid #1e2a32;display:flex;flex-direction:column}
.chat-header{padding:12px;border-bottom:1px solid #1e2a32;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#3ad080;box-shadow:0 0 6px #3ad080}
.chat-title{font-size:9px;letter-spacing:.2em;color:#6a7a8a;font-family:'JetBrains Mono',monospace}
.chat-body{flex:1;padding:10px;overflow:auto}
.sys-msg{background:#1a242f;border-left:2px solid #d0b040;padding:8px;font-size:10px;color:#9a9a7a;line-height:1.4;border-radius:0 6px 6px 0;margin-bottom:8px}
.chat-input{padding:8px;border-top:1px solid #1e2a32;display:flex;gap:6px}
.chat-input input{flex:1;background:#0a0e14;border:1px solid #1e2a32;border-radius:6px;padding:8px;font-size:11px;color:#d8d2b8}
.chat-input button{width:32px;background:#e6d5a0;border:none;border-radius:6px;cursor:pointer;font-weight:800}
.top-actions{padding:10px 14px;display:flex;gap:10px;background:#131a22;border-bottom:1px solid #1e2a32}
.btn-exit{background:#1a242f;border:1px solid #2a3a4a;color:#e6d5a0;padding:8px 14px;border-radius:6px;font-size:8px;letter-spacing:.15em;font-family:'JetBrains Mono',monospace;cursor:pointer}
.btn-exit:hover{border-color:#e6d5a0}
</style>
</head>
<body>
<div class="bg"><img src="./assets/heroes/bg-battlefield.webp" onerror="this.style.display='none'"></div>
<div class="wrap">
  <div class="left-nav">
    <div onclick="location.href='./page3.html'"><div class="nav-item active">👤</div><div class="nav-label">HERO</div></div>
    <div onclick="location.href='./page4.html'"><div class="nav-item">🎒</div><div class="nav-label">BAG</div></div>
    <div onclick="location.href='./page5.html'"><div class="nav-item">📜</div><div class="nav-label">SKILLS</div></div>
    <div onclick="location.href='./page6.html'"><div class="nav-item">⚔️</div><div class="nav-label">BATTLE</div></div>
    <div onclick="location.href='./index.html'"><div class="nav-item">🗺️</div><div class="nav-label">MAP</div></div>
  </div>
  <div class="hero-panel">
    <div class="hero-img-wrap"><img id="heroImg" src="./assets/heroes/warrior-f.webp" alt="hero"></div>
    <div class="hero-info">
      <div class="hero-name" id="heroName">VOLAND</div>
      <div class="hero-class" id="heroClass">Loading...</div>
    </div>
  </div>
  <div class="main">
    <div class="top-actions">
      <button class="btn-exit" onclick="location.href='./page2.html'">← CHANGE HERO</button>
      <button class="btn-exit" onclick="location.href='./page6.html'">→ BATTLEFIELD</button>
    </div>
    <div class="stats-grid" id="statsGrid"></div>
    <div class="bars-panel" id="barsPanel"></div>
  </div>
  <div class="right">
    <div class="chat-header"><div class="dot"></div><div class="chat-title">HERO STATS • db.js</div></div>
    <div class="chat-body" id="chatBody">
      <div class="sys-msg">Герой загружен из VOLAND_HEROES + equip bonuses из VOLAND_ITEMS</div>
      <div class="sys-msg" id="bonusInfo"></div>
    </div>
    <div class="chat-input"><input id="chatIn" placeholder="..."><button onclick="addMsg()">▶</button></div>
  </div>
</div>
<script src="./assets/js/db.js"></script>
<script src="./assets/js/storage.js"></script>
<script src="./assets/js/config.js"></script>
<script>
function addMsg(){
  const inp=document.getElementById('chatIn');
  if(!inp.value.trim()) return;
  const div=document.createElement('div');
  div.className='sys-msg';
  div.textContent=volandGetName()+': '+inp.value;
  document.getElementById('chatBody').appendChild(div);
  inp.value='';
}

let heroId = volandGetHeroId();
if(!VOLAND_HEROES[heroId]) heroId='necro-f-new';
let heroData = VOLAND_HEROES[heroId];
let profileName = volandGetName();
let calc = volandCalcStats();
let cur = calc.cur;
let bonus = calc.bonus;

document.getElementById('heroImg').src = heroData.img;
document.getElementById('heroName').textContent = profileName.toUpperCase();
document.getElementById('heroClass').textContent = heroData.n + ' • ' + heroData.role;

document.getElementById('statsGrid').innerHTML = `
  <div class="stat-card"><div class="stat-label">HP</div><div class="stat-value">${cur.HP}</div><div class="stat-bonus">${bonus.HP? '+'+bonus.HP+' from items':''}</div></div>
  <div class="stat-card"><div class="stat-label">DEF</div><div class="stat-value">${cur.DEF}</div><div class="stat-bonus">${bonus.DEF? '+'+bonus.DEF:''}</div></div>
  <div class="stat-card"><div class="stat-label">DAMAGE</div><div class="stat-value">${cur.DMG}</div><div class="stat-bonus">${bonus.DMG? '+'+bonus.DMG:''}</div></div>
  <div class="stat-card"><div class="stat-label">MANA</div><div class="stat-value">${cur.MANA}</div><div class="stat-bonus">${bonus.MANA? '+'+bonus.MANA:''}</div></div>
  <div class="stat-card"><div class="stat-label">CRIT</div><div class="stat-value">${cur.CRIT}%</div><div class="stat-bonus">${bonus.CRIT? '+'+bonus.CRIT+'%':''}</div></div>
  <div class="stat-card"><div class="stat-label">${cur.PARRY>0?'PARRY':'DODGE'}</div><div class="stat-value">${cur.PARRY>0?cur.PARRY:cur.DODGE}%</div><div class="stat-bonus">${bonus.PARRY||bonus.DODGE? '+'+(bonus.PARRY||bonus.DODGE)+'%':''}</div></div>
`;

document.getElementById('barsPanel').innerHTML = `
  <div class="bar-row"><div class="bar-label">HP</div><div class="bar-track"><div class="bar-fill hp" style="width:${Math.min(100,cur.HP/1500*100)}%">${cur.HP} / 1500</div></div></div>
  <div class="bar-row"><div class="bar-label">MANA</div><div class="bar-track"><div class="bar-fill mana" style="width:${Math.min(100,cur.MANA/400*100)}%">${cur.MANA} / 400</div></div></div>
  <div class="bar-row"><div class="bar-label">STAMINA</div><div class="bar-track"><div class="bar-fill stamina" style="width:100%">100 / 100</div></div></div>
  <div class="bar-row"><div class="bar-label">XP</div><div class="bar-track"><div class="bar-fill xp" style="width:64%">LVL 7 - 6420 / 10000 XP</div></div></div>
`;

let bonusText = Object.keys(bonus).length ? 'Бонусы от шмота: ' + Object.entries(bonus).map(([k,v])=>k+'+'+v).join(', ') : 'Нет экипированных предметов — иди в BAG';
document.getElementById('bonusInfo').textContent = bonusText;
console.log('HERO page loaded', heroId, cur, bonus);
</script>
</body>
</html>
