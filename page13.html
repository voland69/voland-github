<script>
// ===== PAGE13 v2 — 3 окошка + fullscreen =====
function openView(name){
  document.getElementById('mainView').style.display='none';
  document.getElementById('seasonView').style.display='none';
  document.getElementById('rewardsView').style.display='none';
  document.getElementById('passView').style.display='none';
  if(name==='season'){ document.getElementById('seasonView').style.display='block'; renderSeason(); }
  if(name==='rewards'){ document.getElementById('rewardsView').style.display='block'; renderRewards(); }
  if(name==='pass'){ document.getElementById('passView').style.display='block'; renderPass(); }
  window.scrollTo(0,0);
}
function closeView(){
  document.getElementById('mainView').style.display='block';
  document.getElementById('seasonView').style.display='none';
  document.getElementById('rewardsView').style.display='none';
  document.getElementById('passView').style.display='none';
  updateBadges();
}
function getSeasonInfo(){
  let now = new Date();
  let y = now.getFullYear(), m = now.getMonth();
  let startMonth = Math.floor(m/2)*2;
  let start = new Date(y, startMonth, 1);
  let end = new Date(y, startMonth+2, 0, 23,59,59);
  let seasonNum = 1;
  if(!(y===2026 && startMonth===10)){
    seasonNum = 1 + ((y-2026)*6 + (startMonth/2 - 5));
    if(seasonNum<1) seasonNum=1;
  }
  let total = Math.floor((new Date(y,startMonth+2,0) - new Date(y,startMonth,1))/86400000)+1;
  let passed = Math.floor((now - new Date(y,startMonth,1))/86400000)+1;
  if(passed<0) passed=0; if(passed>total) passed=total;
  let left = total - passed;
  let pct = Math.floor(passed/total*100);
  let diff = end - now;
  if(diff<0) diff=0;
  let daysLeft = Math.floor(diff/86400000);
  let hoursLeft = Math.floor((diff % 86400000)/3600000);
  return {num:seasonNum, start:start, end:end, total:total, passed:passed, left:left, pct:pct, now:now, daysLeft:daysLeft, hoursLeft:hoursLeft};
}
function fmtDate(d){
  let months=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'].map(x=>volandMonthGen(x));
  return d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();
}
function renderSeason(){
  let s = getSeasonInfo();
  let news = '';
  if(s.num===1){
    news = `
      <div class="news-item"><b>${volandT('3 новые локи:', '3 new locations:')}</b> ${volandT('Болото, Вулкан, Руины — новые мобы, боссы и ресурсы Вода, Камень, Кость.', 'Swamp, Volcano, Ruins — new mobs, bosses and resources Water, Stone, Bone.')}</div>
      <div class="news-item"><b>${volandT('51 миссия вместо 22:', '51 missions instead of 22:')}</b> ${volandT('6 фаз на каждой локе — 20, 50, 100, 200, 300, 500 мобов. Титулы на III фазе зелёные, IV — синие, V — красные, VI — жёлтые, ', '6 phases per location — 20, 50, 100, 200, 300, 500 mobs. Titles on phase III green, IV blue, V red, VI yellow, ')}<b>${volandT('ВЛАДЫКА + лока', 'LORD + location')}</b>.</div>
      <div class="news-item"><b>${volandT('Новая формула стамины:', 'New stamina formula:')}</b> ${volandT('100 + 1,5% за каждый стат героя — теперь стамина растёт с героем.', '100 + 1.5% per hero stat — stamina now grows with hero.')}</div>
      <div class="news-item"><b>Market:</b> ${volandT('Вода, Камень, Кость по 50g BUY / 25g SELL, как у базы. Обмен как у базы — 1к2 внутри базы, 1к4 с Клыком и Эссенцией.', 'Water, Stone, Bone at 50g BUY / 25g SELL, like base. Exchange like base — 1:2 inside base, 1:4 with Fang and Essence.')}</div>
      <div class="news-item"><b>${volandT('Починка ульты:', 'Ult fix:')}</b> ${volandT('ульта теперь на ', 'ult is now on ')}<b>T</b>${volandT(', а не на ', ', not on ')}<b>R</b>${volandT(', и считается в миссии «Ученик Магии» — каждое нажатие T в бою +1.', ', and counts in mission «Apprentice» — each T press in battle +1.')}</div>
      <div class="news-item"><b>Page3:</b> ${volandT('карточка QUESTS заменена на MISSIONS — X / 51, процент, клик ведёт на страницу миссий.', 'QUESTS card replaced with MISSIONS — X / 51, percent, click goes to missions page.')}</div>
      <div class="news-item"><b>${volandT('Battle Pass и календарь:', 'Battle Pass and calendar:')}</b> ${volandT('новый PASS — сезон, ежедневные подарки и пасс от общего XP героя.', 'new PASS — season, daily gifts and pass from total hero XP.')}</div>
    `;
  } else {
    news = `<div class="news-item">${volandT('Новости Сезона ', 'Season ')}${s.num} ${volandT('появятся в начале сезона.', 'news will appear at season start.')}</div>`;
  }
  document.getElementById('seasonCard').innerHTML = `
    <div class="section-title">⭐ ${volandT("СЕЗОН","SEASON")} ${s.num}</div>
    <div class="section-sub">${fmtDate(s.start)} — ${fmtDate(s.end)} • ${volandT('2 месяца', '2 months')} • ${s.total} ${volandT('дней', 'days')}</div>
    <div style="margin-top:12px;font:400 11px Inter,sans-serif;color:#d8d2b8">${volandT('Прошло ', 'Passed ')}<b style="color:#e6d5a0">${s.passed} / ${s.total} ${volandT('дней', 'days')}</b> • ${volandT('Осталось ', 'Left ')}<b style="color:#e6d5a0">${s.daysLeft}D ${s.hoursLeft}H</b> • ${s.pct}% ${volandT('сезона', 'of season')}</div>
    <div class="season-bar"><div class="season-fill" style="width:${s.pct}%"></div></div>
    <div style="margin-top:10px;font:700 11px 'JetBrains Mono',monospace;color:#e6d5a0">⏳ ${volandT('СЕЗОН ЗАКАНЧИВАЕТСЯ ЧЕРЕЗ — ', 'SEASON ENDS IN — ')}${s.daysLeft}D ${s.hoursLeft}H</div>
    <div style="margin-top:16px;font:700 11px Inter,sans-serif;color:#e6d5a0;letter-spacing:.08em">${volandT('НОВОСТИ И ИЗМЕНЕНИЯ СЕЗОНА', 'SEASON NEWS AND CHANGES')}</div>
    <div class="news-list">${news}</div>
  `;
}
function getDailyGift(day, totalDays){
  let resCycle = ['quartz','wood','diamond','water','stone','bone'];
  let resNames = {quartz:volandResName('Кварц'),wood:volandResName('Дерево'),diamond:volandResName('Алмаз'),water:volandResName('Вода'),stone:volandResName('Камень'),bone:volandResName('Кость')};
  let resIcons = {quartz:'💎',wood:'🪵',diamond:'💠',water:'💧',stone:'🪨',bone:'🦴'};
  if(day===totalDays) return {icon:'🎁', label:'500G + 500 XP', give:function(){ try{volandAddGold(500);}catch(e){} try{volandAddXp(500);}catch(e){} }};
  if(day%7===0){
    if(day===7) return {icon:'🧪', label:'Potion HP XS + 200G', give:function(){ try{volandAddToInventory('potion-hp-xs');}catch(e){} try{volandAddGold(200);}catch(e){} }};
    if(day===14) return {icon:'🧪', label:'Potion Mana XS + 200G', give:function(){ try{volandAddToInventory('potion-mana-xs');}catch(e){} try{volandAddGold(200);}catch(e){} }};
    if(day===21) return {icon:'🧪', label:'Potion Stam XS + 200G', give:function(){ try{volandAddToInventory('potion-stam-xs');}catch(e){} try{volandAddGold(200);}catch(e){} }};
    if(day===28) return {icon:'🧪', label:'Potion HP S + 300G', give:function(){ try{volandAddToInventory('potion-hp-s');}catch(e){} try{volandAddGold(300);}catch(e){} }};
    return {icon:'🧪', label:'Potion + 200G', give:function(){ try{volandAddToInventory('potion-hp-xs');}catch(e){} try{volandAddGold(200);}catch(e){} }};
  }
  let mod = day % 4;
  if(mod===1){ let amt = 50 + (day % 3) * 25; return {icon:'💰', label:amt+'G', give:function(){ try{volandAddGold(amt);}catch(e){} }}; }
  if(mod===2){ let amt = 50 + (day % 3) * 25; return {icon:'⭐', label:amt+' XP', give:function(){ try{volandAddXp(amt);}catch(e){} }}; }
  if(mod===3){ let rid = resCycle[Math.floor(day/4) % resCycle.length]; return {icon:resIcons[rid], label:'1 '+resNames[rid], give:function(){ try{volandAddResource(rid,1);}catch(e){} }}; }
  return {icon:'💰', label:'75G', give:function(){ try{volandAddGold(75);}catch(e){} }};
}
function getHeroSuffix(){
  try{
    let cur = null;
    try{ if(typeof volandGetCurrentSave==='function') cur = volandGetCurrentSave(); }catch(e){}
    if(!cur){
      try{
        let saves = volandGetSaves(); let idx = volandGetActiveIndex();
        if(saves && saves[idx]) cur = saves[idx];
      }catch(e){}
    }
    if(cur && cur.created) return '_' + cur.created;
    try{ let idx = volandGetActiveIndex(); return '_idx'+idx; }catch(e){ return ''; }
  }catch(e){ return ''; }
}
function getDailyKey(y,m){ return 'voland_daily_'+y+'-'+String(m+1).padStart(2,'0') + getHeroSuffix(); }
function getDailyKeyGlobal(y,m){ return 'voland_daily_'+y+'-'+String(m+1).padStart(2,'0'); }
function getDailyClaimed(y,m){
  try{
    let perHeroKey = getDailyKey(y,m);
    let v = localStorage.getItem(perHeroKey);
    if(v) return JSON.parse(v);
    // Миграция: старый глобальный ключ — только для старого героя, не для нового LVL 1
    try{
      let globalKey = getDailyKeyGlobal(y,m);
      let gv = localStorage.getItem(globalKey);
      if(gv){
        let gArr = JSON.parse(gv);
        if(gArr && gArr.length>0){
          let isFresh = false;
          try{
            let lvl = 1; try{ lvl = volandGetLevel(); }catch(e){}
            let xp = 0; try{ xp = volandGetXp(); }catch(e){}
            let gold = 0; try{ gold = volandGetGold(); }catch(e){}
            if(lvl<=1 && xp<=0 && gold<=0) isFresh = true;
          }catch(e){}
          if(!isFresh){
            // Старый герой — переносим его старые забранные дни на его ключ, и чистим глобальный
            try{ localStorage.setItem(perHeroKey, JSON.stringify(gArr)); }catch(e){}
            try{ localStorage.removeItem(globalKey); }catch(e){}
            return gArr;
          }
        }
      }
    }catch(e){}
    return [];
  }catch(e){ return []; }
}
function claimDaily(day){
  let now = new Date(); let y = now.getFullYear(), m = now.getMonth();
  if(day !== now.getDate()) return;
  let claimed = getDailyClaimed(y,m);
  if(claimed.includes(day)) return;
  let totalDays = new Date(y, m+1, 0).getDate();
  let gift = getDailyGift(day, totalDays);
  try{ gift.give(); }catch(e){}
  claimed.push(day);
  try{ localStorage.setItem(getDailyKey(y,m), JSON.stringify(claimed)); }catch(e){}
  renderRewards(); updateBadges();
}
function renderRewards(){
  let now = new Date(); let y = now.getFullYear(), m = now.getMonth();
  let months = ['ЯНВАРЬ','ФЕВРАЛЬ','МАРТ','АПРЕЛЬ','МАЙ','ИЮНЬ','ИЮЛЬ','АВГУСТ','СЕНТЯБРЬ','ОКТЯБРЬ','НОЯБРЬ','ДЕКАБРЬ'].map(x=>volandMonthUp(x));
  let totalDays = new Date(y, m+1, 0).getDate();
  let claimed = getDailyClaimed(y,m);
  let today = now.getDate();
  let html = `<div class="section-title">🎁 ${volandT("НАГРАДЫ","REWARDS")} • ${months[m]} ${y}</div><div class="section-sub">${totalDays} ${volandT('дней', 'days')} • ${volandT('Забрать можно только сегодня', 'Can claim only today')} • ${volandT('Пропустил день — подарок сгорел', 'Missed day — gift burned')}</div><div class="calendar-grid">`;
  for(let d=1; d<=totalDays; d++){
    let gift = getDailyGift(d, totalDays);
    let cls = '', btn = '';
    if(claimed.includes(d)){ cls='claimed'; btn='<div style="font:700 8px JetBrains Mono,monospace;color:#3ad080">' + volandT("ЗАБРАНО", "CLAIMED") + '</div>'; }
    else if(d < today){ cls='missed'; btn='<div style="font:700 8px JetBrains Mono,monospace;color:#8a8aaa">' + volandT("ПРОПУЩЕН", "MISSED") + '</div>'; }
    else if(d === today){ cls='today'; btn=`<button class="day-btn" onclick="claimDaily(${d})">${volandT('ЗАБРАТЬ', 'CLAIM')}</button>`; }
    else { cls='locked'; btn='<div style="font:700 8px JetBrains Mono,monospace;color:#5a6a7a">' + volandT("ЗАКРЫТО", "CLOSED") + '</div>'; }
    html += `<div class="day-cell ${cls}"><div class="day-num">${volandT('ДЕНЬ ', 'DAY ')}${d}</div><div class="day-gift">${gift.icon}</div><div class="day-label">${gift.label}</div>${btn}</div>`;
  }
  html += `</div>`;
  document.getElementById('rewardsCard').innerHTML = html;
}
function getXpForPassLevel(lvl){ return 1000 + (lvl-1)*200; }
function getTotalXpForPassLevel(lvl){ let sum=0; for(let i=1;i<lvl;i++){ sum += getXpForPassLevel(i); } return sum; }
function getPassLevel(totalXp){ let xp = parseInt(totalXp)||0; let lvl=1; for(let l=1;l<=50;l++){ if(xp >= getTotalXpForPassLevel(l)) lvl=l; else break; } return lvl; }
function getFreePrize(lvl){
  let potCycle = ['potion-hp-xs','potion-mana-xs','potion-stam-xs'];
  let potNames = {'potion-hp-xs':'Potion HP XS','potion-mana-xs':'Potion Mana XS','potion-stam-xs':'Potion Stam XS'};
  let resCycle = ['quartz','wood','diamond','water','stone','bone'];
  let resNames = {quartz:volandResName('Кварц'),wood:volandResName('Дерево'),diamond:volandResName('Алмаз'),water:volandResName('Вода'),stone:volandResName('Камень'),bone:volandResName('Кость')};
  let mod = lvl % 5;
  if(mod===1){ let amt = 100 + (lvl-1)*10; return {label: amt+'G', icon:'💰', give:function(){ try{volandAddGold(amt);}catch(e){} }}; }
  if(mod===2){ let amt = 100 + (lvl-2)*10; return {label: amt+' XP', icon:'⭐', give:function(){ try{volandAddXp(amt);}catch(e){} }}; }
  if(mod===3){ let pid = potCycle[Math.floor(lvl/5) % 3]; return {label: potNames[pid], icon:'🧪', give:function(){ try{volandAddToInventory(pid);}catch(e){} }}; }
  if(mod===4){ let rid = resCycle[Math.floor(lvl/5) % resCycle.length]; return {label: '1 '+resNames[rid], icon:'💎', give:function(){ try{volandAddResource(rid,1);}catch(e){} }}; }
  if(lvl % 10 === 0){ return {label: 'Potion S + 200G', icon:'🧪', give:function(){ try{volandAddToInventory('potion-hp-s');}catch(e){} try{volandAddGold(200);}catch(e){} }}; }
  return {label: '200G + 100 XP', icon:'🎁', give:function(){ try{volandAddGold(200);}catch(e){} try{volandAddXp(100);}catch(e){} }};
}
function getPremiumPrize(lvl){
  let free = getFreePrize(lvl);
  if(free.label.includes('G') && free.label.includes('XP')) return {label:'2000G + 1000 XP + RUNA', icon:'🔮'};
  if(free.label.includes('Potion S')) return {label:'Potion HP XL + RUNA', icon:'🔮'};
  if(free.label.includes('Potion')){ let xl = free.label.replace('XS','XL'); return {label: xl+' + RUNA', icon:'🔮'}; }
  if(free.label.includes('G')){ let amt = parseInt(free.label) * 10; return {label: amt+'G', icon:'💰'}; }
  if(free.label.includes('XP')){ let amt = parseInt(free.label) * 10; return {label: amt+' XP', icon:'⭐'}; }
  return {label:volandT('10x ресурс + RUNA', '10x resource + RUNA'), icon:'🔮'};
}
function getPassKey(seasonNum){ return 'voland_pass_claimed_s'+seasonNum + getHeroSuffix(); }
function getPassKeyGlobal(seasonNum){ return 'voland_pass_claimed_s'+seasonNum; }
function getPassClaimed(seasonNum){
  try{
    let perHeroKey = getPassKey(seasonNum);
    let v = localStorage.getItem(perHeroKey);
    if(v) return JSON.parse(v);
    try{
      let gv = localStorage.getItem(getPassKeyGlobal(seasonNum));
      if(gv){
        let gArr = JSON.parse(gv);
        if(gArr && gArr.length>0){
          let isFresh = false;
          try{
            let lvl = 1; try{ lvl = volandGetLevel(); }catch(e){}
            let xp = 0; try{ xp = volandGetXp(); }catch(e){}
            let gold = 0; try{ gold = volandGetGold(); }catch(e){}
            if(lvl<=1 && xp<=0 && gold<=0) isFresh = true;
          }catch(e){}
          if(!isFresh){
            try{ localStorage.setItem(perHeroKey, JSON.stringify(gArr)); }catch(e){}
            try{ localStorage.removeItem(getPassKeyGlobal(seasonNum)); }catch(e){}
            return gArr;
          }
        }
      }
    }catch(e){}
    return [];
  }catch(e){ return []; }
}
function claimPass(lvl){
  let totalXp = 0; try{ totalXp = volandGetXp(); }catch(e){}
  let curLvl = getPassLevel(totalXp);
  if(lvl > curLvl) return;
  let s = getSeasonInfo();
  let claimed = getPassClaimed(s.num);
  if(claimed.includes(lvl)) return;
  let prize = getFreePrize(lvl);
  try{ prize.give(); }catch(e){}
  claimed.push(lvl);
  try{ localStorage.setItem(getPassKey(s.num), JSON.stringify(claimed)); }catch(e){}
  renderPass(); updateBadges();
}
function claimAllPass(){
  let totalXp = 0; try{ totalXp = volandGetXp(); }catch(e){}
  let curLvl = getPassLevel(totalXp);
  let s = getSeasonInfo();
  let claimed = getPassClaimed(s.num);
  let toClaim = [];
  for(let lvl=1; lvl<=curLvl; lvl++){ if(!claimed.includes(lvl)) toClaim.push(lvl); }
  if(toClaim.length===0) return;
  toClaim.forEach(lvl=>{
    let prize = getFreePrize(lvl);
    try{ prize.give(); }catch(e){}
    claimed.push(lvl);
  });
  try{ localStorage.setItem(getPassKey(s.num), JSON.stringify(claimed)); }catch(e){}
  renderPass(); updateBadges();
}
function renderPass(){
  let totalXp = 0; try{ totalXp = volandGetXp(); }catch(e){}
  let curLvl = getPassLevel(totalXp);
  let totalForCur = getTotalXpForPassLevel(curLvl);
  let needForCur = curLvl>=50 ? getXpForPassLevel(50) : getXpForPassLevel(curLvl);
  let inLvl = (parseInt(totalXp)||0) - totalForCur;
  if(inLvl<0) inLvl=0;
  let toNext = curLvl>=50 ? 0 : needForCur - inLvl;
  let pct = needForCur>0 ? Math.floor(inLvl/needForCur*100) : 100;
  if(pct>100) pct=100;
  let s = getSeasonInfo();
  let claimed = getPassClaimed(s.num);
  let avail = 0;
  for(let lvl=1; lvl<=curLvl; lvl++){ if(!claimed.includes(lvl)) avail++; }
  let headerCells = '', freeCells = '', premCells = '';
  for(let lvl=1; lvl<=50; lvl++){
    let isCur = lvl===curLvl;
    headerCells += `<div class="pass-header-cell ${isCur?'cur':''}">${lvl}</div>`;
    let free = getFreePrize(lvl);
    let prem = getPremiumPrize(lvl);
    let freeCls = '', freeDot = '<div class="pass-dot"></div>';
    if(claimed.includes(lvl)){ freeCls='unlocked'; freeDot='<div class="pass-dot done"></div>'; }
    else if(lvl<=curLvl){ freeCls='current'; freeDot='<div class="pass-dot avail"></div>'; }
    freeCells += `<div class="pass-cell free ${freeCls}" onclick="claimPass(${lvl})" title=volandT("БЕСПЛАТНО LVL ", "FREE LVL ") + lvl + " — " + free.label + volandT(" — нажми чтобы забрать", " — click to claim")><div class="pass-cell-icon">${free.icon}</div><div class="pass-cell-label">${free.label}</div>${freeDot}</div>`;
    premCells += `<div class="pass-cell prem" title=volandT("ПРЕМИУМ LVL ", "PREMIUM LVL ") + lvl + " — " + prem.label + volandT(" — СКОРО", " — SOON")><div class="pass-cell-icon">${prem.icon}</div><div class="pass-cell-label">${prem.label}</div><div class="pass-dot"></div></div>`;
  }
  document.getElementById('passCard').innerHTML = `
    <div class="section-title">🎫 BATTLE PASS • ${volandT("СЕЗОН","SEASON")} ${s.num}</div>
    <div class="section-sub">${volandT('1 — 50 • От общего XP героя • БЕСПЛАТНО — забрать можно • ПРЕМИУМ — СКОРО', '1 — 50 • From total hero XP • FREE — can claim • PREMIUM — SOON')}</div>
    <div class="pass-top">
      <div class="pass-circle"><div class="pass-circle-lvl">${volandT('УРОВЕНЬ', 'LEVEL')}</div><div class="pass-circle-num">${curLvl}</div><div class="pass-circle-max">/ 50</div></div>
      <div class="pass-top-info">
        <div style="font:700 12px 'JetBrains Mono',monospace;color:#e6d5a0;letter-spacing:.15em">${volandT('СЕЗОН ', 'SEASON ')}${s.num} • ${volandT('ПРОГРЕСС СЕЗОНА', 'SEASON PROGRESS')}</div>
        <div class="pass-xp">${inLvl} / <span>${needForCur} XP</span></div>
        <div class="pass-xp-bar"><div class="pass-xp-fill" style="width:${pct}%"></div></div>
        <div style="margin-top:6px;font:400 10px 'JetBrains Mono',monospace;color:#8a9aaa">🏆 ${volandT('Ур.', 'Lvl.')} ${curLvl}/50 • ${volandT('Следующий: ', 'Next: ')}${volandT('Ур.', 'Lvl.')} ${curLvl>=50?'МАКС':curLvl+1} • ${volandT('До следующего: ', 'To next: ')}${toNext} XP • ${volandT('Всего XP: ', 'Total XP: ')}${totalXp}</div>
      </div>
      <button class="claim-all" onclick="claimAllPass()" ${avail===0?'disabled':''}>🎁 ${volandT('ЗАБРАТЬ ВСЁ', 'CLAIM ALL')} • ${avail}</button>
    </div>
    <div class="pass-scroll"><div class="pass-inner">
      <div class="pass-row"><div class="pass-label">${volandT("УРОВЕНЬ","LEVEL")}</div>${headerCells}</div>
      <div class="pass-row"><div class="pass-label">🎁<br>${volandT('БЕСПЛАТНО', 'FREE')}</div>${freeCells}</div>
      <div class="pass-row"><div class="pass-label">👑<br>${volandT('ПРЕМИУМ', 'PREMIUM')}</div>${premCells}</div>
    </div></div>
    <div style="margin-top:10px;font:400 9px 'JetBrains Mono',monospace;color:#8a9aaa;text-align:center">${volandT('Нажми на окошко БЕСПЛАТНО — забрать по отдельности. Кнопка ЗАБРАТЬ ВСЁ — забрать всё активное сразу. ПРЕМИУМ — видно, но забрать нельзя.', 'Click FREE cell — claim one by one. CLAIM ALL button — claim all active at once. PREMIUM — visible but cannot claim.')}</div>
  `;
}
function updateBadges(){
  try{
    let s = getSeasonInfo();
    let el = document.getElementById('seasonBadge');
    if(el) el.textContent = (typeof volandT==='function' ? volandT('СЕЗОН ','SEASON ') : 'SEASON ')+s.num+' • '+s.daysLeft+'D '+s.hoursLeft+'H';
    let now = new Date();
    let months = ['ЯНВАРЬ','ФЕВРАЛЬ','МАРТ','АПРЕЛЬ','МАЙ','ИЮНЬ','ИЮЛЬ','АВГУСТ','СЕНТЯБРЬ','ОКТЯБРЬ','НОЯБРЬ','ДЕКАБРЬ'].map(x=>volandMonthUp(x));
    let rb = document.getElementById('rewardsBadge');
    if(rb) rb.textContent = months[now.getMonth()]+' '+now.getFullYear();
    let totalXp = 0; try{ totalXp = volandGetXp(); }catch(e){}
    let pb = document.getElementById('passBadge');
    if(pb) pb.textContent = 'LVL '+getPassLevel(totalXp)+' / 50';
  }catch(e){}
}
updateBadges();
</script>
