<script>
// ===== PAGE13 — SEASON / REWARDS / BATTLE PASS =====
function getSeasonInfo(){
  let now = new Date();
  let y = now.getFullYear(), m = now.getMonth();
  let startMonth = Math.floor(m/2)*2;
  let start = new Date(y, startMonth, 1);
  let end = new Date(y, startMonth+2, 0);
  let seasonNum = 1;
  if(!(y===2026 && startMonth===10)){
    seasonNum = 1 + ((y-2026)*6 + (startMonth/2 - 5));
    if(seasonNum<1) seasonNum=1;
  }
  let total = Math.floor((end - start)/86400000)+1;
  let passed = Math.floor((now - start)/86400000)+1;
  if(passed<0) passed=0; if(passed>total) passed=total;
  let left = total - passed;
  let pct = Math.floor(passed/total*100);
  return {num:seasonNum, start:start, end:end, total:total, passed:passed, left:left, pct:pct, now:now};
}
function fmtDate(d){
  let months=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  return d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();
}
function renderSeason(){
  let s = getSeasonInfo();
  let news = '';
  if(s.num===1){
    news = `
      <div class="news-item"><b>3 новые локи:</b> Болото, Вулкан, Руины — новые мобы, боссы и ресурсы Вода, Камень, Кость.</div>
      <div class="news-item"><b>51 миссия вместо 22:</b> 6 фаз на каждой локе — 20, 50, 100, 200, 300, 500 мобов. Титулы на III фазе зелёные, IV — синие, V — красные, VI — жёлтые, <b>ВЛАДЫКА + лока</b>.</div>
      <div class="news-item"><b>Новая формула стамины:</b> 100 + 1,5% за каждый стат героя — теперь стамина растёт с героем.</div>
      <div class="news-item"><b>Market:</b> Вода, Камень, Кость по 50g BUY / 25g SELL, как у базы. Обмен как у базы — 1к2 внутри базы, 1к4 с Клыком и Эссенцией.</div>
      <div class="news-item"><b>Починка ульты:</b> ульта теперь на <b>T</b>, а не на <b>R</b>, и считается в миссии «Ученик Магии» — каждое нажатие T в бою +1.</div>
      <div class="news-item"><b>Page3:</b> карточка QUESTS заменена на MISSIONS — X / 51, процент, клик ведёт на страницу миссий.</div>
      <div class="news-item"><b>Battle Pass и календарь:</b> новый PASS — сезон, ежедневные подарки и пасс от общего XP героя.</div>
    `;
  } else {
    news = `<div class="news-item">Новости Сезона ${s.num} появятся в начале сезона. Следи за обновлениями.</div>`;
  }
  document.getElementById('seasonCard').innerHTML = `
    <div class="section-title">⭐ SEASON ${s.num}</div>
    <div class="section-sub">${fmtDate(s.start)} — ${fmtDate(s.end)} • 2 месяца • ${s.total} дней</div>
    <div style="margin-top:12px;font:400 11px Inter,sans-serif;color:#d8d2b8">Прошло <b style="color:#e6d5a0">${s.passed} / ${s.total} дней</b> • Осталось <b style="color:#e6d5a0">${s.left} дней</b> • ${s.pct}% сезона</div>
    <div class="season-bar"><div class="season-fill" style="width:${s.pct}%"></div></div>
    <div style="margin-top:16px;font:700 11px Inter,sans-serif;color:#e6d5a0;letter-spacing:.08em">НОВОСТИ И ИЗМЕНЕНИЯ СЕЗОНА</div>
    <div class="news-list">${news}</div>
  `;
}

// ===== DAILY REWARDS =====
function getDailyGift(day, totalDays){
  let resCycle = ['quartz','wood','diamond','water','stone','bone'];
  let resNames = {quartz:'Кварц',wood:'Дерево',diamond:'Алмаз',water:'Вода',stone:'Камень',bone:'Кость'};
  let resIcons = {quartz:'💎',wood:'🪵',diamond:'💠',water:'💧',stone:'🪨',bone:'🦴'};
  if(day===totalDays) return {icon:'🎁', label:'500G + 500 XP', give:function(){ try{volandAddGold(500);}catch(e){} try{volandAddXp(500);}catch(e){} }};
  if(day%7===0){
    if(day===7) return {icon:'🧪', label:'Potion HP XS + 200G', give:function(){ try{volandAddToInventory('potion-hp-xs');}catch(e){} try{volandAddGold(200);}catch(e){} }};
    if(day===14) return {icon:'🧪', label:'Potion Mana XS + 200G', give:function(){ try{volandAddToInventory('potion-mana-xs');}catch(e){} try{volandAddGold(200);}catch(e){} }};
    if(day===21) return {icon:'🧪', label:'Potion Stam XS + 200G', give:function(){ try{volandAddToInventory('potion-stam-xs');}catch(e){} try{volandAddGold(200);}catch(e){} }};
    if(day===28) return {icon:'🧪', label:'Potion HP S + 300G', give:function(){ try{volandAddToInventory('potion-hp-s');}catch(e){} try{volandAddGold(300);}catch(e){} }};
    return {icon:'🧪', label:'Potion + 200G', give:function(){ try{volandAddToInventory('potion-hp-xs');}catch(e){} try{volandAddGold(200);}catch(e){} }};
  }
  let mod = day % 4;
  if(mod===1){
    let amt = 50 + (day % 3) * 25;
    return {icon:'💰', label:amt+'G', give:function(){ try{volandAddGold(amt);}catch(e){} }};
  }
  if(mod===2){
    let amt = 50 + (day % 3) * 25;
    return {icon:'⭐', label:amt+' XP', give:function(){ try{volandAddXp(amt);}catch(e){} }};
  }
  if(mod===3){
    let rid = resCycle[Math.floor(day/4) % resCycle.length];
    return {icon:resIcons[rid], label:'1 '+resNames[rid], give:function(){ try{volandAddResource(rid,1);}catch(e){} }};
  }
  return {icon:'💰', label:'75G', give:function(){ try{volandAddGold(75);}catch(e){} }};
}
function getDailyKey(y,m){
  return 'voland_daily_'+y+'-'+String(m+1).padStart(2,'0');
}
function getDailyClaimed(y,m){
  try{ let v = localStorage.getItem(getDailyKey(y,m)); return v ? JSON.parse(v) : []; }catch(e){ return []; }
}
function claimDaily(day){
  let now = new Date();
  let y = now.getFullYear(), m = now.getMonth();
  if(day !== now.getDate()) return;
  let claimed = getDailyClaimed(y,m);
  if(claimed.includes(day)) return;
  let totalDays = new Date(y, m+1, 0).getDate();
  let gift = getDailyGift(day, totalDays);
  try{ gift.give(); }catch(e){}
  claimed.push(day);
  try{ localStorage.setItem(getDailyKey(y,m), JSON.stringify(claimed)); }catch(e){}
  renderRewards();
  renderPass();
}
function renderRewards(){
  let now = new Date();
  let y = now.getFullYear(), m = now.getMonth();
  let months = ['ЯНВАРЬ','ФЕВРАЛЬ','МАРТ','АПРЕЛЬ','МАЙ','ИЮНЬ','ИЮЛЬ','АВГУСТ','СЕНТЯБРЬ','ОКТЯБРЬ','НОЯБРЬ','ДЕКАБРЬ'];
  let totalDays = new Date(y, m+1, 0).getDate();
  let claimed = getDailyClaimed(y,m);
  let today = now.getDate();
  let html = `<div class="section-title">🎁 REWARDS • ${months[m]} ${y}</div><div class="section-sub">${totalDays} дней • Забрать можно только сегодня • Пропустил день — подарок сгорел</div><div class="calendar-grid">`;
  for(let d=1; d<=totalDays; d++){
    let gift = getDailyGift(d, totalDays);
    let cls = '', btn = '';
    if(claimed.includes(d)){ cls='claimed'; btn='<div style="font:700 8px JetBrains Mono,monospace;color:#3ad080">DONE</div>'; }
    else if(d < today){ cls='missed'; btn='<div style="font:700 8px JetBrains Mono,monospace;color:#8a8aaa">MISSED</div>'; }
    else if(d === today){ cls='today'; btn=`<button class="day-btn" onclick="claimDaily(${d})">CLAIM</button>`; }
    else { cls='locked'; btn='<div style="font:700 8px JetBrains Mono,monospace;color:#5a6a7a">LOCKED</div>'; }
    html += `<div class="day-cell ${cls}"><div class="day-num">ДЕНЬ ${d}</div><div class="day-gift">${gift.icon}</div><div class="day-label">${gift.label}</div>${btn}</div>`;
  }
  html += `</div>`;
  document.getElementById('rewardsCard').innerHTML = html;
}

// ===== BATTLE PASS =====
function getPassLevel(totalXp){
  let lvl = Math.floor((parseInt(totalXp)||0) / 1000) + 1;
  if(lvl<1) lvl=1; if(lvl>50) lvl=50;
  return lvl;
}
function getFreePrize(lvl){
  let potCycle = ['potion-hp-xs','potion-mana-xs','potion-stam-xs'];
  let potNames = {'potion-hp-xs':'Potion HP XS','potion-mana-xs':'Potion Mana XS','potion-stam-xs':'Potion Stam XS'};
  let resCycle = ['quartz','wood','diamond','water','stone','bone'];
  let resNames = {quartz:'Кварц',wood:'Дерево',diamond:'Алмаз',water:'Вода',stone:'Камень',bone:'Кость'};
  let mod = lvl % 5;
  if(mod===1){
    let amt = 100 + (lvl-1)*10;
    return {label: amt+'G', icon:'💰', give:function(){ try{volandAddGold(amt);}catch(e){} }};
  }
  if(mod===2){
    let amt = 100 + (lvl-2)*10;
    return {label: amt+' XP', icon:'⭐', give:function(){ try{volandAddXp(amt);}catch(e){} }};
  }
  if(mod===3){
    let pid = potCycle[Math.floor(lvl/5) % 3];
    return {label: potNames[pid], icon:'🧪', give:function(){ try{volandAddToInventory(pid);}catch(e){} }};
  }
  if(mod===4){
    let rid = resCycle[Math.floor(lvl/5) % resCycle.length];
    return {label: '1 '+resNames[rid], icon:'💎', give:function(){ try{volandAddResource(rid,1);}catch(e){} }};
  }
  // mod 0
  if(lvl % 10 === 0){
    return {label: 'Potion S + 200G', icon:'🧪', give:function(){ try{volandAddToInventory('potion-hp-s');}catch(e){} try{volandAddGold(200);}catch(e){} }};
  }
  return {label: '200G + 100 XP', icon:'🎁', give:function(){ try{volandAddGold(200);}catch(e){} try{volandAddXp(100);}catch(e){} }};
}
function getPremiumPrize(lvl){
  let free = getFreePrize(lvl);
  // Premium = x10 от Free + эксклюзив
  if(free.label.includes('G') && free.label.includes('XP')){
    return {label:'2000G + 1000 XP + RUNA', icon:'🔮'};
  }
  if(free.label.includes('Potion S')){
    return {label:'Potion HP XL + RUNA', icon:'🔮'};
  }
  if(free.label.includes('Potion')){
    let xl = free.label.replace('XS','XL').replace('S','XL');
    return {label: xl+' + RUNA', icon:'🔮'};
  }
  if(free.label.includes('G')){
    let amt = parseInt(free.label) * 10;
    return {label: amt+'G', icon:'💰'};
  }
  if(free.label.includes('XP')){
    let amt = parseInt(free.label) * 10;
    return {label: amt+' XP', icon:'⭐'};
  }
  // Ресурс
  return {label:'10x ресурс + RUNA', icon:'🔮'};
}
function getPassKey(seasonNum){
  return 'voland_pass_claimed_s'+seasonNum;
}
function getPassClaimed(seasonNum){
  try{ let v = localStorage.getItem(getPassKey(seasonNum)); return v ? JSON.parse(v) : []; }catch(e){ return []; }
}
function claimPass(lvl){
  let totalXp = 0;
  try{ totalXp = volandGetXp(); }catch(e){}
  let curLvl = getPassLevel(totalXp);
  if(lvl > curLvl) return;
  let s = getSeasonInfo();
  let claimed = getPassClaimed(s.num);
  if(claimed.includes(lvl)) return;
  let prize = getFreePrize(lvl);
  try{ prize.give(); }catch(e){}
  claimed.push(lvl);
  try{ localStorage.setItem(getPassKey(s.num), JSON.stringify(claimed)); }catch(e){}
  renderPass();
}
function renderPass(){
  let totalXp = 0;
  try{ totalXp = volandGetXp(); }catch(e){}
  let curLvl = getPassLevel(totalXp);
  let inLvl = (parseInt(totalXp)||0) % 1000;
  let toNext = curLvl>=50 ? 0 : 1000 - inLvl;
  let pct = Math.floor(inLvl/1000*100);
  let s = getSeasonInfo();
  let claimed = getPassClaimed(s.num);
  let html = `<div class="section-title">🎫 BATTLE PASS • 1 — 50</div><div class="section-sub">От общего XP героя • Твой XP: ${totalXp} • Уровень пасса: ${curLvl} / 50 • До следующего: ${toNext} XP</div><div class="pass-bar"><div class="pass-fill" style="width:${pct}%"></div></div><div style="margin-top:10px;font:400 10px Inter,sans-serif;color:#8a9aaa">FREE — посредственные призы, забрать можно. PREMIUM — x10 от FREE + XL зелья и Руны, видно, но забрать нельзя — <b style="color:#a0a0ff">PREMIUM SOON</b>.</div><div class="pass-grid">`;
  for(let lvl=1; lvl<=50; lvl++){
    let free = getFreePrize(lvl);
    let prem = getPremiumPrize(lvl);
    let cls = '', btn = '';
    if(claimed.includes(lvl)){ cls='unlocked'; btn='<div style="font:700 8px JetBrains Mono,monospace;color:#3ad080">FREE DONE</div>'; }
    else if(lvl <= curLvl){ cls='current'; btn=`<button class="pass-btn" onclick="claimPass(${lvl})">CLAIM FREE</button>`; }
    else { cls=''; btn='<div style="font:700 8px JetBrains Mono,monospace;color:#5a6a7a">LOCKED</div>'; }
    html += `<div class="pass-card ${cls}"><div class="pass-lvl">LVL ${lvl}</div><div class="pass-free">FREE<br>${free.icon} ${free.label}</div><div class="pass-prem">PREMIUM<br>${prem.icon} ${prem.label}</div>${btn}<button class="pass-prem-btn" disabled>PREMIUM SOON</button></div>`;
  }
  html += `</div>`;
  document.getElementById('passCard').innerHTML = html;
}
renderSeason();
renderRewards();
renderPass();
</script>

    label.style.top = (rect.top + rect.height/2) + 'px';
    label.style.transform = 'translateY(-50%) translateX(0)';
  });
  g.addEventListener('mouseleave', ()=>{
    label.style.transform = 'translateY(-50%) translateX(-6px)';

});

});
