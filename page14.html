.top-bar{height:48px;background:rgba(18,24,33,.85);border-bottom:1px solid rgba(30,42,50,.5);display:flex;align-items:center;justify-content:space-between;padding:0 16px;padding-right:130px}

.online-list{padding:10px;display:flex;flex-direction:column;gap:6px}

.chat-head{padding:10px 12px;border-bottom:1px solid #2a3a4a;font:700 9px 'JetBrains Mono',monospace;letter-spacing:.15em;color:#e6d5a0;display:flex;justify-content:space-between;align-items:center}

.btn{padding:10px 14px;border-radius:8px;border:1px solid #2a3a4a;background:#1a242f;color:#d8d2b8;font:700 9px 'JetBrains Mono',monospace;letter-spacing:.12em;cursor:pointer;text-align:center;transition:.15s;white-space:nowrap}

.input{width:100%;padding:10px;background:#0a0e14;border:1px solid #2a3a4a;border-radius:8px;color:#e6d5a0;font:700 11px 'JetBrains Mono',monospace}
.emblem-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}

.card{width:100%;max-width:560px;background:rgba(38,48,60,.85);border:1px solid #2a3a4a;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;margin:auto}
.card-title{font:900 13px 'Cinzel Decorative',serif;color:#e6d5a0;letter-spacing:.12em;text-align:center}

function volandGetGuild(){ try{ var g=JSON.parse(localStorage.getItem(GUILD_KEY)||'null'); if(g&&g.name&&g.tag){ if(!g.v||g.v<7){ g.v=7; g.level=1; g.xp=0; g.xpNeed=2000; g.goldGoal=5000; g.points=0; g.treasury=0; g.upgrades={}; try{ localStorage.setItem(GUILD_KEY,JSON.stringify(g)); localStorage.removeItem(GUILD_BANK_KEY); }catch(e){} } if(!g.xpNeed) g.xpNeed=2000; if(!g.goldGoal) g.goldGoal=5000; if(g.points==null) g.points=0; if(g.xp==null) g.xp=0; if(g.treasury==null) g.treasury=0; return g; } }catch(e){} return null; }
function volandSaveGuild(g){ try{ localStorage.setItem(GUILD_KEY,JSON.stringify(g)); }catch(e){} } function checkLevelUp(g){ var leveled=false; while((g.xp||0)>=(g.xpNeed||2000)){ g.xp=(g.xp||0)-(g.xpNeed||2000); g.level=(g.level||1)+1; g.points=(g.points||0)+1; g.xpNeed=Math.round((g.xpNeed||2000)*1.1); leveled=true; } while((g.treasury||0)>=(g.goldGoal||5000)){ g.treasury=(g.treasury||0)-(g.goldGoal||5000); g.level=(g.level||1)+1; g.points=(g.points||0)+1; g.goldGoal=Math.round((g.goldGoal||5000)*1.1); leveled=true; } if(leveled) volandSaveGuild(g); return leveled; }
function volandGetGuildSlots(){ var g=volandGetGuild(); var extra=0; if(g&&g.upgrades&&g.upgrades.slots) extra=g.upgrades.slots*5; return 20+extra; }
function volandGetUpgradesDone(){ var g=volandGetGuild(); if(!g||!g.upgrades) return 0; var c=0; Object.values(g.upgrades).forEach(function(v){ if(v>0) c++; }); return c; }
function refreshTop(){ try{ var gl=document.getElementById('goldLabel'); if(gl) gl.textContent=volandT('ЗОЛОТО:','GOLD:'); var rl=document.getElementById('resLabel'); if(rl) rl.textContent=volandT('РЕС:','RES:'); document.getElementById('goldDisplay').textContent=volandGetGold(); var res=volandGetResources(); var total=Object.values(res).reduce(function(a,b){return a+b;},0); document.getElementById('resDisplay').textContent=total; }catch(e){} }
function selectEmblem(idx){ selectedEmblem=EMBLEMS[idx]; document.querySelectorAll('.emblem-opt').forEach(function(el,i){ el.classList.toggle('selected',i===idx); }); }
function showLog(id,msg,cls){ try{ var el=document.getElementById(id); if(el){ el.textContent=msg; el.className='log '+(cls||''); } }catch(e){} }
function createGuild(){ try{ var name=(document.getElementById('guildName').value||'').trim(); var tag=(document.getElementById('guildTag').value||'').trim().toUpperCase(); var desc=(document.getElementById('guildDesc').value||'').trim(); if(name.length<3){ showLog('createLog',volandT('Название от 3 символов','Name min 3 chars'),'err'); return; } if(tag.length<2||tag.length>4){ showLog('createLog',volandT('Тег 2-4 буквы','Tag 2-4 letters'),'err'); return; } var gold=volandGetGold(); if(gold<GUILD_CREATE_COST){ showLog('createLog',volandT('Недостаточно золота: ','Not enough gold: ')+gold+'/'+GUILD_CREATE_COST,'err'); return; } try{ volandSpendGold(GUILD_CREATE_COST); }catch(e){ localStorage.setItem('voland_v1_gold',String(gold-GUILD_CREATE_COST)); } var g={name:name,tag:tag,emblem:selectedEmblem,desc:desc||volandT('Гильдия VOLAND','VOLAND Guild'),created:Date.now(),level:1,treasury:0,upgrades:{},xp:0,xpNeed:2000,goldGoal:5000,points:0,v:7}; volandSaveGuild(g); try{ localStorage.setItem(GUILD_CHAT_KEY,JSON.stringify([{t:Date.now(),who:'SYS',text:volandT('Ты создал гильдию ','You created guild ')+name}])); }catch(e){} refreshTop(); render(); }catch(e){ showLog('createLog',volandT('Ошибка: ','Error: ')+e.message,'err'); } }
function leaveGuild(){ var g=volandGetGuild(); if(!g) return; if(!confirm(volandT('Покинуть гильдию ','Leave guild ')+g.name+'?')) return; try{ localStorage.removeItem(GUILD_KEY); }catch(e){} render(); }
function switchView(v){ activeView=v; render(); }
function upgradeHall(id){ try{ var g=volandGetGuild(); if(!g) return; if(!g.upgrades) g.upgrades={}; var hall=HALL.find(function(h){ return h.id===id; }); var cost=hall?hall.cost:1; var lvl=g.upgrades[id]||0; if(lvl>=5){ showLog('hallLog',volandT('Максимум','Max'),'err'); return; } if((g.points||0)<cost){ showLog('hallLog',volandT('Недостаточно очков гильдии: ','Not enough guild points: ')+(g.points||0)+'/'+cost,'err'); return; } g.points=(g.points||0)-cost; g.upgrades[id]=lvl+1; volandSaveGuild(g); refreshTop(); render(); showLog('hallLog',volandT('Улучшено: ','Upgraded: ')+id+' LVL '+(lvl+1)+' • '+volandT('Очков осталось: ','Points left: ')+g.points,'ok'); }catch(e){ showLog('hallLog',volandT('Ошибка: ','Error: ')+e.message,'err'); } }
function donateGold(){ try{ var inp=document.getElementById('donateInput'); var amt=parseInt(inp.value||'0',10); if(!amt||amt<=0){ showLog('bankLog',volandT('Введи сумму','Enter amount'),'err'); return; } var gold=volandGetGold(); if(gold<amt){ showLog('bankLog',volandT('Недостаточно золота: ','Not enough gold: ')+gold+'/'+amt,'err'); return; } try{ volandSpendGold(amt); }catch(e){ localStorage.setItem('voland_v1_gold',String(gold-amt)); } var g=volandGetGuild(); g.treasury=(g.treasury||0)+amt; volandSaveGuild(g); var leveled=checkLevelUp(g); var me='YOU'; try{ var saves=volandGetSaves(); var idx=volandGetActiveIndex(); if(saves[idx]&&saves[idx].name) me=(saves[idx].name||'YOU').toUpperCase(); }catch(e){} var hist=[]; try{ hist=JSON.parse(localStorage.getItem(GUILD_BANK_KEY)||'[]'); }catch(e){} hist.push({who:me,amount:amt,t:Date.now()}); localStorage.setItem(GUILD_BANK_KEY,JSON.stringify(hist)); refreshTop(); render(); showLog('bankLog',volandT('Донат: ','Donated: ')+amt+'g','ok'); }catch(e){ showLog('bankLog',volandT('Ошибка: ','Error: ')+e.message,'err'); } }
function getChats(key){ try{ return JSON.parse(localStorage.getItem(key)||'[]'); }catch(e){ return []; } }
function sendChat(key,inputId){ try{ var inp=document.getElementById(inputId); var txt=(inp.value||'').trim(); if(!txt) return; var chats=getChats(key); var me='YOU'; try{ var saves=volandGetSaves(); var idx=volandGetActiveIndex(); if(saves[idx]&&saves[idx].name) me=(saves[idx].name||'YOU').toUpperCase(); }catch(e){} chats.push({t:Date.now(),who:me,text:txt}); if(chats.length>50) chats=chats.slice(-50); localStorage.setItem(key,JSON.stringify(chats)); inp.value=''; render(); }catch(e){} }
function renderMembers(g){ var slots=volandGetGuildSlots(); var meName='YOU'; var meHero=''; var meLvl=1; try{ var saves=volandGetSaves(); var idx=volandGetActiveIndex(); if(saves[idx]){ meName=(saves[idx].name||'YOU').toUpperCase(); var hero=VOLAND_HEROES[saves[idx].hero]; if(hero) meHero=hero.n; try{ var li=volandGetLevelInfo(parseInt(saves[idx].xp||0)); meLvl=li.lvl; }catch(e){} } }catch(e){} var html=''; html+='<div class="m-row header"><div class="m-col-head"></div><div class="m-col-head player-head">'+volandT('ИГРОК','PLAYER')+'</div><div class="m-col-head">'+volandT('ДЕНЬ','DAY')+'</div><div class="m-col-head">'+volandT('НЕДЕЛЯ','WEEK')+'</div><div class="m-col-head">'+volandT('ВСЕГО','TOTAL')+'</div></div>'; var treasury=g.treasury||0; var dayGold=Math.min(150,treasury+150); var weekGold=Math.min(850,treasury+850); var totalGold=treasury+1200; var dayMobs=12, weekMobs=68, totalMobs=240; for(var i=0;i<slots;i++){ if(i===0){ html+='<div class="m-row leader"><div class="m-rank">'+(i+1)+'</div><div class="m-player"><div class="m-ava"><img src="./assets/ui/nav/hero.webp" onerror="this.style.display=\'none\'"></div><div class="m-info"><div class="m-name">'+meName+'</div><div class="m-sub">Lv '+meLvl+' • '+(meHero||'')+' <span class="leader-badge">'+volandT('ЛИДЕР','LEADER')+'</span></div></div></div><div class="m-col"><div class="m-gold">🪙 '+dayGold+'</div><div class="m-mobs">⚔️ '+dayMobs+'</div></div><div class="m-col"><div class="m-gold">🪙 '+weekGold+'</div><div class="m-mobs">⚔️ '+weekMobs+'</div></div><div class="m-col"><div class="m-gold">🪙 '+totalGold+'</div><div class="m-mobs">⚔️ '+totalMobs+'</div></div></div>'; } else { html+='<div class="m-row empty"><div class="m-rank">'+(i+1)+'</div><div class="m-player"><div class="m-ava"><span style="font-size:16px;color:#5a6a7a">+</span></div><div class="m-info"><div class="m-name">'+volandT('ПУСТОЙ СЛОТ','EMPTY SLOT')+'</div><div class="m-sub">'+volandT('Свободно','Free')+'</div></div></div><div class="m-col"><div class="m-gold">—</div><div class="m-mobs">—</div></div><div class="m-col"><div class="m-gold">—</div><div class="m-mobs">—</div></div><div class="m-col"><div class="m-gold">—</div><div class="m-mobs">—</div></div></div>'; } } return html; }
function renderUpgrades(g){ var cards=HALL.map(function(h){ var lvl=(g.upgrades&&g.upgrades[h.id])||0; var max=lvl>=5; var cost=h.cost||1; var costText=cost===1?volandT('1 ОЧКО','1 POINT'):volandT('2 ОЧКА','2 POINTS'); var canBuy=!max&&(g.points||0)>=cost; return '<div class="hall-card '+(max?'max':'')+'"><div class="hall-icon">'+h.icon+'</div><div class="hall-name">'+volandT(h.nameRU,h.nameEN)+'</div><div class="hall-desc">'+volandT(h.descRU,h.descEN)+'</div><div class="hall-lvl">LVL '+lvl+'/5 • '+(max?volandT('МАКС','MAX'):costText)+'</div><div class="btn primary" '+(canBuy?'onclick="upgradeHall(\''+h.id+'\')"':'style="opacity:.4;pointer-events:none"')+'>'+volandT('УЛУЧШИТЬ','UPGRADE')+' • '+costText+'</div></div>'; }).join(''); return '<div class="hall-grid">'+cards+'</div><div class="log" id="hallLog"></div>'; }
function renderBank(g){ var hist=[]; try{ hist=JSON.parse(localStorage.getItem(GUILD_BANK_KEY)||'[]'); }catch(e){} var today=new Date().toDateString(); var todaySum=0, totalSum=0; hist.forEach(function(h){ totalSum+=h.amount; if(new Date(h.t).toDateString()===today) todaySum+=h.amount; }); var list=hist.slice().reverse().map(function(h){ return '<div class="donate-item"><span><b>'+h.who+'</b> • '+new Date(h.t).toLocaleDateString()+'</span><b style="color:#d0b040">+'+h.amount+'g</b></div>'; }).join('')||'<div class="donate-item"><span>'+volandT('Пока нет донатов','No donations yet')+'</span><span>—</span></div>'; return '<div class="bank-wrap"><div class="bank-top"><div class="bank-stat"><div class="bank-stat-label">'+volandT('КАЗНА','TREASURY')+'</div><div class="bank-stat-value">'+(g.treasury||0)+'g</div></div><div class="bank-stat"><div class="bank-stat-label">'+volandT('СЕГОДНЯ','TODAY')+'</div><div class="bank-stat-value">'+todaySum+'g</div></div><div class="bank-stat"><div class="bank-stat-label">'+volandT('ВСЕГО','TOTAL')+'</div><div class="bank-stat-value">'+totalSum+'g</div></div></div><div class="donate-row"><input id="donateInput" type="number" min="1" placeholder="'+volandT('Сумма доната','Donate amount')+'"><div class="btn primary" onclick="donateGold()">'+volandT('DONATE','DONATE')+'</div></div><div class="log" id="bankLog"></div><div style="font:700 8px \'JetBrains Mono\',monospace;letter-spacing:.15em;color:#8a9aaa">'+volandT('ИСТОРИЯ ДОНАТОВ','DONATION HISTORY')+'</div><div class="donate-list">'+list+'</div></div>'; }
function renderOnline(g){ var slots=volandGetGuildSlots(); var meName='YOU'; var meLvl=1; try{ var saves=volandGetSaves(); var idx=volandGetActiveIndex(); if(saves[idx]){ meName=(saves[idx].name||'YOU').toUpperCase(); try{ var li=volandGetLevelInfo(parseInt(saves[idx].xp||0)); meLvl=li.lvl; }catch(e){} } }catch(e){} var html=''; for(var i=0;i<slots;i++){ if(i===0) html+='<div class="online-row"><span class="online-dot"></span><div class="m-ava"><img src="./assets/ui/nav/hero.webp" onerror="this.style.display=\'none\'"></div><div class="m-info"><div class="m-name">'+meName+'</div><div class="m-sub">Lv '+meLvl+' • '+volandT('ОНЛАЙН','ONLINE')+'</div></div><span style="font:700 7px \'JetBrains Mono\',monospace;color:#3ad080">● '+volandT('ОНЛАЙН','ONLINE')+'</span></div>'; else html+='<div class="online-row" style="opacity:.55"><span class="online-dot off"></span><div class="m-ava"><span style="font-size:16px;color:#5a6a7a">+</span></div><div class="m-info"><div class="m-name">'+volandT('ПУСТОЙ СЛОТ','EMPTY SLOT')+'</div><div class="m-sub">'+volandT('ОФФЛАЙН','OFFLINE')+'</div></div></div>'; } return '<div class="online-list">'+html+'</div>'; }

function topBoxesHTML(slots,upDone,treasury){ return `<div class="top-boxes-header"><div class="top-box mini ${activeView==='members'?'active':''}" onclick="switchView('members')"><div class="top-box-icon">👥</div><div class="top-box-info"><div class="top-box-label">${volandT('УЧАСТНИКИ','MEMBERS')}</div><div class="top-box-value">1/${slots}</div><div class="top-box-sub">${volandT('Нажми — список','Tap — list')}</div></div></div><div class="top-box mini ${activeView==='upgrades'?'active':''}" onclick="switchView('upgrades')"><div class="top-box-icon">⚒️</div><div class="top-box-info"><div class="top-box-label">${volandT('УЛУЧШЕНИЯ','UPGRADES')}</div><div class="top-box-value">${upDone}/12</div><div class="top-box-sub">${volandT('Нажми — улучшения','Tap — upgrades')}</div></div></div><div class="top-box mini ${activeView==='bank'?'active':''}" onclick="switchView('bank')"><div class="top-box-icon">💰</div><div class="top-box-info"><div class="top-box-label">${volandT('БАНК','BANK')}</div><div class="top-box-value">${treasury}g</div><div class="top-box-sub">${volandT('Нажми — донат','Tap — donate')}</div></div></div><div class="top-box mini ${activeView==='online'?'active':''}" onclick="switchView('online')"><div class="top-box-icon">🟢</div><div class="top-box-info"><div class="top-box-label">${volandT('ОНЛАЙН','ONLINE')}</div><div class="top-box-value">1 ${volandT('ОНЛАЙН','ONLINE')}</div><div class="top-box-sub">${volandT('Нажми — кто онлайн','Tap — who is online')}</div></div></div></div>`; } function render(){ refreshTop(); var g=volandGetGuild(); if(g) checkLevelUp(g); var el=document.getElementById('guildContent'); if(!g){ el.innerHTML='<div style="flex:1;display:flex;overflow:auto;padding:20px"><div class="card"><div class="card-title">'+volandT('СОЗДАТЬ ГИЛЬДИЮ','CREATE GUILD')+'</div><div style="font:400 9px \'JetBrains Mono\',monospace;color:#8a9aaa;text-align:center;line-height:1.6">'+volandT('Пока ты один. Создай гильдию — задел на будущее.','You are alone for now. Create a guild — prep for the future.')+'</div><input class="input" id="guildName" placeholder="'+volandT('Название гильдии','Guild name')+'" maxlength="24"><input class="input" id="guildTag" placeholder="'+volandT('Тег 2-4 буквы, напр. VLND','Tag 2-4 letters, e.g. VLND')+'" maxlength="4" style="text-transform:uppercase"><div class="emblem-grid">'+EMBLEMS.map(function(e,i){ return '<div class="emblem-opt '+(i===0?'selected':'')+'" onclick="selectEmblem('+i+')"><img src="'+e+'" onerror="this.style.display=\'none\'"></div>'; }).join('')+'</div><input class="input" id="guildDesc" placeholder="'+volandT('Описание (необязательно)','Description (optional)')+'" maxlength="80"><div class="btn primary" onclick="createGuild()">'+volandT('СОЗДАТЬ ГИЛЬДИЮ • ','CREATE GUILD • ')+GUILD_CREATE_COST+'g</div><div class="log" id="createLog"></div></div></div>'; return; } var xp=g.xp||0; var xpNeed=g.xpNeed||2000; var xpPct=Math.min(100,Math.round(xp/xpNeed*100)); var goldGoal=g.goldGoal||5000; var treasury=g.treasury||0; var goldPct=Math.min(100,Math.round(treasury/goldGoal*100)); var chats=renderChats(g); var slots=volandGetGuildSlots(); var upDone=volandGetUpgradesDone(); var bigHead='', bigBody=''; if(activeView==='members'){ bigHead='<span>'+volandT('УЧАСТНИКИ ГИЛЬДИИ','GUILD MEMBERS')+'</span><span>1/'+slots+'</span>'; bigBody=renderMembers(g); } else if(activeView==='upgrades'){ bigHead='<span>'+volandT('УЛУЧШЕНИЯ','UPGRADES')+'</span><span>'+volandT('ОЧКИ: ','POINTS: ')+(g.points||0)+' • '+upDone+'/12</span>'; bigBody=renderUpgrades(g); } else if(activeView==='bank'){ bigHead='<span>'+volandT('БАНК','BANK')+'</span><span>'+treasury+'g</span>'; bigBody=renderBank(g); } else { bigHead='<span>'+volandT('ОНЛАЙН','ONLINE')+'</span><span>1 '+volandT('ОНЛАЙН','ONLINE')+'</span>'; bigBody=renderOnline(g); } el.innerHTML='<div class="guild-header"><div class="guild-emblem"><img src="'+(g.emblem||EMBLEMS[0])+'" onerror="this.style.display=\'none\'"></div><div class="guild-meta"><div class="guild-name">'+g.name.toUpperCase()+'</div><div class="guild-line2"><span class="guild-tag"><span class="bracket">[</span><span class="tag-name">'+g.tag+'</span><span class="bracket">]</span></span><span>LVL <b>'+(g.level||1)+'</b></span><span>'+volandT('УЧАСТНИКИ: ','MEMBERS: ')+'<b>1/'+slots+'</b></span><span>'+volandT('СОЗДАНА ','CREATED ')+new Date(g.created).toLocaleDateString()+'</span></div><div class="guild-desc">'+(g.desc||'')+'</div></div>'+topBoxesHTML(slots,upDone,treasury)+'<div class="header-actions"><div class="btn sm danger" onclick="leaveGuild()">'+volandT('ПОКИНУТЬ','LEAVE')+'</div></div></div><div class="bars"><div class="bar-box"><div class="bar-label"><span>XP • '+volandT('ОПЫТ ГИЛЬДИИ','GUILD XP')+'</span><b>'+xp+' / '+xpNeed+' • '+xpPct+'%</b></div><div class="bar-track"><div class="bar-fill xp" style="width:'+xpPct+'%"></div></div></div><div class="bar-box"><div class="bar-label"><span>GOLD • '+volandT('КАЗНА','TREASURY')+'</span><b>'+treasury+'g / '+goldGoal+'g • '+goldPct+'%</b></div><div class="bar-track"><div class="bar-fill" style="width:'+goldPct+'%"></div></div></div></div><div class="main-row"><div class="big-window"><div class="big-head">'+bigHead+'</div><div class="big-body">'+bigBody+'</div></div><div class="chat"><div class="chat-head"><span>'+volandT('ЧАТ ГИЛЬДИИ','GUILD CHAT')+'</span><span class="chat-status">'+volandT('ЛОКАЛЬНО','LOCAL')+'</span></div><div class="chat-body">'+chats.guild+'</div><div class="chat-input"><input id="guildChatInput" placeholder="'+volandT('Написать в гильдию...','Write to guild...')+'" onkeydown="if(event.key===\'Enter\') sendChat(\''+GUILD_CHAT_KEY+'\',\'guildChatInput\')"><div class="btn primary sm" onclick="sendChat(\''+GUILD_CHAT_KEY+'\',\'guildChatInput\')">'+volandT('ОТПРАВИТЬ','SEND')+'</div></div></div><div class="chat global"><div class="chat-head"><span>'+volandT('ОБЩИЙ ЧАТ','GLOBAL CHAT')+'</span><span class="chat-status soon">SOON</span></div><div class="chat-body">'+chats.global+'</div><div class="chat-input"><input id="globalChatInput" placeholder="'+volandT('Общий чат — SOON...','Global chat — SOON...')+'" onkeydown="if(event.key===\'Enter\') sendChat(\''+GLOBAL_CHAT_KEY+'\',\'globalChatInput\')"><div class="btn sm" onclick="sendChat(\''+GLOBAL_CHAT_KEY+'\',\'globalChatInput\')">'+volandT('ОТПРАВИТЬ','SEND')+'</div></div></div></div>'; }
