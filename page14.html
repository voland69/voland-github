<script>
var GUILD_KEY='voland_v1_guild';
var GUILD_CHAT_KEY='voland_v1_guild_chat';
var GLOBAL_CHAT_KEY='voland_v1_global_chat';
var GUILD_BANK_KEY='voland_v1_guild_bank';
var GUILD_CREATE_COST=1000;
var EMBLEMS=['./assets/ui/nav/guilds.webp','./assets/ui/nav/hero.webp','./assets/ui/nav/battle.webp','./assets/ui/nav/market.webp','./assets/ui/nav/pvp.webp','./assets/ui/nav/pass.webp'];
var selectedEmblem=EMBLEMS[0];
var activeView='members';
var HALL=[
  {id:'treasury', icon:'💰', nameRU:'КАЗНА', nameEN:'TREASURY', descRU:'+10% золота с миссий за уровень', descEN:'+10% gold from missions per level', cost:1},
  {id:'xp', icon:'⭐', nameRU:'ОПЫТ', nameEN:'EXPERIENCE', descRU:'+5% XP за уровень', descEN:'+5% XP per level', cost:1},
  {id:'power', icon:'⚔️', nameRU:'СИЛА', nameEN:'POWER', descRU:'+10 DMG за уровень', descEN:'+10 DMG per level', cost:1},
  {id:'slots', icon:'👥', nameRU:'МЕСТА', nameEN:'SLOTS', descRU:'+5 мест в гильдии за уровень', descEN:'+5 guild slots per level', cost:2},
  {id:'hp', icon:'❤️', nameRU:'ЗДОРОВЬЕ', nameEN:'HEALTH', descRU:'+50 HP за уровень', descEN:'+50 HP per level', cost:1},
  {id:'stam', icon:'🔋', nameRU:'ВЫНОСЛИВОСТЬ', nameEN:'STAMINA', descRU:'+10 STAM за уровень', descEN:'+10 STAM per level', cost:1},
  {id:'loot', icon:'🎒', nameRU:'ДОБЫЧА', nameEN:'LOOT', descRU:'+2% ресурсов с мобов за уровень', descEN:'+2% resources from mobs per level', cost:1},
  {id:'discount', icon:'🏷️', nameRU:'СКИДКА', nameEN:'DISCOUNT', descRU:'-5% цен в магазине (page10) за уровень', descEN:'-5% market prices (page10) per level', cost:1},
  {id:'regen', icon:'🔄', nameRU:'ВОССТАНОВЛЕНИЕ', nameEN:'REGEN', descRU:'+5% к восстановлению STAM за уровень', descEN:'+5% STAM regen per level', cost:1},
  {id:'crit', icon:'🎯', nameRU:'КРИТ', nameEN:'CRIT', descRU:'+1% к криту за уровень', descEN:'+1% crit per level', cost:1},
  {id:'def', icon:'🛡️', nameRU:'ЗАЩИТА', nameEN:'DEFENSE', descRU:'+10 защиты за уровень', descEN:'+10 defense per level', cost:1},
  {id:'craft', icon:'⚗️', nameRU:'КРАФТ', nameEN:'CRAFT', descRU:'-5% золота за улучшение шмота (page12) за уровень', descEN:'-5% gold for gear upgrade (page12) per level', cost:1}
];
function volandGetGuild(){ try{ var g=JSON.parse(localStorage.getItem(GUILD_KEY)||'null'); if(g&&g.name&&g.tag){ if(!g.v||g.v<7){ g.v=7; g.level=1; g.xp=0; g.xpNeed=2000; g.goldGoal=5000; g.points=0; g.treasury=0; g.upgrades={}; try{ localStorage.setItem(GUILD_KEY,JSON.stringify(g)); localStorage.removeItem(GUILD_BANK_KEY); }catch(e){} } if(!g.xpNeed) g.xpNeed=2000; if(!g.goldGoal) g.goldGoal=5000; if(g.points==null) g.points=0; if(g.xp==null) g.xp=0; if(g.treasury==null) g.treasury=0; return g; } }catch(e){} return null; }
function volandSaveGuild(g){ try{ localStorage.setItem(GUILD_KEY,JSON.stringify(g)); }catch(e){} } function checkLevelUp(g){ var leveled=false; while((g.xp||0)>=(g.xpNeed||2000)){ g.xp=(g.xp||0)-(g.xpNeed||2000); g.level=(g.level||1)+1; g.points=(g.points||0)+1; g.xpNeed=Math.round((g.xpNeed||2000)*1.1); leveled=true; } while((g.treasury||0)>=(g.goldGoal||5000)){ g.treasury=(g.treasury||0)-(g.goldGoal||5000); g.level=(g.level||1)+1; g.points=(g.points||0)+1; g.goldGoal=Math.round((g.goldGoal||5000)*1.1); leveled=true; } if(leveled) volandSaveGuild(g); return leveled; }
function volandGetGuildSlots(){ var g=volandGetGuild(); var extra=0; if(g&&g.upgrades&&g.upgrades.slots) extra=g.upgrades.slots*5; return 20+extra; }
function volandGetUpgradesDone(){ var g=volandGetGuild(); if(!g||!g.upgrades) return 0; var c=0; Object.values(g.upgrades).forEach(function(v){ c+= (parseInt(v)||0); }); return c; }
function volandGetGuildBonusChips(g){ var chips=[]; try{ var b=(typeof volandGetGuildBonus==='function') ? volandGetGuildBonus() : {}; var u=(g&&g.upgrades)||{}; if(b.TREASURY>0) chips.push('+'+b.TREASURY+'% '+volandT('ЗОЛОТО','GOLD')); if(b.XP>0) chips.push('+'+b.XP+'% XP'); if(b.DMG>0) chips.push('+'+b.DMG+' DMG'); if(u.slots>0) chips.push('+'+(u.slots*5)+' '+volandT('МЕСТ','SLOTS')); if(b.HP>0) chips.push('+'+b.HP+' HP'); if(b.STAM>0) chips.push('+'+b.STAM+' STAM'); if(b.LOOT>0) chips.push('+'+b.LOOT+'% '+volandT('РЕСУРСЫ','LOOT')); if(b.DISCOUNT>0) chips.push('-'+b.DISCOUNT+'%G MARKET'); if(b.REGEN>0) chips.push('+'+b.REGEN+'% STAM REGEN'); if(b.CRIT>0) chips.push('+'+b.CRIT+'% CRIT'); if(b.DEF>0) chips.push('+'+b.DEF+' DEF'); if(b.CRAFT>0) chips.push('-'+b.CRAFT+'%G KRAFT'); }catch(e){} return chips; }
function refreshTop(){ try{ var gl=document.getElementById('goldLabel'); if(gl) gl.textContent=volandT('ЗОЛОТО:','GOLD:'); var rl=document.getElementById('resLabel'); if(rl) rl.textContent=volandT('РЕС:','RES:'); document.getElementById('goldDisplay').textContent=volandGetGold(); var res=volandGetResources(); var total=Object.values(res).reduce(function(a,b){return a+b;},0); document.getElementById('resDisplay').textContent=total; }catch(e){} }
function selectEmblem(idx){ selectedEmblem=EMBLEMS[idx]; document.querySelectorAll('.emblem-opt').forEach(function(el,i){ el.classList.toggle('selected',i===idx); }); }
function showLog(id,msg,cls){ try{ var el=document.getElementById(id); if(el){ el.textContent=msg; el.className='log '+(cls||''); } }catch(e){} }
function createGuild(){ try{ var name=(document.getElementById('guildName').value||'').trim(); var tag=(document.getElementById('guildTag').value||'').trim().toUpperCase(); var desc=(document.getElementById('guildDesc').value||'').trim(); if(name.length<3){ showLog('createLog',volandT('Название от 3 символов','Name min 3 chars'),'err'); return; } if(tag.length<2||tag.length>4){ showLog('createLog',volandT('Тег 2-4 буквы','Tag 2-4 letters'),'err'); return; } var gold=volandGetGold(); if(gold<GUILD_CREATE_COST){ showLog('createLog',volandT('Недостаточно золота: ','Not enough gold: ')+gold+'/'+GUILD_CREATE_COST,'err'); return; } volandSpendGold(GUILD_CREATE_COST); var g={name:name,tag:tag,emblem:selectedEmblem,desc:desc||volandT('Гильдия VOLAND','VOLAND Guild'),created:Date.now(),level:1,treasury:0,upgrades:{},xp:0,xpNeed:2000,goldGoal:5000,points:0,v:7}; volandSaveGuild(g); try{ localStorage.setItem(GUILD_CHAT_KEY,JSON.stringify([{t:Date.now(),who:'SYS',text:volandT('Ты создал гильдию ','You created guild ')+name}])); }catch(e){} refreshTop(); render(); }catch(e){ showLog('createLog',volandT('Ошибка: ','Error: ')+e.message,'err'); } }
function leaveGuild(){ var g=volandGetGuild(); if(!g) return; if(!confirm(volandT('Покинуть гильдию ','Leave guild ')+g.name+'?')) return; try{ localStorage.removeItem(GUILD_KEY); }catch(e){} render(); }
function switchView(v){ activeView=v; render(); }
function upgradeHall(id){ try{ var g=volandGetGuild(); if(!g) return; if(!g.upgrades) g.upgrades={}; var hall=HALL.find(function(h){ return h.id===id; }); var cost=hall?hall.cost:1; var lvl=g.upgrades[id]||0; if(lvl>=5){ showLog('hallLog',volandT('Максимум','Max'),'err'); return; } if((g.points||0)<cost){ showLog('hallLog',volandT('Недостаточно очков гильдии: ','Not enough guild points: ')+(g.points||0)+'/'+cost,'err'); return; } g.points=(g.points||0)-cost; g.upgrades[id]=lvl+1; volandSaveGuild(g); refreshTop(); render(); showLog('hallLog',volandT('Улучшено: ','Upgraded: ')+id+' LVL '+(lvl+1)+' • '+volandT('Очков осталось: ','Points left: ')+g.points,'ok'); }catch(e){ showLog('hallLog',volandT('Ошибка: ','Error: ')+e.message,'err'); } }
function donateGold(){ try{ var inp=document.getElementById('donateInput'); var amt=parseInt(inp.value||'0',10); if(!amt||amt<=0){ showLog('bankLog',volandT('Введи сумму','Enter amount'),'err'); return; } var gold=volandGetGold(); if(gold<amt){ showLog('bankLog',volandT('Недостаточно золота: ','Not enough gold: ')+gold+'/'+amt,'err'); return; } volandSpendGold(amt); var g=volandGetGuild(); g.treasury=(g.treasury||0)+amt; volandSaveGuild(g); var leveled=checkLevelUp(g); var me='YOU'; try{ var saves=volandGetSaves(); var idx=volandGetActiveIndex(); if(saves[idx]&&saves[idx].name) me=(saves[idx].name||'YOU').toUpperCase(); }catch(e){} var hist=[]; try{ hist=JSON.parse(localStorage.getItem(GUILD_BANK_KEY)||'[]'); }catch(e){} hist.push({who:me,amount:amt,t:Date.now()}); localStorage.setItem(GUILD_BANK_KEY,JSON.stringify(hist)); refreshTop(); render(); showLog('bankLog',volandT('Донат: ','Donated: ')+amt+'g','ok'); }catch(e){ showLog('bankLog',volandT('Ошибка: ','Error: ')+e.message,'err'); } }
function getChats(key){ try{ return JSON.parse(localStorage.getItem(key)||'[]'); }catch(e){ return []; } }
function sendChat(key,inputId){ try{ var inp=document.getElementById(inputId); var txt=(inp.value||'').trim(); if(!txt) return; var chats=getChats(key); var me='YOU'; try{ var saves=volandGetSaves(); var idx=volandGetActiveIndex(); if(saves[idx]&&saves[idx].name) me=(saves[idx].name||'YOU').toUpperCase(); }catch(e){} chats.push({t:Date.now(),who:me,text:txt}); if(chats.length>50) chats=chats.slice(-50); localStorage.setItem(key,JSON.stringify(chats)); inp.value=''; render(); }catch(e){} }
function renderMembers(g){ var slots=volandGetGuildSlots(); var meName='YOU'; var meHero=''; var meLvl=1; try{ var saves=volandGetSaves(); var idx=volandGetActiveIndex(); if(saves[idx]){ meName=(saves[idx].name||'YOU').toUpperCase(); var hero=VOLAND_HEROES[saves[idx].hero]; if(hero) meHero=hero.n; try{ var li=volandGetLevelInfo(parseInt(saves[idx].xp||0)); meLvl=li.lvl; }catch(e){} } }catch(e){} var html=''; html+='<div class="m-row header"><div class="m-col-head"></div><div class="m-col-head player-head">'+volandT('ИГРОК','PLAYER')+'</div><div class="m-col-head">'+volandT('ДЕНЬ','DAY')+'</div><div class="m-col-head">'+volandT('НЕДЕЛЯ','WEEK')+'</div><div class="m-col-head">'+volandT('ВСЕГО','TOTAL')+'</div></div>'; var treasury=g.treasury||0; var hist=[]; try{ hist=JSON.parse(localStorage.getItem(GUILD_BANK_KEY)||'[]'); }catch(e){ hist=[]; } var todayStr=new Date().toDateString(); var weekAgo=Date.now()-7*24*60*60*1000; var myHist=hist.filter(function(h){ return (h.who||'').toUpperCase()===meName; }); if(myHist.length===0 && hist.length>0) myHist=hist; var dayGold=0, weekGold=0, totalGold=0; myHist.forEach(function(h){ totalGold+= (h.amount||0); if(new Date(h.t).toDateString()===todayStr) dayGold+=(h.amount||0); if(h.t>=weekAgo) weekGold+=(h.amount||0); }); var gkills=[]; try{ gkills=JSON.parse(localStorage.getItem('voland_v1_guild_kills')||'[]'); }catch(e){ gkills=[]; } var totalMobs=0; try{ totalMobs= (typeof volandGetKills==='function' ? volandGetKills() : 0) || 0; }catch(e){ totalMobs=0; } try{ if(gkills.length>totalMobs && totalMobs>0){ gkills=gkills.slice(gkills.length-totalMobs); localStorage.setItem('voland_v1_guild_kills', JSON.stringify(gkills)); } else if(gkills.length<totalMobs){ var missing=totalMobs-gkills.length; for(var _di=0; _di<missing; _di++){ gkills.push({t:Date.now()}); } if(gkills.length>2000) gkills=gkills.slice(-2000); localStorage.setItem('voland_v1_guild_kills', JSON.stringify(gkills)); } localStorage.setItem('voland_v1_guild_kills_last_total', String(totalMobs)); }catch(e){} if(totalMobs===0 && gkills.length>0) totalMobs=gkills.length; var dayMobs=0, weekMobs=0; gkills.forEach(function(k){ var t=k.t||0; if(new Date(t).toDateString()===todayStr) dayMobs++; if(t>=weekAgo) weekMobs++; }); for(var i=0;i<slots;i++){ if(i===0){ html+='<div class="m-row leader"><div class="m-rank">'+(i+1)+'</div><div class="m-player"><div class="m-ava"><img src="./assets/ui/nav/hero.webp" onerror="this.style.display=\'none\'"></div><div class="m-info"><div class="m-name">'+meName+'</div><div class="m-sub">Lv '+meLvl+' • '+(meHero||'')+' <span class="leader-badge">'+volandT('ЛИДЕР','LEADER')+'</span></div></div></div><div class="m-col"><div class="m-gold">🪙 '+dayGold+'</div><div class="m-mobs">⚔️ '+dayMobs+'</div></div><div class="m-col"><div class="m-gold">🪙 '+weekGold+'</div><div class="m-mobs">⚔️ '+weekMobs+'</div></div><div class="m-col"><div class="m-gold">🪙 '+totalGold+'</div><div class="m-mobs">⚔️ '+totalMobs+'</div></div></div>'; } else { html+='<div class="m-row empty"><div class="m-rank">'+(i+1)+'</div><div class="m-player"><div class="m-ava"><span style="font-size:16px;color:#5a6a7a">+</span></div><div class="m-info"><div class="m-name">'+volandT('ПУСТОЙ СЛОТ','EMPTY SLOT')+'</div><div class="m-sub">'+volandT('Свободно','Free')+'</div></div></div><div class="m-col"><div class="m-gold">—</div><div class="m-mobs">—</div></div><div class="m-col"><div class="m-gold">—</div><div class="m-mobs">—</div></div><div class="m-col"><div class="m-gold">—</div><div class="m-mobs">—</div></div></div>'; } } return html; }
function renderUpgrades(g){ var chips=volandGetGuildBonusChips(g); var chipsHtml= chips.length ? '<div class="guild-bonus-chips">'+chips.map(function(c){ return '<div class="guild-bonus-chip">'+c+'</div>'; }).join('')+'</div>' : ''; var cards=HALL.map(function(h){ var lvl=(g.upgrades&&g.upgrades[h.id])||0; var max=lvl>=5; var cost=h.cost||1; var costText=cost===1?volandT('1 ОЧКО','1 POINT'):volandT('2 ОЧКА','2 POINTS'); var canBuy=!max&&(g.points||0)>=cost; return '<div class="hall-card '+(max?'max':'')+'"><div class="hall-icon">'+h.icon+'</div><div class="hall-name">'+volandT(h.nameRU,h.nameEN)+'</div><div class="hall-desc">'+volandT(h.descRU,h.descEN)+'</div><div class="hall-lvl">LVL '+lvl+'/5 • '+(max?volandT('МАКС','MAX'):costText)+'</div><div class="btn primary" '+(canBuy?'onclick="upgradeHall(\''+h.id+'\')"':'style="opacity:.4;pointer-events:none"')+'>'+volandT('УЛУЧШИТЬ','UPGRADE')+' • '+costText+'</div></div>'; }).join(''); return chipsHtml+'<div class="hall-grid">'+cards+'</div><div class="log" id="hallLog"></div>'; }
function renderBank(g){ var hist=[]; try{ hist=JSON.parse(localStorage.getItem(GUILD_BANK_KEY)||'[]'); }catch(e){} var today=new Date().toDateString(); var todaySum=0, totalSum=0; hist.forEach(function(h){ totalSum+=h.amount; if(new Date(h.t).toDateString()===today) todaySum+=h.amount; }); var list=hist.slice().reverse().map(function(h){ return '<div class="donate-item"><span><b>'+h.who+'</b> • '+new Date(h.t).toLocaleDateString()+'</span><b style="color:#d0b040">+'+h.amount+'g</b></div>'; }).join('')||'<div class="donate-item"><span>'+volandT('Пока нет донатов','No donations yet')+'</span><span>—</span></div>'; return '<div class="bank-wrap"><div class="bank-top"><div class="bank-stat"><div class="bank-stat-label">'+volandT('КАЗНА','TREASURY')+'</div><div class="bank-stat-value">'+(g.treasury||0)+'g</div></div><div class="bank-stat"><div class="bank-stat-label">'+volandT('СЕГОДНЯ','TODAY')+'</div><div class="bank-stat-value">'+todaySum+'g</div></div><div class="bank-stat"><div class="bank-stat-label">'+volandT('ВСЕГО','TOTAL')+'</div><div class="bank-stat-value">'+totalSum+'g</div></div></div><div class="donate-row"><input id="donateInput" type="number" min="1" placeholder="'+volandT('Сумма доната','Donate amount')+'"><div class="btn primary" onclick="donateGold()">'+volandT('DONATE','DONATE')+'</div></div><div class="log" id="bankLog"></div><div style="font:700 8px \'JetBrains Mono\',monospace;letter-spacing:.15em;color:#8a9aaa">'+volandT('ИСТОРИЯ ДОНАТОВ','DONATION HISTORY')+'</div><div class="donate-list">'+list+'</div></div>'; }
function renderOnline(g){ var slots=volandGetGuildSlots(); var meName='YOU'; var meLvl=1; try{ var saves=volandGetSaves(); var idx=volandGetActiveIndex(); if(saves[idx]){ meName=(saves[idx].name||'YOU').toUpperCase(); try{ var li=volandGetLevelInfo(parseInt(saves[idx].xp||0)); meLvl=li.lvl; }catch(e){} } }catch(e){} var html=''; for(var i=0;i<slots;i++){ if(i===0) html+='<div class="online-row"><span class="online-dot"></span><div class="m-ava"><img src="./assets/ui/nav/hero.webp" onerror="this.style.display=\'none\'"></div><div class="m-info"><div class="m-name">'+meName+'</div><div class="m-sub">Lv '+meLvl+' • '+volandT('ОНЛАЙН','ONLINE')+'</div></div><span style="font:700 7px \'JetBrains Mono\',monospace;color:#3ad080">● '+volandT('ОНЛАЙН','ONLINE')+'</span></div>'; else html+='<div class="online-row" style="opacity:.55"><span class="online-dot off"></span><div class="m-ava"><span style="font-size:16px;color:#5a6a7a">+</span></div><div class="m-info"><div class="m-name">'+volandT('ПУСТОЙ СЛОТ','EMPTY SLOT')+'</div><div class="m-sub">'+volandT('ОФФЛАЙН','OFFLINE')+'</div></div></div>'; } return '<div class="online-list">'+html+'</div>'; }
function renderChats(g){ var gc=getChats(GUILD_CHAT_KEY); if(gc.length===0) gc=[{t:Date.now(),who:'SYS',text:volandT('Добро пожаловать в гильдию','Welcome to the guild')}]; var gl=getChats(GLOBAL_CHAT_KEY); if(gl.length===0) gl=[{t:Date.now(),who:'SYS',text:volandT('Глобальный чат — SOON. Пока локально.','Global chat — SOON. Local for now.')}]; var meName2='YOU'; try{ var saves2=volandGetSaves(); var idx2=volandGetActiveIndex(); if(saves2[idx2]&&saves2[idx2].name) meName2=(saves2[idx2].name||'YOU').toUpperCase(); }catch(e){} var gHtml=gc.map(function(m){ return '<div class="chat-msg '+(m.who==='SYS'?'sys':'')+'"><b>'+m.who+'</b> • '+m.text+'</div>'; }).join(''); var glHtml=gl.map(function(m){ var tag=''; if(m.who!=='SYS'&&m.who===meName2&&g&&g.tag) tag=' <span class="chat-tag"><span class="bracket">[</span><span class="tag-name">'+g.tag+'</span><span class="bracket">]</span></span>'; return '<div class="chat-msg '+(m.who==='SYS'?'sys':'')+'"><b>'+m.who+'</b>'+tag+' • '+m.text+'</div>'; }).join(''); return {guild:gHtml,global:glHtml}; }
function topBoxesHTML(slots,upDone,treasury){ return `<div class="top-boxes-header"><div class="top-box mini ${activeView==='members'?'active':''}" onclick="switchView('members')"><div class="top-box-icon">👥</div><div class="top-box-info"><div class="top-box-label">${volandT('УЧАСТНИКИ','MEMBERS')}</div><div class="top-box-value">1/${slots}</div><div class="top-box-sub">${volandT('Нажми — список','Tap — list')}</div></div></div><div class="top-box mini ${activeView==='upgrades'?'active':''}" onclick="switchView('upgrades')"><div class="top-box-icon">⚒️</div><div class="top-box-info"><div class="top-box-label">${volandT('УЛУЧШЕНИЯ','UPGRADES')}</div><div class="top-box-value">${upDone}/60</div><div class="top-box-sub">${volandT('Нажми — улучшения','Tap — upgrades')}</div></div></div><div class="top-box mini ${activeView==='bank'?'active':''}" onclick="switchView('bank')"><div class="top-box-icon">💰</div><div class="top-box-info"><div class="top-box-label">${volandT('БАНК','BANK')}</div><div class="top-box-value">${treasury}g</div><div class="top-box-sub">${volandT('Нажми — донат','Tap — donate')}</div></div></div><div class="top-box mini ${activeView==='online'?'active':''}" onclick="switchView('online')"><div class="top-box-icon">🟢</div><div class="top-box-info"><div class="top-box-label">${volandT('ОНЛАЙН','ONLINE')}</div><div class="top-box-value">1 ${volandT('ОНЛАЙН','ONLINE')}</div><div class="top-box-sub">${volandT('Нажми — кто онлайн','Tap — who is online')}</div></div></div></div>`; } function render(){ refreshTop(); var g=volandGetGuild(); if(g) checkLevelUp(g); try{ if(g){ var _totalMobs=0; try{ _totalMobs=(typeof volandGetKills==='function'?volandGetKills():0)||0; }catch(e){} var _counted=(g.xpKills==null?0:(parseInt(g.xpKills)||0)); var _missing=_totalMobs-_counted; if(_missing>0){ g.xp=(g.xp||0)+_missing; g.xpKills=_counted+_missing; checkLevelUp(g); volandSaveGuild(g); g=volandGetGuild(); } } }catch(e){} var el=document.getElementById('guildContent'); if(!g){ el.innerHTML='<div style="flex:1;display:flex;overflow:auto;padding:20px"><div class="card"><div class="card-title">'+volandT('СОЗДАТЬ ГИЛЬДИЮ','CREATE GUILD')+'</div><div style="font:400 9px \'JetBrains Mono\',monospace;color:#8a9aaa;text-align:center;line-height:1.6">'+volandT('Пока ты один. Создай гильдию — задел на будущее.','You are alone for now. Create a guild — prep for the future.')+'</div><input class="input" id="guildName" placeholder="'+volandT('Название гильдии','Guild name')+'" maxlength="24"><input class="input" id="guildTag" placeholder="'+volandT('Тег 2-4 буквы, напр. VLND','Tag 2-4 letters, e.g. VLND')+'" maxlength="4" style="text-transform:uppercase"><div class="emblem-grid">'+EMBLEMS.map(function(e,i){ return '<div class="emblem-opt '+(i===0?'selected':'')+'" onclick="selectEmblem('+i+')"><img src="'+e+'" onerror="this.style.display=\'none\'"></div>'; }).join('')+'</div><input class="input" id="guildDesc" placeholder="'+volandT('Описание (необязательно)','Description (optional)')+'" maxlength="80"><div class="btn primary" onclick="createGuild()">'+volandT('СОЗДАТЬ ГИЛЬДИЮ • ','CREATE GUILD • ')+GUILD_CREATE_COST+'g</div><div class="log" id="createLog"></div></div></div>'; return; } var xp=g.xp||0; var xpNeed=g.xpNeed||2000; var xpPct=Math.min(100,Math.round(xp/xpNeed*100)); var goldGoal=g.goldGoal||5000; var treasury=g.treasury||0; var goldPct=Math.min(100,Math.round(treasury/goldGoal*100)); var chats=renderChats(g); var slots=volandGetGuildSlots(); var upDone=volandGetUpgradesDone(); var bigHead='', bigBody=''; if(activeView==='members'){ bigHead='<span>'+volandT('УЧАСТНИКИ ГИЛЬДИИ','GUILD MEMBERS')+'</span><span>1/'+slots+'</span>'; bigBody=renderMembers(g); } else if(activeView==='upgrades'){ bigHead='<span>'+volandT('УЛУЧШЕНИЯ','UPGRADES')+'</span><span>'+volandT('ОЧКИ: ','POINTS: ')+(g.points||0)+' • '+upDone+'/60</span>'; bigBody=renderUpgrades(g); } else if(activeView==='bank'){ bigHead='<span>'+volandT('БАНК','BANK')+'</span><span>'+treasury+'g</span>'; bigBody=renderBank(g); } else { bigHead='<span>'+volandT('ОНЛАЙН','ONLINE')+'</span><span>1 '+volandT('ОНЛАЙН','ONLINE')+'</span>'; bigBody=renderOnline(g); } el.innerHTML='<div class="guild-header"><div class="guild-emblem"><img src="'+(g.emblem||EMBLEMS[0])+'" onerror="this.style.display=\'none\'"></div><div class="guild-meta"><div class="guild-name">'+g.name.toUpperCase()+'</div><div class="guild-line2"><span class="guild-tag"><span class="bracket">[</span><span class="tag-name">'+g.tag+'</span><span class="bracket">]</span></span><span>LVL <b>'+(g.level||1)+'</b></span><span>'+volandT('УЧАСТНИКИ: ','MEMBERS: ')+'<b>1/'+slots+'</b></span><span>'+volandT('СОЗДАНА ','CREATED ')+new Date(g.created).toLocaleDateString()+'</span></div><div class="guild-desc">'+(g.desc||'')+'</div></div>'+topBoxesHTML(slots,upDone,treasury)+'<div class="header-actions"><div class="btn sm danger" onclick="leaveGuild()">'+volandT('ПОКИНУТЬ','LEAVE')+'</div></div></div><div class="bars"><div class="bar-box"><div class="bar-label"><span>XP • '+volandT('ОПЫТ ГИЛЬДИИ','GUILD XP')+'</span><b>'+xp+' / '+xpNeed+' • '+xpPct+'%</b></div><div class="bar-track"><div class="bar-fill xp" style="width:'+xpPct+'%"></div></div></div><div class="bar-box"><div class="bar-label"><span>GOLD • '+volandT('КАЗНА','TREASURY')+'</span><b>'+treasury+'g / '+goldGoal+'g • '+goldPct+'%</b></div><div class="bar-track"><div class="bar-fill" style="width:'+goldPct+'%"></div></div></div></div><div class="main-row"><div class="big-window"><div class="big-head">'+bigHead+'</div><div class="big-body">'+bigBody+'</div></div><div class="chat"><div class="chat-head"><span>'+volandT('ЧАТ ГИЛЬДИИ','GUILD CHAT')+'</span><span class="chat-status">'+volandT('ЛОКАЛЬНО','LOCAL')+'</span></div><div class="chat-body">'+chats.guild+'</div><div class="chat-input"><input id="guildChatInput" placeholder="'+volandT('Написать в гильдию...','Write to guild...')+'" onkeydown="if(event.key===\'Enter\') sendChat(\''+GUILD_CHAT_KEY+'\',\'guildChatInput\')"><div class="btn primary sm" onclick="sendChat(\''+GUILD_CHAT_KEY+'\',\'guildChatInput\')">'+volandT('ОТПРАВИТЬ','SEND')+'</div></div></div><div class="chat global"><div class="chat-head"><span>'+volandT('ОБЩИЙ ЧАТ','GLOBAL CHAT')+'</span><span class="chat-status soon">SOON</span></div><div class="chat-body">'+chats.global+'</div><div class="chat-input"><input id="globalChatInput" placeholder="'+volandT('Общий чат — SOON...','Global chat — SOON...')+'" onkeydown="if(event.key===\'Enter\') sendChat(\''+GLOBAL_CHAT_KEY+'\',\'globalChatInput\')"><div class="btn sm" onclick="sendChat(\''+GLOBAL_CHAT_KEY+'\',\'globalChatInput\')">'+volandT('ОТПРАВИТЬ','SEND')+'</div></div></div></div>'; }
render();
</script>
