<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOLAND - GUILD</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
.left-nav{width:60px !important;min-width:60px !important;max-width:60px !important;flex:0 0 60px !important;background:rgba(18,24,30,.94) !important;border-right:1px solid #2a3a4a !important;display:flex !important;flex-direction:column !important;justify-content:space-between !important;align-items:center !important;height:100vh !important;height:100dvh !important;overflow:visible !important;padding:6px 4px !important;gap:0 !important;position:relative !important;z-index:20 !important}
.nav-top{display:flex !important;flex-direction:column !important;gap:4px !important;align-items:center !important;width:100% !important;overflow:visible !important}
.nav-bottom{margin-top:auto !important;padding-top:8px !important;border-top:1px solid rgba(255,255,255,.08) !important;width:100% !important;display:flex !important;flex-direction:column !important;align-items:center !important;gap:4px !important;overflow:visible !important}
.nav-group{cursor:pointer !important;display:flex !important;flex-direction:column !important;align-items:center !important;gap:0 !important;width:100% !important;position:relative !important;overflow:visible !important}
.nav-item{width:52px !important;height:52px !important;min-width:52px !important;min-height:52px !important;background:transparent !important;border:1px solid transparent !important;border-radius:9px !important;display:flex !important;align-items:center !important;justify-content:center !important;opacity:.75 !important;transition:.2s !important;flex-shrink:0 !important;padding:0 !important;overflow:hidden !important}
.nav-item.active{border-color:#e6d5a0 !important;opacity:1 !important;background:transparent !important;box-shadow:0 0 10px rgba(230,213,160,.3) !important}
.nav-item:hover{opacity:1 !important;border-color:#e6d5a0 !important}
.nav-item img{width:100% !important;height:100% !important;object-fit:cover !important;display:block !important;border-radius:8px !important;background:transparent !important}
.nav-label{position:fixed !important;left:64px !important;background:rgba(20,26,34,.96) !important;border:1px solid #e6d5a0 !important;color:#e6d5a0 !important;padding:5px 9px !important;border-radius:6px !important;font:700 8px 'JetBrains Mono',monospace !important;letter-spacing:.15em !important;white-space:nowrap !important;opacity:0 !important;pointer-events:none !important;transition:.18s !important;z-index:99999 !important;box-shadow:0 4px 16px rgba(0,0,0,.5) !important}
.nav-group:hover .nav-label{opacity:1 !important}
.wrap{display:flex !important;position:fixed !important;inset:0 !important}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0e14;color:#d8d2b8;font-family:Inter,Arial,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0}.bg img{width:100%;height:100%;object-fit:cover}
.bg:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.6)}
.center{flex:1;display:flex;flex-direction:column;overflow:hidden;background:rgba(16,22,30,.22)}
.top-bar{height:48px;background:rgba(18,24,33,.85);border-bottom:1px solid rgba(30,42,50,.5);display:flex;align-items:center;justify-content:space-between;padding:0 16px;padding-right:130px}
.top-title{font:900 16px 'Cinzel Decorative',serif;letter-spacing:.2em;color:#e6d5a0}
.top-res{display:flex;gap:12px;font:700 10px 'JetBrains Mono',monospace;color:#8a9aaa}
.top-res span{color:#d0b040}
/* 3 - шапка гильдии */
.guild-header{display:flex;gap:14px;align-items:center;padding:12px 16px;background:rgba(38,48,60,.85);border-bottom:1px solid #2a3a4a}
.guild-emblem{width:64px;height:64px;min-width:64px;border-radius:12px;background:transparent;border:1px solid #e6d5a0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.guild-emblem img{width:100%;height:100%;object-fit:cover}
.guild-meta{flex:1;display:flex;flex-direction:column;gap:3px}
.guild-name{font:900 20px 'Cinzel Decorative',serif;color:#e6d5a0;letter-spacing:.1em}
.guild-tagline{font:700 9px 'JetBrains Mono',monospace;color:#8a9aaa;letter-spacing:.2em}
.guild-desc{font:400 9px 'JetBrains Mono',monospace;color:#8a9aaa}
.header-actions{display:flex;gap:8px;align-items:center}
/* 4 - две бары */
.bars{display:flex;gap:12px;padding:10px 16px;background:transparent}
.bar-box{flex:1;background:rgba(38,48,60,.85);border:1px solid #2a3a4a;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.bar-label{display:flex;justify-content:space-between;font:700 8px 'JetBrains Mono',monospace;letter-spacing:.18em;color:#8a9aaa}
.bar-label b{color:#e6d5a0}
.bar-track{height:10px;background:#0a0e14;border-radius:6px;overflow:hidden;border:1px solid #2a3a4a}
.bar-fill{height:100%;background:linear-gradient(90deg,#d0b040,#e6d5a0);border-radius:6px;transition:.3s}
.bar-fill.xp{background:linear-gradient(90deg,#3ad080,#7ae0a0)}
/* главная сетка 5 + 6 + 2 */
.main-row{flex:1;display:flex;gap:10px;padding:0 16px 12px;overflow:hidden}
.members{flex:2.1;display:flex;flex-direction:column;background:rgba(38,48,60,.85);border:1px solid #2a3a4a;border-radius:12px;overflow:hidden}
.members-head{padding:10px 12px;border-bottom:1px solid #2a3a4a;font:700 9px 'JetBrains Mono',monospace;letter-spacing:.15em;color:#e6d5a0;display:flex;justify-content:space-between}
.members-table{flex:1;overflow:auto}
.m-row{display:grid;grid-template-columns:38px 1fr 86px 86px 86px;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid rgba(30,42,50,.4)}
.m-row.header{position:sticky;top:0;background:rgba(20,26,34,.95);font:700 7px 'JetBrains Mono',monospace;letter-spacing:.12em;color:#6a7a8a;padding:8px 10px;z-index:1}
.m-row.leader{border-left:3px solid #e6d5a0;background:rgba(230,213,160,.06)}
.m-row.empty{opacity:.55}
.m-rank{font:900 13px 'JetBrains Mono',monospace;color:#e6d5a0;text-align:center}
.m-player{display:flex;gap:8px;align-items:center;overflow:hidden}
.m-ava{width:34px;height:34px;min-width:34px;border-radius:6px;background:transparent;border:1px solid #2a3a4a;overflow:hidden;display:flex;align-items:center;justify-content:center}
.m-ava img{width:100%;height:100%;object-fit:cover}
.m-info{display:flex;flex-direction:column;gap:1px;overflow:hidden}
.m-name{font:700 10px Inter,sans-serif;color:#e6d5a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.m-sub{font:400 7px 'JetBrains Mono',monospace;color:#6a7a8a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-col{display:flex;flex-direction:column;gap:2px;text-align:right}
.m-gold{font:700 9px 'JetBrains Mono',monospace;color:#d0b040}
.m-mobs{font:700 8px 'JetBrains Mono',monospace;color:#8a9aaa}
.m-col .label-mini{font:400 6px 'JetBrains Mono',monospace;color:#5a6a7a}
/* чаты 6 и 2 */
.chat{flex:1;display:flex;flex-direction:column;background:rgba(38,48,60,.85);border:1px solid #2a3a4a;border-radius:12px;overflow:hidden;min-width:0}
.chat.global{flex:.85}
.chat-head{padding:10px 12px;border-bottom:1px solid #2a3a4a;font:700 9px 'JetBrains Mono',monospace;letter-spacing:.15em;color:#e6d5a0;display:flex;justify-content:space-between;align-items:center}
.chat-status{font:700 7px 'JetBrains Mono',monospace;color:#3ad080;border:1px solid #3ad080;border-radius:4px;padding:2px 5px}
.chat-status.soon{color:#8a9aaa;border-color:#5a6a7a}
.chat-body{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.chat-msg{font:400 9px 'JetBrains Mono',monospace;line-height:1.5;color:#d8d2b8;background:rgba(0,0,0,.18);border-radius:8px;padding:7px 9px}
.chat-msg.me{background:rgba(230,213,160,.08)}
.chat-msg b{color:#e6d5a0}
.chat-msg.sys{color:#8a9aaa;text-align:center;background:transparent;border:1px dashed #2a3a4a}
.chat-input{display:flex;gap:6px;padding:8px;border-top:1px solid #2a3a4a}
.chat-input input{flex:1;padding:8px;background:#0a0e14;border:1px solid #2a3a4a;border-radius:8px;color:#e6d5a0;font:400 9px 'JetBrains Mono',monospace}
.btn{padding:10px 14px;border-radius:8px;border:1px solid #2a3a4a;background:#1a242f;color:#d8d2b8;font:700 9px 'JetBrains Mono',monospace;letter-spacing:.12em;cursor:pointer;text-align:center;transition:.15s;white-space:nowrap}
.btn:hover{border-color:#e6d5a0;color:#e6d5a0}
.btn.primary{background:#e6d5a0;color:#121214;font-weight:800;border-color:#e6d5a0}
.btn.danger{background:transparent;border-color:#5a2a2a;color:#8a5a5a}
.btn.sm{padding:7px 10px;font-size:8px}
.input{width:100%;padding:10px;background:#0a0e14;border:1px solid #2a3a4a;border-radius:8px;color:#e6d5a0;font:700 11px 'JetBrains Mono',monospace}
.emblem-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.emblem-opt{height:56px;border-radius:8px;background:transparent;border:1px solid #2a3a4a;overflow:hidden;cursor:pointer;padding:4px}
.emblem-opt.selected{border-color:#e6d5a0;box-shadow:0 0 10px rgba(230,213,160,.3)}
.emblem-opt img{width:100%;height:100%;object-fit:cover;border-radius:6px}
.card{width:100%;max-width:560px;background:rgba(38,48,60,.85);border:1px solid #2a3a4a;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;margin:auto}
.card-title{font:900 13px 'Cinzel Decorative',serif;color:#e6d5a0;letter-spacing:.12em;text-align:center}
.log{font:700 9px 'JetBrains Mono',monospace;min-height:16px;text-align:center}
.log.ok{color:#3ad080}.log.err{color:#e05050}
@media(max-width:1100px){.chat.global{display:none}.m-row{grid-template-columns:32px 1fr 72px 72px 72px}}
@media(max-width:800px){.main-row{flex-direction:column;overflow:auto}.members{flex:none}.chat{flex:none;min-height:280px}}
</style>
</head>

<script>
var GUILD_KEY='voland_v1_guild';
var GUILD_CHAT_KEY='voland_v1_guild_chat';
var GLOBAL_CHAT_KEY='voland_v1_global_chat';
var GUILD_CREATE_COST=1000;
var EMBLEMS=['./assets/ui/nav/guilds.webp','./assets/ui/nav/hero.webp','./assets/ui/nav/battle.webp','./assets/ui/nav/market.webp','./assets/ui/nav/pvp.webp','./assets/ui/nav/pass.webp'];
var selectedEmblem=EMBLEMS[0];
function volandGetGuild(){ try{ var g=JSON.parse(localStorage.getItem(GUILD_KEY)||'null'); if(g&&g.name&&g.tag) return g; }catch(e){} return null; }
function volandSaveGuild(g){ try{ localStorage.setItem(GUILD_KEY,JSON.stringify(g)); }catch(e){} }
function volandGetGuildSlots(){ var g=volandGetGuild(); var extra=0; if(g&&g.upgrades&&g.upgrades.slots) extra=g.upgrades.slots*5; return 20+extra; }
function refreshTop(){ try{ var gl=document.getElementById('goldLabel'); if(gl) gl.textContent=volandT('ЗОЛОТО:','GOLD:'); var rl=document.getElementById('resLabel'); if(rl) rl.textContent=volandT('РЕС:','RES:'); document.getElementById('goldDisplay').textContent=volandGetGold(); var res=volandGetResources(); var total=Object.values(res).reduce(function(a,b){return a+b;},0); document.getElementById('resDisplay').textContent=total; }catch(e){} }
function selectEmblem(idx){ selectedEmblem=EMBLEMS[idx]; document.querySelectorAll('.emblem-opt').forEach(function(el,i){ el.classList.toggle('selected',i===idx); }); }
function showLog(id,msg,cls){ try{ var el=document.getElementById(id); if(el){ el.textContent=msg; el.className='log '+(cls||''); } }catch(e){} }
function createGuild(){ try{ var name=(document.getElementById('guildName').value||'').trim(); var tag=(document.getElementById('guildTag').value||'').trim().toUpperCase(); var desc=(document.getElementById('guildDesc').value||'').trim(); if(name.length<3){ showLog('createLog',volandT('Название от 3 символов','Name min 3 chars'),'err'); return; } if(tag.length<2||tag.length>4){ showLog('createLog',volandT('Тег 2-4 буквы','Tag 2-4 letters'),'err'); return; } var gold=volandGetGold(); if(gold<GUILD_CREATE_COST){ showLog('createLog',volandT('Недостаточно золота: ','Not enough gold: ')+gold+'/'+GUILD_CREATE_COST,'err'); return; } try{ volandSpendGold(GUILD_CREATE_COST); }catch(e){ localStorage.setItem('voland_v1_gold',String(gold-GUILD_CREATE_COST)); } var g={name:name,tag:tag,emblem:selectedEmblem,desc:desc||volandT('Гильдия VOLAND','VOLAND Guild'),created:Date.now(),level:1,treasury:0,upgrades:{},xp:120}; volandSaveGuild(g); try{ localStorage.setItem(GUILD_CHAT_KEY,JSON.stringify([{t:Date.now(),who:'SYS',text:volandT('Ты создал гильдию ','You created guild ')+name}])); }catch(e){} refreshTop(); render(); }catch(e){ showLog('createLog',volandT('Ошибка: ','Error: ')+e.message,'err'); } }
function leaveGuild(){ var g=volandGetGuild(); if(!g) return; if(!confirm(volandT('Покинуть гильдию ','Leave guild ')+g.name+'?')) return; try{ localStorage.removeItem(GUILD_KEY); }catch(e){} render(); }
function getChats(key){ try{ return JSON.parse(localStorage.getItem(key)||'[]'); }catch(e){ return []; } }
function sendChat(key,inputId){ try{ var inp=document.getElementById(inputId); var txt=(inp.value||'').trim(); if(!txt) return; var chats=getChats(key); var me='YOU'; try{ var saves=volandGetSaves(); var idx=volandGetActiveIndex(); if(saves[idx]&&saves[idx].name) me=(saves[idx].name||'YOU').toUpperCase(); }catch(e){} chats.push({t:Date.now(),who:me,text:txt}); if(chats.length>50) chats=chats.slice(-50); localStorage.setItem(key,JSON.stringify(chats)); inp.value=''; render(); }catch(e){} }
function renderMembers(g){ var slots=volandGetGuildSlots(); var meName='YOU'; var meHero=''; var meLvl=1; try{ var saves=volandGetSaves(); var idx=volandGetActiveIndex(); if(saves[idx]){ meName=(saves[idx].name||'YOU').toUpperCase(); var hero=VOLAND_HEROES[saves[idx].hero]; if(hero) meHero=hero.n; try{ var li=volandGetLevelInfo(parseInt(saves[idx].xp||0)); meLvl=li.lvl; }catch(e){} } }catch(e){} var html=''; html+='<div class="m-row header"><div>#</div><div>'+volandT('ИГРОК','PLAYER')+'</div><div>'+volandT('ДЕНЬ','DAY')+'</div><div>'+volandT('НЕДЕЛЯ','WEEK')+'</div><div>'+volandT('ВСЕГО','TOTAL')+'</div></div>'; var treasury=g.treasury||0; var dayGold=Math.min(150,treasury+150); var weekGold=Math.min(850,treasury+850); var totalGold=treasury+1200; var dayMobs=12, weekMobs=68, totalMobs=240; for(var i=0;i<slots;i++){ if(i===0){ html+='<div class="m-row leader"><div class="m-rank">#'+(i+1)+'</div><div class="m-player"><div class="m-ava"><img src="./assets/ui/nav/hero.webp" onerror="this.style.display=\'none\'"></div><div class="m-info"><div class="m-name">'+meName+'</div><div class="m-sub">Lv '+meLvl+' • '+(meHero||'')+' • '+volandT('ЛИДЕР','LEADER')+'</div></div></div><div class="m-col"><div class="m-gold">🪙 '+dayGold+'</div><div class="m-mobs">⚔️ '+dayMobs+'</div></div><div class="m-col"><div class="m-gold">🪙 '+weekGold+'</div><div class="m-mobs">⚔️ '+weekMobs+'</div></div><div class="m-col"><div class="m-gold">🪙 '+totalGold+'</div><div class="m-mobs">⚔️ '+totalMobs+'</div></div></div>'; } else { html+='<div class="m-row empty"><div class="m-rank">#'+(i+1)+'</div><div class="m-player"><div class="m-ava"><span style="font-size:16px;color:#5a6a7a">+</span></div><div class="m-info"><div class="m-name">'+volandT('ПУСТОЙ СЛОТ','EMPTY SLOT')+'</div><div class="m-sub">'+volandT('Свободно','Free')+'</div></div></div><div class="m-col"><div class="m-gold">—</div><div class="m-mobs">—</div></div><div class="m-col"><div class="m-gold">—</div><div class="m-mobs">—</div></div><div class="m-col"><div class="m-gold">—</div><div class="m-mobs">—</div></div></div>'; } } return html; }
function renderChats(){ var gc=getChats(GUILD_CHAT_KEY); if(gc.length===0) gc=[{t:Date.now(),who:'SYS',text:volandT('Добро пожаловать в гильдию','Welcome to the guild')}]; var gl=getChats(GLOBAL_CHAT_KEY); if(gl.length===0) gl=[{t:Date.now(),who:'SYS',text:volandT('Глобальный чат — SOON. Пока локально.','Global chat — SOON. Local for now.')}]; var gHtml=gc.map(function(m){ return '<div class="chat-msg '+(m.who==='SYS'?'sys':'')+'"><b>'+m.who+'</b> • '+m.text+'</div>'; }).join(''); var glHtml=gl.map(function(m){ return '<div class="chat-msg '+(m.who==='SYS'?'sys':'')+'"><b>'+m.who+'</b> • '+m.text+'</div>'; }).join(''); return {guild:gHtml,global:glHtml}; }
function render(){ refreshTop(); var g=volandGetGuild(); var el=document.getElementById('guildContent'); if(!g){ el.innerHTML='<div style="flex:1;display:flex;overflow:auto;padding:20px"><div class="card"><div class="card-title">'+volandT('СОЗДАТЬ ГИЛЬДИЮ','CREATE GUILD')+'</div><div style="font:400 9px \'JetBrains Mono\',monospace;color:#8a9aaa;text-align:center;line-height:1.6">'+volandT('Пока ты один. Создай гильдию — задел на будущее.','You are alone for now. Create a guild — prep for the future.')+'</div><input class="input" id="guildName" placeholder="'+volandT('Название гильдии','Guild name')+'" maxlength="24"><input class="input" id="guildTag" placeholder="'+volandT('Тег 2-4 буквы, напр. VLND','Tag 2-4 letters, e.g. VLND')+'" maxlength="4" style="text-transform:uppercase"><div class="emblem-grid">'+EMBLEMS.map(function(e,i){ return '<div class="emblem-opt '+(i===0?'selected':'')+'" onclick="selectEmblem('+i+')"><img src="'+e+'" onerror="this.style.display=\'none\'"></div>'; }).join('')+'</div><input class="input" id="guildDesc" placeholder="'+volandT('Описание (необязательно)','Description (optional)')+'" maxlength="80"><div class="btn primary" onclick="createGuild()">'+volandT('СОЗДАТЬ ГИЛЬДИЮ • ','CREATE GUILD • ')+GUILD_CREATE_COST+'g</div><div class="log" id="createLog"></div></div></div>'; return; } var xp=g.xp||120; var xpNeed=500; var xpPct=Math.min(100,Math.round(xp/xpNeed*100)); var goldGoal=5000; var treasury=g.treasury||0; var goldPct=Math.min(100,Math.round(treasury/goldGoal*100)); var chats=renderChats(); var slots=volandGetGuildSlots(); el.innerHTML='<div class="guild-header"><div class="guild-emblem"><img src="'+(g.emblem||EMBLEMS[0])+'" onerror="this.style.display=\'none\'"></div><div class="guild-meta"><div class="guild-name">'+g.name.toUpperCase()+' <span style="font-size:11px;color:#d0b040">['+g.tag+']</span> <span style="font-size:11px;color:#8a9aaa">LVL '+(g.level||1)+'</span></div><div class="guild-tagline">'+volandT('УЧАСТНИКИ: ','MEMBERS: ')+'1/'+slots+' • '+volandT('СОЗДАНА ','CREATED ')+new Date(g.created).toLocaleDateString()+'</div><div class="guild-desc">'+(g.desc||'')+'</div></div><div class="header-actions"><div class="btn sm" onclick="location.href=\'./page12.html\'">'+volandT('ЗАЛ','HALL')+'</div><div class="btn sm danger" onclick="leaveGuild()">'+volandT('ПОКИНУТЬ','LEAVE')+'</div></div></div><div class="bars"><div class="bar-box"><div class="bar-label"><span>XP • '+volandT('ОПЫТ ГИЛЬДИИ','GUILD XP')+'</span><b>'+xp+' / '+xpNeed+' • '+xpPct+'%</b></div><div class="bar-track"><div class="bar-fill xp" style="width:'+xpPct+'%"></div></div></div><div class="bar-box"><div class="bar-label"><span>GOLD • '+volandT('КАЗНА','TREASURY')+'</span><b>'+treasury+'g / '+goldGoal+'g • '+goldPct+'%</b></div><div class="bar-track"><div class="bar-fill" style="width:'+goldPct+'%"></div></div></div></div><div class="main-row"><div class="members"><div class="members-head"><span>'+volandT('УЧАСТНИКИ ГИЛЬДИИ','GUILD MEMBERS')+'</span><span>1/'+slots+'</span></div><div class="members-table">'+renderMembers(g)+'</div></div><div class="chat"><div class="chat-head"><span>'+volandT('ЧАТ ГИЛЬДИИ','GUILD CHAT')+'</span><span class="chat-status">'+volandT('ЛОКАЛЬНО','LOCAL')+'</span></div><div class="chat-body">'+chats.guild+'</div><div class="chat-input"><input id="guildChatInput" placeholder="'+volandT('Написать в гильдию...','Write to guild...')+'" onkeydown="if(event.key===\'Enter\') sendChat(\''+GUILD_CHAT_KEY+'\',\'guildChatInput\')"><div class="btn primary sm" onclick="sendChat(\''+GUILD_CHAT_KEY+'\',\'guildChatInput\')">'+volandT('ОТПРАВИТЬ','SEND')+'</div></div></div><div class="chat global"><div class="chat-head"><span>'+volandT('ОБЩИЙ ЧАТ','GLOBAL CHAT')+'</span><span class="chat-status soon">SOON</span></div><div class="chat-body">'+chats.global+'</div><div class="chat-input"><input id="globalChatInput" placeholder="'+volandT('Общий чат — SOON...','Global chat — SOON...')+'" onkeydown="if(event.key===\'Enter\') sendChat(\''+GLOBAL_CHAT_KEY+'\',\'globalChatInput\')"><div class="btn sm" onclick="sendChat(\''+GLOBAL_CHAT_KEY+'\',\'globalChatInput\')">'+volandT('ОТПРАВИТЬ','SEND')+'</div></div></div></div>'; }
render();
</script>
