function getExchangeRate(fromId, toId){
  if(fromId===toId) return 1;
  const base = ['quartz','wood','diamond','water','stone','bone'];
  const rare = ['fang','essence'];
  const isBaseFrom = base.includes(fromId);
  const isBaseTo = base.includes(toId);
  const isRareFrom = rare.includes(fromId);
  const isRareTo = rare.includes(toId);
  if(isBaseFrom && isBaseTo) return 2;
  if(isRareFrom && isRareTo) return 1;
  if(isBaseFrom && isRareTo) return 4;
  if(isRareFrom && isBaseTo) return 0.25;
  return 2;
}

function changeQty(delta){
  let el = document.getElementById('modalQty');
  let v = parseInt(el.value)||1;
  v += delta;
  v = Math.max(1, Math.min(999, v));
  el.value = v;
  updateModalPrices();
}

function updateModalPrices(){
  if(!currentModalItem) return;
  let qty = parseInt(document.getElementById('modalQty').value)||1;
  qty = Math.max(1, Math.min(999, qty));
  document.getElementById('modalQty').value = qty;
  document.getElementById('modalBuyPrice').textContent = (currentModalItem.buy*qty)+'g ('+currentModalItem.buy+'g x'+qty+')';
  document.getElementById('modalSellPrice').textContent = (currentModalItem.sell*qty)+'g ('+currentModalItem.sell+'g x'+qty+')';
  let gold = 0; try{ gold = volandGetGold(); }catch(e){}
  let buyBtn = document.getElementById('modalBuyBtn');
  let sellBtn = document.getElementById('modalSellBtn');
  if(buyBtn) buyBtn.disabled = gold < currentModalItem.buy*qty;
  if(sellBtn) sellBtn.disabled = currentModalItem.have < qty;
  if(buyBtn) buyBtn.style.opacity = buyBtn.disabled ? '.4' : '1';
  if(sellBtn) sellBtn.style.opacity = sellBtn.disabled ? '.4' : '1';
}

function confirmBuy(){
  if(!currentModalItem) return;
  let qty = parseInt(document.getElementById('modalQty').value)||1;
  if(currentModalItem.type==='res') buyRes(currentModalItem.id, qty);
  else buyPotion(currentModalItem.id, qty);

function confirmSell(){
  if(!currentModalItem) return;
  let qty = parseInt(document.getElementById('modalQty').value)||1;

function buyRes(id, qty){
  try{
    let price = MARKET_PRICES[id].buy * qty;
    let gold = volandGetGold();
    if(gold < price){ showLog('modalLog',volandT('Недостаточно GOLD: ', 'Not enough GOLD: ')+gold+'/'+price,'err'); return; }
    volandSetGold(gold - price);
    volandAddResource(id, qty);
    showLog('modalLog',volandT('Куплено ', 'Bought ')+RES_NAMES[id]+' x'+qty+volandT(' за ', ' for ')+price+'g','ok');
    renderMarket(); refreshTop();
    if(currentModalItem && currentModalItem.id===id){
      currentModalItem.have += qty;
      document.getElementById('modalHave').textContent = `${volandT('В рюкзаке: ', 'In bag: ')}x${currentModalItem.have}`;
      updateModalPrices();
    }
  }catch(e){ showLog('modalLog',volandT('Ошибка: ', 'Error: ')+e.message,'err'); }
}
function sellRes(id, qty){
  try{
    let res = volandGetResources();
    let have = res[id]||0;
    if(have < qty){ showLog('modalLog',volandT('Недостаточно ', 'Not enough ')+RES_NAMES[id],'err'); return; }
    let price = MARKET_PRICES[id].sell * qty;
    volandAddResource(id, -qty);
    let gold = volandGetGold();
    volandSetGold(gold + price);
    showLog('modalLog',volandT('Продано ', 'Sold ')+RES_NAMES[id]+' x'+qty+volandT(' за ', ' for ')+price+'g','ok');
    renderMarket(); refreshTop();
    if(currentModalItem && currentModalItem.id===id){
      currentModalItem.have -= qty;
      document.getElementById('modalHave').textContent = `В рюкзаке: x${currentModalItem.have}`;
      updateModalPrices();
    }
  }catch(e){ showLog('modalLog','Ошибка: '+e.message,'err'); }
}

function buyPotion(id, qty){
  try{
    let price = POTION_PRICES[id].buy*qty;
    let gold = volandGetGold();
    if(gold < price){ showLog('modalLog',volandT('Недостаточно золота', 'Not enough gold'),'err'); return; }
    volandAddGold(-price);
    for(let i=0;i<qty;i++){ if(typeof volandAddToInventory==='function') volandAddToInventory(id); }
    showLog('modalLog','Куплено '+id+' x'+qty,'ok');
    renderMarket(); refreshTop();
    if(currentModalItem && currentModalItem.id===id){
      currentModalItem.have += qty;
      document.getElementById('modalHave').textContent = `В рюкзаке: x${currentModalItem.have}`;
      updateModalPrices();
    }
  }catch(e){ console.log(e); showLog('modalLog','Ошибка: '+e.message,'err'); }
}
function sellPotion(id, qty){
  try{
    let price = POTION_PRICES[id].sell*qty;
    let inv = volandGetInventory ? volandGetInventory() : [];
    let have = inv.filter(x=> (x.id||x)===id).length;
    if(have < qty){ showLog('modalLog',volandT('Недостаточно банок', 'Not enough jars'),'err'); return; }
    for(let i=0;i<qty;i++){ if(typeof volandRemoveFromInventory==='function') volandRemoveFromInventory(id); }
    volandAddGold(price);
    showLog('modalLog','Продано '+id+' x'+qty+volandT(' за ', ' for ')+price+'g','ok');
    renderMarket(); refreshTop();
    if(currentModalItem && currentModalItem.id===id){
      currentModalItem.have -= qty;
      document.getElementById('modalHave').textContent = `В рюкзаке: x${currentModalItem.have}`;
      updateModalPrices();
    }
  }catch(e){ console.log(e); showLog('modalLog','Ошибка: '+e.message,'err'); }
}

function updateExchangePreview(){

function doExchange(){
  try{
    let fromId = document.getElementById('exFrom').value;
    let toId = document.getElementById('exTo').value;
    let amount = parseInt(document.getElementById('exAmount').value)||1;
    if(fromId===toId){ showLog('exLog', volandT('Выбери разные ресурсы','Choose different resources'),'err'); return; }
    let res = volandGetResources();
    let have = res[fromId]||0;
    if(have < amount){ showLog('exLog','Недостаточно '+RES_NAMES[fromId]+': '+have+'/'+amount,'err'); return; }
    let rate = getExchangeRate(fromId, toId);
    let receive = rate >=1 ? Math.floor(amount / rate) : Math.floor(amount * (1/rate));
    if(receive < 1){ showLog('exLog',volandT('Слишком мало для обмена, увеличь количество', 'Too little for exchange, increase amount'),'err'); return; }
    volandAddResource(fromId, -amount);
    volandAddResource(toId, receive);
    showLog('exLog',volandT('Обмен: -', 'Exchange: -')+amount+' '+RES_NAMES[fromId]+' +'+receive+' '+RES_NAMES[toId],'ok');
    renderResList(); renderExchange(); refreshTop(); renderMarket();
  }catch(e){ showLog('exLog','Ошибка: '+e.message,'err'); }
}

function createP2P(){
  try{
    let resId = document.getElementById('p2pRes').value;
    let amount = parseInt(document.getElementById('p2pAmt').value)||1;
    let pricePer = parseInt(document.getElementById('p2pPrice').value)||1;

    if(have < amount){ showLog('p2pLog','Недостаточно '+RES_NAMES[resId]+': '+have+'/'+amount,'err'); return; }
    volandAddResource(resId, -amount);
    let listings = getP2PList();
    listings.push({resId, amount, pricePer, ts:Date.now()});
    setP2PList(listings);
    showLog('p2pLog',volandT('Лот выставлен: ', 'Listing posted: ')+RES_NAMES[resId]+' x'+amount+volandT(' за ', ' for ')+pricePer+volandT('g/шт', 'g/pc'),'ok');
    renderResList(); renderP2P(); refreshTop(); renderMarket();
  }catch(e){ showLog('p2pLog','Ошибка: '+e.message,'err'); }
}

function removeP2P(idx){
  try{
    let listings = getP2PList();
    let lot = listings[idx];
    if(!lot) return;
    volandAddResource(lot.resId, lot.amount);
    listings.splice(idx,1);
    setP2PList(listings);
    showLog('p2pLog',volandT('Лот снят, ресурсы возвращены', 'Listing removed, resources returned'),'ok');
    renderResList(); renderP2P(); refreshTop(); renderMarket();
  }catch(e){ showLog('p2pLog','Ошибка: '+e.message,'err'); }
}

function updateTop(){ refreshTop(); }

document.addEventListener('DOMContentLoaded', ()=>{
  renderResList();
  renderMarket();
  refreshTop();
});
setTimeout(()=>{ renderResList(); renderMarket(); refreshTop(); }, 100);
</script>
</body>
</html>
