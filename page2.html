<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0e0e10;overflow:hidden;font-family:Inter,Arial,sans-serif;color:#e6e0cc}
.top{position:fixed;top:0;left:0;right:0;height:54px;background:rgba(18,18,20,.95);border-bottom:1px solid #23232a;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:10}
.top h1{font-size:14px;letter-spacing:.25em;color:#e8dcc0}
.left{position:fixed;left:0;top:54px;bottom:0;width:380px;background:rgba(18,18,20,.92);border-right:1px solid #23232a;overflow:auto;padding:10px;z-index:5}
.center{position:fixed;left:380px;right:360px;top:54px;bottom:0;z-index:0;background:#0e0e10}
.center img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.center:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0e0e10 0%,rgba(14,14,16,.2) 30%,rgba(14,14,16,.2) 70%,#0e0e10 100%)}
.right{position:fixed;right:0;top:54px;bottom:0;width:360px;background:rgba(23,23,27,.95);border-left:1px solid #23232a;overflow:auto;padding:14px;z-index:5;display:flex;flex-direction:column}
.skill{display:flex;gap:10px;background:#17171b;border:1px solid #23232a;border-radius:10px;padding:9px;margin-bottom:8px}
.icon{width:56px;height:56px;border-radius:10px;overflow:hidden;background:#1e1e22;flex-shrink:0}
.icon img{width:100%;height:100%;object-fit:cover;display:block}
.sname{font-size:11px;font-weight:700}.badge{font-size:6px;background:#1e1e22;border:1px solid #2a2a32;padding:2px 4px;border-radius:3px;margin-left:5px;color:#8a8678}
.sdesc{font-size:9px;color:#8b8b95;line-height:1.35;margin-top:3px}.smeta{font-size:7px;color:#5e5e68;margin-top:4px}
.stat{margin:10px 0}.stat-head{display:flex;justify-content:space-between}.label{font-size:8px;color:#8a8678;letter-spacing:.1em}.val{font-size:10px;color:#e6d5a0;font-weight:600}
.bar{height:2px;background:rgba(255,255,255,.08);margin-top:4px}.bar-fill{height:100%;background:#e6d5a0;display:block}
.input-box{background:#2a2a2e;border:1px solid #3a3a42;padding:10px;margin-top:14px}
.input-box label{font-size:7px;letter-spacing:.2em;color:#8a8678;display:block;margin-bottom:6px}
.input-box input{width:100%;background:#0e0e10;border:1px solid #3a3a42;color:#e8dcc0;padding:9px 10px;font-size:11px;outline:none}
.btn{margin-top:14px;padding:12px;background:rgba(230,213,160,.12);border:1px solid rgba(255,255,255,.1);text-align:center;font-size:8px;letter-spacing:.25em;color:#5a5a60;cursor:not-allowed}
.btn.active{background:rgba(230,213,160,.15);border-color:#e6d5a0;color:#e6d5a0;cursor:pointer}
</style>
</head>

document.getElementById('heroTitle').textContent = hero.name;
document.getElementById('heroImg').src = hero.img;

document.getElementById('skillsLeft').innerHTML = `<div style="font-size:9px;letter-spacing:.3em;color:#6b6875;text-align:center;margin-bottom:10px">SKILLS — ${hero.name}</div>` + hero.skills.map(s=>`
<div class="skill"><div class="icon"><img src="${s.i}"></div><div><div class="sname">${s.n} <span class="badge">${s.b}</span></div><div class="sdesc">${s.d}</div><div class="smeta">${s.m}</div></div></div>`).join('');

function renderStats(){
const st=hero.stats;
const max={HP:1500,DEF:200,DMG:300,MANA:350};
document.getElementById('statsRight').innerHTML=`
<div class="stat"><div class="stat-head"><span class="label">HP</span><span class="val">${st.HP}</span></div><div class="bar"><span class="bar-fill" style="width:${st.HP/max.HP*100}%"></span></div></div>
<div class="stat"><div class="stat-head"><span class="label">DEF</span><span class="val">${st.DEF}</span></div><div class="bar"><span class="bar-fill" style="width:${st.DEF/max.DEF*100}%"></span></div></div>
<div class="stat"><div class="stat-head"><span class="label">DAMAGE</span><span class="val">${st.DMG}</span></div><div class="bar"><span class="bar-fill" style="width:${st.DMG/max.DMG*100}%"></span></div></div>
<div class="stat"><div class="stat-head"><span class="label">CRIT</span><span class="val">${st.CRIT}</span></div><div class="bar"><span class="bar-fill" style="width:${parseInt(st.CRIT)*3}%"></span></div></div>
<div class="stat"><div class="stat-head"><span class="label">DODGE</span><span class="val">${st.DODGE}</span></div><div class="bar"><span class="bar-fill" style="width:${parseInt(st.DODGE)*4}%"></span></div></div>
<div class="stat"><div class="stat-head"><span class="label">MANA</span><span class="val">${st.MANA}</span></div><div class="bar"><span class="bar-fill" style="width:${st.MANA/max.MANA*100}%"></span></div></div>
`;
}
renderStats();

const nameInput=document.getElementById('playerName');
const btn=document.getElementById('saveBtn');
function check(){
const v=nameInput.value.trim();
if(v.length>=3){btn.classList.add('active');btn.textContent='CONFIRM CHAMPION — SAVE AS '+v.toUpperCase();}
else{btn.classList.remove('active');btn.textContent='ENTER NAME — MIN 3 CHARS';}
}
nameInput.addEventListener('input',check);
btn.addEventListener('click',()=>{
if(!btn.classList.contains('active'))return;
localStorage.setItem('voland_player_name',nameInput.value.trim());
localStorage.setItem('voland_hero',heroId);
btn.textContent='✓ SAVED';
setTimeout(()=>location.href='index.html',600);
});
check();
</script>
