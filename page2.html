<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HERO DETAIL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0a0a0c;overflow:hidden;font-family:Inter,Arial,sans-serif;color:#e6e0cc}
.bg{position:fixed;inset:0;z-index:0}.bg img{width:100%;height:100%;object-fit:cover}.bg:after{content:"";position:absolute;inset:0;background:rgba(10,10,14,.72)}
.top{position:fixed;top:0;left:0;right:0;height:58px;background:rgba(18,18,20,.96);border-bottom:1px solid #23232a;display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:10}
.top h1{font-size:16px;letter-spacing:.28em;color:#e6d5a0;font-weight:800}
.left{position:fixed;left:0;top:58px;bottom:0;width:380px;background:rgba(16,16,18,.92);border-right:1px solid #23232a;overflow:auto;padding:12px;z-index:5}
.center{position:fixed;left:380px;right:380px;top:58px;bottom:0;z-index:1;display:flex;align-items:flex-start;justify-content:center;background:rgba(0,0,0,.15)}
.center img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block} /* головы и ноги теперь в кадре */
.right{position:fixed;right:0;top:58px;bottom:0;width:380px;background:rgba(20,20,24,.96);border-left:1px solid #23232a;overflow:auto;padding:16px;z-index:5}
.skill{display:flex;gap:12px;background:#17171b;border:1px solid #23232a;border-radius:12px;padding:10px;margin-bottom:10px}
.icon{width:62px;height:62px;border-radius:12px;overflow:hidden;background:#1e1e22;flex-shrink:0;border:1px solid #2a2a32}
.icon img{width:100%;height:100%;object-fit:cover;display:block}
.sname{font-size:12px;font-weight:700;letter-spacing:.02em}.badge{font-size:7px;background:#1e1e22;border:1px solid #2a2a32;padding:2px 5px;border-radius:4px;margin-left:6px;color:#8a8678}
.sdesc{font-size:10px;color:#a0a0a8;margin-top:4px;line-height:1.35}.smeta{font-size:8px;color:#6e6e78;margin-top:5px}
.stat-row{margin-bottom:14px}
.stat{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.12em;margin-bottom:4px}.label{color:#8a8678}.val{color:#e6d5a0;font-weight:800}
.bar{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden} /* было 2px - не видно */
.bar-fill{height:100%;background:linear-gradient(90deg,#e6d5a0,#c9b896);display:block;border-radius:3px}
.input-box{background:#1e1e22;border:1px solid #2a2a32;padding:12px;margin-top:20px;border-radius:8px}
.input-box label{font-size:8px;letter-spacing:.22em;color:#8a8678;display:block;margin-bottom:8px}
.input-box input{width:100%;background:#0e0e10;border:1px solid #3a3a42;color:#e8dcc0;padding:11px;font-size:12px;outline:none;border-radius:6px}
.btn{margin-top:16px;padding:13px;border:1px solid #3a3a42;text-align:center;font-size:9px;letter-spacing:.28em;color:#666;cursor:not-allowed;border-radius:8px}
.btn.active{border-color:#e6d5a0;color:#121214;background:#e6d5a0;font-weight:800;cursor:pointer}
</style>
</head>
<body>

const heroId=localStorage.getItem('voland_hero')||'necro-m';

document.getElementById('heroTitle').textContent=h.name;
document.getElementById('heroImg').src=h.img;
document.getElementById('leftSkills').innerHTML=h.skills.map(s=>`
<div class="skill">
  <div class="icon"><img src="${s.i}" onerror="this.style.background='#1e1e22'"></div>
  <div><div class="sname">${s.n} <span class="badge">${s.b}</span></div><div class="sdesc">${s.d}</div><div class="smeta">${s.m}</div></div>
</div>`).join('');

const maxHP=1300,maxDEF=180,maxDMG=280,maxMANA=320;
function pct(v,max){return Math.min(100,Math.round(v/max*100))+'%';}
document.getElementById('stats').innerHTML=`
<div class="stat-row"><div class="stat"><span class="label">HP</span><span class="val">${h.stats.HP}</span></div><div class="bar"><span class="bar-fill" style="width:${pct(h.stats.HP,maxHP)}"></span></div></div>
<div class="stat-row"><div class="stat"><span class="label">DEF</span><span class="val">${h.stats.DEF}</span></div><div class="bar"><span class="bar-fill" style="width:${pct(h.stats.DEF,maxDEF)}"></span></div></div>
<div class="stat-row"><div class="stat"><span class="label">DMG</span><span class="val">${h.stats.DMG}</span></div><div class="bar"><span class="bar-fill" style="width:${pct(h.stats.DMG,maxDMG)}"></span></div></div>
<div class="stat-row"><div class="stat"><span class="label">MANA</span><span class="val">${h.stats.MANA}</span></div><div class="bar"><span class="bar-fill" style="width:${pct(h.stats.MANA,maxMANA)}"></span></div></div>
`;

const inp=document.getElementById('playerName');const btn=document.getElementById('saveBtn');
function check(){const v=inp.value.trim();if(v.length>=3){btn.classList.add('active');btn.textContent='CONFIRM — '+v.toUpperCase();}else{btn.classList.remove('active');btn.textContent='ENTER NAME — MIN 3 CHARS';}}
inp.addEventListener('input',check);btn.addEventListener('click',()=>{if(!btn.classList.contains('active'))return;localStorage.setItem('voland_player_name',inp.value.trim());btn.textContent='✓ SAVED';setTimeout(()=>location.href='index.html',600);});check();

</html>
