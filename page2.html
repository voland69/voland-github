<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0e0e10;overflow:hidden;font-family:Inter,Arial,sans-serif;color:#e6e0cc}
.top{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(18,18,20,.95);border-bottom:1px solid #23232a;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:10}
.top h1{font-size:13px;letter-spacing:.25em;color:#e8dcc0}
.left{position:fixed;left:0;top:56px;bottom:0;width:280px;background:rgba(18,18,20,.9);border-right:1px solid #23232a;overflow:auto;padding:8px;z-index:5}
.hero-btn{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid transparent;border-radius:8px;cursor:pointer;margin-bottom:4px}
.hero-btn.active{border-color:#e6d5a0;background:rgba(230,213,160,.08)}
.hero-btn img{width:36px;height:36px;border-radius:6px;object-fit:cover}
.hero-btn span{font-size:10px}
.center{position:fixed;left:280px;right:340px;top:56px;bottom:0;z-index:0;background:#0e0e10}
.center img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.center:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,14,16,.8) 0%,rgba(14,14,16,.15) 30%,rgba(14,14,16,.15) 70%,rgba(14,14,16,.9) 100%)}
.right{position:fixed;right:0;top:56px;bottom:0;width:340px;background:rgba(23,23,27,.92);border-left:1px solid #23232a;overflow:auto;padding:10px;z-index:5}
.skill{display:flex;gap:8px;background:#17171b;border:1px solid #23232a;border-radius:10px;padding:8px;margin-bottom:8px}
.icon{width:48px;height:48px;border-radius:8px;overflow:hidden;background:#1e1e22;flex-shrink:0}
.icon img{width:100%;height:100%;object-fit:cover;display:block}
.sname{font-size:10px;font-weight:700}.badge{font-size:5px;background:#1e1e22;border:1px solid #2a2a32;padding:1px 3px;border-radius:3px;margin-left:4px;color:#8a8678}
.sdesc{font-size:8px;color:#8b8b95;margin-top:2px;line-height:1.3}.smeta{font-size:6px;color:#5e5e68;margin-top:2px}
</style>
</head>

const list=document.getElementById('list');
const heroImg=document.getElementById('heroImg');
const skillsBox=document.getElementById('skills');

function renderList(){
list.innerHTML='';
heroes.forEach(h=>{
const d=document.createElement('div');
d.className='hero-btn';
d.innerHTML=`<img src="${h.img}"><span>${h.name}</span>`;
d.onclick=()=>selectHero(h.id);
d.id='btn-'+h.id;
list.appendChild(d);
});
}
function selectHero(id){
const h=heroes.find(x=>x.id===id);
document.querySelectorAll('.hero-btn').forEach(b=>b.classList.remove('active'));
document.getElementById('btn-'+id).classList.add('active');
heroImg.src=h.img;
skillsBox.innerHTML=`<div style="font-size:9px;letter-spacing:.3em;color:#6b6875;text-align:center;margin-bottom:8px">${h.name} — SKILLS</div>`+
h.skills.map(s=>`<div class="skill"><div class="icon"><img src="${s.icon}"></div><div><div class="sname">${s.name} <span class="badge">${s.badge}</span></div><div class="sdesc">${s.desc}</div><div class="smeta">${s.meta}</div></div></div>`).join('');
localStorage.setItem('voland_hero',id);
}
renderList();
selectHero('archer-f');
