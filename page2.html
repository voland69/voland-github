<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0a0c;color:#e6e0cc;font-family:Inter,Arial,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0}.bg img{width:100%;height:100%;object-fit:cover}.bg:after{content:"";position:absolute;inset:0;background:rgba(8,8,10,.82)}
.wrap{position:fixed;inset:0;display:flex;z-index:2}
.left{width:440px;min-width:440px;background:#0e0e10;border-right:1px solid #23232a;padding:10px;overflow-y:auto;overflow-x:hidden}
.skill{display:flex;gap:14px;background:#17171b;border:1px solid #23232a;border-radius:12px;padding:10px;align-items:center;margin-bottom:10px}
.icon{width:112px;height:112px;min-width:112px;border-radius:12px;background:#1e1e22;border:1px solid #2a2a32;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:48px;flex-shrink:0;position:relative}
.icon img{width:100%;height:100%;object-fit:cover;display:block}
.icon .fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:42px;background:#1e1e22}
.sinfo{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.sname{font-size:12px;font-weight:700;color:#e6d5a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:8px;background:#1e1e22;border:1px solid #2a2a32;padding:2px 5px;border-radius:3px;color:#8a8678;margin-left:5px}
.sdesc{font-size:11px;color:#9a9aa0;margin-top:6px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.smeta{font-size:8px;color:#6a6a72;margin-top:5px}
.center{flex:1;background:#000;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative}
.center img{max-height:78vh;max-width:92%;width:auto;height:auto;object-fit:contain;object-position:bottom center;display:block;filter: drop-shadow(0 0 20px rgba(0,0,0,.8))}
.right{width:400px;min-width:400px;background:#121214;border-left:1px solid #23232a;overflow:auto;padding:14px;display:flex;flex-direction:column}
.hero-right{font-family:'Cinzel Decorative',serif;font-size:20px;letter-spacing:.35em;color:#e6d5a0;font-weight:900;padding-bottom:18px;border-bottom:1px solid #2a2a32;margin-bottom:20px}
.stat-row{margin-bottom:10px}
.stat{display:flex;justify-content:space-between;font-size:9px;margin-bottom:3px;letter-spacing:.1em}
.val{color:#e6d5a0;font-weight:800}
.bar{height:6px;background:#222;border-radius:3px;overflow:hidden}
.bar-fill{height:100%;background:#e6d5a0;display:block}
.input-box{margin-top:auto;background:#1e1e22;border:1px solid #2a2a32;padding:10px;border-radius:8px}
.input-box .label{font-size:7px;letter-spacing:.2em;color:#8a8678}
.input-box input{width:100%;margin-top:6px;background:#0e0e10;border:1px solid #3a3a42;color:#e6e0cc;padding:9px;border-radius:6px;font-size:12px}
.btn{margin-top:10px;padding:11px;border:1px solid #3a3a42;text-align:center;font-size:8px;letter-spacing:.2em;border-radius:6px;transition:.2s}
.btn.active{background:#e6d5a0;color:#121214;font-weight:800;cursor:pointer}
.close{position:fixed;top:8px;right:8px;z-index:10;width:32px;height:32px;background:rgba(0,0,0,.7);border:1px solid #2a2a32;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#e6e0cc}
</style>
</head>

function loadHero(id){
 if(!DB[id]) id='necro-f-new';
 let h=DB[id];
 document.getElementById('hr').textContent=h.n;
 document.getElementById('heroImg').src=h.img;
 document.getElementById('left').innerHTML=h.sk.map(s=>{
  let icons=s[2]; let first=icons[0];
  return `<div class="skill"><div class="icon"><img src="${first}" data-fallbacks='${JSON.stringify(icons.slice(1))}' loading="lazy" onload="this.nextElementSibling.style.display='none'" onerror="let fb=JSON.parse(this.dataset.fallbacks||'[]'); if(fb.length){this.src=fb.shift(); this.dataset.fallbacks=JSON.stringify(fb);}else{this.style.display='none'; this.nextElementSibling.style.display='flex';}"><div class="fallback">${s[3]}</div></div><div class="sinfo"><div class="sname">${s[0]} <span class="badge">${s[1]}</span></div><div class="sdesc">${s[4]}</div><div class="smeta">${s[5]}</div></div></div>`;
 }).join('');
 function pct(v,m){return Math.min(100,Math.round(v/m*100))+'%'}
 let st=h.st;
 // gear bonuses
 try{
  let gear=JSON.parse(localStorage.getItem('voland_equip')||'{}');
  let bonus={HP:0,DEF:0,DMG:0,MANA:0,CRIT:0,DODGE:0};
  const MAP={head:{DMG:20,DEF:10},ear1:{CRIT:1,DMG:5},ear2:{CRIT:1,DODGE:2},amulet:{MANA:50,CRIT:2},armor:{HP:100,DEF:30},weapon:{DMG:40},shield:{DEF:60,HP:50},ring1:{DMG:15,CRIT:1},ring2:{MANA:30,DODGE:1},gloves:{DEF:15,DMG:10},boots:{DEF:20,DODGE:2,HP:20}};
  for(let slot in gear){let id=gear[slot];if(MAP[id]){for(let k in MAP[id]){st[k]+=MAP[id][k];bonus[k]+=MAP[id][k];}}}
  document.getElementById('stats').innerHTML=`
<div class="stat-row"><div class="stat"><span>HP</span><span class="val">${st.HP} ${bonus.HP?`(+${bonus.HP})`:''}</span></div><div class="bar"><div class="bar-fill" style="width:${pct(st.HP,1500)}"></div></div></div>
<div class="stat-row"><div class="stat"><span>DEF</span><span class="val">${st.DEF} ${bonus.DEF?`(+${bonus.DEF})`:''}</span></div><div class="bar"><div class="bar-fill" style="width:${pct(st.DEF,300)}"></div></div></div>
<div class="stat-row"><div class="stat"><span>DMG</span><span class="val">${st.DMG} ${bonus.DMG?`(+${bonus.DMG})`:''}</span></div><div class="bar"><div class="bar-fill" style="width:${pct(st.DMG,400)}"></div></div></div>
<div class="stat-row"><div class="stat"><span>MANA</span><span class="val">${st.MANA} ${bonus.MANA?`(+${bonus.MANA})`:''}</span></div><div class="bar"><div class="bar-fill" style="width:${pct(st.MANA,400)}"></div></div></div>
<div class="stat-row"><div class="stat"><span>CRIT CHANCE</span><span class="val">${st.CRIT}% ${bonus.CRIT?`(+${bonus.CRIT}%)`:''}</span></div><div class="bar"><div class="bar-fill" style="width:${st.CRIT*3}%"></div></div></div>
<div class="stat-row"><div class="stat"><span>EVASION</span><span class="val">${st.DODGE}% ${bonus.DODGE?`(+${bonus.DODGE}%)`:''}</span></div><div class="bar"><div class="bar-fill" style="width:${st.DODGE*4}%"></div></div></div>`;
 }catch(e){
  document.getElementById('stats').innerHTML=`
<div class="stat-row"><div class="stat"><span>HP</span><span class="val">${st.HP}</span></div><div class="bar"><div class="bar-fill" style="width:${pct(st.HP,1300)}"></div></div></div>
<div class="stat-row"><div class="stat"><span>DEF</span><span class="val">${st.DEF}</span></div><div class="bar"><div class="bar-fill" style="width:${pct(st.DEF,180)}"></div></div></div>
<div class="stat-row"><div class="stat"><span>DMG</span><span class="val">${st.DMG}</span></div><div class="bar"><div class="bar-fill" style="width:${pct(st.DMG,280)}"></div></div></div>
<div class="stat-row"><div class="stat"><span>MANA</span><span class="val">${st.MANA}</span></div><div class="bar"><div class="bar-fill" style="width:${pct(st.MANA,320)}"></div></div></div>
<div class="stat-row"><div class="stat"><span>CRIT CHANCE</span><span class="val">${st.CRIT}%</span></div><div class="bar"><div class="bar-fill" style="width:${st.CRIT*3}%"></div></div></div>
<div class="stat-row"><div class="stat"><span>EVASION</span><span class="val">${st.DODGE}%</span></div><div class="bar"><div class="bar-fill" style="width:${st.DODGE*4}%"></div></div></div>`;
 }
}
let startId=localStorage.getItem('voland_hero'); if(!startId||!DB[startId]) startId='necro-f-new';
loadHero(startId);
setInterval(()=>{let cur=localStorage.getItem('voland_hero'); if(cur&&cur!==startId&&DB[cur]){startId=cur; loadHero(cur);}},300);
let inp=document.getElementById('nameIn'),btn=document.getElementById('btn');
function chk(){let v=inp.value.trim();if(v.length>=3){btn.classList.add('active');btn.textContent='CONFIRM — '+v.toUpperCase()}else{btn.classList.remove('active');btn.textContent='ENTER NAME'}}
inp.addEventListener('input',chk);chk();
btn.onclick=()=>{if(btn.classList.contains('active')){localStorage.setItem('voland_name',inp.value.trim());location.href='index.html';}};
</script>
</body>
</html>
