<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HERO SELECT - 8 HEROES</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Inter:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0a0c;color:#e6e0cc;font-family:Inter,Arial,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0}
.bg img{width:100%;height:100%;object-fit:cover}
.bg:after{content:"";position:absolute;inset:0;background:rgba(8,8,10,.82)}
.wrap{position:fixed;inset:0;display:flex;z-index:2}
.left{width:440px;min-width:440px;background:#0e0e10;border-right:1px solid #23232a;overflow-y:auto;padding:10px}
.skill{display:flex;gap:10px;background:#17171b;border:1px solid #23232a;border-radius:10px;padding:8px;margin-bottom:8px;align-items:flex-start}
.icon{width:88px;height:88px;min-width:88px;border-radius:10px;background:#1e1e22;border:1px solid #2a2a32;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:48px;flex-shrink:0;position:relative}
.icon img{width:100%;height:100%;object-fit:cover;display:block}
.icon .fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:42px;background:#1e1e22}
.sinfo{flex:1;min-width:0;padding-top:2px}
.sname{font-size:11px;font-weight:700;color:#e6d5a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:7px;background:#1e1e22;border:1px solid #2a2a32;padding:2px 4px;border-radius:3px;color:#8a8678;margin-left:4px}
.sdesc{font-size:10px;color:#9a9aa0;margin-top:4px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:28px}
.smeta{font-size:7px;color:#6a6a72;margin-top:3px}
.center{flex:1;background:#000;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative}
.center img{max-height:88vh;max-width:100%;width:auto;height:auto;object-fit:contain;object-position:bottom center;display:block}
.right{width:400px;min-width:400px;background:#121214;border-left:1px solid #23232a;overflow:auto;padding:14px;display:flex;flex-direction:column}
.hero-right{font-family:'Cinzel Decorative',serif;font-size:20px;letter-spacing:.35em;color:#e6d5a0;font-weight:900;padding-bottom:10px;border-bottom:1px solid #2a2a32;margin-bottom:12px}
.stat-row{margin-bottom:8px}
.stat{display:flex;justify-content:space-between;font-size:9px;margin-bottom:3px;letter-spacing:.1em}
.val{color:#e6d5a0;font-weight:800}
.bar{height:6px;background:#222;border-radius:3px;overflow:hidden}
.bar-fill{height:100%;background:#e6d5a0;display:block}
.stat-row.crit .bar-fill{background:#ffcc66}
.stat-row.eva .bar-fill{background:#66e0a0}
.input-box{margin-top:auto;background:#1e1e22;border:1px solid #2a2a32;padding:10px;border-radius:8px}
.input-box .label{font-size:7px;letter-spacing:.2em;color:#8a8678}
.input-box input{width:100%;margin-top:6px;background:#0e0e10;border:1px solid #3a3a42;color:#e6e0cc;padding:9px;border-radius:6px;font-size:12px}
.btn{margin-top:10px;padding:11px;border:1px solid #3a3a42;text-align:center;font-size:8px;letter-spacing:.2em;border-radius:6px;transition:.2s}
.btn.active{background:#e6d5a0;color:#121214;font-weight:800;cursor:pointer}
.close{position:fixed;top:8px;right:8px;z-index:10;width:32px;height:32px;background:rgba(0,0,0,.7);border:1px solid #2a2a32;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#e6e0cc}
</style>
</head>
<body>
<div class="bg"><img src="assets/heroes/bg-battlefield.webp"></div>
<div class="close" onclick="location.href='index.html'">✕</div>
<div class="wrap">
<div class="left" id="left"></div>
<div class="center"><img id="heroImg" src="assets/heroes/necro-f-new.webp"></div>
<div class="right">
<div class="hero-right" id="hr">AMETHYST</div>
<div id="stats"></div>
<div class="input-box"><div class="label">ENTER YOUR NAME</div><input id="nameIn" value="VOLAND 1337"></div>
<div id="btn" class="btn">CONFIRM</div>
</div>
</div>
<script>
const DB={
'necro-f-new':{n:'AMETHYST',img:'assets/heroes/necro-f-new.webp',st:{HP:1000,DEF:100,DMG:240,MANA:280,CRIT:15,EVA:12},sk:[
['Шепот Аметиста','PASSIVE','heroes/icon_shepot_ametista.jpg','🔮','Дух 100% урона +5 маны','Дух 3 раунда'],
['Проклятие Душ','1','heroes/icon_proklyatie_dush.jpg','💜','Луч света 200% + кража 5 маны + страх -15%','КД 3'],
['Аметистовая Тюрьма','2','heroes/icon_ametistovaya_tyurma.jpg','👻','Стан AOE 1р + взрыв 300%','КД 10'],
['Похищение Жизни','3','heroes/icon_pokhishchenie_zhizni.jpg','💀','30% отдача + 30% хил 4р','КД 18'],
['Аметистовый Закат','4','heroes/icon_ametistovyy_zakat.jpg','🌌','ULT 5 душ по 200% + стан','КД 25']]},
'archer-m':{n:'DARK RANGER',img:'assets/heroes/archer-m.webp',st:{HP:1020,DEF:95,DMG:230,MANA:210,CRIT:20,EVA:18},sk:[
['Метка Тени','PASSIVE','heroes/icon_metka_teni.jpg','👁️','2-я атака метка +200%','Мана 0'],
['Беглый выстрел','1','heroes/icon_begliy_vystrel.jpg','🏹','200% урона ближайшему','КД 3'],
['Шаг в Ничто','2','heroes/icon_shag_v_nichto.jpg','🌑','Инвиз 3 раунда + гарант крит след атаки','КД 20'],
['Призрачная Стрела','3','heroes/icon_prizrachnaya_strela.jpg','💫','140% + стан 33% до 3 целей','КД 5'],
['Залп Бездны','4','heroes/icon_zalp_bezdny.jpg','🌌','ULT 7x100% =700% в одну','КД 25']]}
};
// ... остальные 6 героев так же, CRIT/EVA уже добавил
let id=localStorage.getItem('voland_hero')||'necro-f-new';
let h=DB[id];
document.getElementById('hr').textContent=h.n;
document.getElementById('heroImg').src=h.img;
document.getElementById('left').innerHTML=h.sk.map(s=>`<div class="skill"><div class="icon"><img src="${s[2]}" onload="this.nextElementSibling.style.display='none'" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="fallback">${s[3]}</div></div><div class="sinfo"><div class="sname">${s[0]} <span class="badge">${s[1]}</span></div><div class="sdesc" title="${s[4]}">${s[4]}</div><div class="smeta">${s[5]}</div></div></div>`).join('');
function pct(v,m){return Math.min(100,Math.round(v/m*100))+'%'}
let st=h.st;
document.getElementById('stats').innerHTML=`
<div class="stat-row"><div class="stat"><span>HP</span><span class="val">${st.HP}</span></div><div class="bar"><div class="bar-fill" style="width:${pct(st.HP,1300)}"></div></div></div>
<div class="stat-row"><div class="stat"><span>DEF</span><span class="val">${st.DEF}</span></div><div class="bar"><div class="bar-fill" style="width:${pct(st.DEF,180)}"></div></div></div>
<div class="stat-row"><div class="stat"><span>DMG</span><span class="val">${st.DMG}</span></div><div class="bar"><div class="bar-fill" style="width:${pct(st.DMG,280)}"></div></div></div>
<div class="stat-row"><div class="stat"><span>MANA</span><span class="val">${st.MANA}</span></div><div class="bar"><div class="bar-fill" style="width:${pct(st.MANA,320)}"></div></div></div>
<div class="stat-row crit"><div class="stat"><span>CRIT CHANCE</span><span class="val">${st.CRIT}%</span></div><div class="bar"><div class="bar-fill" style="width:${st.CRIT*3}%"></div></div></div>
<div class="stat-row eva"><div class="stat"><span>EVASION</span><span class="val">${st.EVA}%</span></div><div class="bar"><div class="bar-fill" style="width:${st.EVA*4}%"></div></div></div>`;
</script>
</body>
</html>
