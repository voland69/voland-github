<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOLAND - SELECT HERO</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#080a0e;color:#d8d2b8;font-family:Inter,Arial,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0}
.bg img{width:100%;height:100%;object-fit:cover}
.bg:after{content:"";position:absolute;inset:0;background:rgba(8,10,14,.88)}
.wrap{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column}
.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;padding-right:130px;border-bottom:1px solid #1e2a32;background:rgba(14,18,24,.9)}
.top-title{font-family:'Cinzel Decorative',serif;font-size:18px;letter-spacing:.35em;color:#e6d5a0;font-weight:900}
.top-sub{font-size:8px;color:#6a7a8a;font-family:'JetBrains Mono',monospace;letter-spacing:.15em}
.main{flex:1;display:flex;overflow:hidden}
.hero-grid{width:280px;min-width:280px;background:rgba(14,18,24,.85);border-right:1px solid #1e2a32;padding:10px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;overflow:auto;align-content:start}
.hero-card{background:#151c24;border:1px solid #232f3a;border-radius:10px;padding:8px 8px 10px;cursor:pointer;transition:.2s;display:flex;flex-direction:column;align-items:center;gap:6px}
.hero-card:hover{border-color:#e6d5a0;transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.4)}
.hero-card.active{border-color:#e6d5a0;background:#1e2f3e;box-shadow:0 0 16px rgba(230,213,160,.2)}
.hero-card img{width:100%;height:110px;object-fit:cover;object-position:top center;border-radius:8px;border:1px solid #1e2a32;background:#0a0e14}
.hero-card-name{font-size:9px;font-weight:800;color:#e6d5a0;letter-spacing:.1em;text-align:center;font-family:'JetBrains Mono',monospace}
.hero-card-role{font-size:6px;color:#6a7a8a;letter-spacing:.05em;text-align:center}
.center{flex:1;display:flex;background:#1a222e;position:relative;overflow:hidden}
.left-skills{width:380px;min-width:380px;background:rgba(12,14,18,.92);border-right:1px solid #1e2a32;padding:10px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.skill{flex:0 0 auto;display:flex;gap:12px;background:#171a20;border:1px solid #232f3a;border-radius:10px;padding:10px;align-items:center}
.icon{width:64px;height:64px;min-width:64px;border-radius:8px;background:#1e252f;border:1px solid #2a3a4a;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:28px;position:relative}
.icon img{width:100%;height:100%;object-fit:cover;display:block}
.icon .fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#1e252f}
.sinfo{flex:1;min-width:0}
.sname{font-size:11px;font-weight:700;color:#e6d5a0}
.badge{font-size:7px;background:#1e2a32;border:1px solid #2a3a4a;padding:2px 4px;border-radius:3px;color:#8a9a6a;margin-left:6px}
.sdesc{font-size:10px;color:#9aa0a8;margin-top:4px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.smeta{font-size:7px;color:#6a7a8a;margin-top:4px}
.hero-view{flex:1;display:flex;align-items:center;justify-content:center;background:#1a222e;position:relative;padding:0}
.hero-view img{width:100%;height:100%;max-height:100%;max-width:100%;object-fit:cover;object-position:top center;filter:drop-shadow(0 0 24px rgba(0,0,0,.9))}
.right{width:340px;min-width:340px;background:rgba(18,22,30,.94);border-left:1px solid #1e2a32;padding:14px;display:flex;flex-direction:column;overflow:auto}
.hero-right{font-family:'Cinzel Decorative',serif;font-size:18px;letter-spacing:.3em;color:#e6d5a0;font-weight:900;padding-bottom:12px;border-bottom:1px solid #1e2a32;margin-bottom:14px}
.stat-row{margin-bottom:10px}
.stat{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.1em;margin-bottom:3px}
.val{color:#e6d5a0;font-weight:800}
.bar{height:6px;background:#0a0e14;border:1px solid #1e2a32;border-radius:3px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#8a6a1a,#d0b040)}
.input-box{margin-top:auto;background:#1a222e;border:1px solid #2a3a4a;padding:12px;border-radius:8px}
.input-box .label{font-size:7px;letter-spacing:.2em;color:#8a9a6a;font-family:'JetBrains Mono',monospace}
.input-box input{width:100%;margin-top:8px;background:#0a0e14;border:1px solid #2a3a4a;color:#e6e0cc;padding:10px;border-radius:6px;font-size:12px;font-family:'JetBrains Mono',monospace}
.btn{margin-top:12px;padding:12px;border:1px solid #3a4a5a;text-align:center;font-size:9px;letter-spacing:.2em;border-radius:6px;transition:.2s;font-family:'JetBrains Mono',monospace}
.btn.active{background:#e6d5a0;color:#121214;font-weight:800;cursor:pointer;border-color:#e6d5a0}
.btn.active:hover{box-shadow:0 0 16px rgba(230,213,160,.3)}
.btn.disabled{opacity:.4;pointer-events:none}
.close{position:fixed;top:10px;right:120px;z-index:10;width:32px;height:32px;background:rgba(0,0,0,.7);border:1px solid #2a3a4a;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#e6d5a0}
</style>
</head>
<body>
<div class="bg"><img src="./assets/heroes/bg-battlefield.webp" onerror="this.style.display='none'"></div>
<div class="close" onclick="location.href='./index.html'">✕</div>
<div class="wrap">
<div class="top">
<div class="top-title">ВЫБОР ГЕРОЯ • 8 ГЕРОЕВ</div>
<div class="top-sub">ВЫБЕРИ ГЕРОЯ • ВВЕДИ ИМЯ • ПОДТВЕРДИ → СТРАНИЦА ГЕРОЯ</div>
</div>
<div class="main">
<div class="hero-grid" id="heroGrid"></div>
<div class="center">
<div class="left-skills" id="leftSkills"></div>
<div class="hero-view"><img id="heroImg" src="./assets/heroes/necro-f-new.webp" alt="hero"></div>
</div>
<div class="right">
<div class="hero-right" id="heroRightName">AMETHYST</div>
<div id="stats"></div>
<div class="input-box">
<div class="label">ВВЕДИ СВОЁ ИМЯ (мин. 3 символа)</div>
<input id="nameIn" value="VOLAND 1337" placeholder="Твое имя...">
</div>
<div id="btn" class="btn disabled">ВВЕДИ ИМЯ ≥3 СИМВОЛА</div>
</div>
</div>
</div>
<script src="./assets/js/lang.js"></script>
<script src="./assets/js/config.js"></script>
<script src="./assets/js/db/heroes.js"></script>
<script src="./assets/js/db/tiers.js"></script>
<script src="./assets/js/db/resources.js"></script>
<script src="./assets/js/db/items.js"></script>
<script src="./assets/js/db/starter.js"></script>
<script src="./assets/js/db/locations.js"></script>
<script src="./assets/js/db/enemies.js"></script>
<script src="./assets/js/db/missions.js"></script>
<script src="./assets/js/storage.js"></script>
<script>
let selectedId = volandGetHeroId() || 'necro-f-new';
let allIds = Object.keys(VOLAND_HEROES);
if (!VOLAND_HEROES[selectedId]) selectedId = allIds[0];
function renderGrid(){
  const grid = document.getElementById('heroGrid');
  grid.innerHTML = allIds.map(id=>{
    const h = VOLAND_HEROES[id];
    const active = id===selectedId ? 'active' : '';
    return `<div class="hero-card ${active}" onclick="selectHero('${id}')">
      <img src="${h.thumb || h.img}" onerror="this.src='./assets/heroes/warrior-f.webp'">
      <div class="hero-card-name">${h.n}</div>
      <div class="hero-card-role">${h.role}</div>
    </div>`;
  }).join('');
}
function selectHero(id){
  if (!VOLAND_HEROES[id]) return;
  selectedId = id;
  renderGrid();
  loadHero(id);
}
function loadHero(id){
  const h = VOLAND_HEROES[id];
  if (!h) return;
  document.getElementById('heroRightName').textContent = h.n;
  document.getElementById('heroImg').src = h.img;
  document.getElementById('leftSkills').innerHTML = h.sk.map(s=>{
    const sName = (typeof volandSkillName==='function' ? volandSkillName(s[0]) : s[0]);
    const badge = s[1];
    const icons = s[2];
    const firstIcon = icons[0];
    const emoji = s[3] || '🔮';
    const desc = (typeof volandSkillLong==='function' ? volandSkillLong(s[0], s[4]) : s[4]);
    const meta = (typeof volandSkillShort==='function' ? volandSkillShort(s[0], s[5]) : s[5]);
    return `<div class="skill">
      <div class="icon">
        <img src="${firstIcon}" data-fallbacks='${JSON.stringify(icons.slice(1))}' data-emoji="${emoji}" loading="lazy"
          onload="this.nextElementSibling.style.display='none'"
          onerror="let fb=JSON.parse(this.dataset.fallbacks||'[]'); if(fb.length){ this.src=fb.shift(); } else { this.style.display='none'; this.nextElementSibling.style.display='flex'; }">
        <div class="fallback">${emoji}</div>
      </div>
      <div class="sinfo">
        <div class="sname">${sName} <span class="badge">${badge}</span></div>
        <div class="sdesc">${desc}</div>
        <div class="smeta">${meta}</div>
      </div>
    </div>`;
  }).join('');
  const st = h.st;
  function pct(v,m){ return Math.min(100, Math.round(v/m*100))+'%'; }
  document.getElementById('stats').innerHTML = `
    <div class="stat-row"><div class="stat"><span>HP</span><span class="val">${st.HP}</span></div><div class="bar"><div class="bar-fill" style="width:${pct(st.HP,1300)}"></div></div></div>
    <div class="stat-row"><div class="stat"><span>DEF</span><span class="val">${st.DEF}</span></div><div class="bar"><div class="bar-fill" style="width:${pct(st.DEF,180)}"></div></div></div>
    <div class="stat-row"><div class="stat"><span>DMG</span><span class="val">${st.DMG}</span></div><div class="bar"><div class="bar-fill" style="width:${pct(st.DMG,280)}"></div></div></div>
    <div class="stat-row"><div class="stat"><span>MANA</span><span class="val">${st.MANA}</span></div><div class="bar"><div class="bar-fill" style="width:${pct(st.MANA,320)}"></div></div></div>
    <div class="stat-row"><div class="stat"><span>CRIT</span><span class="val">${st.CRIT}%</span></div><div class="bar"><div class="bar-fill" style="width:${st.CRIT*4}%"></div></div></div>
    <div class="stat-row"><div class="stat"><span>${st.PARRY>0?'PARRY':'DODGE'}</span><span class="val">${st.PARRY>0?st.PARRY:st.DODGE}%</span></div><div class="bar"><div class="bar-fill" style="width:${(st.PARRY||st.DODGE)*4}%"></div></div></div>
  `;
}
let inp = document.getElementById('nameIn');
let btn = document.getElementById('btn');
let savedName = volandGetName();
if (savedName && savedName!=='VOLAND 1337') inp.value = savedName;
function chk(){
  let v = inp.value.trim();
  if (v.length>=3 && VOLAND_HEROES[selectedId]){
    btn.classList.remove('disabled');
    btn.classList.add('active');
    btn.textContent = volandT('ПОДТВЕРДИТЬ — ','CONFIRM — ') + v.toUpperCase() + ' • ' + VOLAND_HEROES[selectedId].n + volandT(' → ГЕРОЙ',' → HERO');
  } else {
    btn.classList.remove('active');
    btn.classList.add('disabled');
    btn.textContent = v.length<3 ? volandT('ВВЕДИ ИМЯ ≥3 СИМВОЛА','ENTER NAME ≥3 CHARS') : volandT('ВЫБЕРИ ГЕРОЯ','SELECT HERO');
  }
}
inp.addEventListener('input', chk);
btn.onclick = ()=>{
  if (!btn.classList.contains('active')) return;
  const name = inp.value.trim();
  if (name.length<3) return;
  try {
    let slotParam = new URLSearchParams(location.search).get('slot');
    let slot = slotParam!==null ? parseInt(slotParam) : null;
    let saves = [];
    try{ saves = JSON.parse(localStorage.getItem('voland_v1_saves')||'[]'); }catch(e){ saves=[]; }
    if(!Array.isArray(saves)) saves=[];
    saves = saves.filter(s=>s && s.hero && s.name);
    // STARTER GEAR
    let starterEquip = {};
    let starterInv = [];
    try{
      let gearIds = (typeof VOLAND_GET_STARTER_GEAR_FOR_HERO==='function') ? VOLAND_GET_STARTER_GEAR_FOR_HERO(selectedId) : (typeof VOLAND_BASE_CLOTHING_IDS!=='undefined' ? [...VOLAND_BASE_CLOTHING_IDS, 'sword-bw-lvl1','shield-bw-lvl1'] : []);
      gearIds.forEach(gid=>{
        try{
          let it = (typeof VOLAND_ITEMS!=='undefined') ? VOLAND_ITEMS.find(x=>x.id===gid) : null;
          if(it && it.slot){ starterEquip[it.slot] = gid; }
        }catch(e){}
      });
      starterInv = gearIds.map(id=>({id:id, time:Date.now()}));
    }catch(e){ starterEquip={}; starterInv=[]; }
    let baseHP = 1000, baseMANA = 200;
    try{
      let h = VOLAND_HEROES[selectedId];
      if(h && h.st){ baseHP = h.st.HP||1000; baseMANA = h.st.MANA||200; }
      for(let gid in starterEquip){
        try{
          let it = VOLAND_ITEMS.find(x=>x.id===starterEquip[gid]);
          if(it && it.bonus){
            if(it.bonus.HP) baseHP += it.bonus.HP;
            if(it.bonus.MANA) baseMANA += it.bonus.MANA;
          }
        }catch(e){}
      }
    }catch(e){}
    let now = Date.now();
    let today = new Date().toISOString().slice(0,10);
    let newSave = {
      hero: selectedId,
      name: name,
      equip: starterEquip,
      inventory: starterInv,
      created: now,
      kills:0,
      quests:0,
      quests_total:40,
      pvp:0,
      xp:0,
      gold:0,
      stat_points:0,
      resources:{},
      stamina:100,
      lastStaminaUpdate:now,
      hp_current:baseHP,
      lastHPUpdate:now,
      mana_current:baseMANA,
      lastMANAUpdate:now,
      boss_kills_data:{date:today, kills:{}},
      mission_stats:{kill_loc:{1:0,2:0,3:0}, kill_boss:0, kill_boss_diff:[], login_days:[today], ult_uses:0, win_streak:0, max_win_streak:0, collect_green:0, collect_blue:0, collect_legend:0, equip_dmg_max:0},
      missions_done:[]
    };
    // SLOT LOGIC - per-hero isolation, no global wipe
    if(slot!==null && !isNaN(slot) && slot>=0 && slot<3){
      if(slot < saves.length){
        saves[slot] = newSave;
      } else {
        // fill gaps if needed then push
        while(saves.length < slot){ saves.push(null); }
        saves[slot] = newSave;
        saves = saves.filter(s=>s);
      }
      if(saves.length>3) saves = saves.slice(0,3);
      let activeIdx = saves.findIndex(s=>s && s.created===newSave.created);
      if(activeIdx===-1) activeIdx = slot < saves.length ? slot : saves.length-1;
      localStorage.setItem('voland_v1_saves', JSON.stringify(saves));
      localStorage.setItem('voland_v1_active', String(activeIdx));
    } else {
      if(saves.length>=3){ saves.shift(); }
      saves.push(newSave);
      localStorage.setItem('voland_v1_saves', JSON.stringify(saves));
      localStorage.setItem('voland_v1_active', String(saves.length-1));
    }
    localStorage.setItem('voland_v1_hero', selectedId);
    localStorage.setItem('voland_v1_name', name);
    localStorage.setItem('voland_hero', selectedId);
    localStorage.setItem('voland_name', name);
    localStorage.setItem('voland_v1_created', String(now));
  } catch(e){
    console.error(e);
    localStorage.setItem('voland_hero', selectedId);
    localStorage.setItem('voland_name', name);
  }
  location.href = './page3.html';
};
renderGrid();
loadHero(selectedId);
try{ if(typeof volandT==='function'){ document.getElementById('nameIn').placeholder = volandT('Твое имя...','Your name...'); } }catch(e){}
chk();
</script>
</body>
</html>
