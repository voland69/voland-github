*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1a29 url('assets/heroes/bg-battlefield.webp') no-repeat fixed center top;background-size:cover;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;font-family:Inter,sans-serif}
.frame{width:100%;max-width:1320px;background:rgba(10,15,24,.92);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);display:grid;grid-template-columns:360px 1fr 360px;box-shadow:0 20px 70px rgba(0,0,0,.8);overflow:hidden}

.skills-panel{background:linear-gradient(180deg,#121214 0%,#0a0a0c 100%);border-right:1px solid rgba(255,255,255,.06);padding:16px;display:flex;flex-direction:column;gap:10px;overflow:auto;max-height:860px}
.panel-title{font-size:8px;letter-spacing:.35em;color:#8a8678;text-align:center;display:flex;align-items:center;gap:10px}
.panel-title::before,.panel-title::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.1)}
.skill-card{background:#17171b;border:1px solid #222227;border-radius:10px;padding:12px;display:flex;gap:10px;transition:.2s}
.skill-card:hover{border-color:#c9a96e;transform:translateX(2px)}
.skill-card .icon{width:44px;height:44px;background:radial-gradient(circle at 30% 30%,#2a2a32,#1e1e22);border:1px solid #2a2a32;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:inset 0 0 8px rgba(0,0,0,.5)}
.skill-card .sname{font-size:11px;font-weight:700;color:#e6e0cc}
.skill-card .badge{font-size:7px;background:#1e1e22;border:1px solid #2a2a32;padding:1px 5px;border-radius:4px;margin-left:6px;color:#8a8678}
.skill-card .sdesc{font-size:9px;color:#8b8b95;line-height:1.35;margin-top:3px}
.skill-card .smeta{font-size:7px;color:#5e5e68;margin-top:4px}
.center{position:relative;background:#0a0f18;display:flex;flex-direction:column}
.center img{width:100%;height:100%;min-height:720px;object-fit:cover;object-position:top center;display:block}
.center::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,15,24,.4) 0%,transparent 15%,transparent 85%,rgba(10,15,24,.6) 100%);pointer-events:none}
.hero-top{position:absolute;top:0;left:0;right:0;padding:14px 16px;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);display:flex;justify-content:space-between}
.hero-top h1{font-family:Cinzel,serif;font-size:18px;letter-spacing:.18em;color:#e8dcc0}
.hero-top .sub{font-size:7px;letter-spacing:.2em;color:#8a8678;margin-top:2px}
.right{background:linear-gradient(180deg,#121214 0%,#0e0e10 100%);padding:16px 18px 12px;display:flex;flex-direction:column;gap:12px;border-left:1px solid rgba(255,255,255,.06)}
.rhead{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:10px}
.close{width:24px;height:24px;border-radius:50%;border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;color:#8a8678;cursor:pointer;font-size:12px}
.namebox{background:#1a1a1a;border:1px solid #2a2a2a;padding:10px 12px}
.namebox .label{font-size:8px;letter-spacing:.25em;color:#8a8678;display:flex;justify-content:space-between;margin-bottom:6px}
.namebox input{width:100%;background:#0e0e0e;border:1px solid #2a2a2a;color:#e6e0cc;padding:8px 10px;font-size:12px;outline:none}
.stats-title{font-size:8px;letter-spacing:.35em;color:#8a8678;text-align:center;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.stats-title::before,.stats-title::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.1)}
.stat{margin-bottom:8px}
.stat-top{display:flex;justify-content:space-between;font-size:8px;letter-spacing:.2em;margin-bottom:3px}
.stat-top span:first-child{color:#8a8678} .stat-top span:last-child{color:#d9b77a}
.bar{height:2px;background:rgba(255,255,255,.08)} .bar-fill{height:100%;background:#d9b77a}
.arch{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);padding:10px 12px}

.bottom{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid rgba(255,255,255,.08)}
.bottom button{background:transparent;border:0;padding:12px;font-size:8px;letter-spacing:.25em;cursor:pointer}
