*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0a0c;color:#e6e0cc;font-family:Inter,Arial,sans-serif;overflow:hidden}

.left{width:440px;min-width:440px;background:#0e0e10;border-right:1px solid #23232a;overflow-y:auto;padding:10px}

.icon .fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:42px;background:#1e1e22}
.sinfo{flex:1;min-width:0;padding-top:2px}
.sname{font-size:11px;font-weight:700;color:#e6d5a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sdesc{font-size:10px;color:#9a9aa0;margin-top:4px;line-height:1.35;min-height:28px}
.smeta{font-size:7px;color:#6a6a72;margin-top:3px}
.center{flex:1;background:#000;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative}
.center img{max-height:88vh;max-width:100%;width:auto;height:auto;object-fit:contain;object-position:bottom center;display:block}
.right{width:400px;min-width:400px;background:#121214;border-left:1px solid #23232a;overflow:auto;padding:14px;display:flex;flex-direction:column}
.hero-right{font-family:'Cinzel Decorative',serif;font-size:20px;letter-spacing:.35em;color:#e6d5a0;font-weight:900;padding-bottom:18px;border-bottom:1px solid #2a2a32;margin-bottom:112px}
.stat-row{margin-bottom:10px}
.stat{display:flex;justify-content:space-between;font-size:9px;margin-bottom:3px;letter-spacing:.1em}
.val{color:#e6d5a0;font-weight:800}
.bar{height:6px;background:#222;border-radius:3px;overflow:hidden}

.input-box{margin-top:auto;background:#1e1e22;border:1px solid #2a2a32;padding:10px;border-radius:8px}

.btn{margin-top:10px;padding:11px;border:1px solid #3a3a42;text-align:center;font-size:8px;letter-spacing:.2em;border-radius:6px;transition:.2s}

.close{position:fixed;top:8px;right:8px;z-index:10;width:32px;height:32px;background:rgba(0,0,0,.7);border:1px solid #2a2a32;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#e6e0cc}

function loadHero(id){
 if(!DB[id]) id='necro-f-new';
 let h=DB[id];
 document.getElementById('hr').textContent=h.n;
 document.getElementById('heroImg').src=h.img;
 document.getElementById('left').innerHTML=h.sk.map(s=>{
  let icons=s[2]; let first=icons[0];
  return `<div class="skill"><div class="icon"><img src="${first}" data-fallbacks='${JSON.stringify(icons.slice(1))}' loading="lazy" onload="this.nextElementSibling.style.display='none'" onerror="let fb=JSON.parse(this.dataset.fallbacks||'[]'); if(fb.length){this.src=fb.shift(); this.dataset.fallbacks=JSON.stringify(fb);}else{this.style.display='none'; this.nextElementSibling.style.display='flex';}"><div class="fallback">${s[3]}</div></div><div class="sinfo"><div class="sname">${s[0]} <span class="badge">${s[1]}</span></div><div class="sdesc">${s[4]}</div><div class="smeta">${s[5]}</div></div></div>`;
 }).join('');
 function pct(v,m){return Math.min(100,Math.round(v/m*100))+'%'}
 let st=h.st;
 document.getElementById('stats').innerHTML=`
<div class="stat-row"><div class="stat"><span>HP</span><span class="val">${st.HP}</span></div><div class="bar"><div class="bar-fill" style="width:${pct(st.HP,1300)}"></div></div></div>
<div class="stat-row"><div class="stat"><span>DEF</span><span class="val">${st.DEF}</span></div><div class="bar"><div class="bar-fill" style="width:${pct(st.DEF,180)}"></div></div></div>
<div class="stat-row"><div class="stat"><span>DMG</span><span class="val">${st.DMG}</span></div><div class="bar"><div class="bar-fill" style="width:${pct(st.DMG,280)}"></div></div></div>
<div class="stat-row"><div class="stat"><span>MANA</span><span class="val">${st.MANA}</span></div><div class="bar"><div class="bar-fill" style="width:${pct(st.MANA,320)}"></div></div></div>
<div class="stat-row"><div class="stat"><span>CRIT CHANCE</span><span class="val">${st.CRIT}%</span></div><div class="bar"><div class="bar-fill" style="width:${st.CRIT*3}%"></div></div></div>
<div class="stat-row"><div class="stat"><span>EVASION</span><span class="val">${st.EVA}%</span></div><div class="bar"><div class="bar-fill" style="width:${st.EVA*4}%"></div></div></div>`;
}
let startId=localStorage.getItem('voland_hero'); if(!startId||!DB[startId]) startId='necro-f-new';
loadHero(startId);
setInterval(()=>{let cur=localStorage.getItem('voland_hero'); if(cur&&cur!==startId&&DB[cur]){startId=cur; loadHero(cur);}},300);
let inp=document.getElementById('nameIn'),btn=document.getElementById('btn');
function chk(){let v=inp.value.trim();if(v.length>=3){btn.classList.add('active');btn.textContent='CONFIRM — '+v.toUpperCase()}else{btn.classList.remove('active');btn.textContent='ENTER NAME'}}
inp.addEventListener('input',chk);chk();
btn.onclick=()=>{if(btn.classList.contains('active')){localStorage.setItem('voland_name',inp.value.trim());location.href='index.html';}};
</script>
