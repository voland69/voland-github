<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HERO DETAIL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0a0a0c;overflow:hidden;font-family:Inter,Arial,sans-serif;color:#e6e0cc}
.bg{position:fixed;inset:0;z-index:0}
.bg img{width:100%;height:100%;object-fit:cover;display:block}
.bg:after{content:"";position:absolute;inset:0;background:rgba(10,10,12,.72)}
.top{position:fixed;top:0;left:0;right:0;height:54px;background:rgba(18,18,20,.9);border-bottom:1px solid #23232a;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:10}
.top h1{font-size:14px;letter-spacing:.25em;color:#e8dcc0}
.left{position:fixed;left:0;top:54px;bottom:0;width:380px;background:rgba(18,18,20,.92);border-right:1px solid #23232a;overflow:auto;padding:10px;z-index:5}
.center{position:fixed;left:380px;right:360px;top:54px;bottom:0;z-index:1}
.center img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.right{position:fixed;right:0;top:54px;bottom:0;width:360px;background:rgba(23,23,27,.95);border-left:1px solid #23232a;overflow:auto;padding:14px;z-index:5}
.skill{display:flex;gap:10px;background:#17171b;border:1px solid #23232a;border-radius:10px;padding:9px;margin-bottom:8px}
.icon{width:56px;height:56px;border-radius:10px;overflow:hidden;background:#1e1e22;flex-shrink:0}
.icon img{width:100%;height:100%;object-fit:cover;display:block}
.sname{font-size:11px;font-weight:700}.badge{font-size:6px;background:#1e1e22;border:1px solid #2a2a32;padding:2px 4px;border-radius:3px;margin-left:5px;color:#8a8678}
.sdesc{font-size:9px;color:#8b8b95;margin-top:3px}.smeta{font-size:7px;color:#5e5e68;margin-top:4px}
.stat{display:flex;justify-content:space-between;margin-bottom:8px;font-size:9px}
.label{color:#8a8678;letter-spacing:.1em}.val{color:#e6d5a0;font-weight:700}
.bar{height:2px;background:rgba(255,255,255,.08);margin-top:3px}.bar-fill{height:100%;background:#e6d5a0;display:block}
.input-box{background:#2a2a2e;border:1px solid #3a3a42;padding:10px;margin-top:16px}
.input-box label{font-size:7px;letter-spacing:.2em;color:#8a8678;display:block;margin-bottom:6px}
.input-box input{width:100%;background:#0e0e10;border:1px solid #3a3a42;color:#e8dcc0;padding:9px;font-size:11px;outline:none}
.btn{margin-top:14px;padding:12px;border:1px solid #444;text-align:center;font-size:8px;letter-spacing:.25em;color:#666;cursor:not-allowed}
.btn.active{border-color:#e6d5a0;color:#e6d5a0;background:rgba(230,213,160,.12);cursor:pointer}
</style>
</head>
<body>
<div class="bg"><img src="assets/heroes/bg-battlefield.webp"></div>

document.getElementById('heroImg').src=h.img;
document.getElementById('leftSkills').innerHTML=h.skills.map(s=>`<div class="skill"><div class="icon"><img src="${s.i}"></div><div><div class="sname">${s.n} <span class="badge">${s.b}</span></div><div class="sdesc">${s.d}</div><div class="smeta">${s.m}</div></div></div>`).join('');
