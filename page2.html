<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HERO DETAIL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0a0a0c;overflow:hidden;font-family:Inter,Arial,sans-serif;color:#e6e0cc}
.bg{position:fixed;inset:0;z-index:0}.bg img{width:100%;height:100%;object-fit:cover}.bg:after{content:"";position:absolute;inset:0;background:rgba(10,10,14,.72)}
.top{position:fixed;top:0;left:0;right:0;height:58px;background:rgba(18,18,20,.96);border-bottom:1px solid #23232a;display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:10}
.top h1{font-size:16px;letter-spacing:.28em;color:#e6d5a0;font-weight:800}
.left{position:fixed;left:0;top:58px;bottom:0;width:380px;background:rgba(16,16,18,.92);border-right:1px solid #23232a;overflow:auto;padding:12px;z-index:5}
.center{position:fixed;left:380px;right:380px;top:58px;bottom:0;z-index:1;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.15)}
.center img{
  width:50%;
  height:50%;
  object-fit:contain;
  object-position:center top;
  display:block;
  /* уменьшена в 2 раза */
}
.right{position:fixed;right:0;top:58px;bottom:0;width:380px;background:rgba(20,20,24,.96);border-left:1px solid #23232a;overflow:auto;padding:16px;z-index:5}
.skill{display:flex;gap:12px;background:#17171b;border:1px solid #23232a;border-radius:12px;padding:10px;margin-bottom:10px}
.icon{width:62px;height:62px;border-radius:12px;overflow:hidden;background:#1e1e22;flex-shrink:0;border:1px solid #2a2a32}
.icon img{width:100%;height:100%;object-fit:cover;display:block}
.sname{font-size:12px;font-weight:700}.badge{font-size:7px;background:#1e1e22;border:1px solid #2a2a32;padding:2px 5px;border-radius:4px;margin-left:6px;color:#8a8678}
.sdesc{font-size:10px;color:#a0a0a8;margin-top:4px;line-height:1.35}.smeta{font-size:8px;color:#6e6e78;margin-top:5px}
.stat-row{margin-bottom:14px}.stat{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.12em;margin-bottom:4px}.label{color:#8a8678}.val{color:#e6d5a0;font-weight:800}
.bar{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#e6d5a0,#c9b896);display:block;border-radius:3px}
.input-box{background:#1e1e22;border:1px solid #2a2a32;padding:12px;margin-top:20px;border-radius:8px}.input-box label{font-size:8px;letter-spacing:.22em;color:#8a8678;display:block;margin-bottom:8px}.input-box input{width:100%;background:#0e0e10;border:1px solid #3a3a42;color:#e8dcc0;padding:11px;font-size:12px;outline:none;border-radius:6px}
.btn{margin-top:16px;padding:13px;border:1px solid #3a3a42;text-align:center;font-size:9px;letter-spacing:.28em;color:#666;cursor:not-allowed;border-radius:8px}.btn.active{border-color:#e6d5a0;color:#121214;background:#e6d5a0;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div class="bg"><img src="assets/heroes/bg-battlefield.webp"></div>
<div class="top"><h1 id="heroTitle">GRAVELORD</h1><div onclick="location.href='index.html'" style="cursor:pointer;font-size:18px">✕</div></div>
