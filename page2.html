<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HERO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0a0c;overflow:hidden;font-family:Inter,Arial,sans-serif;color:#e6e0cc}
.bg{position:fixed;inset:0;z-index:0}.bg img{width:100%;height:100%;object-fit:cover}.bg:after{content:"";position:absolute;inset:0;background:rgba(8,8,10,.78)}
.top{position:fixed;top:0;left:0;right:0;height:0;z-index:10;display:flex;justify-content:flex-end;padding:8px 12px}
.top .close{cursor:pointer;font-size:20px;color:#8a8678;background:rgba(0,0,0,.6);width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid #2a2a32}
/* 3 зоны слитно без пробелов */
.wrap{position:fixed;inset:0;top:0;display:flex;z-index:1;height:100vh}
.left{width:380px;min-width:380px;background:rgba(12,12,14,.98);border-right:1px solid #23232a;overflow:auto;padding:12px}
.center{flex:1;background:rgba(0,0,0,.4);display:flex;align-items:stretch;justify-content:center;overflow:hidden;border-right:1px solid #23232a;border-left:1px solid #23232a}
.center img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:top center;
  display:block;
}
.right{width:380px;min-width:380px;background:rgba(18,18,20,.98);overflow:auto;padding:14px;display:flex;flex-direction:column}
/* титул теперь справа над статами */
.hero-title-right{font-size:18px;letter-spacing:.32em;color:#e6d5a0;font-weight:800;margin-bottom:14px;text-align:left;border-bottom:1px solid #2a2a32;padding-bottom:10px}
/* иконки в 2 раза больше - было 56px стало 112px */
.skill{display:flex;gap:12px;background:#17171b;border:1px solid #23232a;border-radius:12px;padding:10px;margin-bottom:10px;align-items:center}
.icon{width:112px;height:112px;min-width:112px;border-radius:12px;overflow:hidden;background:#1e1e22;flex-shrink:0;border:1px solid #2a2a32}
.icon img{width:100%;height:100%;object-fit:cover;display:block}
.sname{font-size:11px;font-weight:700}.badge{font-size:7px;background:#1e1e22;border:1px solid #2a2a32;padding:2px 5px;border-radius:4px;margin-left:6px;color:#8a8678}
.sdesc{font-size:10px;color:#a0a0a8;margin-top:4px;line-height:1.35}.smeta{font-size:8px;color:#6e6e78;margin-top:4px}
.stat-row{margin-bottom:12px}.stat{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.1em;margin-bottom:4px}.val{color:#e6d5a0;font-weight:800}.bar{height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}.bar-fill{height:100%;background:#e6d5a0;display:block}
.input-box{margin-top:auto;background:#1e1e22;border:1px solid #2a2a32;padding:12px;border-radius:8px}.input-box label{font-size:7px;color:#8a8678;letter-spacing:.2em}.input-box input{width:100%;margin-top:6px;background:#0e0e10;border:1px solid #3a3a42;color:#e6e0cc;padding:10px;font-size:12px;border-radius:6px}
.btn{margin-top:12px;padding:12px;border:1px solid #3a3a42;text-align:center;font-size:8px;letter-spacing:.25em;color:#666;border-radius:8px}.btn.active{background:#e6d5a0;color:#121214;border-color:#e6d5a0;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div class="bg"><img src="assets/heroes/bg-battlefield.webp"></div>

</div>
