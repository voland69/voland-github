<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOLAND - SELECT HERO</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0a0c;color:#e6e0cc;font-family:Inter,Arial,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0}.bg img{width:100%;height:100%;object-fit:cover}.bg:after{content:"";position:absolute;inset:0;background:rgba(8,8,10,.84)}
.wrap{position:fixed;inset:0;display:flex;flex-direction:column;z-index:2}
.hero-select-bar{height:92px;background:rgba(14,20,26,.9);border-bottom:1px solid #23232a;display:flex;align-items:center;gap:10px;padding:10px 14px;overflow-x:auto}
.hero-thumb{width:72px;height:72px;min-width:72px;border-radius:10px;border:2px solid #2a2a32;overflow:hidden;cursor:pointer;transition:.2s;position:relative;background:#1a1a1e}
.hero-thumb img{width:100%;height:100%;object-fit:cover}
.hero-thumb:hover{border-color:#4a5a6a;transform:translateY(-2px)}
.hero-thumb.active{border-color:#e6d5a0;box-shadow:0 0 12px rgba(230,213,160,.3);transform:translateY(-2px)}
.hero-thumb .tname{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);font-size:6px;color:#e6d5a0;text-align:center;padding:2px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em}
.main{flex:1;display:flex;overflow:hidden}
.left{width:440px;min-width:440px;background:#0e0e10;border-right:1px solid #23232a;padding:10px;overflow-y:auto}
.skill{display:flex;gap:12px;background:#17171b;border:1px solid #23232a;border-radius:10px;padding:10px;align-items:center;margin-bottom:8px}
.icon{width:96px;height:96px;min-width:96px;border-radius:10px;background:#1e1e22;border:1px solid #2a2a32;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0;position:relative}
.icon img{width:100%;height:100%;object-fit:cover;display:block}
.icon .fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:28px;background:#1e1e22}
.sinfo{flex:1;min-width:0}
.sname{font-size:11px;font-weight:700;color:#e6d5a0}
.badge{font-size:7px;background:#1e1e22;border:1px solid #2a2a32;padding:2px 4px;border-radius:3px;color:#8a8678;margin-left:4px}
.sdesc{font-size:10px;color:#9a9aa0;margin-top:4px;line-height:1.3}
.smeta{font-size:7px;color:#6a6a72;margin-top:4px}
.center{flex:1;background:#000;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative}
.center img{max-height:80vh;max-width:94%;width:auto;height:auto;object-fit:contain;object-position:bottom center;display:block;filter: drop-shadow(0 0 20px rgba(0,0,0,.8))}
.right{width:380px;min-width:380px;background:#121214;border-left:1px solid #23232a;overflow:auto;padding:14px;display:flex;flex-direction:column}
.hero-right{font-family:'Cinzel Decorative',serif;font-size:18px;letter-spacing:.3em;color:#e6d5a0;font-weight:900;padding-bottom:14px;border-bottom:1px solid #2a2a32;margin-bottom:12px}
.stat-row{margin-bottom:8px}
.stat{display:flex;justify-content:space-between;font-size:8px;margin-bottom:3px;letter-spacing:.1em}
.val{color:#e6d5a0;font-weight:800}
.bar{height:5px;background:#222;border-radius:3px;overflow:hidden}
.bar-fill{height:100%;background:#e6d5a0;display:block}
.input-box{margin-top:auto;background:#1e1e22;border:1px solid #2a2a32;padding:10px;border-radius:8px}
.input-box .label{font-size:7px;letter-spacing:.2em;color:#8a8678}
.input-box input{width:100%;margin-top:6px;background:#0e0e10;border:1px solid #3a3a42;color:#e6e0cc;padding:9px;border-radius:6px;font-size:12px}
.btn{margin-top:10px;padding:11px;border:1px solid #3a3a42;text-align:center;font-size:8px;letter-spacing:.2em;border-radius:6px;transition:.2s}
.btn.active{background:#e6d5a0;color:#121214;font-weight:800;cursor:pointer}
.btn.active:hover{box-shadow:0 0 12px rgba(230,213,160,.3)}
.close{position:fixed;top:8px;right:8px;z-index:10;width:32px;height:32px;background:rgba(0,0,0,.7);border:1px solid #2a2a32;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#e6e0cc}
</style>
</head>
<body>
<div class="bg"><img src="./assets/heroes/bg-battlefield.webp" onerror="this.style.display='none'"></div>
<div class="close" onclick="location.href='./index.html'">✕</div>
<div class="wrap">
  <div class="hero-select-bar" id="heroBar"></div>
  <div class="main">
    <div class="left" id="left"></div>
    <div class="center"><img id="heroImg" src="./assets/heroes/mage-f-new.webp" alt="hero"></div>
    <div class="right">
      <div class="hero-right" id="hr">SELECT HERO</div>
      <div id="stats"></div>
      <div class="input-box"><div class="label">ENTER YOUR NAME (3+ chars)</div><input id="nameIn" placeholder="VOLAND 1337" value="VOLAND 1337"></div>
      <div id="btn" class="btn">SELECT HERO FIRST</div>
      <div style="margin-top:8px;font-size:6px;color:#4a5a6a;font-family:'JetBrains Mono',monospace;text-align:center">Выбери героя сверху → введи имя → SAVE → перейдешь на PAGE3 (твоя точка старта навсегда)</div>
    </div>
  </div>
</div>
<script src="./assets/js/db.js"></script>
<script src="./assets/js/storage.js"></script>
<script>
let selectedHeroId = volandGetHeroId();

function renderBar(){
  const bar = document.getElementById('heroBar');
  bar.innerHTML = Object.keys(VOLAND_HEROES).map(id=>{
    const h = VOLAND_HEROES[id];
    const active = id===selectedHeroId ? 'active' : '';
    return `<div class="hero-thumb ${active}" onclick="selectHero('${id}')" title="${h.n} - ${h.role}">
      <img src="${h.thumb}" onerror="this.style.display='none'">
      <div class="tname">${h.n}</div>
    </div>`;
  }).join('');
}

function loadHero(id){
  if (!VOLAND_HEROES[id]) id='mage-f-new';
  selectedHeroId = id;
  const h = VOLAND_HEROES[id];
  document.getElementById('hr').textContent = h.n;
  document.getElementById('heroImg').src = h.img;
  document.getElementById('left').innerHTML = h.sk.map(s=>{
    const icons = s[2];
    const first = icons[0];
    return `<div class="skill"><div class="icon"><img src="${first}" data-fallbacks='${JSON.stringify(icons.slice(1))}' loading="lazy" onload="this.nextElementSibling.style.display='none'" onerror="let fb=JSON.parse(this.dataset.fallbacks||'[]'); if(fb.length){this.src=fb.shift(); this.dataset.fallbacks=JSON.stringify(fb);}else{this.style.display='none'; this.nextElementSibling.style.display='flex';}"><div class="fallback">${s[3]}</div></div><div class="sinfo"><div class="sname">${s[0]} <span class="badge">${s[1]}</span></div><div class="sdesc">${s[4]}</div><div class="smeta">${s[5]}</div></div></div>`;
  }).join('');
  function pct(v,m){return Math.min(100,Math.round(v/m*100))+'%'}
  let st = {...h.st};
  // apply equip bonuses for preview
  try {
    const raw = volandGetEquipRaw();
    for (let slot in raw){
      const itemId = raw[slot];
      const bonus = VOLAND_ITEMS_MAP[itemId];
      if (bonus){ for (let k in bonus){ st[k]=(st[k]||0)+bonus[k]; } }
    }
  } catch(e){}
  document.getElementById('stats').innerHTML = `
    <div class="stat-row"><div class="stat"><span>HP</span><span class="val">${st.HP}</span></div><div class="bar"><div class="bar-fill" style="width:${pct(st.HP,1500)}"></div></div></div>
    <div class="stat-row"><div class="stat"><span>DEF</span><span class="val">${st.DEF}</span></div><div class="bar"><div class="bar-fill" style="width:${pct(st.DEF,300)}"></div></div></div>
    <div class="stat-row"><div class="stat"><span>DMG</span><span class="val">${st.DMG}</span></div><div class="bar"><div class="bar-fill" style="width:${pct(st.DMG,400)}"></div></div></div>
    <div class="stat-row"><div class="stat"><span>MANA</span><span class="val">${st.MANA}</span></div><div class="bar"><div class="bar-fill" style="width:${pct(st.MANA,400)}"></div></div></div>
    <div class="stat-row"><div class="stat"><span>CRIT</span><span class="val">${st.CRIT}%</span></div><div class="bar"><div class="bar-fill" style="width:${st.CRIT*3}%"></div></div></div>
    <div class="stat-row"><div class="stat"><span>DODGE</span><span class="val">${st.DODGE}%</span></div><div class="bar"><div class="bar-fill" style="width:${st.DODGE*4}%"></div></div></div>
  `;
  renderBar();
  chk();
}

function selectHero(id){
  loadHero(id);
  // превью сохраняем сразу чтобы не потерять
  try { localStorage.setItem(VOLAND_KEYS.hero, id); } catch(e){}
}

let inp=document.getElementById('nameIn');
let btn=document.getElementById('btn');
// load name
try {
  const savedName = volandGetName();
  if (savedName) inp.value = savedName;
} catch(e){}

function chk(){
  const v = inp.value.trim();
  if (v.length>=3 && selectedHeroId){
    btn.classList.add('active');
    btn.textContent = 'SAVE → PAGE3 (START) — ' + v.toUpperCase();
  } else {
    btn.classList.remove('active');
    if (!selectedHeroId) btn.textContent='SELECT HERO FIRST';
    else btn.textContent='ENTER NAME (3+ chars)';
  }
}
inp.addEventListener('input', chk);
chk();

btn.onclick=()=>{
  if (!btn.classList.contains('active')) return;
  const name = inp.value.trim();
  if (name.length<3) return;
  volandSet(VOLAND_KEYS.hero, selectedHeroId);
  volandSet(VOLAND_KEYS.name, name);
  volandSet(VOLAND_KEYS.created, String(Date.now()));
  // legacy для совместимости
  try { localStorage.setItem('voland_hero', selectedHeroId); localStorage.setItem('voland_name', name); } catch(e){}
  location.href='./page3.html';
};

loadHero(selectedHeroId);
</script>
</body>
</html>
