<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOLAND - LOCATIONS</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/nav.css">
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#0a0e14;color:#d8d2b8;font-family:Inter,Arial,sans-serif;overflow:hidden}.bg{position:fixed;inset:0;z-index:0}.bg img{width:100%;height:100%;object-fit:cover;opacity:.9}.bg:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.45)}.wrap{position:fixed;inset:0;display:flex;z-index:2}.center{flex:1;display:flex;flex-direction:column;padding:20px 16px;overflow:auto;background:rgba(16,22,30,.18);width:100%;max-width:100%}.title{font:900 34px 'Cinzel Decorative',serif;letter-spacing:.15em;color:#e6d5a0;line-height:1}.title span{display:block;font:400 10px 'JetBrains Mono',monospace;letter-spacing:.35em;color:#7a90a8;margin-top:8px}.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;max-width:100%;width:100%;margin-top:20px}.card{position:relative;background:rgba(20,26,34,.88);border:1px solid rgba(122,144,168,.22);border-radius:12px;padding:0;text-align:center;cursor:pointer;transition:.25s;overflow:hidden;min-height:260px;height:300px;display:flex;flex-direction:column}.card:hover{transform:translateY(-4px);border-color:#e6d5a0;box-shadow:0 12px 28px rgba(0,0,0,.5),0 0 16px rgba(230,213,160,.18)}.card.boss{border-color:rgba(224,80,80,.45)}.card.boss-limit{opacity:0.55;filter:grayscale(0.5)}.boss-badge{position:absolute;top:8px;right:8px;background:rgba(180,30,30,.9);color:#fff;font:900 9px 'JetBrains Mono',monospace;letter-spacing:.15em;padding:4px 7px;border-radius:4px;z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.5);border:1px solid rgba(255,100,100,.5)}.card .icon{flex:1;width:100%;height:100%;margin:0;display:flex;align-items:center;justify-content:center;position:relative;padding:0;overflow:hidden}.card .icon img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}.card .name{position:absolute;bottom:0;left:0;right:0;padding:14px 8px 10px;background:linear-gradient(transparent,rgba(0,0,0,.9));font:700 12px Inter,sans-serif;color:#e6d5a0;text-transform:uppercase;z-index:2;letter-spacing:.05em;line-height:1.3}.card .eng,.card .desc,.card .lvl,.card .track,.card .hint,.card .num{display:none}.right{width:200px;min-width:200px;background:rgba(14,20,26,.92);border-left:1px solid rgba(30,42,50,.5);display:flex;flex-direction:column}#volandLangToggle{right:212px !important;top:10px !important}@media(max-width:900px){#volandLangToggle{right:10px !important}}.chat-head{padding:12px;border-bottom:1px solid #1e2a32;display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;border-radius:50%;background:#3ad080;box-shadow:0 0 6px #3ad080}.chat-title{font-size:9px;letter-spacing:.2em;color:#6a7a8a;font-family:'JetBrains Mono',monospace}.chat-body{flex:1;padding:12px;overflow:auto;display:flex;flex-direction:column;gap:10px}.sys{font:9px 'JetBrains Mono',monospace;color:#7a90a8;background:rgba(122,144,168,.08);border-radius:6px;padding:8px;line-height:1.4}@media(max-width:900px){.stages{grid-template-columns:1fr 1fr}.right{display:none}}.main,.center,.center-col,.hero-panel{
  position:relative !important;
  z-index:1 !important;
}.wrap{
  display:flex !important;
  position:fixed !important;
  inset:0 !important;
}</style>
</head>
<body>
<div class="bg"><img id="bgImg" src="./assets/enemies/bg-desert-dark.jpg" onerror="this.src='./assets/heroes/bg-battlefield.webp'"></div>
<div class="wrap">
<div class="left-nav" id="voland-nav"></div>
<div class="center">
<div class="title" id="locTitle">ПУСТЫНЯ</div>
<div id="staminaDisplay" style="margin-top:12px;font:700 10px JetBrains Mono,monospace;color:#3ad080;text-align:center"></div><div class="stages" id="stagesGrid"></div>
</div>
<div class="right">
<div class="chat-head"><div class="dot"></div><div class="chat-title">VOLAND • COMMS</div></div>
<div class="chat-body"><div class="sys" id="chatInfo">SYS: Click card → page8 same mob • hp% from db.js</div></div>
</div>
</div>
<script src="./assets/js/lang.js"></script>
<script src="./assets/js/config.js"></script>
<script src="./assets/js/db/heroes.js"></script>
<script src="./assets/js/db/tiers.js"></script>
<script src="./assets/js/db/resources.js"></script>
<script src="./assets/js/db/items.js"></script>
<script src="./assets/js/db/starter.js"></script>
<script src="./assets/js/db/locations.js"></script>
<script src="./assets/js/db/enemies.js"></script>
<script src="./assets/js/db/missions.js"></script>
<script src="./assets/js/storage.js"></script>
<script>
const p=new URLSearchParams(location.search);
let locId=parseInt(p.get('loc')||localStorage.getItem('voland_location')||'1');
let enemies;
let locData;
try{
  if(typeof VOLAND_ENEMIES!=='undefined' && VOLAND_ENEMIES[locId]){
   enemies=VOLAND_ENEMIES[locId];
  } else if(typeof window!=='undefined' && window.VOLAND_ENEMIES && window.VOLAND_ENEMIES[locId]){
   enemies=window.VOLAND_ENEMIES[locId];
  } else {
   document.getElementById('stagesGrid').innerHTML='<div style="padding:20px;color:#e05050">Ошибка загрузки enemies.js</div>';
   enemies=[];
  }
 locData=(typeof VOLAND_LOCATIONS!=='undefined'&&VOLAND_LOCATIONS.find(l=>l.id==locId))|| (locId==6 ? {name:'РУИНЫ',eng:'RUINS',img:'./assets/enemies/bg-ruins.webp'} : locId==5 ? {name:'ВУЛКАН',eng:'VOLCANO',img:'./assets/enemies/bg-volcano.webp'} : locId==4 ? {name:'БОЛОТО',eng:'SWAMP',img:'./assets/enemies/bg-swamp.webp'} : locId==3 ? {name:'ЛЕДЯНЫЕ ЗЕМЛИ',eng:'FROSTLANDS',img:'./assets/enemies/bg-frostlands.webp'} : locId==2 ? {name:'ТЕМНЫЙ ЛЕС',eng:'DARK FOREST',img:'./assets/enemies/bg-dark-forest.webp'} : {name:'ПУСТЫНЯ',eng:'DESERT',img:'./assets/enemies/bg-desert-dark.jpg'});
}catch(e){
  document.getElementById('stagesGrid').innerHTML='<div style="padding:20px;color:#e05050">Ошибка загрузки enemies.js</div>';
  enemies=[];
 locData= locId==6 ? {name:'РУИНЫ',eng:'RUINS',img:'./assets/enemies/bg-ruins.webp'} : locId==5 ? {name:'ВУЛКАН',eng:'VOLCANO',img:'./assets/enemies/bg-volcano.webp'} : locId==4 ? {name:'БОЛОТО',eng:'SWAMP',img:'./assets/enemies/bg-swamp.webp'} : locId==3 ? {name:'ЛЕДЯНЫЕ ЗЕМЛИ',eng:'FROSTLANDS',img:'./assets/enemies/bg-frostlands.webp'} : locId==2 ? {name:'ТЕМНЫЙ ЛЕС',eng:'DARK FOREST',img:'./assets/enemies/bg-dark-forest.webp'} : {name:'ПУСТЫНЯ',eng:'DESERT',img:'./assets/enemies/bg-desert-dark.jpg'};
}
document.getElementById('locTitle').innerHTML=(volandGetLang()==='en' ? locData.eng : locData.name);
try{
 let bgEl=document.getElementById('bgImg');
 if(bgEl){
  let bgSrc = locData.img || (locId==6 ? './assets/enemies/bg-ruins.webp' : locId==5 ? './assets/enemies/bg-volcano.webp' : locId==4 ? './assets/enemies/bg-swamp.webp' : locId==3 ? './assets/enemies/bg-frostlands.webp' : locId==2 ? './assets/enemies/bg-dark-forest.webp' : './assets/enemies/bg-desert-dark.jpg');
  bgEl.src=bgSrc;
 }
}catch(e){}
function startBattle(stage){
 try{
  // BOSS DAILY LIMIT 10 per boss per day
  let isBossStage = (parseInt(stage)===4);
  if(isBossStage){
    try{
      if(typeof volandCanFightBoss==='function' && !volandCanFightBoss(locId)){
        let info = typeof volandGetBossLimitInfo==='function' ? volandGetBossLimitInfo(locId) : {kills:10, limit:10};
        let tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1); tomorrow.setHours(0,0,0,0);
        let now = new Date(); let diff = tomorrow - now;
        let hours = Math.floor(diff/1000/60/60); let mins = Math.floor((diff/1000/60)%60);
        alert(`Лимит боссов на сегодня! Ты уже убил ${info.kills}/${info.limit} боссов этой локи.\nПриходи завтра через ${hours}ч ${mins}м.\nСброс в полночь.`);
        try{ updateStaminaDisplay(); }catch(e){}
        return;
      }
    }catch(e){}
  }
  // STAMINA CHECK 1,2,3,5 / 3,4,5,10 / 5,6,7,15
  let cost = 1;
  try{
    if(typeof volandGetStaminaCost==='function'){
      cost = volandGetStaminaCost(locId, stage);
    } else if(window.VOLAND_STAMINA_COSTS && VOLAND_STAMINA_COSTS[locId] && VOLAND_STAMINA_COSTS[locId][stage]){
      cost = VOLAND_STAMINA_COSTS[locId][stage];
    }
  }catch(e){ cost = 1; }
  let curStam = 100;
  try{
    if(typeof volandGetStamina==='function') curStam = volandGetStamina();
  }catch(e){}
  if(curStam < cost){
    let info = '';
    try{
      let sinfo = volandGetStaminaInfo();
      let mins = Math.ceil(sinfo.toNext/1000/60);
      if(sinfo.toNext>0) info = ` • реген через ${mins} мин`;
    }catch(e){}
    alert('Недостаточно STAMINA! Нужно '+cost+', есть '+curStam+'.'+info+'\nПодожди реген: 2 стамины за 3 минуты (40/час)');
    try{ updateStaminaDisplay(); }catch(e){}
    return;
  }
  try{
    if(typeof volandSpendStamina==='function'){
      if(!volandSpendStamina(cost)){
        alert('Недостаточно STAMINA!');
        return;
      }
    }
  }catch(e){}
  localStorage.setItem('voland_location',String(locId));
  localStorage.setItem('voland_last_stage',String(stage));
  localStorage.setItem('voland_battle',JSON.stringify({loc:locId,stage:stage, staminaCost:cost}));
 }catch(e){}
 location.href='./page8.html?loc='+locId+'&stage='+stage;
}
document.getElementById('stagesGrid').innerHTML=enemies.map(e=>{
 let staminaCost = 1;
 try{
   if(typeof volandGetStaminaCost==='function') staminaCost = volandGetStaminaCost(locId, e.stage);
   else if(window.VOLAND_STAMINA_COSTS && VOLAND_STAMINA_COSTS[locId]) staminaCost = VOLAND_STAMINA_COSTS[locId][e.stage]||1;
 }catch(e){}
 let isBoss = !!e.boss;
 let bossInfo = {kills:0, limit:10, left:10, canFight:true};
 try{
   if(isBoss && typeof volandGetBossLimitInfo==='function'){
     bossInfo = volandGetBossLimitInfo(locId);
   }
 }catch(err){}
 let rs = e;
 let iconHtml = e.img ? `<img src="${e.img}" alt="${volandEnemyName(e)}" onerror="this.parentNode.innerHTML='${e.icon}'">` : `<div style="font-size:48px">${e.icon}</div>`;
 let staminaBadge = `<div class="boss-badge" style="background:rgba(30,60,30,.92);border:1px solid #3ad080;color:#3ad080;box-shadow:0 2px 8px rgba(0,0,0,.5)">${staminaCost} STAM</div>`;
 let bossCounterBadge = '';
 if(isBoss){
   let kills = bossInfo.kills;
   let limit = bossInfo.limit;
   let color = kills>=limit ? '#e05050' : kills>=7 ? '#d0b040' : '#3ad080';
   let bg = kills>=limit ? 'rgba(180,30,30,.92)' : 'rgba(20,26,34,.88)';
   let border = kills>=limit ? 'rgba(224,80,80,.8)' : color;
   bossCounterBadge = `<div class="boss-badge" style="top:8px;right:8px;background:${bg};border-color:${border};color:${kills>=limit?'#fff':color}">${kills}/${limit} ${volandT('БОСС', 'BOSS')}</div>`;
 }
 return `
 <div class="card ${e.boss?'boss':''} ${isBoss && !bossInfo.canFight ? 'boss-limit' : ''}" onclick="startBattle(${e.stage})" style="${isBoss && !bossInfo.canFight ? 'opacity:0.55;filter:grayscale(0.5)' : ''}">
  ${isBoss ? bossCounterBadge : staminaBadge}
  ${isBoss ? `<div class="boss-badge" style="top:36px;right:8px;background:rgba(30,60,30,.92);border:1px solid #3ad080;color:#3ad080">${staminaCost} STAM</div>` : ''}
  <div class="icon">${iconHtml}</div>
  <div class="name">${volandEnemyName(e)}<span style="display:block;margin-top:4px;font:400 8px 'JetBrains Mono',monospace;color:#8ab0d0;letter-spacing:.1em">HP ${rs.hp} • DEF ${rs.def} • DMG ${rs.dmg}</span></div>
 </div>
`;
}).join('');
</script>
<script src="./assets/js/nav.js"></script>
</body>
</html>
