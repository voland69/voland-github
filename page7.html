<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOLAND - LOCATIONS</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0e14;color:#d8d2b8;font-family:Inter,Arial,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0}.bg img{width:100%;height:100%;object-fit:cover;opacity:.9}
.bg:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.45)}
.wrap{position:fixed;inset:0;display:flex;z-index:2}
.left-nav{width:68px;min-width:68px;background:rgba(18,24,30,.35);border-right:1px solid rgba(30,42,50,.5);display:flex;flex-direction:column;align-items:center;padding:12px 6px;gap:18px}
.nav-item{width:48px;height:48px;background:#1a252f;border:1px solid #2a3a4a;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;opacity:.6;transition:.2s}
.nav-item.active{background:#1e2f3e;border-color:#e6d5a0;opacity:1}
.nav-label{font-size:7px;letter-spacing:.15em;color:#6a7a8a;margin-top:4px;text-align:center;font-family:'JetBrains Mono',monospace}
.center{flex:1;display:flex;flex-direction:column;padding:28px 32px;overflow:auto;background:rgba(16,22,30,.18)}
.title{font:900 34px 'Cinzel Decorative',serif;letter-spacing:.15em;color:#e6d5a0;line-height:1}
.title span{display:block;font:400 10px 'JetBrains Mono',monospace;letter-spacing:.35em;color:#7a90a8;margin-top:8px}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;max-width:1100px;margin-top:28px}
.card{position:relative;background:rgba(20,26,34,.88);border:1px solid rgba(122,144,168,.22);border-radius:12px;padding:0;text-align:center;cursor:pointer;transition:.25s;overflow:hidden;min-height:320px;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);border-color:#e6d5a0;box-shadow:0 12px 28px rgba(0,0,0,.5),0 0 16px rgba(230,213,160,.18)}
.card.boss{border-color:rgba(224,80,80,.45)}
.card .icon{flex:1;width:100%;height:100%;margin:0;display:flex;align-items:center;justify-content:center;position:relative}
.card .icon img{width:100%;height:100%;object-fit:cover;display:block}
.card .name{position:absolute;bottom:0;left:0;right:0;padding:14px 8px 10px;background:linear-gradient(transparent,rgba(0,0,0,.9));font:700 12px Inter,sans-serif;color:#e6d5a0;text-transform:uppercase;z-index:2;letter-spacing:.05em;line-height:1.3}
.card .eng,.card .desc,.card .lvl,.card .track,.card .hint,.card .num{display:none}

.right{width:200px;min-width:200px;background:rgba(14,20,26,.92);border-left:1px solid rgba(30,42,50,.5);display:flex;flex-direction:column}
.chat-head{padding:12px;border-bottom:1px solid #1e2a32;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#3ad080;box-shadow:0 0 6px #3ad080}
.chat-title{font-size:9px;letter-spacing:.2em;color:#6a7a8a;font-family:'JetBrains Mono',monospace}
.chat-body{flex:1;padding:12px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.sys{font:9px 'JetBrains Mono',monospace;color:#7a90a8;background:rgba(122,144,168,.08);border-radius:6px;padding:8px;line-height:1.4}
@media(max-width:900px){.stages{grid-template-columns:1fr 1fr}.right{display:none}}
</style>
</head>
<body>
<div class="bg"><img id="bgImg" src="./assets/enemies/bg-desert-dark.jpg" onerror="this.src='./assets/heroes/bg-battlefield.webp'"></div>
<div class="wrap">
<div class="left-nav">
<div onclick="location.href='./page3.html'"><div class="nav-item">👤</div><div class="nav-label">HERO</div></div>
<div onclick="location.href='./page4.html'"><div class="nav-item">🎒</div><div class="nav-label">BAG</div></div>
<div onclick="location.href='./page5.html'"><div class="nav-item">📜</div><div class="nav-label">SKILLS</div></div>
<div onclick="location.href='./page6.html'"><div class="nav-item active">⚔️</div><div class="nav-label">BATTLE</div></div>
</div>
<div class="center">
<div class="title" id="locTitle">ПУСТЫНЯ<span id="locSub">DESERT • 4 STAGES</span></div>
<div class="stages" id="stagesGrid"></div>
</div>
<div class="right">
<div class="chat-head"><div class="dot"></div><div class="chat-title">VOLAND • COMMS</div></div>
<div class="chat-body"><div class="sys" id="chatInfo">SYS: Click card → page8 same mob • hp% from db.js</div></div>
</div>
</div>
<script src="./assets/js/db.js"></script>
<script src="./assets/js/storage.js"></script>
<script>
const p=new URLSearchParams(location.search);
let locId=parseInt(p.get('loc')||localStorage.getItem('voland_location')||'1');
let enemies=(window.VOLAND_ENEMIES&&VOLAND_ENEMIES[locId])?VOLAND_ENEMIES[locId]:VOLAND_ENEMIES[1];
let locData=(window.VOLAND_LOCATIONS&&VOLAND_LOCATIONS.find(l=>l.id==locId))||{name:'ПУСТЫНЯ',eng:'DESERT'};
document.getElementById('locTitle').innerHTML=locData.name+'<span id="locSub">'+locData.eng+' • '+enemies.length+' STAGES • CLICK TO FIGHT</span>';
try{
 let bgEl=document.getElementById('bgImg');
 if(bgEl){
  let bgSrc = locData.img || (locId==2 ? './assets/enemies/bg-dark-forest.webp' : './assets/enemies/bg-desert-dark.jpg');
  bgEl.src=bgSrc;
 }
}catch(e){}


function startBattle(stage){
 try{
  localStorage.setItem('voland_location',String(locId));
  localStorage.setItem('voland_last_stage',String(stage));
  localStorage.setItem('voland_battle',JSON.stringify({loc:locId,stage:stage}));
 }catch(e){}
 location.href='./page8.html?loc='+locId+'&stage='+stage;
}

const REAL_STATS = {
 1:{1:{hp:4000,def:100,dmg:150},2:{hp:3000,def:200,dmg:150},3:{hp:4000,def:150,dmg:200},4:{hp:6000,def:200,dmg:250}},
 2:{1:{hp:5000,def:150,dmg:250},2:{hp:5000,def:150,dmg:300},3:{hp:7000,def:300,dmg:250},4:{hp:10000,def:350,dmg:300}}
};
document.getElementById('stagesGrid').innerHTML=enemies.map(e=>{
 let rs = (REAL_STATS[locId] && REAL_STATS[locId][e.stage]) || (REAL_STATS[1] && REAL_STATS[1][e.stage]) || {hp:2000,def:100,dmg:150};
 let iconHtml = e.img ? `<img src="${e.img}" alt="${e.name}">` : `<div style="font-size:48px">${e.icon}</div>`;
 return `
 <div class="card ${e.boss?'boss':''}" onclick="startBattle(${e.stage})">
  <div class="icon">${iconHtml}</div>
  <div class="name">${e.name}<span style="display:block;margin-top:4px;font:400 8px 'JetBrains Mono',monospace;color:#8ab0d0;letter-spacing:.1em">HP ${rs.hp} • DEF ${rs.def} • DMG ${rs.dmg}</span></div>
 </div>
`;
}).join('');

// подсветка LOC1 STAGE4 для проверки синхронизации
try{
 if(locId==1){
  const el=document.querySelectorAll('.card')[3];
  if(el){ el.style.outline='1px solid #e6d5a0'; }
 }
}catch(e){}
</script>
</body>
</html>
