<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOLAND - WORKSHOP</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0e14;color:#d8d2b8;font-family:Inter,Arial,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0;background:url("./assets/heroes/bg-battlefield.webp") center/cover no-repeat fixed}
.bg:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.6)}
.wrap{position:fixed;inset:0;display:flex;z-index:2}
.left-nav{width:68px;min-width:68px;background:rgba(18,24,30,.9);border-right:1px solid #2a3a4a;display:flex;flex-direction:column;justify-content:space-between;height:100%;padding:12px 6px;backdrop-filter:blur(4px)}
.nav-top{display:flex;flex-direction:column;gap:14px;align-items:center;overflow:auto}
.nav-bottom{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center}
.nav-group{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:.2s}
.nav-item{width:48px;height:48px;background:#1a252f;border:1px solid #2a3a4a;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;opacity:.6;transition:.2s}
.nav-item.active{border-color:#e6d5a0;opacity:1;background:#1e2f3e;box-shadow:0 0 12px rgba(230,213,160,.3)}
.nav-item img{width:28px;height:28px;object-fit:contain;display:block}
.nav-item:hover{opacity:1;border-color:#e6d5a0}
.nav-label{font-size:7px;color:#6a7a8a;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-align:center}
.nav-group.active .nav-label{color:#e6d5a0}
.center{flex:1;padding:24px;overflow:auto;display:flex;flex-direction:column;align-items:center;background:rgba(16,22,30,.18)}
.page-title{font:900 32px 'Cinzel Decorative',serif;color:#e6d5a0;letter-spacing:.15em;text-align:center}
.page-sub{margin-top:8px;font:400 9px 'JetBrains Mono',monospace;letter-spacing:.35em;color:#7a90a8;text-transform:uppercase;text-align:center}
.placeholder-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;width:100%;max-width:1100px;margin-top:28px}
.ph-card{background:rgba(20,26,34,.88);border:1px solid rgba(122,144,168,.22);border-radius:12px;padding:22px;text-align:center;backdrop-filter:blur(8px);transition:.2s}
.ph-card:hover{border-color:#e6d5a0;transform:translateY(-2px)}
.ph-icon{font-size:36px;margin-bottom:12px}
.ph-name{font:700 13px Inter,sans-serif;letter-spacing:.08em;color:#e6d5a0;text-transform:uppercase}
.ph-desc{margin-top:8px;font:400 10px 'JetBrains Mono',monospace;color:#8a9aaa;line-height:1.5}
.ph-badge{margin-top:14px;display:inline-block;font:900 10px 'JetBrains Mono',monospace;letter-spacing:.25em;color:#5a6e80;border:1px solid #3a4a5a;border-radius:6px;padding:5px 10px;background:rgba(0,0,0,.2)}

</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
<div class="left-nav">
  <div class="nav-top">
    <div class="nav-group " onclick="location.href='./page3.html'"><div class="nav-item " data-page="page3"><img src="./assets/ui/nav/hero.webp" alt="HERO" style="width:28px;height:28px;object-fit:contain;display:block"></div><div class="nav-label">HERO</div></div>
    <div class="nav-group " onclick="location.href='./page4.html'"><div class="nav-item " data-page="page4"><img src="./assets/ui/nav/bag.webp" alt="BAG" style="width:28px;height:28px;object-fit:contain;display:block"></div><div class="nav-label">BAG</div></div>
    <div class="nav-group " onclick="location.href='./page5.html'"><div class="nav-item " data-page="page5"><img src="./assets/ui/nav/skills.webp" alt="SKILLS" style="width:28px;height:28px;object-fit:contain;display:block"></div><div class="nav-label">SKILLS</div></div>
    <div class="nav-group " onclick="location.href='./page6.html'"><div class="nav-item " data-page="page6"><img src="./assets/ui/nav/battle.webp" alt="BATTLE" style="width:28px;height:28px;object-fit:contain;display:block"></div><div class="nav-label">BATTLE</div></div>
    <div class="nav-group " onclick="location.href='./page9.html'"><div class="nav-item " data-page="page9"><img src="./assets/ui/nav/missions.webp" alt="MISSIONS" style="width:28px;height:28px;object-fit:contain;display:block"></div><div class="nav-label">MISSIONS</div></div>
    <div class="nav-group " onclick="location.href='./page10.html'"><div class="nav-item " data-page="page10"><img src="./assets/ui/nav/market.webp" alt="MARKET" style="width:28px;height:28px;object-fit:contain;display:block"></div><div class="nav-label">MARKET</div></div>
    <div class="nav-group " onclick="location.href='./page11.html'"><div class="nav-item " data-page="page11"><img src="./assets/ui/nav/pvp.webp" alt="PVP" style="width:28px;height:28px;object-fit:contain;display:block"></div><div class="nav-label">PVP</div></div>
    <div class="nav-group active" onclick="location.href='./page12.html'"><div class="nav-item active" data-page="page12"><img src="./assets/ui/nav/workshop.webp" alt="WORKSHOP" style="width:28px;height:28px;object-fit:contain;display:block"></div><div class="nav-label">WORKSHOP</div></div>
    <div class="nav-group " onclick="location.href='./page13.html'"><div class="nav-item " data-page="page13"><img src="./assets/ui/nav/pass.webp" alt="PASS" style="width:28px;height:28px;object-fit:contain;display:block"></div><div class="nav-label">PASS</div></div>
  </div>
  <div class="nav-bottom">
    <div class="nav-group" onclick="location.href='./index.html'"><div class="nav-item" data-page="index"><img src="./assets/ui/nav/start.webp" alt="START" style="width:28px;height:28px;object-fit:contain;display:block"></div><div class="nav-label">START</div></div>
  </div>
</div>
  </div>
</div>
<div class="center">
<div class="page-title">WORKSHOP</div>
<div class="page-sub">VOLAND • CRAFT & UPGRADE • COMING SOON</div>

<div class="placeholder-grid">
  <div class="ph-card"><div class="ph-icon">🔨</div><div class="ph-name">CRAFT</div><div class="ph-desc">Создание предметов • Рецепты<br>Жду твоих рецептов</div><div class="ph-badge">SOON</div></div>
  <div class="ph-card"><div class="ph-icon">⚒️</div><div class="ph-name">UPGRADE</div><div class="ph-desc">Улучшение гира • Уровни<br>Без выдуманных статов</div><div class="ph-badge">SOON</div></div>
  <div class="ph-card"><div class="ph-icon">🧪</div><div class="ph-name">ENCHANT</div><div class="ph-desc">Зачарование • Руны<br>Данные — позже</div><div class="ph-badge">SOON</div></div>
</div>

</div>
</div>
<script src="./assets/js/db.js"></script>
<script src="./assets/js/storage.js"></script>
<script>
// active nav highlight fallback
let path=location.pathname.toLowerCase();
document.querySelectorAll('.nav-item').forEach(el=>{
  let pg=el.dataset.page;
  if(pg && path.includes(pg)){
    el.classList.add('active');
    el.closest('.nav-group')?.classList.add('active');
  }
});
</script>
</body>
</html>
