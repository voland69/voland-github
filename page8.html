<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOLAND - BATTLE</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0e14;color:#d8d2b8;font-family:Inter,Arial,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0}.bg img{width:100%;height:100%;object-fit:cover;opacity:1}
.bg:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.55)}
.wrap{position:fixed;inset:0;display:flex;z-index:2}
.left-nav{width:68px;min-width:68px;background:rgba(18,24,30,.45);border-right:1px solid rgba(30,42,50,.6);display:flex;flex-direction:column;align-items:center;padding:12px 6px;gap:18px;backdrop-filter:blur(3px)}
.nav-item{width:48px;height:48px;background:#1a252f;border:1px solid #2a3a4a;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0.6;transition:.2s;font-size:20px}
.nav-item.active{background:#1e2f3e;border-color:#e6d5a0;opacity:1;box-shadow:0 0 12px rgba(230,213,160,.25)}
.nav-label{font-size:7px;letter-spacing:.15em;color:#6a7a8a;margin-top:4px;text-align:center;font-family:'JetBrains Mono',monospace}
.center{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.top-head{padding:16px 22px;display:flex;align-items:center;justify-content:space-between;background:rgba(16,22,30,.35);border-bottom:1px solid rgba(30,42,50,.4);backdrop-filter:blur(2px)}
.head-title{font-family:'Cinzel Decorative',serif;font-size:18px;letter-spacing:.2em;color:#e6d5a0;font-weight:900}
.head-sub{margin-left:14px;font-size:9px;letter-spacing:.25em;color:#6a7a8a;font-family:'JetBrains Mono',monospace}
.arena{flex:1;display:flex;align-items:center;justify-content:center;gap:32px;padding:24px;position:relative}
.card{width:340px;background:rgba(18,24,33,.88);border:1px solid rgba(50,60,75,.6);border-radius:14px;padding:18px 16px;display:flex;flex-direction:column;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,.5);backdrop-filter:blur(4px)}
.card.hero{border-color:rgba(230,213,160,.25)}
.card.enemy{border-color:rgba(80,90,110,.4)}
.card-icon{width:92px;height:92px;border-radius:12px;background:#0a0e14;border:1px solid #2a3a4a;display:flex;align-items:center;justify-content:center;font-size:44px;overflow:hidden}
.card-icon img{width:100%;height:100%;object-fit:cover}
.card-name{margin-top:12px;font-family:'Cinzel Decorative',serif;font-size:12px;letter-spacing:.15em;color:#e6d5a0;text-align:center}
.card-role{margin-top:4px;font-size:8px;letter-spacing:.2em;color:#6a7a8a;font-family:'JetBrains Mono',monospace;text-transform:uppercase}
.bar-wrap{width:100%;margin-top:12px;display:flex;flex-direction:column;gap:6px}
.bar-track{height:22px;background:#070a0e;border-radius:6px;overflow:hidden;border:1px solid #1e2a32;position:relative}
.bar-fill{height:100%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;font-family:'JetBrains Mono',monospace;transition:width .4s ease}
.bar-fill.hp{background:linear-gradient(90deg,#b33030,#e05050);color:#fff}
.bar-fill.enemy-hp{background:linear-gradient(90deg,#0f1418,#1a242f);color:#e6d5a0;border:1px solid #2a3a4a}
.bar-fill.stats{background:linear-gradient(90deg,#1e2a3a,#2a3a50);color:#8ab0d0}
.vs{font-family:'Cinzel Decorative',serif;font-size:28px;color:#e6d5a0;opacity:.7;letter-spacing:.1em;text-shadow:0 0 20px rgba(230,213,160,.3)}
.log-zone{height:148px;background:rgba(10,14,20,.85);border-top:1px solid rgba(30,42,50,.5);padding:10px 14px;overflow:auto;font-family:'JetBrains Mono',monospace;font-size:10px;line-height:1.5;color:#7a8a9a}
.log-line{margin-bottom:2px}
.log-line.hit{color:#d8d2b8}
.log-line.enemy-hit{color:#ff8a8a}
.log-line.win{color:#3ad080;font-weight:700}
.log-line.lose{color:#e05050;font-weight:700}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.modal-overlay.show{display:flex}
.modal{width:420px;background:linear-gradient(180deg,#1a2330,#121a24);border:1px solid rgba(230,213,160,.2);border-radius:18px;padding:26px 22px 18px;text-align:center;box-shadow:0 20px 80px rgba(0,0,0,.7),0 0 30px rgba(230,213,160,.15)}
.trophy{font-size:38px;filter:drop-shadow(0 0 12px rgba(230,213,160,.4))}
.modal-title{margin-top:10px;font-family:'Cinzel Decorative',serif;font-size:22px;letter-spacing:.25em;color:#e6d5a0;font-weight:900}
.modal-sub{margin-top:8px;font-size:10px;letter-spacing:.15em;color:#7a8a8a;font-family:'JetBrains Mono',monospace}
.rewards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:18px}
.reward{background:#0f1620;border:1px solid #1e2a32;border-radius:10px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.reward-icon{font-size:20px}
.reward-val{font-size:14px;font-weight:900;font-family:'JetBrains Mono',monospace;color:#e6d5a0}
.reward-val.gold{color:#d0b040}
.reward-val.xp{color:#6ab0ff}
.reward-lbl{font-size:7px;letter-spacing:.15em;color:#5a6a7a;font-family:'JetBrains Mono',monospace}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;height:40px;border-radius:10px;border:1px solid #2a3a4a;background:#1a242f;color:#8a9a8a;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.15em;cursor:pointer;transition:.2s}
.btn:hover{border-color:#e6d5a0;color:#e6d5a0}
.btn.gold{background:linear-gradient(180deg,#e6d5a0,#c0a860);color:#0a0e14;border-color:#e6d5a0;font-weight:800}
.btn.gold:hover{box-shadow:0 0 18px rgba(230,213,160,.4)}
</style>
</head>
<body>
<div class="bg"><img src="./assets/heroes/bg-battlefield.webp" onerror="this.style.display='none'"></div>
<div class="wrap">
  <div class="left-nav">
    <div onclick="location.href='./page3.html'"><div class="nav-item">👤</div><div class="nav-label">HERO</div></div>
    <div onclick="location.href='./page4.html'"><div class="nav-item">🎒</div><div class="nav-label">BAG</div></div>
    <div onclick="location.href='./page5.html'"><div class="nav-item">📜</div><div class="nav-label">SKILLS</div></div>
    <div onclick="location.href='./page6.html'"><div class="nav-item active">⚔️</div><div class="nav-label">BATTLE</div></div>
    <div onclick="location.href='./index.html'"><div class="nav-item">🗺️</div><div class="nav-label">MAP</div></div>
  </div>
  <div class="center">
    <div class="top-head">
      <div style="display:flex;align-items:center">
        <div class="head-title" id="locTitle">ПУСТЫНЯ</div>
        <div class="head-sub" id="stageTitle">STAGE 1 • ПЕСЧАНАЯ МЫШЬ</div>
      </div>
    </div>
    <div class="arena">
      <div class="card hero">
        <div class="card-icon" id="heroIcon">🦁</div>
        <div class="card-name" id="heroName">VOLAND 1337</div>
        <div class="card-role" id="heroRole">LION WARDEN</div>
        <div class="bar-wrap">
          <div class="bar-track"><div class="bar-fill hp" id="heroHpBar" style="width:100%">HP 1400</div></div>
          <div class="bar-track"><div class="bar-fill stats" id="heroStatBar" style="width:100%">DEF 210 • DMG 180</div></div>
        </div>
      </div>
      <div class="vs">VS</div>
      <div class="card enemy">
        <div class="card-icon" id="enemyIcon">🐭</div>
        <div class="card-name" id="enemyName">ПЕСЧАНАЯ МЫШЬ</div>
        <div class="card-role" id="enemyEng">Sand Gerbil</div>
        <div class="bar-wrap">
          <div class="bar-track"><div class="bar-fill enemy-hp" id="enemyHpBar" style="width:100%">HP 500</div></div>
          <div class="bar-track"><div class="bar-fill stats" id="enemyStatBar" style="width:100%">DEF 10 • DMG 50</div></div>
        </div>
        <div style="margin-top:8px;font-size:8px;color:#5a6a7a;font-family:'JetBrains Mono',monospace;text-align:center" id="enemyDesc">Безобидный грызун</div>
      </div>
    </div>
    <div class="log-zone" id="logZone"></div>
  </div>
</div>

<div class="modal-overlay" id="victoryModal">
  <div class="modal">
    <div class="trophy">🏆</div>
    <div class="modal-title" id="modalTitle">ПОБЕДА!</div>
    <div class="modal-sub" id="modalSub">Ты победил в битве • ПЕСЧАНАЯ МЫШЬ</div>
    <div class="rewards">
      <div class="reward"><div class="reward-icon">🪙</div><div class="reward-val gold" id="rewGold">+190</div><div class="reward-lbl">GOLD</div></div>
      <div class="reward"><div class="reward-icon">⭐</div><div class="reward-val xp" id="rewXp">+4200</div><div class="reward-lbl">XP</div></div>
      <div class="reward"><div class="reward-icon">📦</div><div class="reward-val" id="rewLoot">1</div><div class="reward-lbl">LOOT</div></div>
    </div>
    <div class="modal-btns">
      <button class="btn" onclick="fightAgain()">✕ БИТЬ СНОВА</button>
      <button class="btn gold" onclick="goToMobs()">✓ К МОБАМ</button>
    </div>
  </div>
</div>

<script src="./assets/js/db.js"></script>
<script src="./assets/js/storage.js"></script>
<script>
if (!volandHasSave()){ location.href='./page2.html'; }
function getParams(){
  const p = new URLSearchParams(location.search);
  return { loc: parseInt(p.get('loc')||'1'), stage: parseInt(p.get('stage')||'1') };
}
const {loc, stage} = getParams();
let heroId = volandGetHeroId();
if(!VOLAND_HEROES[heroId]) heroId='warrior-m';
const heroData = VOLAND_HEROES[heroId];
const calc = volandCalcStats();
const cur = calc.cur;
const profileName = volandGetName();
document.getElementById('heroIcon').innerHTML = `<img src="${heroData.img}" onerror="this.parentNode.textContent='🦁'">`;
document.getElementById('heroName').textContent = profileName.toUpperCase();
document.getElementById('heroRole').textContent = heroData.n;
let enemies = VOLAND_ENEMIES[loc] || VOLAND_ENEMIES[1];
let enemyData = enemies.find(e=>e.stage===stage) || enemies[0];
let locData = VOLAND_LOCATIONS.find(l=>l.id===loc) || VOLAND_LOCATIONS[0];
document.getElementById('locTitle').textContent = locData.name;
document.getElementById('stageTitle').textContent = `STAGE ${stage} • ${enemyData.name}`;
document.getElementById('enemyIcon').textContent = enemyData.icon;
document.getElementById('enemyName').textContent = enemyData.name;
document.getElementById('enemyEng').textContent = enemyData.eng;
document.getElementById('enemyDesc').textContent = enemyData.desc;
const eDef = 10 * stage + (loc-1)*5;
const eDmg = 30 + 20*stage + (loc-1)*10;
const eMaxHp = 400 + stage*100 + (loc-1)*150;
let eHp = eMaxHp;
let hHp = cur.HP;
let hMax = cur.HP;
function updBars(){
  document.getElementById('heroHpBar').style.width = Math.max(0, hHp / hMax * 100) + '%';
  document.getElementById('heroHpBar').textContent = `HP ${hHp} / ${hMax}`;
  document.getElementById('heroStatBar').textContent = `DEF ${cur.DEF} • DMG ${cur.DMG}`;
  document.getElementById('enemyHpBar').style.width = Math.max(0, eHp / eMaxHp * 100) + '%';
  document.getElementById('enemyHpBar').textContent = `HP ${eHp} / ${eMaxHp}`;
  document.getElementById('enemyStatBar').textContent = `DEF ${eDef} • DMG ${eDmg}`;
}
updBars();
const logZone = document.getElementById('logZone');
function addLog(txt, cls=''){ const d=document.createElement('div'); d.className='log-line '+cls; d.textContent=txt; logZone.appendChild(d); logZone.scrollTop = 9999; }
function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
async function runBattle(){
  addLog(`Бой: ${profileName} vs ${enemyData.name} [LOC ${loc} STAGE ${stage}]`);
  addLog(`${enemyData.name} HP ${eMaxHp} DEF ${eDef} DMG ${eDmg} vs HERO HP ${hMax} DEF ${cur.DEF} DMG ${cur.DMG}`);
  while(hHp>0 && eHp>0){
    await new Promise(r=>setTimeout(r, 420));
    let isCrit = Math.random()*100 < cur.CRIT;
    let baseDmg = Math.max(10, cur.DMG - Math.floor(eDef/2) + rand(-12,12));
    if(isCrit) baseDmg = Math.floor(baseDmg*1.5);
    eHp = Math.max(0, eHp - baseDmg);
    updBars();
    addLog(`⚔️ Ты бьешь ${enemyData.name} на ${baseDmg}${isCrit?' CRIT!':''}`, 'hit');
    if(eHp<=0) break;
    await new Promise(r=>setTimeout(r, 380));
    let dmgToHero = Math.max(5, eDmg - Math.floor(cur.DEF/4) + rand(-8,8));
    if(Math.random()*100 < cur.DODGE){ addLog(`💨 Ты увернулся от ${enemyData.name}!`, 'hit'); }
    else { hHp = Math.max(0, hHp - dmgToHero); updBars(); addLog(`💥 ${enemyData.name} бьет тебя на ${dmgToHero} — HP ${hHp}/${hMax}`, 'enemy-hit'); }
    if(hHp<=0) break;
  }
  if(eHp<=0){ addLog(`✅ ПОБЕДА!`, 'win'); showVictory(); } else { addLog(`❌ ПОРАЖЕНИЕ!`, 'lose'); showDefeat(); }
}
function showVictory(){
  document.getElementById('rewGold').textContent = `+${150 + stage*40 + loc*20}`;
  document.getElementById('rewXp').textContent = `+${4000 + stage*200 + loc*100}`;
  document.getElementById('modalTitle').textContent = 'ПОБЕДА!';
  document.getElementById('modalSub').textContent = `Ты победил в битве • ${enemyData.name}`;
  document.getElementById('victoryModal').classList.add('show');
}
function showDefeat(){
  document.getElementById('modalTitle').textContent = 'ПОРАЖЕНИЕ!';
  document.getElementById('modalSub').textContent = `Тебя победил ${enemyData.name}`;
  document.getElementById('victoryModal').classList.add('show');
}
function fightAgain(){ location.reload(); }
function goToMobs(){ location.href = `./page7.html?loc=${loc}`; }
runBattle();
</script>
</body>
</html>
