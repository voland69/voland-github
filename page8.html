<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOLAND - BATTLE SYNC</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>/* тот же стиль что у тебя был */</style>
</head>
<body>
<div class="bg"><img src="./assets/heroes/bg-battlefield.webp"></div>
<div class="wrap">
  <div class="left-nav">
    <div onclick="location.href='./page3.html'"><div class="nav-item">👤</div><div class="nav-label">HERO</div></div>
    <div onclick="location.href='./page4.html'"><div class="nav-item">🎒</div><div class="nav-label">BAG</div></div>
    <div onclick="location.href='./page6.html'"><div class="nav-item active">⚔️</div><div class="nav-label">BATTLE</div></div>
  </div>
  <div class="center">
    <div class="top-head"><div id="locTitle">ПУСТЫНЯ</div><div id="stageTitle">STAGE 1</div></div>
    <div class="arena">
      <div class="card hero"><div id="heroIcon"></div><div id="heroName"></div><div id="heroHpBar"></div><div id="heroManaBar"></div></div>
      <div class="vs">VS</div>
      <div class="card enemy" id="enemyCard"><div id="enemyIcon"></div><div id="enemyName"></div><div id="enemyHpBar"></div><div id="enemyStatBar"></div></div>
    </div>
    <div id="logZone" class="log-zone"></div>
    <div id="skillBar" class="skill-bar"></div>
  </div>
</div>
<script src="./assets/js/db.js"></script>
<script src="./assets/js/storage.js"></script>
<script>
if(typeof volandGetEnemyStats !== 'function'){
  window.volandGetEnemyStats = function(loc, stage){
    const fb={1:[{maxHp:600,def:8,dmg:40},{maxHp:1300,def:18,dmg:140},{maxHp:2100,def:35,dmg:300},{maxHp:3000,def:50,dmg:500}]};
    const list=VOLAND_ENEMIES[loc]||[]; const e=list.find(x=>x.stage===stage)||list[0]||{maxHp:600};
    const f=(fb[loc]&&fb[loc][stage-1])||{maxHp:600,def:8,dmg:40};
    return {maxHp:e.maxHp||f.maxHp, def:e.def||f.def, dmg:e.dmg||f.dmg, data:e};
  };
}
const {loc, stage} = (()=>{const p=new URLSearchParams(location.search);return {loc:parseInt(p.get('loc')||'1'), stage:parseInt(p.get('stage')||'1')}})();
let heroId=volandGetHeroId(); if(!VOLAND_HEROES[heroId]) heroId='warrior-m';
const heroData=VOLAND_HEROES[heroId]; const calc=volandCalcStats(); const cur=calc.cur;
const enemyStats=volandGetEnemyStats(loc,stage); const enemyData=enemyStats.data;
const eDef=enemyStats.def, eDmg=enemyStats.dmg, eMaxHp=enemyStats.maxHp;
let eHp=eMaxHp, hHp=cur.HP, hMax=cur.HP, hMana=cur.MANA, hMaxMana=cur.MANA, turn=1, enemyStun=0, cooldowns=[0,0,0,0,0], isBattleOver=false;
function updBars(){
  document.getElementById('heroHpBar').textContent=`HP ${hHp}/${hMax}`;
  document.getElementById('enemyHpBar').textContent=`HP ${eHp}/${eMaxHp}`;
  document.getElementById('enemyStatBar').textContent=`DEF ${eDef} • DMG ${eDmg} • SYNC ${eMaxHp}/${eDef}/${eDmg}`;
}
updBars();
// ... остальной бой как у тебя был, только используй eMaxHp/eDef/eDmg из volandGetEnemyStats
</script>
</body>
</html>
