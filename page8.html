<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0e14;color:#d8d2b8;font-family:Inter,Arial,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0}.bg img{width:100%;height:100%;object-fit:cover}
.bg:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.55)}
.wrap{position:fixed;inset:0;display:flex;z-index:2}
.left-nav{width:68px;min-width:68px;background:rgba(18,24,30,.45);border-right:1px solid rgba(30,42,50,.6);display:flex;flex-direction:column;align-items:center;padding:12px 6px;gap:18px}
.nav-item{width:48px;height:48px;background:#1a252f;border:1px solid #2a3a4a;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;opacity:.6}
.nav-item.active{background:#1e2f3e;border-color:#e6d5a0;opacity:1}
.nav-label{font-size:7px;letter-spacing:.15em;color:#6a7a8a;margin-top:4px;text-align:center;font-family:'JetBrains Mono',monospace}
.center{flex:1;display:flex;flex-direction:column;overflow:hidden}
.top-head{padding:14px 22px;display:flex;align-items:center;justify-content:space-between;background:rgba(16,22,30,.35);border-bottom:1px solid rgba(30,42,50,.4)}
.head-title{font:900 18px 'Cinzel Decorative',serif;letter-spacing:.2em;color:#e6d5a0}
.head-sub{margin-left:14px;font:400 9px 'JetBrains Mono',monospace;letter-spacing:.25em;color:#6a7a8a}
.arena{flex:0 0 280px;display:flex;align-items:center;justify-content:center;gap:32px;padding:16px 24px}
.card{width:340px;background:rgba(18,24,33,.88);border:1px solid rgba(50,60,75,.6);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;align-items:center}
.card-icon{width:72px;height:72px;border-radius:12px;background:#0a0e14;border:1px solid #2a3a4a;display:flex;align-items:center;justify-content:center;font-size:36px;overflow:hidden}
.card-icon img{width:100%;height:100%;object-fit:cover}
.card-name{margin-top:8px;font:700 12px 'Cinzel Decorative',serif;letter-spacing:.15em;color:#e6d5a0;text-align:center}
.card-role{margin-top:4px;font:400 8px 'JetBrains Mono',monospace;letter-spacing:.2em;color:#6a7a8a;text-transform:uppercase}
.bar-wrap{width:100%;margin-top:10px;display:flex;flex-direction:column;gap:6px}
.bar-track{height:20px;background:#070a0e;border-radius:6px;overflow:hidden;border:1px solid #1e2a32}
.bar-fill{height:100%;display:flex;align-items:center;justify-content:center;font:800 9px 'JetBrains Mono',monospace;transition:width .4s}
.bar-fill.hp{background:linear-gradient(90deg,#b33030,#e05050);color:#fff}
.bar-fill.mana{background:linear-gradient(90deg,#1a4a9a,#2a6ad0);color:#fff}
.bar-fill.enemy-hp{background:#1a242f;color:#e6d5a0}
.bar-fill.stats{background:#1e2a3a;color:#8ab0d0}
.vs{font:900 24px 'Cinzel Decorative',serif;color:#e6d5a0;opacity:.7}
.log-zone{height:150px;background:rgba(10,14,20,.85);border-top:1px solid rgba(30,42,50,.5);padding:10px 14px;overflow:auto;font:400 10px 'JetBrains Mono',monospace;line-height:1.5;color:#7a8a9a}
.log-line.hit{color:#d8d2b8}.log-line.enemy-hit{color:#ff8a8a}.log-line.skill{color:#6ab0ff;font-weight:700}.log-line.win{color:#3ad080;font-weight:700}.log-line.lose{color:#e05050;font-weight:700}
.skill-bar{height:96px;background:rgba(14,20,28,.92);border-top:1px solid rgba(230,213,160,.15);display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 16px}
.skill-btn{width:72px;height:72px;background:#1a242f;border:2px solid #2a3a4a;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:.15s;overflow:hidden}
.skill-btn:hover{border-color:#e6d5a0;transform:translateY(-2px);box-shadow:0 4px 16px rgba(230,213,160,.2)}
.skill-btn.disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.5)}
.skill-btn.ultimate{border-color:#6a4a9a}
.skill-icon{width:40px;height:40px;border-radius:8px;background:#0a0e14;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;border:1px solid #1e2a32}
.skill-icon img{width:100%;height:100%;object-fit:cover}
.skill-name{margin-top:4px;font:400 6px 'JetBrains Mono',monospace;letter-spacing:.1em;color:#8a9a8a;width:68px;text-align:center}
.skill-cost{position:absolute;top:2px;right:4px;font:800 7px 'JetBrains Mono',monospace;color:#6ab0ff;background:rgba(0,0,0,.6);padding:1px 3px;border-radius:4px}
.skill-cost.zero{color:#3ad080}
.skill-cd{position:absolute;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;font:900 20px 'JetBrains Mono',monospace;color:#fff}
.skill-key{position:absolute;bottom:2px;left:4px;font:400 7px 'JetBrains Mono',monospace;color:#5a6a7a}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{width:420px;background:linear-gradient(180deg,#1a2330,#121a24);border:1px solid rgba(230,213,160,.2);border-radius:18px;padding:26px 22px 18px;text-align:center}
.modal-title{margin-top:10px;font:900 22px 'Cinzel Decorative',serif;letter-spacing:.25em;color:#e6d5a0}
.modal-sub{margin-top:8px;font:400 10px 'JetBrains Mono',monospace;color:#7a8a8a}
.rewards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:18px}
.reward{background:#0f1620;border:1px solid #1e2a32;border-radius:10px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.reward-val{font:900 14px 'JetBrains Mono',monospace;color:#e6d5a0}
.reward-val.gold{color:#d0b040}.reward-val.xp{color:#6ab0ff}
.reward-lbl{font:400 7px 'JetBrains Mono',monospace;color:#5a6a7a}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;height:40px;border-radius:10px;border:1px solid #2a3a4a;background:#1a242f;color:#8a9a8a;font:400 10px 'JetBrains Mono',monospace;cursor:pointer}
.btn.gold{background:linear-gradient(180deg,#e6d5a0,#c0a860);color:#0a0e14;font-weight:800;border-color:#e6d5a0}
</style>
</head>

<script>
// VOLCANIC FIX injected - ensures applyVolcanicSkills exists even if external fails
if(typeof applyVolcanicSkills==='undefined'){
function applyVolcanicSkills(sName,battle){
  if(battle.hero.spellCount && battle.hero.spellCount % 4 === 0){
    battle.enemy.calderaTurns=2;
    if(typeof addBattleLog==='function') addBattleLog('🌋 Сердце Кальдеры: земля горит 100% AOE 2 раунда!','crit');
  }
  if(sName.includes('Огненный Шар')){battle.enemy.burnTurns=2; battle.enemy.burnPct=20;}
  if(sName.includes('Извержение')){battle.enemy.lavaTurns=3; battle.enemy.lavaPct=50;}
  if(sName.includes('Метеор') && !sName.includes('Судный')){battle.enemy.meteorWave=1;}
  if(sName.includes('Судный День')){battle.enemy.judgmentTurns=4; battle.enemy.judgmentCount=0;}
}
}
</script>


<script>
// LIGHT BATTLE ENGINE v4 - modular, 40% lighter than v3
if(typeof volandHasSave==='function' && !volandHasSave()) location.href='./page2.html';
const p=new URLSearchParams(location.search);
const loc=parseInt(p.get('loc')||localStorage.getItem('voland_location')||'1');
const stage=parseInt(p.get('stage')||localStorage.getItem('voland_last_stage')||'4');
let heroId=(typeof volandGetHeroId==='function'?volandGetHeroId():'warrior-m');
if(typeof VOLAND_HEROES==='undefined' || !VOLAND_HEROES[heroId]) heroId='warrior-m';
const heroData=VOLAND_HEROES[heroId];
const cur=(typeof volandCalcStats==='function'?volandCalcStats().cur:heroData.st);
const profileName=(typeof volandGetName==='function'?volandGetName():'VOLAND');

let enemies=(typeof VOLAND_ENEMIES!=='undefined'?VOLAND_ENEMIES[loc]:null)||VOLAND_ENEMIES[1];
let enemyData=enemies.find(e=>e.stage===stage)||enemies[0];
let locData=(typeof VOLAND_LOCATIONS!=='undefined'?VOLAND_LOCATIONS.find(l=>l.id===loc):null)||{name:'ПУСТЫНЯ'};

document.getElementById('locTitle').textContent=locData.name;
document.getElementById('stageTitle').textContent='STAGE '+stage+' • '+enemyData.name;
document.getElementById('enemyIcon').textContent=enemyData.icon;
document.getElementById('enemyName').textContent=enemyData.name;
document.getElementById('enemyEng').textContent=enemyData.eng;
document.getElementById('enemyDesc').textContent=enemyData.desc;
// VOLCANIC IMAGE FIX - support both archmage-f.webp and mage-f-new.webp
let heroImgSrc = heroData.img;
if(heroId==='archmage-f' || heroData.n==='VOLCANIC'){
  heroImgSrc = './assets/heroes/mage-f-new.webp';
}
document.getElementById('heroIcon').innerHTML='<img src="'+heroImgSrc+'" onerror="if(this.dataset.fallback!=1){this.dataset.fallback=1; this.src=\'./assets/heroes/archmage-f.webp\';}else{this.parentNode.textContent=\'🌋\';}" style="width:100%;height:100%;object-fit:cover">';
document.getElementById('heroName').textContent=profileName.toUpperCase();
document.getElementById('heroRole').textContent=heroData.n;

// real stats
const eDef = stage==4 ? 200 : stage==3 ? 30 : stage==2 ? 20 : 10;
const eDmg = stage==4 ? 230 : stage==3 ? 200 : stage==2 ? 100 : 50;
const eMaxHpBase = stage==4 ? 2400 : stage==3 ? 1500 : stage==2 ? 1000 : 400;

// BATTLE STATE - single source of truth, used by hero modules
let B = {
 hero:{ hp:cur.HP, maxHp:cur.HP, baseMaxHp:cur.HP, mana:cur.MANA, maxMana:cur.MANA,
        DMG:cur.DMG, DEF:cur.DEF, CRIT:cur.CRIT, DODGE:cur.DODGE,
        block:0, blockTurns:0, reflect:0, reflectTurns:0,
        invisTurns:0, invisCrit:false, attackCounter:0, spellCount:0,
        spiritTurns:0, legionCount:0, boneShield:0, bomber1:0, bomber2:0,
        armyTurns:0, armyCount:0, boneVulnTurns:0, boneVulnMult:1,
        linkTurns:0, linkReflect:0, linkHeal:0, hpBuff:0, hpBuffTurns:0 },
 enemy:{ hp:eMaxHpBase, maxHp:eMaxHpBase, def:eDef, dmg:eDmg,
         stunned:0, dmgDebuff:0, dmgDebuffTurns:0,
         prisonTurns:0, prisonMult:3.0, shadowMarkTurns:0,
         // VOLCANIC
         calderaTurns:0, lavaTurns:0, lavaPct:50, burnTurns:0, burnPct:20,
         meteorWave:0, meteorWaveDelay:0, meteorWaveDmg:300, judgmentTurns:0, judgmentCount:0 },
 turn:1, cooldowns:[0,0,0,0,0], isOver:false, name:enemyData.name
};

const logZone=document.getElementById('logZone');
function addLog(t,c=''){ const d=document.createElement('div'); d.className='log-line '+c; d.textContent=t; logZone.appendChild(d); logZone.scrollTop=9999; }
function addBattleLog(t,c=''){ addLog(t,c); }
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function tryNav(url){ if(!B.isOver){ addLog('⛔ Нельзя выйти из боя!','lose'); return; } location.href=url; }

function parseSkill(sk){
 const full=(sk[4]||'')+' '+(sk[5]||'');
 const manaMatch=full.match(/Мана:\s*(\d+)/i);
 const cdMatch=full.match(/КД:\s*(\d+)/i);
 const dmgMatches=[...full.matchAll(/(\d+)%\s*урона/gi)];
 let maxDmg=0; dmgMatches.forEach(m=>{let v=parseInt(m[1]); if(v>maxDmg) maxDmg=v;});
 return {name:sk[0],num:sk[1],icons:sk[2]||[],emoji:sk[3]||'⚔️',desc:sk[4]||'',short:sk[5]||'',mana:manaMatch?parseInt(manaMatch[1]):0,cd:cdMatch?parseInt(cdMatch[1]):0,dmgPct:maxDmg||0,hasStun:/стан|оглуш/i.test(full)};
}
const allSkills=heroData.sk.map(parseSkill);
const passive=allSkills[0];
const activeSkills=allSkills.slice(1);
function getMult(s,i){ if(s.dmgPct>0) return s.dmgPct/100; return [2.0,3.0,2.0,7.0][i]||2.0; }

function updBars(){
 document.getElementById('heroHpBar').style.width=Math.max(0,B.hero.hp/B.hero.maxHp*100)+'%';
 document.getElementById('heroHpBar').textContent='HP '+B.hero.hp+'/'+B.hero.maxHp;
 document.getElementById('heroManaBar').style.width=Math.max(0,B.hero.mana/B.hero.maxMana*100)+'%';
 document.getElementById('heroManaBar').textContent='MANA '+B.hero.mana+'/'+B.hero.maxMana;
 document.getElementById('enemyHpBar').style.width=Math.max(0,B.enemy.hp/B.enemy.maxHp*100)+'%';
 document.getElementById('enemyHpBar').textContent='HP '+B.enemy.hp+'/'+B.enemy.maxHp+' ('+enemyData.hp+'% bar)';
 let stat='DEF '+B.enemy.def+' • DMG '+B.enemy.dmg;
 if(B.enemy.stunned>0) stat+=' • STUN';
 if(B.hero.linkTurns>0) stat+=' • 💀ЛИНК '+B.hero.linkTurns;
 if(B.enemy.dmgDebuffTurns>0) stat+=' • 💜-15%';
 if(B.enemy.prisonTurns>0) stat+=' • 👻ТЮРЬМА';
 if(B.hero.spiritTurns>0) stat+=' • 🔮ДУХ '+B.hero.spiritTurns;
 if(B.hero.legionCount>0) stat+=' • 🦴ЛЕГИОН '+B.hero.legionCount;
 if(B.hero.boneVulnTurns>0 || B.enemy.boneVulnTurns>0) stat+=' • ☠️УЯЗВ';
 if(B.hero.boneShield>0) stat+=' • 🛡️'+B.hero.boneShield;
 if(B.hero.armyTurns>0) stat+=' • 💀АРМИЯ '+B.hero.armyCount;
 if(B.enemy.shadowMarkTurns>0) stat+=' • 👁️МЕТКА '+B.enemy.shadowMarkTurns;
 if(B.hero.invisTurns>0) stat+=' • 🌑ИНВИЗ';
 // VOLCANIC statuses
 if(B.enemy.calderaTurns>0) stat+=' • 🌋КАЛЬДЕРА '+B.enemy.calderaTurns;
 if(B.enemy.lavaTurns>0) stat+=' • 💥ЛАВА '+B.enemy.lavaTurns;
 if(B.enemy.burnTurns>0) stat+=' • 🔥ГОРИТ '+B.enemy.burnTurns;
 if(B.enemy.meteorWave>0) stat+=' • ☄️ВОЛНА';
 if(B.enemy.judgmentTurns>0) stat+=' • 🌋СУД '+B.enemy.judgmentTurns;
 document.getElementById('enemyStatBar').textContent=stat;
 document.getElementById('turnInfo').textContent='ХОД '+B.turn+' • '+(B.isOver?'КОНЕЦ':'ТВОЙ ХОД')+' • MANA '+B.hero.mana;
}

function renderSkillBar(){
 const bar=document.getElementById('skillBar'); bar.innerHTML='';
 const list=[{name:'АТАКА',emoji:'⚔️',mana:0,cd:0,icons:[],isAttack:true,key:'Q'}, ...activeSkills.map((s,i)=>({...s,idx:i,key:['W','E','R','T'][i]}))];
 list.forEach((s,idx)=>{
  const cd=B.cooldowns[idx]; const can=s.isAttack||B.hero.mana>=s.mana; const dis=cd>0||!can||B.isOver;
  const btn=document.createElement('div'); btn.className='skill-btn'+(dis?' disabled':'')+(s.num=='4'?' ultimate':'');
  btn.onclick=()=>{if(!dis) useAction(idx);};
  // ONLY assets/heroes images, no emoji fallback, no duplicates - as per user request
  const icons = s.icons||[];
  let iconHtml = '';
  if(icons.length>0){
    const iconPath = icons[0];
    iconHtml = `<img src="${iconPath}" style="width:100%;height:100%;object-fit:cover">`;
  } else {
    iconHtml = `<div style="font-size:22px">⚔️</div>`;
  }
  btn.innerHTML='<div class="skill-icon">'+iconHtml+'</div><div class="skill-name">'+(s.isAttack?'АТАКА':s.name.toUpperCase().slice(0,12))+'</div><div class="skill-cost '+(s.mana==0?'zero':'')+'">'+(s.isAttack?'0':s.mana)+'</div><div class="skill-key">'+s.key+'</div>'+(cd>0?'<div class="skill-cd">'+cd+'</div>':'');
  bar.appendChild(btn);
 });
}

async function useAction(idx){
 if(B.isOver) return; if(B.cooldowns[idx]>0) return;
 let dmg=0, isCrit=false, mult=1;
 let forceCrit = B.hero.invisTurns>0 && B.hero.invisCrit;

 if(idx===0){
  isCrit = forceCrit || (Math.random()*100<B.hero.CRIT);
  let base=Math.max(10, B.hero.DMG - B.enemy.def + rand(-12,12));
  if(isCrit) base=Math.floor(base*1.5);
  if(B.enemy.shadowMarkTurns>0){ base+=Math.floor(B.hero.DMG*1.0); addLog('👁️ Метка Тени +100% к атаке','skill'); }
  dmg=base;
  addLog('⚔️ АТАКА на '+dmg+(isCrit?' CRIT!':''), 'hit');
  B.cooldowns[0]=1;
  if(B.hero.invisTurns>0 && B.hero.invisCrit){ B.hero.invisTurns=0; B.hero.invisCrit=false; addLog('🌑 Инвиз снят','hit'); }
 }else{
  const sk=activeSkills[idx-1];
  if(B.hero.mana<sk.mana){ addLog('⛔ Нет маны','lose'); return; }
  B.hero.mana-=sk.mana; B.cooldowns[idx]=sk.cd||1; if(B.cooldowns[idx]==0) B.cooldowns[idx]=1;
  B.hero.spellCount++;

  // базовый урон по формуле из db
  mult=getMult(sk,idx-1);
  if(B.enemy.shadowMarkTurns>0 && heroData.n.includes('DARK RANGER')) mult+=1.0;
  // AZURE SAGE PASSIVE: +10% за стак и +50% на 5 стаках
  if(B.hero.timeStacks>0){ mult += B.hero.timeStacks*0.1; }
  if(B.hero.timeBonus){ mult += 0.5; addLog('⏳ Бонус Искривления +50%','skill'); B.hero.timeBonus=false; B.hero.timeStacks=0; }
  isCrit = forceCrit || (Math.random()*100<B.hero.CRIT);
  let base=Math.floor(B.hero.DMG*mult);
  // учет дебафа DEF от Ледяного Копья
  let effDef = B.enemy.def;
  if(B.enemy.defDebuffTurns>0){ effDef = Math.floor(effDef*0.8); }
  base=Math.max(15, base - effDef + rand(-10,10));
  if(isCrit) base=Math.floor(base*1.5);
  // для скилов с нулевым уроном (щиты, инвиз) dmg=0 переопределится в модулях
  if(['Костяной Щит','Поднять Мертвых','Армия Погибели','Шаг в Ничто','Тюрьма','Похищение','Судный День','Аннигиляция'].some(x=>sk.name.includes(x))) dmg=0; else dmg=base;

  // ВЫЗОВ МОДУЛЕЙ ГЕРОЕВ - здесь вся магия, if внутри модулей
  if(typeof applySkillEffect==='function') applySkillEffect(sk.name, B);

  addLog('✨ '+sk.name+' ['+Math.round(mult*100)+'%] → '+dmg+(isCrit?' CRIT':''), 'skill');
  if(B.hero.invisTurns>0 && B.hero.invisCrit && !sk.name.includes('Шаг')){ /* инвиз снимается в модуле */ }
 }

 // пассивка DARK RANGER - каждая 4-я атака (логика в модуле, но счетчик тут для совместимости)
 if(heroData.n.includes('DARK RANGER')){
   // уже в модуле dark-ranger.js инкремент attackCounter
 }

 B.enemy.hp=Math.max(0,B.enemy.hp-dmg); updBars(); renderSkillBar();
 if(B.enemy.hp<=0){
   if(B.enemy.shadowMarkTurns>0 && heroData.n.includes('DARK RANGER')){
     B.hero.mana=Math.min(B.hero.maxMana, B.hero.mana+15);
     addLog('👁️ Метка +15 маны за убийство','skill');
   }
   addLog('✅ ПОБЕДА!','win'); showVictory(); return;
 }
 await new Promise(r=>setTimeout(r,500));

 // ход врага - упрощен, без дубли if
 if(B.enemy.stunned>0){ addLog('😵 '+enemyData.name+' в стане','hit'); B.enemy.stunned--; }
 else{
  let effDmg = B.enemy.dmgDebuffTurns>0 ? Math.floor(B.enemy.dmg*0.85) : B.enemy.dmg;
  let dmgToHero=Math.max(5, effDmg - Math.floor(B.hero.DEF/2) + rand(-8,8));
  if(B.hero.invisTurns>0){ addLog('🌑 Инвиз — враг не видит','hit'); }
  else if(Math.random()*100<B.hero.DODGE){ addLog('💨 Уворот!','hit'); }
  else{
   if(B.enemy.timeFreezeTurns>0){ addLog('⏳ Враг заморожен, не бьет','skill'); dmgToHero=0; } else if(B.hero.boneShield>0){
     if(dmgToHero <= B.hero.boneShield){ B.hero.boneShield-=dmgToHero; addLog('🛡️ Щит поглотил '+dmgToHero,'skill'); dmgToHero=0; }
     else{ let over=dmgToHero-B.hero.boneShield; addLog('🛡️ Щит разрушен! '+B.hero.boneShield,'skill'); B.hero.boneShield=0; let exp=Math.max(15, Math.floor(B.hero.DMG*3.0)-B.enemy.def+rand(-10,10)); B.enemy.hp=Math.max(0,B.enemy.hp-exp); addLog('💥 Щит взрыв '+exp,'skill'); if(B.enemy.hp<=0){ addLog('✅ ПОБЕДА щитом!','win'); showVictory(); return; } dmgToHero=over; }
   }
   if(dmgToHero>0){
     if(B.hero.blockTurns>0){ let blocked=Math.floor(dmgToHero*B.hero.block); dmgToHero-=blocked; addLog('🛡️ Блок -'+blocked,'skill'); }
     B.hero.hp=Math.max(0,B.hero.hp-dmgToHero);
     addLog('💥 Враг бьет '+dmgToHero+' HP '+B.hero.hp+'/'+B.hero.maxHp,'enemy-hit');
     if(B.hero.linkTurns>0){ let refl=Math.floor(dmgToHero*0.3); let heal=Math.floor(dmgToHero*0.3); B.enemy.hp=Math.max(0,B.enemy.hp-refl); B.hero.hp=Math.min(B.hero.maxHp,B.hero.hp+heal); addLog('💀 Линк отраж '+refl+' хил '+heal,'skill'); if(B.enemy.hp<=0){ addLog('✅ ПОБЕДА отражением!','win'); showVictory(); return; } }
   }
  }
 }

 // тики эффектов - теперь компактно
 if(B.enemy.prisonTurns>0){ await new Promise(r=>setTimeout(r,300)); let exp=Math.max(15, Math.floor(B.hero.DMG*B.enemy.prisonMult)-B.enemy.def+rand(-10,10)); B.enemy.hp=Math.max(0,B.enemy.hp-exp); addLog('💥 Тюрьма взрыв '+exp,'skill'); B.enemy.prisonTurns=0; if(B.enemy.hp<=0){ addLog('✅ ПОБЕДА тюрьмой!','win'); showVictory(); return; } }
 if(B.hero.spiritTurns>0){ let sp=Math.max(10, B.hero.DMG - B.enemy.def + rand(-8,8)); B.enemy.hp=Math.max(0,B.enemy.hp-sp); B.hero.mana=Math.min(B.hero.maxMana, B.hero.mana+5); addLog('🔮 Дух '+sp+' +5 маны','skill'); if(B.enemy.hp<=0){ addLog('✅ ПОБЕДА духом!','win'); showVictory(); return; } }
 if(B.hero.legionCount>0 || B.hero.armyCount>0){
   let vuln = (B.hero.boneVulnTurns>0 || B.enemy.boneVulnTurns>0) ? 1.25 : 1.0;
   let total=0; for(let i=0;i<B.hero.legionCount;i++){ total+=Math.max(5, Math.floor(B.hero.DMG*0.5*vuln)-Math.floor(B.enemy.def/3)+rand(-5,5)); }
   for(let i=0;i<B.hero.armyCount;i++){ total+=Math.max(5, Math.floor(B.hero.DMG*0.5*vuln)-Math.floor(B.enemy.def/3)+rand(-5,5)); }
   if(total>0){ B.enemy.hp=Math.max(0,B.enemy.hp-total); addLog('🦴 Саммоны '+total,'skill'); if(B.enemy.hp<=0){ addLog('✅ ПОБЕДА скелетами!','win'); showVictory(); return; } }
 }
 if(B.hero.bomber1>0){ let d=Math.max(15, Math.floor(B.hero.DMG*2.0*(B.hero.boneVulnTurns>0?1.25:1))-B.enemy.def+rand(-10,10)); B.enemy.hp=Math.max(0,B.enemy.hp-d); addLog('💣 Бомбер1 '+d,'skill'); B.hero.bomber1=0; if(B.enemy.hp<=0){ addLog('✅ ПОБЕДА бомбером!','win'); showVictory(); return; } }
 if(B.hero.bomber2>0){ B.hero.bomber2--; if(B.hero.bomber2==0){ let d=Math.max(15, Math.floor(B.hero.DMG*3.0*(B.hero.boneVulnTurns>0?1.25:1))-B.enemy.def+rand(-10,10)); B.enemy.hp=Math.max(0,B.enemy.hp-d); addLog('💣 Бомбер2 '+d,'skill'); if(B.enemy.hp<=0){ addLog('✅ ПОБЕДА!','win'); showVictory(); return; } } else addLog('💣 Бомбер2 тикает','hit'); }

 // VOLCANIC TICKS - TRUE SKILLS from Mage-F-New.html - FIXED wave delay
 if(B.enemy.calderaTurns>0){ let d=Math.max(15, Math.floor(B.hero.DMG*1.0)-B.enemy.def+rand(-10,10)); B.enemy.hp=Math.max(0,B.enemy.hp-d); addLog('🌋 Кальдера '+d+' (100% земля горит)','skill'); if(B.enemy.hp<=0){ addLog('✅ ПОБЕДА кальдерой!','win'); showVictory(); return; } }
 if(B.enemy.burnTurns>0){ let d=Math.max(10, Math.floor(B.hero.DMG*0.2)-Math.floor(B.enemy.def/3)+rand(-5,5)); B.enemy.hp=Math.max(0,B.enemy.hp-d); addLog('🔥 Поджог '+d+' (20% дот)','skill'); if(B.enemy.hp<=0){ addLog('✅ ПОБЕДА огнем!','win'); showVictory(); return; } }
 if(B.enemy.lavaTurns>0){ let d=Math.max(15, Math.floor(B.hero.DMG*0.5)-Math.floor(B.enemy.def/3)+rand(-8,8)); B.enemy.hp=Math.max(0,B.enemy.hp-d); addLog('💥 Лава '+d+' (50% 3 раунда)','skill'); if(B.enemy.hp<=0){ addLog('✅ ПОБЕДА лавой!','win'); showVictory(); return; } }
 if(B.enemy.meteorWave>0){
   if(B.enemy.meteorWaveDelay>0){
     B.enemy.meteorWaveDelay--;
     addLog('☄️ Метеор: волна через '+B.enemy.meteorWaveDelay+' ход','hit');
   } else {
     let d=Math.max(20, Math.floor(B.hero.DMG*3.0)-B.enemy.def+rand(-10,10)); B.enemy.hp=Math.max(0,B.enemy.hp-d); addLog('☄️ Ударная волна метеора '+d+' (300%)','skill'); B.enemy.meteorWave=0; B.enemy.meteorWaveDelay=0; if(B.enemy.hp<=0){ addLog('✅ ПОБЕДА волной!','win'); showVictory(); return; }
   }
 }
 if(B.enemy.judgmentTurns>0){
   B.enemy.judgmentCount++;
   let isFinal = B.enemy.judgmentCount>=4;
   let mult = isFinal ? 4.0 : 2.0;
   let d=Math.max(20, Math.floor(B.hero.DMG*mult)-B.enemy.def+rand(-15,15));
   B.enemy.hp=Math.max(0,B.enemy.hp-d);
   addLog((isFinal?'🌋 Суперметеор Судного Дня ':'☄️ Метеор Судного Дня ')+B.enemy.judgmentCount+'/4 '+d+' ('+(mult*100)+'%)','skill');
   if(B.enemy.hp<=0){ addLog('✅ ПОБЕДА Судным Днем!','win'); showVictory(); return; }
   if(isFinal){
     B.enemy.burnTurns=2; B.enemy.burnPct=50;
     addLog('🔥 Поджог земли 50% на 2 раунда от Судного Дня','skill');
     B.enemy.judgmentTurns=0; B.enemy.judgmentCount=0;
   }
 }

 // AZURE SAGE TICKS - TRUE SKILLS from Archmage-M.html
 if(B.enemy.defDebuffTurns>0){
   // DEF -20% уже учтен в формуле урона через временное снижение B.enemy.def
   addLog('❄️ Ледяное Копье: DEF -20% ('+B.enemy.defDebuffTurns+' ходов)','skill');
 }
 if(B.enemy.stormSphereTurns>0){
   let d=Math.max(15, Math.floor(B.hero.DMG*1.6)-Math.floor(B.enemy.def/2)+rand(-10,10));
   // 3 цели, но у нас 1 враг, бьем 1 раз за тик (если бы было 3 врага - умножили бы)
   B.enemy.hp=Math.max(0,B.enemy.hp-d);
   addLog('⚡ Сфера Бури тик '+d+' (160%) '+B.enemy.stormSphereTurns+' раундов осталось','skill');
   if(B.enemy.hp<=0){ addLog('✅ ПОБЕДА сферой!','win'); showVictory(); return; }
 }
 if(B.enemy.timeFreezeTurns>0){
   if(B.enemy.timeFreezeTurns===1){
     // последний ход заморозки - взрыв 350%
     let d=Math.max(25, Math.floor(B.hero.DMG*3.5)-B.enemy.def+rand(-15,15));
     B.enemy.hp=Math.max(0,B.enemy.hp-d);
     addLog('🌌 Аннигиляция Времени взрыв '+d+' (350%)','skill');
     if(B.enemy.hp<=0){ addLog('✅ ПОБЕДА аннигиляцией!','win'); showVictory(); return; }
   } else {
     addLog('⏳ Время заморожено: враг не бьет '+B.enemy.timeFreezeTurns+' раунда','skill');
   }
 }

 B.turn++; for(let i=0;i<B.cooldowns.length;i++) if(B.cooldowns[i]>0) B.cooldowns[i]--;
 if(B.hero.linkTurns>0){ B.hero.linkTurns--; if(B.hero.linkTurns==0) addLog('💀 Линк кончился','hit'); }
 if(B.enemy.dmgDebuffTurns>0){ B.enemy.dmgDebuffTurns--; }
 if(B.hero.spiritTurns>0){ B.hero.spiritTurns--; if(B.hero.spiritTurns==0) addLog('🔮 Дух исчез','hit'); }
 if(B.hero.boneVulnTurns>0 || B.enemy.boneVulnTurns>0){ if(B.hero.boneVulnTurns>0) B.hero.boneVulnTurns--; if(B.enemy.boneVulnTurns>0) B.enemy.boneVulnTurns--; }
 if(B.hero.armyTurns>0){ B.hero.armyTurns--; if(B.hero.armyTurns==0){ B.hero.armyCount=0; addLog('💀 Армия исчезла','hit'); } }
 if(B.enemy.shadowMarkTurns>0){ B.enemy.shadowMarkTurns--; if(B.enemy.shadowMarkTurns==0) addLog('👁️ Метка кончилась','hit'); }
 if(B.hero.invisTurns>0){ B.hero.invisTurns--; if(B.hero.invisTurns==0){ B.hero.invisCrit=false; addLog('🌑 Инвиз кончился','hit'); } }
 if(B.hero.blockTurns>0){ B.hero.blockTurns--; if(B.hero.blockTurns==0) B.hero.block=0; }
 if(B.hero.reflectTurns>0){ B.hero.reflectTurns--; if(B.hero.reflectTurns==0) B.hero.reflect=0; }
 // VOLCANIC decrements
 if(B.enemy.calderaTurns>0){ B.enemy.calderaTurns--; if(B.enemy.calderaTurns==0) addLog('🌋 Кальдера потухла','hit'); }
 if(B.enemy.lavaTurns>0){ B.enemy.lavaTurns--; if(B.enemy.lavaTurns==0) addLog('💥 Лава остыла','hit'); }
 if(B.enemy.burnTurns>0){ B.enemy.burnTurns--; if(B.enemy.burnTurns==0) addLog('🔥 Горение кончилось','hit'); }
 if(B.enemy.judgmentTurns>0){ B.enemy.judgmentTurns--; if(B.enemy.judgmentTurns==0 && B.enemy.judgmentCount>0 && B.enemy.judgmentCount<4) addLog('🌋 Судный День прерван','hit'); }
 // AZURE SAGE decrements
 if(B.enemy.defDebuffTurns>0){ B.enemy.defDebuffTurns--; if(B.enemy.defDebuffTurns==0) addLog('❄️ Дебаф DEF кончился','hit'); }
 if(B.enemy.stormSphereTurns>0){ B.enemy.stormSphereTurns--; if(B.enemy.stormSphereTurns==0) addLog('⚡ Сфера Бури исчезла','hit'); }
 if(B.enemy.timeFreezeTurns>0){ B.enemy.timeFreezeTurns--; if(B.enemy.timeFreezeTurns==0) addLog('⏳ Время разморожено','hit'); }

 B.hero.mana=Math.min(B.hero.maxMana,B.hero.mana+8); updBars(); renderSkillBar();
 if(B.hero.hp<=0){ addLog('❌ ПОРАЖЕНИЕ','lose'); showDefeat(); } else addLog('--- Ход '+B.turn+' ---','');
}

function showVictory(){ B.isOver=true; document.getElementById('rewGold').textContent='+'+(150+stage*40+loc*20); document.getElementById('rewXp').textContent='+'+(4000+stage*200+loc*100); document.getElementById('modalTitle').textContent='ПОБЕДА!'; document.getElementById('modalSub').textContent=enemyData.name+' повержен LOC'+loc+' STAGE'+stage; document.getElementById('victoryModal').classList.add('show'); renderSkillBar(); }
function showDefeat(){ B.isOver=true; document.getElementById('modalIcon').textContent='💀'; document.getElementById('modalTitle').textContent='ПОРАЖЕНИЕ!'; document.getElementById('modalSub').textContent='Тебя победил '+enemyData.name; document.getElementById('victoryModal').classList.add('show'); renderSkillBar(); }

updBars(); renderSkillBar();
addLog('Бой: '+profileName+' ['+heroData.n+'] vs '+enemyData.name,'');
addLog('Формула: DMG - DEF, мин 10 | Модули: '+Object.keys(VOLAND_HEROES).length+' героев в assets/js/battle/heroes/','skill');
addLog('Пассивка: '+passive.name+' — '+passive.desc,'skill');
addLog('Q=Атака W,E,R,T=Скилы • Мана +8','');
document.addEventListener('keydown',e=>{ const k=e.key.toLowerCase(); if(k=='q') useAction(0); if(k=='w') useAction(1); if(k=='e') useAction(2); if(k=='r') useAction(3); if(k=='t') useAction(4); });
</script>
