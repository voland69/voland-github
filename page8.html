<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOLAND - BATTLE MANUAL</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0e14;color:#d8d2b8;font-family:Inter,Arial,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0}.bg img{width:100%;height:100%;object-fit:cover}
.bg:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.55)}
.wrap{position:fixed;inset:0;display:flex;z-index:2}
.left-nav{width:68px;min-width:68px;background:rgba(18,24,30,.45);border-right:1px solid rgba(30,42,50,.6);display:flex;flex-direction:column;align-items:center;padding:12px 6px;gap:18px}
.nav-item{width:48px;height:48px;background:#1a252f;border:1px solid #2a3a4a;border-radius:10px;display:flex;align-items:center;justify-content:center;opacity:0.6;font-size:20px}
.nav-item.active{background:#1e2f3e;border-color:#e6d5a0;opacity:1}
.nav-label{font-size:7px;color:#6a7a8a;margin-top:4px;text-align:center;font-family:'JetBrains Mono',monospace}
.center{flex:1;display:flex;flex-direction:column;overflow:hidden}
.top-head{padding:16px 22px;display:flex;background:rgba(16,22,30,.35);border-bottom:1px solid rgba(30,42,50,.4)}
.head-title{font-family:'Cinzel Decorative',serif;font-size:18px;letter-spacing:.2em;color:#e6d5a0;font-weight:900}
.head-sub{margin-left:14px;font-size:9px;letter-spacing:.25em;color:#6a7a8a;font-family:'JetBrains Mono',monospace}
.arena{flex:1;display:flex;align-items:center;justify-content:center;gap:32px;padding:20px}
.card{width:340px;background:rgba(18,24,33,.88);border:1px solid rgba(50,60,75,.6);border-radius:14px;padding:18px 16px;display:flex;flex-direction:column;align-items:center;transition:transform .2s}
.card.hit{transform:scale(0.96)} .card.hero{border-color:rgba(230,213,160,.25)}
.card-icon{width:92px;height:92px;border-radius:12px;background:#0a0e14;border:1px solid #2a3a4a;display:flex;align-items:center;justify-content:center;font-size:44px;overflow:hidden}
.card-icon img{width:100%;height:100%;object-fit:cover}
.card-name{margin-top:12px;font-family:'Cinzel Decorative',serif;font-size:12px;letter-spacing:.15em;color:#e6d5a0;text-align:center}
.card-role{margin-top:4px;font-size:8px;letter-spacing:.2em;color:#6a7a8a;font-family:'JetBrains Mono',monospace}
.bar-wrap{width:100%;margin-top:12px;display:flex;flex-direction:column;gap:6px}
.bar-track{height:22px;background:#070a0e;border-radius:6px;overflow:hidden;border:1px solid #1e2a32}
.bar-fill{height:100%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;transition:width .4s}
.bar-fill.hp{background:linear-gradient(90deg,#b33030,#e05050);color:#fff}
.bar-fill.enemy-hp{background:#1a242f;color:#e6d5a0}
.bar-fill.stats{background:#1e2a3a;color:#8ab0d0}
.vs{font-family:'Cinzel Decorative',serif;font-size:28px;color:#e6d5a0;opacity:.7}
.controls{padding:14px 18px;background:rgba(10,14,20,.88);border-top:1px solid rgba(30,42,50,.5);display:flex;gap:12px;justify-content:center}
.btn-attack{height:48px;min-width:220px;padding:0 24px;background:linear-gradient(180deg,#e6d5a0,#c0a860);border:1px solid #e6d5a0;border-radius:12px;color:#0a0e14;font-family:'Cinzel Decorative',serif;font-size:13px;letter-spacing:.2em;font-weight:900;cursor:pointer}
.btn-attack:disabled{opacity:.3;cursor:not-allowed}
.log-zone{height:138px;background:rgba(10,14,20,.85);border-top:1px solid rgba(30,42,50,.5);padding:10px 14px;overflow:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:#7a8a9a}
.log-line.hit{color:#d8d2b8} .log-line.enemy-hit{color:#ff8a8a} .log-line.win{color:#3ad080;font-weight:700} .log-line.lose{color:#e05050;font-weight:700}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.modal-overlay.show{display:flex}
.modal{width:420px;background:linear-gradient(180deg,#1a2330,#121a24);border:1px solid rgba(230,213,160,.2);border-radius:18px;padding:26px 22px 18px;text-align:center}
.modal-title{margin-top:10px;font-family:'Cinzel Decorative',serif;font-size:22px;letter-spacing:.25em;color:#e6d5a0;font-weight:900}
.modal-sub{margin-top:8px;font-size:10px;color:#7a8a8a;font-family:'JetBrains Mono',monospace}
.rewards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:18px}
.reward{background:#0f1620;border:1px solid #1e2a32;border-radius:10px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.reward-val.gold{color:#d0b040} .reward-val.xp{color:#6ab0ff}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;height:40px;border-radius:10px;border:1px solid #2a3a4a;background:#1a242f;color:#8a9a8a;font-family:'JetBrains Mono',monospace;font-size:10px;cursor:pointer}
.btn.gold{background:linear-gradient(180deg,#e6d5a0,#c0a860);color:#0a0e14;font-weight:800;border-color:#e6d5a0}
</style>
</head>
<body>
<div class="bg"><img src="./assets/heroes/bg-battlefield.webp" onerror="this.style.display='none'"></div>
<div class="wrap">
  <div class="left-nav">
    <div onclick="location.href='./page3.html'"><div class="nav-item">👤</div><div class="nav-label">HERO</div></div>
    <div onclick="location.href='./page4.html'"><div class="nav-item">🎒</div><div class="nav-label">BAG</div></div>
    <div onclick="location.href='./page5.html'"><div class="nav-item">📜</div><div class="nav-label">SKILLS</div></div>
    <div onclick="location.href='./page6.html'"><div class="nav-item active">⚔️</div><div class="nav-label">BATTLE</div></div>
    <div onclick="location.href='./index.html'"><div class="nav-item">🗺️</div><div class="nav-label">MAP</div></div>
  </div>
  <div class="center">
    <div class="top-head"><div style="display:flex;align-items:center"><div class="head-title" id="locTitle">ПУСТЫНЯ</div><div class="head-sub" id="stageTitle">STAGE 1 • ПЕСЧАНАЯ МЫШЬ</div></div></div>
    <div class="arena">
      <div class="card hero" id="heroCard"><div class="card-icon" id="heroIcon">🦁</div><div class="card-name" id="heroName">VOLAND 1337</div><div class="card-role" id="heroRole"></div><div class="bar-wrap"><div class="bar-track"><div class="bar-fill hp" id="heroHpBar">HP 1400</div></div><div class="bar-track"><div class="bar-fill stats" id="heroStatBar">DEF 210 • DMG 180</div></div></div></div>
      <div class="vs">VS</div>
      <div class="card enemy" id="enemyCard"><div class="card-icon" id="enemyIcon">🐭</div><div class="card-name" id="enemyName">ПЕСЧАНАЯ МЫШЬ</div><div class="card-role" id="enemyEng">Sand Gerbil</div><div class="bar-wrap"><div class="bar-track"><div class="bar-fill enemy-hp" id="enemyHpBar">HP 500</div></div><div class="bar-track"><div class="bar-fill stats" id="enemyStatBar">DEF 10 • DMG 50</div></div></div><div style="margin-top:8px;font-size:8px;color:#5a6a7a;font-family:'JetBrains Mono',monospace" id="enemyDesc"></div></div>
    </div>
    <div class="controls"><button class="btn-attack" id="attackBtn" onclick="doAttack()">⚔️ АТАКОВАТЬ</button></div>
    <div class="log-zone" id="logZone"></div>
  </div>
</div>
<div class="modal-overlay" id="victoryModal"><div class="modal"><div>🏆</div><div class="modal-title" id="modalTitle">ПОБЕДА!</div><div class="modal-sub" id="modalSub">Ты победил</div><div class="rewards"><div class="reward"><div>🪙</div><div class="reward-val gold" id="rewGold">+190</div><div>GOLD</div></div><div class="reward"><div>⭐</div><div class="reward-val xp" id="rewXp">+4200</div><div>XP</div></div><div class="reward"><div>📦</div><div id="rewLoot">1</div><div>LOOT</div></div></div><div class="modal-btns"><button class="btn" onclick="location.reload()">✕ БИТЬ СНОВА</button><button class="btn gold" onclick="location.href='./page7.html?loc='+loc">✓ К МОБАМ</button></div></div></div>
<script src="./assets/js/db.js"></script>
<script src="./assets/js/storage.js"></script>
<script>
const p=new URLSearchParams(location.search); const loc=parseInt(p.get('loc')||'1'); const stage=parseInt(p.get('stage')||'1');
let heroId=volandGetHeroId(); if(!VOLAND_HEROES[heroId]) heroId='warrior-m';
const heroData=VOLAND_HEROES[heroId]; const cur=volandCalcStats().cur; const name=volandGetName();
document.getElementById('heroIcon').innerHTML=`<img src="${heroData.img}" onerror="this.parentNode.textContent='🦁'">`;
document.getElementById('heroName').textContent=name.toUpperCase(); document.getElementById('heroRole').textContent=heroData.n;
let enemies=VOLAND_ENEMIES[loc]||VOLAND_ENEMIES[1]; let eData=enemies.find(e=>e.stage===stage)||enemies[0];
let lData=VOLAND_LOCATIONS.find(l=>l.id===loc)||VOLAND_LOCATIONS[0];
document.getElementById('locTitle').textContent=lData.name; document.getElementById('stageTitle').textContent=`STAGE ${stage} • ${eData.name}`;
document.getElementById('enemyIcon').textContent=eData.icon; document.getElementById('enemyName').textContent=eData.name; document.getElementById('enemyEng').textContent=eData.eng; document.getElementById('enemyDesc').textContent=eData.desc;
const eDef=10*stage+(loc-1)*5; const eDmg=30+20*stage+(loc-1)*10; const eMax=400+stage*100+(loc-1)*150;
let eHp=eMax; let hHp=cur.HP; let hMax=cur.HP; let over=false;
function upd(){ document.getElementById('heroHpBar').style.width=Math.max(0,hHp/hMax*100)+'%'; document.getElementById('heroHpBar').textContent=`HP ${hHp}/${hMax}`; document.getElementById('enemyHpBar').style.width=Math.max(0,eHp/eMax*100)+'%'; document.getElementById('enemyHpBar').textContent=`HP ${eHp}/${eMax}`; }
upd(); const log=document.getElementById('logZone'); function add(t,c=''){ const d=document.createElement('div'); d.className='log-line '+c; d.textContent=t; log.appendChild(d); log.scrollTop=9999; } function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
add(`Ручной бой: ${name} vs ${eData.name} — жми АТАКОВАТЬ`,'info');
function doAttack(){
 if(over) return; document.getElementById('attackBtn').disabled=true;
 let crit=Math.random()*100<cur.CRIT; let dmg=Math.max(10,cur.DMG-Math.floor(eDef/2)+rnd(-12,12)); if(crit) dmg=Math.floor(dmg*1.5);
 eHp=Math.max(0,eHp-dmg); upd(); add(`⚔️ Ты бьешь ${eData.name} на ${dmg}${crit?' CRIT!':''}`,'hit');
 if(eHp<=0){ over=true; add('✅ ПОБЕДА!','win'); setTimeout(()=>{document.getElementById('victoryModal').classList.add('show');},400); return; }
 setTimeout(()=>{ let d2=Math.max(5,eDmg-Math.floor(cur.DEF/4)+rnd(-8,8)); if(Math.random()*100<cur.DODGE){ add(`💨 Уворот!`,'hit'); } else { hHp=Math.max(0,hHp-d2); upd(); add(`💥 ${eData.name} бьет тебя на ${d2}`,'enemy-hit'); } if(hHp<=0){ over=true; add('❌ ПОРАЖЕНИЕ!','lose'); document.getElementById('modalTitle').textContent='ПОРАЖЕНИЕ!'; document.getElementById('victoryModal').classList.add('show'); } else { document.getElementById('attackBtn').disabled=false; } },500);
}
</script>
</body>
</html>
