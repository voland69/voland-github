<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOLAND - BATTLE</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0e14;color:#d8d2b8;font-family:Inter,Arial,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0}.bg img{width:100%;height:100%;object-fit:cover}.bg:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.55)}
.wrap{position:fixed;inset:0;display:flex;z-index:2}
.left-nav{width:68px;min-width:68px;background:rgba(18,24,30,.35);border-right:1px solid rgba(30,42,50,.5);display:flex;flex-direction:column;align-items:center;padding:12px 6px;gap:18px}
.nav-item{width:48px;height:48px;background:#1a252f;border:1px solid #2a3a4a;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0.6;font-size:20px}
.nav-item.active{background:#1e2f3e;border-color:#e6d5a0;opacity:1}
.nav-label{font-size:7px;letter-spacing:.15em;color:#6a7a8a;margin-top:4px;text-align:center;font-family:'JetBrains Mono',monospace}
.center{flex:1;display:flex;flex-direction:column;padding:20px;overflow:auto;background:rgba(16,22,30,.2)}
.title{font-family:'Cinzel Decorative',serif;font-size:22px;font-weight:900;letter-spacing:.15em;color:#e6d5a0}
.title span{font-family:'JetBrains Mono',monospace;font-size:9px;color:#7a90a8;margin-left:12px}
.back{padding:8px 14px;border:1px solid rgba(122,144,168,.2);border-radius:8px;background:rgba(20,26,34,.6);color:#7a90a8;font:700 8px 'JetBrains Mono',monospace;cursor:pointer}
.battle-area{display:grid;grid-template-columns:1fr 120px 1fr;gap:20px;align-items:center;max-width:1100px;margin:0 auto;width:100%;flex:1}
.hero-card,.enemy-card{background:rgba(20,26,34,.85);border:1px solid rgba(122,144,168,.2);border-radius:14px;padding:20px;text-align:center}
.enemy-card.boss{border-color:rgba(224,80,80,.4)}
.icon{font-size:64px;margin:10px 0}
.name{font:800 14px Inter,sans-serif;color:#e6d5a0;text-transform:uppercase}
.eng{font:400 9px 'JetBrains Mono',monospace;color:#7a90a8;margin-top:4px}
.bar{height:18px;background:#0a0e14;border-radius:4px;border:1px solid #1e2a32;margin-top:8px;overflow:hidden}
.fill{height:100%;display:flex;align-items:center;justify-content:center;font:700 9px 'JetBrains Mono',monospace;color:#fff}
.vs{font:900 28px 'Cinzel Decorative',serif;color:#e6d5a0;text-align:center;opacity:.6}
.log{max-width:1100px;margin:20px auto 0;width:100%;background:rgba(14,20,26,.85);border:1px solid rgba(30,42,50,.5);border-radius:10px;padding:14px;font:400 10px 'JetBrains Mono',monospace;color:#8ea0b0;max-height:180px;overflow:auto}
.btn-fight{margin:18px auto 0;display:block;padding:14px 36px;background:#e6d5a0;color:#0a0e14;border:none;border-radius:8px;font:900 11px 'JetBrains Mono',monospace;letter-spacing:.2em;cursor:pointer}
.right{width:200px;min-width:200px;background:rgba(14,20,26,.92);border-left:1px solid rgba(30,42,50,.5);display:flex;flex-direction:column}
.chat-header{padding:12px;border-bottom:1px solid #1e2a32;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#e05050;box-shadow:0 0 6px #e05050;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.chat-title{font-size:9px;letter-spacing:.2em;color:#6a7a8a;font-family:'JetBrains Mono',monospace}
.sys-msg{background:#1a242f;border-left:2px solid #e05050;padding:8px;font-size:9px;color:#9a9a7a;border-radius:0 6px 6px 0;font-family:'JetBrains Mono',monospace}
</style>
</head>
<body>
<div class="bg"><img src="./assets/heroes/bg-battlefield.webp" onerror="this.style.display='none'"></div>
<div class="wrap">
  <div class="left-nav">
    <div onclick="location.href='./page3.html'"><div class="nav-item">👤</div><div class="nav-label">HERO</div></div>
    <div onclick="location.href='./page4.html'"><div class="nav-item">🎒</div><div class="nav-label">BAG</div></div>
    <div onclick="location.href='./page5.html'"><div class="nav-item">📜</div><div class="nav-label">SKILLS</div></div>
    <div onclick="location.href='./page6.html'"><div class="nav-item active">⚔️</div><div class="nav-label">BATTLE</div></div>
    <div onclick="location.href='./index.html'"><div class="nav-item">🗺️</div><div class="nav-label">MAP</div></div>
  </div>
  <div class="center">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
      <div class="title" id="battleTitle">BATTLE<span id="battleSub"></span></div>
      <button class="back" onclick="location.href='./page7.html'">← DESERT</button>
    </div>
    <div class="battle-area" id="battleArea"></div>
    <button class="btn-fight" id="fightBtn">⚔️ АТАКОВАТЬ / FIGHT</button>
    <div class="log" id="log"></div>
  </div>
  <div class="right">
    <div class="chat-header"><div class="dot"></div><div class="chat-title">BATTLE • LIVE</div></div>
    <div style="padding:12px"><div class="sys-msg" id="sysInfo">Loading...</div></div>
  </div>
</div>
<script src="./assets/js/db.js"></script>
<script src="./assets/js/storage.js"></script>
<script>
function getParam(n){return new URLSearchParams(location.search).get(n);}
let loc = parseInt(getParam('loc')||'1'); let stage = parseInt(getParam('stage')||'1');
if(!VOLAND_ENEMIES || !VOLAND_ENEMIES[loc]) loc=1; if(stage<1||stage>4) stage=1;
const extra = [{hp:500,def:10,dmg:50,maxHp:500},{hp:1000,def:20,dmg:100,maxHp:1000},{hp:1500,def:30,dmg:200,maxHp:1500},{hp:3000,def:50,dmg:500,maxHp:3000}];
const baseEnemy = VOLAND_ENEMIES[loc][stage-1]; const ex = extra[stage-1];
const enemy = {name:baseEnemy.name, eng:baseEnemy.eng, icon:baseEnemy.icon, desc:baseEnemy.desc, hp:ex.hp, maxHp:ex.maxHp, def:ex.def, dmg:ex.dmg, boss:baseEnemy.boss, color:baseEnemy.hpColor};
const heroCalc = volandCalcStats(); const hero = heroCalc.cur; const heroData = VOLAND_HEROES[heroCalc.heroId];
document.getElementById('battleTitle').innerHTML = `ПУСТЫНЯ <span>STAGE ${stage} • ${enemy.name}</span>`;
document.getElementById('sysInfo').textContent = `${enemy.name} HP ${enemy.hp} DEF ${enemy.def} DMG ${enemy.dmg} vs HERO HP ${hero.HP} DEF ${hero.DEF} DMG ${hero.DMG}`;
document.getElementById('battleArea').innerHTML = `
  <div class="hero-card"><div class="icon"><img src="${heroData.img}" style="width:96px;height:96px;object-fit:cover;border-radius:12px" onerror="this.parentNode.textContent='👤'"></div><div class="name">${volandGetName()}</div><div class="eng">${heroData.n}</div><div class="bar"><div class="fill" style="width:100%;background:linear-gradient(90deg,#b33030,#e05050)">HP ${hero.HP}</div></div><div class="bar"><div class="fill" style="width:100%;background:rgba(122,184,255,.3);color:#7ab8ff">DEF ${hero.DEF} • DMG ${hero.DMG}</div></div></div>
  <div class="vs">VS</div>
  <div class="enemy-card ${enemy.boss?'boss':''}"><div class="icon">${enemy.icon}</div><div class="name">${enemy.name}</div><div class="eng">${enemy.eng}</div><div class="bar"><div class="fill" id="enemyHpFill" style="width:100%;background:${enemy.color}">${enemy.hp} / ${enemy.maxHp}</div></div><div class="bar"><div class="fill" style="width:100%;background:rgba(255,138,122,.18);color:#ff8a7a">DEF ${enemy.def} • DMG ${enemy.dmg}</div></div><div style="margin-top:10px;font:400 8px Inter,sans-serif;color:#8ea0b0">${enemy.desc}</div></div>`;
let eHp = enemy.hp; const log = document.getElementById('log');
function addLog(t){log.innerHTML+=t+'<br>'; log.scrollTop=9999;}
document.getElementById('fightBtn').onclick = ()=>{
  const dmgToEnemy = Math.max(10, hero.DMG - enemy.def + Math.floor(Math.random()*20));
  eHp = Math.max(0, eHp - dmgToEnemy); const pct = (eHp/enemy.maxHp)*100;
  document.getElementById('enemyHpFill').style.width = pct+'%'; document.getElementById('enemyHpFill').textContent = eHp+' / '+enemy.maxHp;
  addLog(`⚔️ Ты бьешь ${enemy.name} на ${dmgToEnemy} → HP ${eHp}/${enemy.maxHp}`);
  if(eHp<=0){ addLog(`<b style="color:#3ad080">✅ ПОБЕДА! Stage ${stage} cleared.</b>`); document.getElementById('fightBtn').textContent='🏆 ПОБЕДА - НАЗАД'; document.getElementById('fightBtn').onclick=()=>location.href='./page7.html'; }
};
addLog(`Бой: ${volandGetName()} vs ${enemy.name} [LOC ${loc} STAGE ${stage}] — page8 универсальная, читает ?loc&stage + db.js`);
</script>
</body>
</html>
