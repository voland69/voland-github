<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOLAND - BATTLE</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0e14;color:#d8d2b8;font-family:Inter,Arial,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0}.bg img{width:100%;height:100%;object-fit:cover}
.bg:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.55)}
.wrap{position:fixed;inset:0;display:flex;z-index:2}
.left-nav{width:68px;min-width:68px;background:rgba(18,24,30,.45);border-right:1px solid rgba(30,42,50,.6);display:flex;flex-direction:column;align-items:center;padding:12px 6px;gap:18px}
.nav-item{width:48px;height:48px;background:#1a252f;border:1px solid #2a3a4a;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;opacity:.6}
.nav-item.active{background:#1e2f3e;border-color:#e6d5a0;opacity:1}
.nav-label{font-size:7px;letter-spacing:.15em;color:#6a7a8a;margin-top:4px;text-align:center;font-family:'JetBrains Mono',monospace}
.center{flex:1;display:flex;flex-direction:column;overflow:hidden}
.top-head{padding:14px 22px;display:flex;align-items:center;justify-content:space-between;background:rgba(16,22,30,.35);border-bottom:1px solid rgba(30,42,50,.4)}
.head-title{font:900 18px 'Cinzel Decorative',serif;letter-spacing:.2em;color:#e6d5a0}
.head-sub{margin-left:14px;font:400 9px 'JetBrains Mono',monospace;letter-spacing:.25em;color:#6a7a8a}
.arena{flex:0 0 380px;display:flex;align-items:center;justify-content:center;gap:32px;padding:16px 24px}
.card{width:340px;background:rgba(18,24,33,.88);border:1px solid rgba(50,60,75,.6);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;align-items:center}
.card-icon{width:80px;height:96px;border-radius:12px;background:#0a0e14;border:1px solid #2a3a4a;display:flex;align-items:center;justify-content:center;font-size:36px;overflow:hidden}
.card-icon img{width:100%;height:100%;object-fit:cover;object-position:top center}
.card-name{margin-top:8px;font:700 12px 'Cinzel Decorative',serif;letter-spacing:.15em;color:#e6d5a0;text-align:center}
.card-role{margin-top:4px;font:400 8px 'JetBrains Mono',monospace;letter-spacing:.2em;color:#6a7a8a;text-transform:uppercase}
.bar-wrap{width:100%;margin-top:10px;display:flex;flex-direction:column;gap:6px}
.bar-track{height:20px;background:#070a0e;border-radius:6px;overflow:hidden;border:1px solid #1e2a32}
.bar-fill{height:100%;display:flex;align-items:center;justify-content:center;font:800 9px 'JetBrains Mono',monospace;transition:width .4s}
.bar-fill.hp{background:linear-gradient(90deg,#b33030,#e05050);color:#fff}
.bar-fill.mana{background:linear-gradient(90deg,#1a4a9a,#2a6ad0);color:#fff}
.bar-fill.enemy-hp{background:#1a242f;color:#e6d5a0}
.bar-fill.stats{background:#1e2a3a;color:#8ab0d0}
.vs{font:900 24px 'Cinzel Decorative',serif;color:#e6d5a0;opacity:.7}
.log-zone{height:150px;background:rgba(10,14,20,.85);border-top:1px solid rgba(30,42,50,.5);padding:10px 14px;overflow:auto;font:400 10px 'JetBrains Mono',monospace;line-height:1.5;color:#7a8a9a}
.log-line.hit{color:#d8d2b8}.log-line.enemy-hit{color:#ff8a8a}.log-line.skill{color:#6ab0ff;font-weight:700}.log-line.win{color:#3ad080;font-weight:700}.log-line.lose{color:#e05050;font-weight:700}
.skill-bar{height:96px;background:rgba(14,20,28,.92);border-top:1px solid rgba(230,213,160,.15);display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 16px}
.skill-btn{width:72px;height:72px;background:#1a242f;border:2px solid #2a3a4a;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:.15s;overflow:hidden}
.skill-btn:hover{border-color:#e6d5a0;transform:translateY(-2px);box-shadow:0 4px 16px rgba(230,213,160,.2)}
.skill-btn.disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.5)}
.skill-btn.ultimate{border-color:#6a4a9a}
.skill-icon{width:40px;height:40px;border-radius:8px;background:#0a0e14;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;border:1px solid #1e2a32}
.skill-icon img{width:100%;height:100%;object-fit:cover}
.skill-name{margin-top:4px;font:400 6px 'JetBrains Mono',monospace;letter-spacing:.1em;color:#8a9a8a;width:68px;text-align:center}
.skill-cost{position:absolute;top:2px;right:4px;font:800 7px 'JetBrains Mono',monospace;color:#6ab0ff;background:rgba(0,0,0,.6);padding:1px 3px;border-radius:4px}
.skill-cost.zero{color:#3ad080}
.skill-cd{position:absolute;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;font:900 20px 'JetBrains Mono',monospace;color:#fff}
.skill-key{position:absolute;bottom:2px;left:4px;font:400 7px 'JetBrains Mono',monospace;color:#5a6a7a}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{width:420px;background:linear-gradient(180deg,#1a2330,#121a24);border:1px solid rgba(230,213,160,.2);border-radius:18px;padding:26px 22px 18px;text-align:center}
.modal-title{margin-top:10px;font:900 22px 'Cinzel Decorative',serif;letter-spacing:.25em;color:#e6d5a0}
.modal-sub{margin-top:8px;font:400 10px 'JetBrains Mono',monospace;color:#7a8a8a}
.rewards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:18px}
.reward{background:#0f1620;border:1px solid #1e2a32;border-radius:10px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.reward-val{font:900 14px 'JetBrains Mono',monospace;color:#e6d5a0}
.reward-val.gold{color:#d0b040}.reward-val.xp{color:#6ab0ff}
.reward img{width:28px;height:28px;object-fit:contain;display:block}
.reward-lbl{font:400 7px 'JetBrains Mono',monospace;color:#5a6a7a}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;height:40px;border-radius:10px;border:1px solid #2a3a4a;background:#1a242f;color:#8a9a8a;font:400 10px 'JetBrains Mono',monospace;cursor:pointer}
.btn.gold{background:linear-gradient(180deg,#e6d5a0,#c0a860);color:#0a0e14;font-weight:800;border-color:#e6d5a0}

.main,.center,.center-col,.hero-panel{
  position:relative !important;
  z-index:1 !important;
}


/* VOLAND NAV FIX - 60px / 52x52 / gap 4 / no scroll / hover label */
.left-nav{
  width:60px !important;
  min-width:60px !important;
  max-width:60px !important;
  flex:0 0 60px !important;
  background:rgba(18,24,30,.94) !important;
  border-right:1px solid #2a3a4a !important;
  display:flex !important;
  flex-direction:column !important;
  justify-content:flex-start !important;
  align-items:center !important;
  height:100vh !important;
  height:100dvh !important;
  padding:6px 4px !important;
  gap:0 !important;
  overflow:visible !important;
  position:relative !important;
  z-index:20 !important;
  backdrop-filter:blur(6px) !important;
}
.nav-top{
  display:flex !important;
  flex-direction:column !important;
  gap:4px !important;
  align-items:center !important;
  width:100% !important;
}
.nav-bottom{
  margin-top:auto !important;
  padding-top:8px !important;
  border-top:1px solid rgba(255,255,255,.08) !important;
  width:100% !important;
  display:flex !important;
  flex-direction:column !important;
  align-items:center !important;
  gap:4px !important;
}
.nav-group{
  cursor:pointer !important;
  display:flex !important;
  flex-direction:column !important;
  align-items:center !important;
  gap:0 !important;
  width:100% !important;
  position:relative !important;
}
.nav-item{
  width:52px !important;
  height:52px !important;
  min-width:52px !important;
  min-height:52px !important;
  background:#1a252f !important;
  border:1px solid #2a3a4a !important;
  border-radius:9px !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  opacity:.75 !important;
  transition:.2s !important;
  flex-shrink:0 !important;
  padding:0 !important;
  overflow:hidden !important;
}
.nav-item.active{
  border-color:#e6d5a0 !important;
  opacity:1 !important;
  background:#1e2f3e !important;
  box-shadow:0 0 10px rgba(230,213,160,.3) !important;
}
.nav-item:hover{
  opacity:1 !important;
  border-color:#e6d5a0 !important;
}
.nav-item img{
  width:100% !important;
  height:100% !important;
  object-fit:cover !important;
  display:block !important;
  border-radius:8px !important;
}
.nav-label{
  position:absolute !important;
  left:64px !important;
  top:50% !important;
  transform:translateY(-50%) translateX(-6px) !important;
  background:rgba(20,26,34,.96) !important;
  border:1px solid #e6d5a0 !important;
  color:#e6d5a0 !important;
  padding:5px 9px !important;
  border-radius:6px !important;
  font:700 8px 'JetBrains Mono',monospace !important;
  letter-spacing:.15em !important;
  white-space:nowrap !important;
  opacity:0 !important;
  pointer-events:none !important;
  transition:.18s !important;
  z-index:30 !important;
  box-shadow:0 4px 16px rgba(0,0,0,.5) !important;
}
.nav-group:hover .nav-label{
  opacity:1 !important;
  transform:translateY(-50%) translateX(0) !important;
}
.wrap{
  display:flex !important;
  position:fixed !important;
  inset:0 !important;
}

</style>
</head>
