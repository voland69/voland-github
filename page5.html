<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOLAND - SKILLS</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background: url("./assets/heroes/bg-battlefield.webp") center/cover no-repeat fixed #0a0e14;color:#d8d2b8;font-family:Inter,Arial,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0}.bg img{width:100%;height:100%;object-fit:cover;opacity:.9}
.bg:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35)}
.wrap{position:fixed;inset:0;display:flex;z-index:2}
.left-nav{width:68px;min-width:68px;background:rgba(18,24,30,.55);border-right:1px solid rgba(30,42,50,.6);display:flex;flex-direction:column;align-items:center;padding:12px 6px;gap:18px;backdrop-filter: blur(3px)}
.nav-item{width:48px;height:48px;background:#1a252f;border:1px solid #2a3a4a;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0.6;transition:.2s;font-size:20px}
.nav-item.active{background:#1e2f3e;border-color:#e6d5a0;opacity:1;box-shadow:0 0 12px rgba(230,213,160,.25)}
.nav-item:hover{opacity:1;border-color:#e6d5a0}
.nav-label{font-size:7px;letter-spacing:.15em;color:#6a7a8a;margin-top:4px;text-align:center;font-family:'JetBrains Mono',monospace}
.main{flex:1;display:flex;flex-direction:column;background:rgba(16,22,30,.35);backdrop-filter: blur(2px);overflow:auto;padding:22px 26px}
.sk-header{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;border-bottom:1px solid rgba(42,58,74,.5);padding-bottom:12px}
.sk-title{font-family:'Cinzel Decorative',serif;font-size:20px;letter-spacing:.35em;color:#e6d5a0;font-weight:900}
.sk-sub{font-size:7px;letter-spacing:.2em;color:#6a7a8a;font-family:'JetBrains Mono',monospace;margin-top:6px}
.sk-hero{font-size:7px;color:#8a9a6a;font-family:'JetBrains Mono',monospace;text-align:right;line-height:1.6}
.sk-grid{flex:1;width:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:14px;min-height:0}
.skill-big{background:rgba(26,36,47,.88);border:1px solid #2a3a4a;border-radius:10px;display:flex;gap:16px;padding:16px 18px;transition:.2s;position:relative;overflow:hidden;min-height:160px}
.skill-big:hover{border-color:#e6d5a0;background:rgba(30,47,62,.92);box-shadow:0 0 16px rgba(230,213,160,.12)}
.skill-icon{width:112px;height:112px;min-width:112px;border-radius:12px;background:#1e252f;border:1px solid #2a3a4a;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:36px;position:relative}
.skill-icon img{width:100%;height:100%;object-fit:cover;display:block}
.skill-icon .fb{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#1e252f}
.skill-info{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:0}
.skill-name{font-size:13px;font-weight:700;color:#e6d5a0;letter-spacing:.05em;display:flex;align-items:center;gap:8px}
.badge{font-size:7px;background:#1e1e22;border:1px solid #2a2a32;padding:2px 6px;border-radius:4px;color:#8a8678;font-family:'JetBrains Mono',monospace}
.skill-desc{font-size:11px;color:#c9c2b0;margin-top:8px;line-height:1.5;white-space:normal;word-break:break-word}
.skill-meta{font-size:8px;color:#8a9a6a;margin-top:8px;line-height:1.4;font-family:'JetBrains Mono',monospace}
.skill-num{position:absolute;top:8px;left:10px;font-size:8px;font-family:'JetBrains Mono',monospace;color:#4a5a6a}
.skill-big.soon{border-style:dashed;background:rgba(20,28,36,.4);align-items:center;justify-content:center;flex-direction:column;text-align:center}
.soon-icon{font-size:40px;opacity:.3;margin-bottom:10px}
.soon-text{font-family:'Cinzel Decorative',serif;font-size:16px;letter-spacing:.3em;color:#5a6a7a}
.soon-sub{font-size:7px;color:#4a5a6a;font-family:'JetBrains Mono',monospace;margin-top:6px;letter-spacing:.2em}
.right{width:200px;min-width:200px;background:rgba(14,20,26,1);border-left:1px solid rgba(30,42,50,.5);display:flex;flex-direction:column}
.chat-header{padding:12px;border-bottom:1px solid #1e2a32;display:flex;align-items:center;gap:8px;background:#141c24}
.dot{width:8px;height:8px;border-radius:50%;background:#3ad080;box-shadow:0 0 6px #3ad080}
.chat-title{font-size:9px;letter-spacing:.2em;color:#6a7a8a;font-family:'JetBrains Mono',monospace}
.chat-body{flex:1;padding:10px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.sys-msg{background:#1a242f;border-left:2px solid #d0b040;padding:8px;font-size:9px;color:#9a9a7a;line-height:1.3;border-radius:0 6px 6px 0}
.chat-input{padding:8px;border-top:1px solid #1e2a32;display:flex;gap:6px;background:#12181e}
.chat-input input{flex:1;background:#0a0e14;border:1px solid #1e2a32;border-radius:6px;padding:8px;font-size:11px;color:#d8d2b8;outline:none}
.chat-input button{width:32px;background:#e6d5a0;border:none;border-radius:6px;cursor:pointer;font-weight:800;color:#12181e}
</style>
</head>
<body>
<div class="bg"><img src="./assets/heroes/bg-battlefield.webp" onerror="this.style.display='none'"></div>
<div class="wrap">
  <div class="left-nav">
    <div onclick="location.href='./page3.html'"><div class="nav-item">👤</div><div class="nav-label">HERO</div></div>
    <div onclick="location.href='./page4.html'"><div class="nav-item">🎒</div><div class="nav-label">BAG</div></div>
    <div onclick="location.href='./page5.html'"><div class="nav-item active">📜</div><div class="nav-label">SKILLS</div></div>
    <div onclick="location.href='./page6.html'"><div class="nav-item">⚔️</div><div class="nav-label">BATTLE</div></div>
    <div onclick="location.href='./index.html'"><div class="nav-item">🗺️</div><div class="nav-label">MAP</div></div>
  </div>
  <div class="main">
    <div class="sk-header">
      <div><div class="sk-title">SKILLS • 5 + SOON</div><div class="sk-sub">СТРАНИЦА 5 — СКИЛЫ ГЕРОЯ ИЗ DB.JS — 6 БОЛЬШИХ ОКОН</div></div>
      <div class="sk-hero" id="heroInfo">Loading...</div>
    </div>
    <div class="sk-grid" id="skGrid"></div>
  </div>
  <div class="right">
    <div class="chat-header"><div class="dot"></div><div class="chat-title">SKILLS • db.js</div></div>
    <div class="chat-body" id="chatBody">
      <div class="sys-msg">Скилы загружены из VOLAND_HEROES[hero].sk — 5 реальных + 1 SOON</div>
      <div class="sys-msg">Иконки слева • Чат справа • 6 больших окошек посередине</div>
    </div>
    <div class="chat-input"><input id="chatIn" placeholder="..."><button id="chatBtn">▶</button></div>
  </div>
</div>
<script src="./assets/js/db.js"></script>
<script src="./assets/js/storage.js"></script>
<script>
function render(){
  const heroId = volandGetHeroId();
  const hero = VOLAND_HEROES[heroId] || VOLAND_HEROES['mage-f-new'];
  const name = volandGetName();
  const cur = volandCalcStats().cur;

  document.getElementById('heroInfo').innerHTML = hero.n + '<br>' + hero.role + '<br>HP '+cur.HP+' • DMG '+cur.DMG+' • DEF '+cur.DEF+'<br>'+name.toUpperCase();

  const grid = document.getElementById('skGrid');
  let html = '';
  for (let i=0;i<hero.sk.length;i++){
    const s = hero.sk[i];
    const sName = s[0];
    const sBadge = s[1];
    const icons = s[2];
    const firstIcon = icons[0];
    const emoji = s[3] || '🔮';
    const sDesc = s[4];
    const sMeta = s[5];
    html += `
      <div class="skill-big">
        <div class="skill-num">0${i+1}</div>
        <div class="skill-icon">
          <img src="${firstIcon}" data-fbs='${JSON.stringify(icons.slice(1))}' data-emoji="${emoji}"
            onerror="let f=JSON.parse(this.dataset.fbs||'[]'); if(f.length){ this.src=f.shift(); this.dataset.fbs=JSON.stringify(f); } else { this.style.display='none'; this.nextElementSibling.style.display='flex'; }"
            onload="this.nextElementSibling.style.display='none'">
          <div class="fb">${emoji}</div>
        </div>
        <div class="skill-info">
          <div class="skill-name">${sName} <span class="badge">${sBadge}</span></div>
          <div class="skill-desc">${sDesc}</div>
          <div class="skill-meta">${sMeta}</div>
        </div>
      </div>
    `;
  }
  html += `
    <div class="skill-big soon">
      <div class="soon-icon">🔒</div>
      <div class="soon-text">SOON</div>
      <div class="soon-sub">6й СЛОТ • В РАЗРАБОТКЕ</div>
    </div>
  `;
  grid.innerHTML = html;
}

render();
setInterval(render, 3000);

function log(msg){ const d=document.createElement('div'); d.className='sys-msg'; d.textContent=msg; document.getElementById('chatBody').appendChild(d); document.getElementById('chatBody').scrollTop=9999; }
const chatIn=document.getElementById('chatIn'); const chatBtn=document.getElementById('chatBtn');
chatBtn.onclick=()=>{ const v=chatIn.value.trim(); if(!v) return; log('Ты: '+v); chatIn.value=''; };
chatIn.addEventListener('keydown',e=>{ if(e.key==='Enter') chatBtn.click(); });
</script>
</body>
</html>
