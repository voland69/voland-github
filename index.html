<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOLAND CHRONICLES</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1a29 url('assets/heroes/bg-battlefield.webp') no-repeat fixed center top;background-size:cover;min-height:100vh;color:#e6e0cc;font-family:Inter,sans-serif}
.main{max-width:1280px;margin:0 auto;padding:40px 24px 60px}
.top{text-align:center;margin-bottom:24px}
.era{font-size:10px;letter-spacing:.35em;color:#8a8678}
.top h1{font-family:Cinzel,serif;font-size:38px;letter-spacing:.22em;color:#d9b77a;text-shadow:0 2px 14px #000;margin-top:6px}
.sub{font-size:10px;letter-spacing:.3em;color:#8a8678;margin-top:10px}
.filters{display:flex;justify-content:center;gap:8px;margin:24px auto;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:6px;width:fit-content}
.filters button{background:transparent;border:0;color:#8a8678;padding:8px 18px;border-radius:18px;font-size:10px;letter-spacing:.15em;cursor:pointer}
.filters button.active{background:#e8dcc0;color:#1a1a1a;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.card{position:relative;height:460px;overflow:hidden;border-radius:8px;cursor:pointer;background:#0a0f18;box-shadow:0 8px 24px rgba(0,0,0,.6);transition:.25s}
.card:hover{transform:translateY(-4px)}
.card img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.card .fade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.15) 50%,transparent 70%);pointer-events:none}
.card .info{position:absolute;left:0;right:0;bottom:0;padding:12px;pointer-events:none}
.card .name{font-size:11px;letter-spacing:.15em;font-weight:700}
.card .meta{font-size:8px;letter-spacing:.15em;color:#c9a96e;margin-top:2px}
.modal{display:none;position:fixed;inset:0;z-index:999;background:rgba(7,11,18,.92);padding:20px;overflow:auto}
.modal.open{display:block}
.box{max-width:540px;margin:30px auto;background:#121214;border:1px solid #1e1e24;border-radius:12px;padding:18px}
.close{cursor:pointer;text-align:right;font-size:12px;color:#8a8678;margin-bottom:10px}
.skill{background:#17171b;border:1px solid #222227;border-radius:10px;padding:12px;margin-bottom:10px;display:flex;gap:10px}
.sname{font-size:12px;font-weight:600}
.sdesc{font-size:10px;color:#8b8b95;margin-top:4px;line-height:1.4}
</style>
</head>
<body>
<div class="main">
<div class="top"><div class="era">EST. VOLAND ERA</div><h1>VOLAND<br>CHRONICLES</h1><div class="sub">CHOOSE YOUR CHAMPION — 8 HEROES</div></div>
<div class="filters" id="filters">
<button class="active" data-f="all">ALL 08</button>
<button data-f="male">MALE 04</button>
<button data-f="female">FEMALE 04</button>
</div>
<div class="grid" id="grid">
<div class="card" data-g="male" data-id="archer-m"><img src="assets/heroes/archer-m.webp"><div class="fade"></div><div class="info"><div class="name">DARK RANGER</div><div class="meta">ARCHER - MALE</div></div></div>
<div class="card" data-g="male" data-id="warrior-m"><img src="assets/heroes/warrior-m.webp"><div class="fade"></div><div class="info"><div class="name">LION WARDEN</div><div class="meta">WARRIOR - MALE</div></div></div>
<div class="card" data-g="male" data-id="archmage-m"><img src="assets/heroes/archmage-m.webp"><div class="fade"></div><div class="info"><div class="name">AZURE SAGE</div><div class="meta">ARCHMAGE - MALE</div></div></div>
<div class="card" data-g="male" data-id="necro-m"><img src="assets/heroes/necro-m.webp"><div class="fade"></div><div class="info"><div class="name">GRAVELORD</div><div class="meta">NECROMANCER - MALE</div></div></div>
<div class="card" data-g="female" data-id="archer-f"><img src="assets/heroes/archer-f.webp"><div class="fade"></div><div class="info"><div class="name">WILD PATH</div><div class="meta">ARCHER - FEMALE</div></div></div>
<div class="card" data-g="female" data-id="warrior-f"><img src="assets/heroes/warrior-f.webp"><div class="fade"></div><div class="info"><div class="name">IRON VOW</div><div class="meta">WARRIOR - FEMALE</div></div></div>
<div class="card" data-g="female" data-id="mage-f-new"><img src="assets/heroes/mage-f-new.webp"><div class="fade"></div><div class="info"><div class="name">VOLCANIC</div><div class="meta">MAGE - FEMALE</div></div></div>
<div class="card" data-g="female" data-id="necro-f-new"><img src="assets/heroes/necro-f-new.webp"><div class="fade"></div><div class="info"><div class="name">AMETHYST</div><div class="meta">NECROMANCER - FEMALE</div></div></div>
</div>
</div>
<div class="modal" id="modal"><div class="box"><div class="close" id="close">✕ CLOSE</div><div id="mcontent"></div></div></div>
<script>
const heroes={
"archer-m":{n:"DARK RANGER",d:[["Метка Тени PASSIVE","Каждая 2-я атака накладывает Метку Тени на 3 раунда. +200% урона. Убийство +15 маны."],["Беглый выстрел 1","200% урона. КД 3 Мана 5"],["Шаг в Ничто 2","Инвиз 3 раунда, след. атака крит. КД 20"],["Призрачная Стрела 3","140% урона, стан 33%. До 3 целей."],["Залп Бездны ULT","7 стрел по 100%, в 1 цель 700%."]]},
"archer-f":{n:"WILD PATH",d:[["Тропы Зверя PASSIVE","При уклонении след. удар 100% крит."],["Двойной Выстрел 1","2 стрелы по 100%, в 1 цель кровотечение."],["Ядовитая Лиана 2","Стан 1 + яд 100% 3 раунда."],["Глаз Ястреба 3","+25% крит 4 раунда, видит инвиз."],["Буря Стрел ULT","12 стрел по 80% + стан."]]},
"archmage-m":{n:"AZURE SAGE",d:[["Искривление Времени PASSIVE","+10% урона за заклинание, 5 стаков +50%."],["Ледяное Копье 1","+250% урона -20% защиты."],["Сфера Бури 2","3 раунда по 3 целям 160%."],["Лавина 3","+300% всем."],["Аннигиляция Времени ULT","Стан 3 раунда + 350% всем."]]},
"necro-m":{n:"GRAVELORD",d:[["Костяной Легион PASSIVE","1 скелет/раунд макс 3, 50% урона."],["Костяное Копье 1","+150% +25% урон саммонов."],["Костяной Щит 2","Щит 20% HP взрыв 300% AOE."],["Поднять Мертвых 3","2 подрывника 200% и 300% AOE."],["Армия Погибели ULT","5 скелетов 3 раунда."]]},
"warrior-f":{n:"IRON VOW",d:[["Клятва Стаи PASSIVE","При HP<30% +50% урона +30% лайфстил."],["Рассекающий Волк 1","2 удара по 110%."],["Щит Волчьего Вожака 2","Блок 50% 4 раунда контратака 350%."],["Зов Стаи 3","Стан 1, остальные 200% AOE."],["Альфа Хищник ULT","Волк 5 раундов +50% HP +30% урона."]]},
"mage-f-new":{n:"VOLCANIC",d:[["Сердце Кальдеры PASSIVE","Каждое 4 заклинание 100% AOE 2 раунда."],["Огненный Шар 1","150% + поджог 20% 2 раунда."],["Извержение 2","200% AOE + лава 50%/раунд."],["Метеор 3","500% + 300% волна."],["Судный День ULT","4 метеора по 200% + 400% + поджог."]]},
"necro-f-new":{n:"AMETHYST",d:[["Шепот Аметиста PASSIVE","Каждое 3-е — дух 100% +5 маны/раунд."],["Проклятие Душ 1","200% + кража 5 маны -15% урона."],["Аметистовая Тюрьма 2","Стан всех 1 раунд взрыв 300%."],["Похищение Жизни 3","Связь 4 раунда 30% отражение 30% хил."],["Аметистовый Закат ULT","5 душ по 200% + стан."]]},
"warrior-m":{n:"LION WARDEN",d:[["Клятва Льва PASSIVE","+20% защиты союзникам."],["Удар Льва 1","250% + стан."],["Щит Льва 2","Блок 60% 3 раунда."],["Рев 3","AOE страх 1 раунд."],["Аватар Льва ULT","+50% HP и урона 5 раундов."]]}
};
const grid=document.getElementById('grid'),modal=document.getElementById('modal'),mc=document.getElementById('mcontent');
document.getElementById('filters').onclick=e=>{
if(e.target.tagName!=='BUTTON')return;
document.querySelectorAll('#filters button').forEach(b=>b.classList.remove('active'));
e.target.classList.add('active');
const f=e.target.dataset.f;
document.querySelectorAll('.card').forEach(c=>{
if(f==='all'||c.dataset.g===f){c.style.display=''}else{c.style.display='none'}
});
};
grid.addEventListener('click',e=>{
const c=e.target.closest('.card');if(!c)return;
const h=heroes[c.dataset.id];if(!h)return;
mc.innerHTML=<h2 style="margin-bottom:12px">${h.n}</h2>+h.d.map(s=><div class="skill"><div><div class="sname">${s[0]}</div><div class="sdesc">${s[1]}</div></div></div>).join('');
modal.classList.add('open');
});
document.getElementById('close').onclick=()=>modal.classList.remove('open');
modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
</script>
</body>
</html>
