<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOLAND CHRONICLES</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070709;color:#e6e0cc;font-family:Inter,system-ui,sans-serif;min-height:100vh}
.main{max-width:1200px;margin:0 auto;padding:64px 24px 48px;min-height:100vh}
h1{font-family:Cinzel,Georgia,serif;text-align:center;font-size:26px;letter-spacing:.32em;color:#c9a96e;margin-bottom:56px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
@media(max-width:1024px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.card{background:transparent;border:0;overflow:visible;transition:all .3s}
.card:hover{transform:translateY(-4px) scale(1.02)}
.img{aspect-ratio:3/4;width:100%;background:transparent;overflow:visible;display:flex;align-items:flex-end;justify-content:center}
.img img{width:100%;height:100%;object-fit:contain;object-position:bottom center;display:block;border-radius:12px;filter:drop-shadow(0 8px 24px rgba(0,0,0,.8))}
.name{display:none}
footer{margin-top:64px;text-align:center;font-size:11px;letter-spacing:.18em;color:rgba(138,134,120,.6)}
</style>
</head>
<body>
<div class="main">
<h1>VOLAND CHRONICLES</h1>
<div class="grid">
<article class="card"><div class="img"><img src="assets/heroes/archer-m.webp" alt="DARK RANGER"></div></article>
<article class="card"><div class="img"><img src="assets/heroes/warrior-m.webp" alt="LION WARDEN"></div></article>
<article class="card"><div class="img"><img src="assets/heroes/archmage-m.webp" alt="AZURE SAGE"></div></article>
<article class="card"><div class="img"><img src="assets/heroes/necro-m.webp" alt="GRAVELORD"></div></article>
<article class="card"><div class="img"><img src="assets/heroes/archer-f.webp" alt="WILD PATH"></div></article>
<article class="card"><div class="img"><img src="assets/heroes/warrior-f.webp" alt="IRON VOW"></div></article>
<article class="card"><div class="img"><img src="assets/heroes/mage-f-new.webp" alt="VOLCANIC"></div></article>
<article class="card"><div class="img"><img src="assets/heroes/necro-f-new.webp" alt="AMETHYST"></div></article>
</div>
<footer>VOLAND © 2026</footer>
</div>
</body>
</html>
