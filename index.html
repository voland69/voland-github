<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOLAND</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0e151f}
.bg{position:fixed;inset:0;background:url('assets/bg-battlefield.webp') center top / cover no-repeat}
h1{text-align:center;color:#c9a96e;letter-spacing:.3em;font:600 26px Cinzel,serif;margin-bottom:50px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:30px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{background:transparent;border:0}
.img{aspect-ratio:3/4;display:flex;align-items:end}
.img img{width:100%;height:100%;object-fit:contain;object-position:bottom;display:block;filter:drop-shadow(0 12px 24px #000)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="main">
<h1>VOLAND CHRONICLES</h1>
<div class="grid">
<div class="card"><div class="img"><img src="assets/heroes/archer-m.webp"></div></div>
<div class="card"><div class="img"><img src="assets/heroes/warrior-m.webp"></div></div>
<div class="card"><div class="img"><img src="assets/heroes/archmage-m.webp"></div></div>
<div class="card"><div class="img"><img src="assets/heroes/necro-m.webp"></div></div>
<div class="card"><div class="img"><img src="assets/heroes/archer-f.webp"></div></div>
<div class="card"><div class="img"><img src="assets/heroes/warrior-f.webp"></div></div>
<div class="card"><div class="img"><img src="assets/heroes/mage-f-new.webp"></div></div>
<div class="card"><div class="img"><img src="assets/heroes/necro-f-new.webp"></div></div>
</div></div></body></html>
