<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHOOSE HERO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0e0e10;color:#e6e0cc;font-family:Inter,Arial,sans-serif;padding:20px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:1100px;margin:0 auto}
.card{border:1px solid #23232a;border-radius:12px;overflow:hidden;background:#17171b;cursor:pointer;transition:.2s}
.card:hover{border-color:#e6d5a0;transform:translateY(-2px)}
.card img{width:100%;height:220px;object-fit:cover;display:block}
.card .name{padding:10px;font-size:11px;letter-spacing:.15em;text-align:center}
</style>
</head>
<body>
<h1 style="text-align:center;font-size:14px;letter-spacing:.3em;margin-bottom:20px">CHOOSE YOUR CHAMPION</h1>
<div class="grid" id="grid"></div>
<script>
const heroes=[
{id:'archer-f',name:'WILD PATH',img:'assets/heroes/archer-f.webp'},
{id:'archer-m',name:'DARK RANGER',img:'assets/heroes/archer-m.webp'},
{id:'archmage-m',name:'AZURE SAGE',img:'assets/heroes/archmage-m.webp'},
{id:'mage-f-new',name:'VOLCANIC',img:'assets/heroes/mage-f-new.webp'},
{id:'necro-f-new',name:'AMETHYST',img:'assets/heroes/necro-f-new.webp'},
{id:'necro-m',name:'GRAVELORD',img:'assets/heroes/necro-m.webp'},
{id:'warrior-f',name:'IRON VOW',img:'assets/heroes/warrior-f.webp'},
{id:'warrior-m',name:'LION WARDEN',img:'assets/heroes/warrior-m.webp'}
];
const grid=document.getElementById('grid');
heroes.forEach(h=>{
const d=document.createElement('div');d.className='card';
d.innerHTML=`<img src="${h.img}"><div class="name">${h.name}</div>`;
d.onclick=()=>{
localStorage.setItem('voland_hero',h.id);
localStorage.setItem('selectedHero',h.id);
location.href='page2.html';
};
grid.appendChild(d);
});
</script>
</body>
</html>
