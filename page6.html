<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOLAND - BATTLEFIELD</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background: url("assets/heroes/bg-battlefield.webp") center/cover no-repeat fixed #0a0e14;color:#d8d2b8;font-family:Inter,Arial,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0}
.bg img{width:100%;height:100%;object-fit:cover}
.bg:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.15)}
.wrap{position:fixed;inset:0;display:flex;z-index:2}
.left-nav{width:68px;min-width:68px;background:rgba(18,24,30,.35);border-right:1px solid rgba(30,42,50,.5);display:flex;flex-direction:column;align-items:center;padding:12px 6px;gap:18px;backdrop-filter: blur(2px)}
.nav-item{width:48px;height:48px;background:#1a252f;border:1px solid #2a3a4a;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0.6;transition:.2s;font-size:20px}
.nav-item.active{background:#1e2f3e;border-color:#e6d5a0;opacity:1;box-shadow:0 0 12px rgba(230,213,160,.3)}
.nav-label{font-size:7px;letter-spacing:.15em;color:#6a7a8a;margin-top:4px;text-align:center;font-family:'JetBrains Mono',monospace}
.main{flex:1;display:flex;flex-direction:column;background:rgba(16,22,30,.25);backdrop-filter: blur(2px);overflow:auto;padding:24px 28px;align-items:center}
.bf-header{width:100%;max-width:920px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;border-bottom:1px solid rgba(42,58,74,.5);padding-bottom:14px}
.bf-title{font-family:'Cinzel Decorative',serif;font-size:20px;letter-spacing:.35em;color:#e6d5a0;font-weight:900}
.bf-sub{font-size:8px;letter-spacing:.2em;color:#6a7a8a;font-family:'JetBrains Mono',monospace;margin-top:6px}
.bf-stats{font-size:8px;color:#8a9a6a;font-family:'JetBrains Mono',monospace;text-align:right;line-height:1.6}
.bf-grid{width:100%;max-width:920px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,170px);gap:16px}
.battle-card{background:rgba(26,36,47,.85);border:1px solid #2a3a4a;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.2s;position:relative;overflow:hidden;backdrop-filter: blur(1px)}
.battle-card:hover{border-color:#e6d5a0;background:rgba(30,47,62,.9);box-shadow:0 0 16px rgba(230,213,160,.15);transform:translateY(-2px)}
.battle-card.locked{opacity:.45;cursor:not-allowed}
.battle-card.locked:hover{transform:none;box-shadow:none;border-color:#2a3a4a}
.battle-card.active{border-color:#3ad080;box-shadow:0 0 12px rgba(58,208,128,.25)}
.card-num{position:absolute;top:8px;left:10px;font-size:9px;font-family:'JetBrains Mono',monospace;color:#4a5a6a;letter-spacing:.15em}
.card-icon{font-size:32px;margin-bottom:8px;filter: drop-shadow(0 0 6px rgba(0,0,0,.5))}
.card-name{font-size:11px;letter-spacing:.15em;color:#e6d5a0;font-family:'JetBrains Mono',monospace;font-weight:700;margin-top:2px}
.card-lvl{margin-top:6px;font-size:7px;letter-spacing:.15em;color:#6a7a8a;font-family:'JetBrains Mono',monospace;background:#0a0e14;border:1px solid #1e2a32;padding:3px 8px;border-radius:10px}
.card-reward{margin-top:8px;font-size:6px;color:#3ad080;font-family:'JetBrains Mono',monospace}
.battle-card.active .card-lvl{background:rgba(58,208,128,.15);border-color:#3ad080;color:#3ad080}
.right{width:200px;min-width:200px;background:rgba(14,20,26,1);border-left:1px solid rgba(30,42,50,.5);display:flex;flex-direction:column}
.chat-header{padding:12px;border-bottom:1px solid #1e2a32;display:flex;align-items:center;gap:8px;background:#141c24}
.dot{width:8px;height:8px;border-radius:50%;background:#3ad080;box-shadow:0 0 6px #3ad080}
.chat-title{font-size:9px;letter-spacing:.2em;color:#6a7a8a;font-family:'JetBrains Mono',monospace}
.chat-body{flex:1;padding:10px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.sys-msg{background:#1a242f;border-left:2px solid #d0b040;padding:8px;font-size:9px;color:#9a9a7a;line-height:1.3;border-radius:0 6px 6px 0}
.chat-input{padding:8px;border-top:1px solid #1e2a32;display:flex;gap:6px;background:#12181e}
.chat-input input{flex:1;background:#0a0e14;border:1px solid #1e2a32;border-radius:6px;padding:8px;font-size:11px;color:#d8d2b8;outline:none}
.chat-input button{width:32px;background:#e6d5a0;border:none;border-radius:6px;cursor:pointer;font-weight:800;color:#12181e}
</style>
</head>
<body>
<div class="bg"><img src="assets/heroes/bg-battlefield.webp" onerror="this.style.display='none'"></div>
<div class="wrap">
    <div class="left-nav">
    <div onclick="location.href='./page3.html'"><div class="nav-item">👤</div><div class="nav-label">HERO</div></div>
    <div onclick="location.href='./page4.html'"><div class="nav-item">🎒</div><div class="nav-label">BAG</div></div>
    <div onclick="location.href='./page5.html'"><div class="nav-item">📜</div><div class="nav-label">SKILLS</div></div>
    <div onclick="location.href='./page6.html'"><div class="nav-item active">⚔️</div><div class="nav-label">BATTLE</div></div>
    <div onclick="location.href='./index.html'"><div class="nav-item">🗺️</div><div class="nav-label">MAP</div></div>
  </div>
  <div class="main">
    <div class="bf-header">
      <div>
        <div class="bf-title">BATTLEFIELD</div>
        <div class="bf-sub">ВЫБЕРИ АРЕНУ — 8 БОЕВ [1..8] — СТАТЫ = BASE + ШМОТ С PAGE4</div>
      </div>
      <div class="bf-stats" id="heroStats">LOADING...</div>
    </div>
    <div class="bf-grid" id="bfGrid"></div>
  </div>
  <div class="right">
    <div class="chat-header"><div class="dot"></div><div class="chat-title">CHAT 200PX</div></div>
    <div class="chat-body" id="chatBody"><div class="sys-msg">Система: Battlefield загружен — выбери арену 1-8</div></div>
    <div class="chat-input"><input id="chatIn" placeholder="..."><button id="chatBtn">▶</button></div>
  </div>
</div>
<script>
const DB={
'necro-f-new':{n:'AMETHYST',st:{HP:1000,DEF:100,DMG:240,MANA:280,CRIT:15,DODGE:12}},
'necro-m':{n:'GRAVELORD',st:{HP:1150,DEF:110,DMG:190,MANA:260,CRIT:10,DODGE:8}},
'archer-f':{n:'WILD PATH',st:{HP:980,DEF:90,DMG:210,MANA:200,CRIT:25,DODGE:20}},
'archer-m':{n:'DARK RANGER',st:{HP:1020,DEF:95,DMG:230,MANA:210,CRIT:20,DODGE:18}},
'archmage-m':{n:'AZURE SAGE',st:{HP:900,DEF:80,DMG:260,MANA:320,CRIT:18,DODGE:10}},
'mage-f-new':{n:'VOLCANIC',st:{HP:950,DEF:85,DMG:280,MANA:300,CRIT:22,DODGE:11}},
'warrior-f':{n:'IRON VOW',st:{HP:1250,DEF:160,DMG:175,MANA:180,CRIT:12,DODGE:9}},
'warrior-m':{n:'LION WARDEN',st:{HP:1300,DEF:180,DMG:180,MANA:220,CRIT:8,DODGE:7}},
};
const ITEMS=[
 {id:'head', bonus:{DMG:20,DEF:10}}, {id:'ear1', bonus:{CRIT:1,DMG:5}}, {id:'ear2', bonus:{CRIT:1,DODGE:2}},
 {id:'amulet', bonus:{MANA:50,CRIT:2}}, {id:'armor', bonus:{HP:100,DEF:30}}, {id:'weapon', bonus:{DMG:40}},
 {id:'shield', bonus:{DEF:60,HP:50}}, {id:'ring1', bonus:{DMG:15,CRIT:1}}, {id:'ring2', bonus:{MANA:30,DODGE:1}},
 {id:'gloves', bonus:{DEF:15,DMG:10}}, {id:'boots', bonus:{DEF:20,DODGE:2,HP:20}},
];
const GEAR_KEY='voland_equip';
function getEquipped(){
  try{ let s=JSON.parse(localStorage.getItem(GEAR_KEY)||'{}'); let eq={}; for(let k in s){ let it=ITEMS.find(x=>x.id===s[k]); if(it) eq[k]=it; } return eq; }catch(e){ return {}; }
}
function calcStats(){
  let heroId=localStorage.getItem('voland_hero')||'mage-f-new';
  if(!DB[heroId]) heroId='mage-f-new';
  let base=DB[heroId].st;
  let cur={...base};
  let eq=getEquipped();
  for(let slot in eq){ for(let k in eq[slot].bonus){ cur[k]=(cur[k]||0)+eq[slot].bonus[k]; } }
  return {cur, heroId, heroName: DB[heroId].n};
}
const ARENAS=[
 {id:1, name:'ARENA 1', icon:'⚔️', lvl:'LVL 3', reward:'+50 XP', active:true},
 {id:2, name:'ARENA 2', icon:'🛡️', lvl:'LVL 4', reward:'+75 XP', active:true},
 {id:3, name:'ARENA 3', icon:'🔥', lvl:'LVL 5', reward:'+100 XP', active:true},
 {id:4, name:'ARENA 4', icon:'💀', lvl:'LVL 6', reward:'+125 XP', active:false},
 {id:5, name:'ARENA 5', icon:'🌋', lvl:'LVL 7', reward:'+150 XP', active:false},
 {id:6, name:'ARENA 6', icon:'⚡', lvl:'LVL 8', reward:'+200 XP', active:false},
 {id:7, name:'ARENA 7', icon:'👑', lvl:'LVL 9', reward:'+300 XP', active:false},
 {id:8, name:'ARENA 8', icon:'🐉', lvl:'LVL 10', reward:'BOSS', active:false},
];
function renderStats(){
  let {cur, heroId, heroName}=calcStats();
  document.getElementById('heroStats').innerHTML=`${heroName} • ${heroId.toUpperCase()}<br>HP ${cur.HP} • DMG ${cur.DMG} • DEF ${cur.DEF}<br>MANA ${cur.MANA} • CRIT ${cur.CRIT}% • DODGE ${cur.DODGE}%`;
}
function renderGrid(){
  let grid=document.getElementById('bfGrid');
  grid.innerHTML=ARENAS.map(a=>`
    <div class="battle-card ${a.active?'':'locked'} ${a.id===1?'active':''}" data-id="${a.id}" onclick="enterBattle(${a.id})">
      <div class="card-num">0${a.id}</div>
      <div class="card-icon">${a.icon}</div>
      <div class="card-name">${a.name}</div>
      <div class="card-lvl">${a.lvl}</div>
      <div class="card-reward">${a.reward}</div>
    </div>
  `).join('');
}
function enterBattle(id){
  let a=ARENAS.find(x=>x.id===id);
  if(!a.active){ log(`Арена ${id} заблокирована — пройди предыдущие`); return; }
  let {cur}=calcStats();
  log(`Вход в ${a.name} — ${a.lvl} — статы: HP ${cur.HP} DMG ${cur.DMG} DEF ${cur.DEF}`);
  document.querySelectorAll('.battle-card').forEach(c=>c.classList.remove('active'));
  let el=document.querySelector(`.battle-card[data-id="${id}"]`);
  if(el) el.classList.add('active');
}
function log(msg){ const d=document.createElement('div'); d.className='sys-msg'; d.textContent=msg; document.getElementById('chatBody').appendChild(d); document.getElementById('chatBody').scrollTop=9999; }
renderStats(); renderGrid();
setInterval(renderStats, 1000);
const chatIn=document.getElementById('chatIn'); const chatBtn=document.getElementById('chatBtn');
chatBtn.onclick=()=>{ const v=chatIn.value.trim(); if(!v) return; log('Ты: '+v); chatIn.value=''; };
chatIn.addEventListener('keydown',e=>{ if(e.key==='Enter') chatBtn.click(); });
</script>
</body>
</html>
