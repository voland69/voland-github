<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOLAND - BATTLEFIELD</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background: url("./assets/heroes/bg-battlefield.webp") center top/cover no-repeat fixed #0a0e14;color:#a8b8cb;font-family:Inter,Arial,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0}.bg img{width:100%;height:100%;object-fit:cover;opacity:1}.bg:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,0)}
.wrap{position:fixed;inset:0;display:flex;z-index:2;gap:18px}
.left-nav{width:78px;min-width:78px;background:transparent;border:none;display:flex;flex-direction:column;align-items:center;padding:12px 6px;gap:18px}
.nav-item{width:46px;height:46px;background:rgba(20,28,38,0.28);border:1px solid rgba(201,169,110,0.22);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px);font-size:20px;transition:.2s}
.nav-item.active{background:linear-gradient(135deg,#c9a96e,#f2d492);border-color:#f2d492;box-shadow:0 0 12px rgba(201,169,110,0.3)}
.nav-label{font-size:7px;letter-spacing:.15em;color:#9fb0c5;margin-top:4px;text-align:center;font-family:'JetBrains Mono',monospace}
.center-col{flex:1;display:flex;flex-direction:column;gap:18px;overflow:auto;padding:18px 12px 18px 0}
.bf-window{background:rgba(20,26,34,0.32);backdrop-filter:blur(10px);border:1px solid rgba(122,144,168,0.18);border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,0.2);overflow:hidden}
.bf-window-header{height:40px;background:linear-gradient(90deg,rgba(46,58,74,0.55),rgba(40,52,68,0.45));display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:8px;border-bottom:1px solid rgba(122,144,168,0.18)}
.dot{width:7px;height:7px;border-radius:50%;background:#7a90a8}
.window-title{font-family:'Cinzel Decorative',serif;font-size:11px;letter-spacing:.25em;color:#c9a96e;font-weight:700}
.bf-window-body{background:rgba(32,42,56,0.15);padding:12px}
.locs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.loc-card{background:rgba(26,36,47,0.32);border:1px solid rgba(122,144,168,0.18);border-radius:8px;padding:14px;text-align:center;cursor:pointer;backdrop-filter:blur(4px)}
.loc-card.active{border-color:#c9a96e;box-shadow:0 0 12px rgba(201,169,110,0.25)}
.enemy-card{background:rgba(26,36,47,0.32);border:1px solid rgba(122,144,168,0.18);border-radius:8px;padding:10px;text-align:center;cursor:pointer}
.battle-top{display:flex;gap:12px}
.hero-battle-panel{width:220px;min-width:220px;background:rgba(20,26,34,0.45);border:1px solid rgba(122,144,168,0.18);border-radius:8px;overflow:hidden;backdrop-filter:blur(4px)}
.hero-battle-img-wrap{flex:1;background:#0a0e12;display:flex;align-items:center;justify-content:center;min-height:260px}
.hero-battle-img-wrap img{width:100%;height:260px;object-fit:cover;object-position:top center}
.skill-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
.skill-btn{background:rgba(20,28,38,0.28);border:1px solid rgba(122,144,168,0.18);border-radius:8px;padding:8px;display:flex;flex-direction:column;align-items:center;cursor:pointer;min-height:92px;backdrop-filter:blur(4px)}
.skill-btn img{width:52px;height:52px;border-radius:8px;object-fit:cover;border:1px solid rgba(122,144,168,0.18);background:#0a0e14}
.right{width:200px;min-width:200px;background:rgba(18,24,34,0.38);border-left:1px solid rgba(122,144,168,0.14);display:flex;flex-direction:column;backdrop-filter:blur(10px)}
.chat-header{height:40px;background:linear-gradient(90deg,rgba(46,58,74,0.55),rgba(40,52,68,0.45));border-bottom:1px solid rgba(122,144,168,0.18);display:flex;align-items:center;gap:8px;padding:0 12px}
.chat-body{flex:1;padding:10px;overflow:auto;display:flex;flex-direction:column;gap:8px;background:rgba(32,42,56,0.15)}
.sys-msg{background:rgba(26,36,47,0.32);border-left:2px solid #c9a96e;padding:8px;font-size:9px;color:#a8b8cb;line-height:1.3;border-radius:0 6px 6px 0;font-family:'JetBrains Mono',monospace}
</style>
</head>
<body>
<div class="bg"><img src="assets/heroes/bg-battlefield.webp" onerror="this.style.display='none'"></div>
<div class="wrap">
  <div class="left-nav">
    <div onclick="location.href='./page3.html'"><div class="nav-item">👤</div><div class="nav-label">HERO</div></div>
    <div onclick="location.href='./page4.html'"><div class="nav-item">🎒</div><div class="nav-label">BAG</div></div>
    <div onclick="location.href='./page5.html'"><div class="nav-item">📜</div><div class="nav-label">SKILLS</div></div>
    <div><div class="nav-item active">⚔️</div><div class="nav-label">BATTLE</div></div>
    <div onclick="location.href='./index.html'"><div class="nav-item">🗺️</div><div class="nav-label">MAP</div></div>
  </div>
  <div class="center-col">
    <div class="bf-window"><div class="bf-window-header"><div class="dot"></div><div class="window-title">BATTLEFIELD</div></div><div class="bf-window-body"><div class="locs-grid" id="locsGrid"></div></div></div>
    <div class="bf-window"><div class="bf-window-header"><div class="dot"></div><div class="window-title" id="enemiesTitle">ВРАГИ</div></div><div class="bf-window-body"><div class="enemies-grid" id="enemiesGrid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"></div></div></div>
    <div class="bf-window"><div class="bf-window-header"><div class="dot"></div><div class="window-title">БИТВА</div></div><div class="bf-window-body">
      <div class="battle-top">
        <div class="hero-battle-panel"><div class="hero-battle-img-wrap"><img id="heroBattleImg" src="assets/heroes/warrior-m.webp"></div><div style="padding:10px;text-align:center"><div id="heroBattleName" style="font-family:Cinzel Decorative;font-size:12px;color:#c9a96e">LION WARDEN</div><div id="heroHpLabel" style="font-family:JetBrains Mono;font-size:7px;color:#7a90a8;margin-top:4px">HP</div></div></div>
        <div style="flex:1;background:rgba(20,26,34,0.32);border:1px solid rgba(122,144,168,0.18);border-radius:8px;padding:10px"><div id="battleLog" style="display:flex;flex-direction:column;gap:6px"></div></div>
        <div class="hero-battle-panel"><div style="padding:20px;text-align:center"><div id="enemyBattleIcon" style="font-size:64px">🐭</div><div id="enemyBattleName" style="font-size:10px;color:#c9a96e;font-family:JetBrains Mono">ПЕСЧАНАЯ МЫШЬ</div><div id="enemyHpLabel" style="font-size:7px;color:#7a90a8;margin-top:8px">450/450</div></div></div>
      </div>
      <div class="skill-bar" id="skillBar"></div>
    </div></div>
  </div>
  <div class="right"><div class="chat-header"><div class="dot"></div><div class="window-title" style="font-size:8px">CHAT 200PX</div></div><div class="chat-body" id="chatBody"><div class="sys-msg">Система: Battlefield v2 — bg-battlefield.webp виден --bg:0, скилы реальные картинки</div></div><div style="padding:8px;border-top:1px solid rgba(122,144,168,0.14);display:flex;gap:6px"><input id="chatIn" placeholder="..."><button id="chatBtn" style="width:32px;background:#c9a96e;border:none;border-radius:6px;cursor:pointer">▶</button></div></div>
</div>
<script src="./assets/js/db.js"></script>
<script src="./assets/js/storage.js"></script>
<script>
let heroId=localStorage.getItem('voland_hero')||'warrior-m'; if(!VOLAND_HEROES[heroId]) heroId='warrior-m'; let heroData=VOLAND_HEROES[heroId];
let curLoc=1, curEnemyStage=1, cur=volandCalcStats?volandCalcStats().cur:{HP:1300,MANA:220,DMG:180,DEF:180};
function log(m){let d=document.createElement('div');d.className='sys-msg';d.textContent=m;document.getElementById('battleLog').appendChild(d);let c=document.createElement('div');c.className='sys-msg';c.textContent=m;document.getElementById('chatBody').appendChild(c);}
document.getElementById('heroBattleImg').src=heroData.img; document.getElementById('heroBattleName').textContent=heroData.n;
document.getElementById('locsGrid').innerHTML=VOLAND_LOCATIONS.map(l=>`<div class="loc-card ${l.id==curLoc?'active':''}" onclick="curLoc=${l.id};renderEnemies()"><div style="font-size:28px">${l.icon}</div><div style="font-size:10px;color:#c9a96e;font-family:JetBrains Mono">${l.name}</div><div style="font-size:7px;color:#7a90a8">${l.type}</div></div>`).join('');
function renderEnemies(){let en=VOLAND_ENEMIES[curLoc]||VOLAND_ENEMIES[1];document.getElementById('enemiesGrid').innerHTML=en.map(e=>`<div class="enemy-card" onclick="document.getElementById('enemyBattleName').textContent='${e.name}';document.getElementById('enemyBattleIcon').textContent='${e.icon}'"><div style="font-size:26px">${e.icon}</div><div style="font-size:8px;color:#e6d5a0;font-family:JetBrains Mono">${e.name}</div><div style="font-size:6px;color:#7a90a8">${e.lvl}</div></div>`).join('');}
renderEnemies();
document.getElementById('skillBar').innerHTML=heroData.sk.slice(1,5).map(s=>`<div class="skill-btn"><img src="${s[2][0]}" onerror="this.style.display='none'"><div style="font-size:8px;color:#c9a96e;margin-top:6px;font-family:JetBrains Mono">${s[0]}</div><div style="font-size:6px;color:#7a90a8">${s[1]}</div></div>`).join('')+`<div class="skill-btn"><img src="./assets/heroes/icon_udar_lva.jpg"><div style="font-size:8px;color:#c9a96e;margin-top:6px">АТАКА</div></div>`;
document.getElementById('chatBtn').onclick=()=>{let v=document.getElementById('chatIn').value.trim();if(!v)return;log('Ты: '+v);document.getElementById('chatIn').value='';};
</script>
</body>
</html>
