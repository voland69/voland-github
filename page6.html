        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=JetBrains+Mono:wght@400;600&display=swap');
        * { box-sizing: border-box; }
        html, body { margin:0; padding:0; background: #0a0e14; }
        .app-root {
          position: relative;
          min-height: 100vh;
          min-height: 100dvh;
          width: 100%;
          background: #0a0e14;
          overflow-x: clip;
          padding-top: var(--safe-area-inset-top, 0px);
          box-sizing: border-box;
          font-family: 'JetBrains Mono', monospace;
        }
        .bg {
          position: fixed;
          inset: 0;
          z-index: 0;
          width: 100%;
          height: 100%;
          pointer-events: none;
          background: #0a0e14;
        }
        .bg::after {
          content: "";
          position: absolute;
          inset: 0;
          background: rgba(0,0,0,0);
        }
        /* Fallback castle illustration when asset missing */
        .bg-fallback {
          position: absolute;
          inset: 0;
          background: 
            radial-gradient(ellipse at 50% 20%, rgba(230,213,160,0.08) 0%, transparent 60%),
            linear-gradient(to bottom, #0f1a24 0%, #0a0e14 40%, #121821 100%);
        }
        .bg-fallback::before {
          content: "";
          position: absolute;
          left: 50%;
          top: 48%;
          transform: translate(-50%, -50%);
          width: 78%;
          height: 68%;
          background:
            linear-gradient(180deg, rgba(18,28,38,0.6) 0%, rgba(10,14,20,0.9) 100%);
          border: 1px solid rgba(230,213,160,0.07);
          filter: blur(0.3px);
          opacity: 0.6;
          clip-path: polygon(0 100%, 0 30%, 8% 28%, 12% 18%, 18% 20%, 22% 10%, 28% 12%, 32% 4%, 38% 8%, 42% 2%, 50% 6%, 58% 2%, 62% 8%, 68% 4%, 72% 12%, 78% 10%, 82% 20%, 88% 18%, 92% 28%, 100% 30%, 100% 100%);
        }

        .wrap {
          position: fixed;
          inset: 0;
          display: flex;
          z-index: 2;
          top: var(--safe-area-inset-top, 0px);
          height: calc(100vh - var(--safe-area-inset-top, 0px));
          height: calc(100dvh - var(--safe-area-inset-top, 0px));
        }

        /* LEFT NAV */
        .left-nav {
          width: 68px;
          min-width: 68px;
          background: rgba(18,24,30,.35);
          border-right: 1px solid rgba(30,42,50,.5);
          display: flex;
          flex-direction: column;
          align-items: center;
          padding: 12px 6px;
          gap: 18px;
          backdrop-filter: blur(2px);
          -webkit-backdrop-filter: blur(2px);
        }
        .nav-item {
          width: 48px;
          height: 48px;
          background: #1a252f;
          border: 1px solid #2a3a4a;
          border-radius: 10px;
          opacity: 0.6;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 2px;
          cursor: pointer;
          text-decoration: none;
          transition: all .2s ease;
          position: relative;
        }
        .nav-item:hover {
          opacity: 0.9;
          border-color: #3a4a5a;
          transform: translateY(-1px);
        }
        .nav-item.active {
          background: #1e2f3e;
          border-color: #3a4a5a;
          opacity: 1;
          box-shadow: 0 0 12px rgba(230,213,160,.2);
        }
        .nav-item.active::before {
          content: "";
          position: absolute;
          left: -7px;
          top: 50%;
          transform: translateY(-50%);
          width: 3px;
          height: 24px;
          background: #e6d5a0;
          border-radius: 0 3px 3px 0;
          box-shadow: 0 0 8px rgba(230,213,160,.6);
        }
        .nav-icon {
          font-size: 18px;
          line-height: 1;
          filter: grayscale(0.2);
        }
        .nav-item.active .nav-icon { filter: none; }
        .nav-label {
          font-size: 7px;
          letter-spacing: .12em;
          color: #6a7a8a;
          font-weight: 600;
          margin-top: 1px;
        }
        .nav-item.active .nav-label { color: #e6d5a0; }

        /* CENTER */
        .center {
          flex: 1;
          display: flex;
          flex-direction: column;
          padding: 40px 32px;
          overflow: auto;
          overflow-x: hidden;
          background: rgba(16,22,30,0.08);
          backdrop-filter: blur(2px);
          -webkit-backdrop-filter: blur(2px);
        }
        .center::-webkit-scrollbar { width: 4px; }
        .center::-webkit-scrollbar-thumb { background: rgba(122,144,168,0.2); border-radius: 2px; }

        .battle-header {
          font-family: 'Cinzel Decorative', serif;
          font-size: 32px;
          font-weight: 900;
          letter-spacing: .25em;
          color: #e6d5a0;
          text-shadow: 0 2px 12px rgba(0,0,0,0.6), 0 0 24px rgba(230,213,160,0.15);
          line-height: 1.1;
          margin: 8px 0 0 0;
          text-transform: uppercase;
        }
        .header-underline {
          margin-top: 12px;
          width: 88px;
          height: 2px;
          background: linear-gradient(90deg, #e6d5a0 0%, rgba(230,213,160,0) 100%);
          opacity: 0.7;
        }

        .cards-grid {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 24px;
          margin-top: 40px;
          max-width: 1100px;
          width: 100%;
        }

        .loc-card {
          background: rgba(20,26,34,0.82);
          border: 1px solid rgba(122,144,168,0.18);
          border-radius: 12px;
          padding: 32px 24px 28px;
          text-align: center;
          backdrop-filter: blur(10px);
          -webkit-backdrop-filter: blur(10px);
          box-shadow: 0 4px 18px rgba(0,0,0,0.2);
          cursor: pointer;
          transition: all .22s ease;
          position: relative;
          overflow: hidden;
        }
        .loc-card::before {
          content: "";
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse at 50% 0%, rgba(230,213,160,0.06) 0%, transparent 70%);
          opacity: 0;
          transition: opacity .22s ease;
          pointer-events: none;
        }
        .loc-card:hover {
          border-color: #e6d5a0;
          transform: translateY(-3px);
          box-shadow: 0 8px 28px rgba(0,0,0,0.35), 0 0 18px rgba(230,213,160,0.12);

          border-color: #e6d5a0;
          box-shadow: 0 0 0 1px rgba(230,213,160,.4), 0 8px 28px rgba(0,0,0,0.35), 0 0 20px rgba(230,213,160,0.18);
          background: rgba(28,36,48,0.9);
        }

        .loc-label {
          position: absolute;
          top: 12px;
          left: 14px;
          font-size: 8px;
          letter-spacing: .2em;
          color: #6a7a8a;
          font-family: 'JetBrains Mono', monospace;
          font-weight: 600;
        }
        .loc-dot {
          position: absolute;
          top: 14px;
          right: 14px;
          width: 6px;
          height: 6px;
          border-radius: 50%;
          background: #3a4a5a;
          transition: all .2s;
        }
        .loc-card:hover .loc-dot, .loc-card.selected .loc-dot {
          background: #e6d5a0;
          box-shadow: 0 0 6px rgba(230,213,160,.8);
        }

        .loc-icon {
          font-size: 48px;
          line-height: 1;
          margin: 10px auto 6px;
          display: block;
          filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
          transition: transform .22s ease;
        }
        .loc-card:hover .loc-icon { transform: scale(1.08); }

        .loc-title {
          font-family: 'Cinzel Decorative', serif;
          font-size: 14px;
          letter-spacing: .15em;
          color: #e6d5a0;
          margin-top: 16px;
          font-weight: 700;
          line-height: 1.3;
          text-transform: uppercase;
        }
        .loc-sub {
          font-size: 9px;
          color: #7a8a9a;
          letter-spacing: .08em;
          margin-top: 10px;
          font-family: 'JetBrains Mono', monospace;
          text-transform: uppercase;
        }

        /* RIGHT CHAT */
        .right {
          width: 200px;
          min-width: 200px;
          background: rgba(14,20,26,.9);
          border-left: 1px solid rgba(30,42,50,.5);
          display: flex;
          flex-direction: column;
          backdrop-filter: blur(2px);
          -webkit-backdrop-filter: blur(2px);
        }
        .chat-header {
          padding: 12px 14px;
          border-bottom: 1px solid #1e2a32;
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .chat-dot {
          width: 8px;
          height: 8px;
          background: #3ad080;
          border-radius: 50%;
          box-shadow: 0 0 8px rgba(58,208,128,0.6);
          flex-shrink: 0;
        }
        .chat-title {
          font-size: 9px;
          letter-spacing: .2em;
          color: #6a7a8a;
          font-family: 'JetBrains Mono', monospace;
          font-weight: 600;
          text-transform: uppercase;
        }
        .chat-body {
          flex: 1;
          padding: 10px;
          overflow: auto;
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
        .chat-body::-webkit-scrollbar { width: 3px; }
        .chat-body::-webkit-scrollbar-thumb { background: rgba(122,144,168,0.2); }
        .msg {
          font-size: 11px;
          line-height: 1.4;
          padding: 8px 10px;
          border-radius: 8px;
          background: rgba(26,37,47,0.6);
          border: 1px solid rgba(42,58,74,0.4);
          color: #9aa8b8;
        }
        .msg.sys {
          background: rgba(230,213,160,0.06);
          border-color: rgba(230,213,160,0.12);
          color: #b8a882;
        }
        .msg-user {
          font-size: 8px;
          letter-spacing: .12em;
          color: #5a6a7a;
          margin-bottom: 3px;
          text-transform: uppercase;
          font-weight: 600;
        }
        .msg.sys .msg-user { color: #8a7a5a; }

        .chat-input-wrap {
          padding: 10px;
          border-top: 1px solid #1e2a32;
          display: flex;
          gap: 8px;
        }
        .chat-input {
          flex: 1;
          background: rgba(18,24,30,0.8);
          border: 1px solid rgba(42,58,74,0.6);
          border-radius: 6px;
          padding: 8px 10px;
          font-size: 11px;
          color: #c8d4e0;
          outline: none;
          font-family: 'JetBrains Mono', monospace;
        }
        .chat-input:focus { border-color: #3a4a5a; }
        .chat-send {
          width: 32px;
          height: 32px;
          background: #1a252f;
          border: 1px solid #2a3a4a;
          border-radius: 6px;
          color: #6a7a8a;
          cursor: pointer;
          display: grid;
          place-items: center;
          transition: all .15s;
        }
        .chat-send:hover { border-color: #e6d5a0; color: #e6d5a0; background: #1e2f3e; }

        /* RESPONSIVE */
        @media (max-width: 1100px) {
          .cards-grid { grid-template-columns: repeat(2, 1fr); max-width: 720px; }
        }
        @media (max-width: 768px) {
          .wrap { flex-direction: row; }
          .center { padding: 24px 16px; }
          .battle-header { font-size: 24px; letter-spacing: .18em; }
          .cards-grid { grid-template-columns: 1fr; gap: 16px; margin-top: 28px; }
          .right { display: none; }
          .left-nav { width: 56px; min-width: 56px; gap: 14px; padding: 10px 4px; }
          .nav-item { width: 42px; height: 42px; }
          .nav-icon { font-size: 16px; }
        }
        @media (max-width: 390px) {
          .app-root { overflow-x: clip; }
          .wrap { width: 100%; }
          .center { padding: 20px 12px; }
          .battle-header { font-size: 20px; }
        }
