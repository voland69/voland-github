<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOLAND - BATTLE</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/nav.css">
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:url("./assets/heroes/bg-battlefield.webp") center/cover no-repeat fixed #0a0e14;color:#d8d2b8;font-family:Inter,Arial,sans-serif;overflow:hidden}.bg{position:fixed;inset:0;z-index:0}.bg img{width:100%;height:100%;object-fit:cover;display:block}.wrap{position:fixed;inset:0;display:flex;z-index:2}.center{flex:1;padding:24px;overflow:auto;background:rgba(16,22,30,.08);backdrop-filter:blur(1px);display:flex;flex-direction:column;align-items:center}.title{font:900 32px 'Cinzel Decorative',serif;color:#e6d5a0;letter-spacing:.06em;text-align:center}.sub{margin-top:6px;font:8px 'JetBrains Mono',monospace;letter-spacing:.32em;color:#7a90a8;text-transform:uppercase}.loc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;width:100%;max-width:1100px;margin-top:24px}.loc-card{background:rgba(20,26,34,.82);border:1px solid rgba(122,144,168,.18);border-radius:12px;padding:30px 18px;text-align:center;backdrop-filter:blur(10px);box-shadow:0 12px 40px rgba(0,0,0,.4);cursor:pointer;transition:.2s}.loc-card:hover{border-color:#e6d5a0;transform:translateY(-2px)}.loc-card.soon{opacity:.45;cursor:default;border-style:dashed;background:rgba(20,26,34,.5);pointer-events:none}.loc-icon{font-size:36px;margin-bottom:12px}.loc-name{font:700 13px Inter,sans-serif;letter-spacing:.08em;color:#e6d5a0;text-transform:uppercase}.loc-name span{display:block;font:400 10px 'JetBrains Mono',monospace;color:#7a90a8;margin-top:4px}.loc-type{margin-top:10px;font:7px 'JetBrains Mono',monospace;color:#8ea0b0;letter-spacing:.2em;text-transform:uppercase}.loc-lvl{margin-top:10px;font:600 9px 'JetBrains Mono',monospace;color:#e6d5a0}.soon-badge{margin-top:12px;font:900 11px 'JetBrains Mono',monospace;letter-spacing:.25em;color:#5a6e80;border:1px solid #3a4a5a;border-radius:6px;padding:4px 8px;display:inline-block;background:rgba(0,0,0,.2)}.right{width:200px;min-width:200px;background:rgba(14,20,26,.9);border-left:1px solid rgba(30,42,50,.6);display:flex;flex-direction:column;backdrop-filter:blur(6px);margin-top:48px;height:calc(100% - 48px)}.chat-head{height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid rgba(30,42,50,.5)}.dot{width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80}.chat-title{font:7px 'JetBrains Mono',monospace;letter-spacing:.2em;color:#e6d5a0}.chat-body{flex:1;padding:12px;overflow:auto;display:flex;flex-direction:column;gap:8px}.sys-msg{font:10px 'JetBrains Mono',monospace;color:#5a6e80;line-height:1.4;background:rgba(122,144,168,.08);border-radius:6px;padding:8px}.chat-input{border-top:1px solid rgba(30,42,50,.5);display:flex;gap:6px;padding:8px;background:#12181e}.chat-input input{flex:1;background:rgba(20,26,34,.8);border:1px solid rgba(42,58,74,.6);border-radius:6px;padding:7px 8px;font:10px 'JetBrains Mono',monospace;color:#c9d6e2;outline:none}.chat-input button{background:#1e2f3e;border:1px solid #e6d5a0;border-radius:6px;padding:0 10px;font:10px 'JetBrains Mono',monospace;color:#e6d5a0;cursor:pointer}@media(max-width:900px){.loc-grid{grid-template-columns:1fr}}.main,.center,.center-col,.hero-panel{
  position:relative !important;
  z-index:1 !important;
}.wrap{
  display:flex !important;
  position:fixed !important;
  inset:0 !important;
}</style>
</head>
<body>
<div class="bg"><img src="./assets/heroes/bg-battlefield.webp"></div>
<div class="wrap">
  <div class="left-nav" id="voland-nav"></div>

  

  


<main class="center">
<div class="title" id="bfTitle">BATTLEFIELD</div>
<div class="sub">VOLAND • 6 ACTIVE + 2 SOON</div>
<div class="loc-grid" id="locGrid"></div>
</main>
<aside class="right">
<div class="chat-head"><div class="dot"></div><div class="chat-title">VOLAND • COMMS</div></div>
<div class="chat-body" id="chatBody"><div class="sys-msg">SYS: Battlefield — LVL 1 / 5 / 10 fixed</div></div>
<div class="chat-input"><input id="chatIn" placeholder="transmit..."><button id="sendBtn">›</button></div>
</aside>
</div>
<script src="./assets/js/lang.js"></script>
<script src="./assets/js/config.js"></script>
<script src="./assets/js/db/heroes.js"></script>
<script src="./assets/js/db/tiers.js"></script>
<script src="./assets/js/db/resources.js"></script>
<script src="./assets/js/db/items.js"></script>
<script src="./assets/js/db/starter.js"></script>
<script src="./assets/js/db/locations.js"></script>
<script src="./assets/js/db/enemies.js"></script>
<script src="./assets/js/db/missions.js"></script>
<script src="./assets/js/storage.js"></script>
<script>
const LVLS=[1,5,10,15,20,25];
function render(){
  try{ let t=document.getElementById('bfTitle'); if(t) t.textContent = volandT('ПОЛЕ СРАЖЕНИЯ', 'BATTLEFIELD'); }catch(e){}
 const g=document.getElementById('locGrid');
 let a=[],s=[];
 try{
  if(window.VOLAND_LOCATIONS){
   a=VOLAND_LOCATIONS.filter(l=>l.active).slice(0,6);
   s=VOLAND_LOCATIONS.filter(l=>!l.active).slice(0,2);
  }
 }catch(e){}
 if(!a.length) a=[{id:1,name:volandT('ПУСТЫНЯ', 'DESERT'),eng:'DESERT',icon:'🏜️',img:'./assets/enemies/bg-desert-dark.jpg',type:volandT('Жара • Песок', 'Heat • Sand')},{id:2,name:volandT('ТЕМНЫЙ ЛЕС', 'DARK FOREST'),eng:'DARK FOREST',icon:'🌲',img:'./assets/enemies/bg-dark-forest.webp',type:volandT('Тень • Яд', 'Shadow • Poison')},{id:3,name:volandT('ЛЕДЯНЫЕ ЗЕМЛИ', 'FROSTLANDS'),eng:'FROSTLANDS',icon:'❄️',img:'./assets/enemies/bg-frostlands.webp',type:volandT('Холод • Лед', 'Cold • Ice')},{id:4,name:volandT('БОЛОТО', 'SWAMP'),eng:'SWAMP',icon:'🐊',img:'./assets/enemies/bg-swamp.webp',type:volandT('Токсин • Вода', 'Toxin • Water')},{id:5,name:volandT('ВУЛКАН', 'VOLCANO'),eng:'VOLCANO',icon:'🌋',img:'./assets/enemies/bg-volcano.webp',type:volandT('Огонь • Лава', 'Fire • Lava')},{id:6,name:volandT('РУИНЫ', 'RUINS'),eng:'RUINS',icon:'🏛️',img:'./assets/enemies/bg-ruins.webp',type:volandT('Кость • Камень', 'Bone • Stone')}];
 if(!s.length) s=[{id:7,name:volandT('НЕБЕСА', 'HEAVENS'),eng:'SKY ISLANDS',icon:'☁️'},{id:8,name:volandT('БЕЗДНА', 'ABYSS'),eng:'ABYSS',icon:'🕳️'}];
 try{  }catch(e){}
 const top=a.map((l,i)=>{
  let fallback = l.id==1 ? './assets/enemies/bg-desert-dark.jpg' : l.id==2 ? './assets/enemies/bg-dark-forest.webp' : l.id==3 ? './assets/enemies/bg-frostlands.webp' : null;
  let img = l.img || fallback;
  let hasBg = !!img;
  let bgStyle = hasBg ? `background: linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.65)), url('${img}') center/cover no-repeat` : '';
  let iconHtml = hasBg ? '' : `<div class="loc-icon">${l.icon}</div>`;
  return `<div class="loc-card ${hasBg?'has-bg':''}" style="${bgStyle}" onclick="pickLoc('${l.id}')">${iconHtml}<div class="loc-name">${(volandGetLang()==='en'?l.eng:l.name)}</div><div class="loc-lvl">LVL ${LVLS[i]} • ${volandT('ВХОД', 'ENTER')}</div></div>`;
 }).join('');
 const bottom=s.map(l=>`<div class="loc-card soon"><div class="loc-icon">${l.icon}</div><div class="loc-name">${(volandGetLang()==='en'?l.eng:l.name)}</div><div class="loc-type">SOON</div><div class="soon-badge">SOON</div></div>`).join('');
 g.innerHTML=top+bottom;
}
function pickLoc(id){try{localStorage.setItem('voland_location',id);}catch(e){}location.href='./page7.html?loc='+id;}
function sendChat(){const i=document.getElementById('chatIn'),b=document.getElementById('chatBody');if(!i.value.trim())return;const d=document.createElement('div');d.className='sys-msg';d.style.color='#c9d6e2';d.textContent='YOU: '+i.value;b.appendChild(d);i.value='';b.scrollTop=9999;}
document.getElementById('sendBtn').onclick=sendChat;
document.getElementById('chatIn').onkeydown=e=>{if(e.key==='Enter')sendChat();};
render();
</script>
<script src="./assets/js/nav.js"></script>
</body>
</html>
