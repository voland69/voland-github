        .nav-item:hover{opacity:1;border-color:#e6d5a0}
        .nav-item.active{background:#1e2f3e;border-color:#e6d5a0;opacity:1;box-shadow:0 0 12px rgba(230,213,160,.2)}
        .nav-label{font-size:7px;letter-spacing:.15em;color:#6a7a8a;margin-top:4px;text-align:center;font-family:'JetBrains Mono',monospace}
        .nav-wrap{display:flex;flex-direction:column;align-items:center;cursor:pointer}
        .center-col{flex:1;display:flex;flex-direction:column;background:rgba(16,22,30,.25);overflow:hidden;backdrop-filter: blur(2px);overflow:auto}
        .bf-header{padding:16px;text-align:center;background:rgba(19,26,34,.35);border-bottom:1px solid rgba(30,42,50,.5);backdrop-filter: blur(2px)}

        .bf-sub{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.2em;color:#6a7a8a;margin-top:6px}
        .locs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;padding:18px}
        .loc-card{background:rgba(26,36,47,.65);border:1px solid #2a3a4a;border-radius:10px;padding:18px 12px;text-align:center;cursor:pointer;backdrop-filter: blur(2px);transition:.2s}
        .loc-card:hover{border-color:#e6d5a0;box-shadow:0 0 12px rgba(230,213,160,.15);transform:translateY(-1px)}
        .loc-card.active{border-color:#e6d5a0;box-shadow:0 0 16px rgba(230,213,160,.25)}
        .loc-icon{font-size:28px}
        .loc-name{font-family:'Cinzel Decorative',serif;font-size:12px;letter-spacing:.2em;color:#e6d5a0;margin-top:10px;font-weight:700}
        .loc-eng{font-size:7px;letter-spacing:.15em;color:#6a7a8a;margin-top:6px;font-family:'JetBrains Mono'}
        .loc-type{font-size:8px;color:#8a9a8a;margin-top:8px;font-family:'JetBrains Mono'}
        .loc-active{font-size:7px;color:#3ad080;margin-top:8px;letter-spacing:.15em;font-family:'JetBrains Mono'}

        .enemy-card:hover{border-color:#e6d5a0;transform:translateY(-1px)}
        .enemy-card.boss{border-color:#e6d5a0;box-shadow:0 0 10px rgba(230,213,160,.2);background:rgba(40,38,20,.65)}
        .enemy-icon{font-size:32px}

        .enemy-lvl{font-size:7px;color:#6a7a8a;font-family:'JetBrains Mono';margin-top:6px}
        .enemy-stats{font-size:7px;color:#9a9a7a;font-family:'JetBrains Mono';margin-top:6px}

        .hero-battle-info{padding:10px;background:#111821;border-top:1px solid #1e2a32;text-align:center}

        .bar-fill{height:100%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;font-family:'JetBrains Mono',monospace;color:#fff;transition:width .35s ease}
