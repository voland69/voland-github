<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOLAND - BATTLEFIELD</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background: url("./assets/heroes/bg-battlefield.webp") center/cover no-repeat fixed #0a0e14;color:#d8d2b8;font-family:Inter,Arial,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0}.bg:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.42)}
.wrap{position:fixed;inset:0;display:flex;z-index:2}
.left-nav{width:68px;min-width:68px;background:rgba(18,24,30,.35);border-right:1px solid rgba(30,42,50,.5);display:flex;flex-direction:column;align-items:center;padding:12px 6px;gap:18px;backdrop-filter: blur(2px)}
.nav-item{width:48px;height:48px;background:#1a252f;border:1px solid #2a3a4a;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0.6;transition:.2s;font-size:20px}
.nav-item.active{background:#1e2f3e;border-color:#e6d5a0;opacity:1;box-shadow:0 0 12px rgba(230,213,160,.2)}
.nav-label{font-size:7px;letter-spacing:.15em;color:#6a7a8a;margin-top:4px;text-align:center;font-family:'JetBrains Mono',monospace}
.main{flex:1;display:flex;flex-direction:column;background:rgba(16,22,30,.25);backdrop-filter: blur(2px);overflow:auto;padding:22px 26px;align-items:center}
.bf-header{width:100%;max-width:960px;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;border-bottom:1px solid rgba(42,58,74,.5);padding-bottom:12px}
.bf-title{font-family:'Cinzel Decorative',serif;font-size:20px;letter-spacing:.35em;color:#e6d5a0;font-weight:900}
.bf-sub{font-size:7px;letter-spacing:.2em;color:#6a7a8a;font-family:'JetBrains Mono',monospace;margin-top:6px}
.bf-stats{font-size:7px;color:#8a9a6a;font-family:'JetBrains Mono',monospace;text-align:right;line-height:1.6}
.top-actions{width:100%;max-width:960px;display:flex;gap:10px;margin-bottom:14px}
.btn-exit{background:rgba(20,28,36,.85);border:1px solid #2a3a4a;color:#8a9a6a;padding:8px 14px;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;cursor:pointer;transition:.2s}
.btn-exit:hover{border-color:#e6d5a0;color:#e6d5a0;box-shadow:0 0 8px rgba(230,213,160,.15)}
.loc-grid{width:100%;max-width:960px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.loc-card{background:rgba(26,36,47,.88);border:1px solid #2a3a4a;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.2s;position:relative;overflow:hidden;min-height:160px;padding:14px}
.loc-card:hover{border-color:#e6d5a0;background:rgba(30,47,62,.92);box-shadow:0 0 16px rgba(230,213,160,.15);transform:translateY(-2px)}
.loc-card.boss{border-color:#8a6a1a;background:linear-gradient(180deg,rgba(26,36,47,.9),rgba(40,30,15,.6))}
.loc-card.boss:hover{border-color:#d0b040}
.card-num{position:absolute;top:8px;left:10px;font-size:8px;font-family:'JetBrains Mono',monospace;color:#4a5a6a}
.card-icon{font-size:38px;margin-bottom:6px}
.card-name{font-size:11px;letter-spacing:.12em;color:#e6d5a0;font-family:'JetBrains Mono',monospace;font-weight:700;text-align:center}
.card-desc{margin-top:6px;font-size:6px;color:#8a9a6a;font-family:'JetBrains Mono',monospace;text-align:center;line-height:1.4;max-width:160px}
.card-lvl{position:absolute;top:8px;right:10px;font-size:6px;color:#6a7a8a;font-family:'JetBrains Mono',monospace;background:#0a0e14;border:1px solid #1e2a32;padding:2px 6px;border-radius:8px}
.card-hp{margin-top:8px;width:80%;height:4px;background:#0a0e14;border-radius:2px;overflow:hidden;border:1px solid #1e2a32}
.card-hp-fill{height:100%;background:linear-gradient(90deg,#b33030,#e05050)}
.battle-view{width:100%;max-width:960px;display:none;flex-direction:column;gap:16px}
.battle-top{display:flex;gap:16px;align-items:stretch}
.hero-battle,.enemy-battle{flex:1;background:rgba(20,28,36,.85);border:1px solid #2a3a4a;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;position:relative}
.hero-battle.active{border-color:#e6d5a0;box-shadow:0 0 12px rgba(230,213,160,.15)}
.enemy-battle.active{border-color:#e05050;box-shadow:0 0 12px rgba(224,80,80,.15)}
.b-name{font-family:'Cinzel Decorative',serif;font-size:14px;color:#e6d5a0;letter-spacing:.15em}
.b-sub{font-size:7px;color:#8a9a6a;font-family:'JetBrains Mono',monospace}
.b-img{width:100%;height:140px;background:#0a0e14;border:1px solid #1e2a32;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:48px}
.b-img img{width:100%;height:100%;object-fit:cover}
.bar-row{display:flex;flex-direction:column;gap:4px}
.bar-label{font-size:7px;letter-spacing:.1em;color:#6a7a8a;font-family:'JetBrains Mono',monospace;display:flex;justify-content:space-between}
.bar-track{height:20px;background:#0a0e14;border-radius:4px;overflow:hidden;border:1px solid #1e2a32}
.bar-fill{height:100%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;font-family:'JetBrains Mono',monospace;transition:width .4s;white-space:nowrap;padding:0 4px}
.bar-fill.hp{background:linear-gradient(90deg,#b33030,#e05050);color:#fff}
.bar-fill.mana{background:linear-gradient(90deg,#2a5a9a,#4a8ad0);color:#fff}
.battle-log{width:100%;max-height:160px;overflow:auto;background:rgba(10,14,20,.75);border:1px solid #1e2a32;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:4px}
.log-line{font-size:8px;font-family:'JetBrains Mono',monospace;padding:4px 6px;border-radius:4px;line-height:1.4}
.log-line.hero{background:rgba(42,58,74,.4);border-left:2px solid #e6d5a0}
.log-line.enemy{background:rgba(80,30,30,.3);border-left:2px solid #e05050}
.log-line.crit{background:rgba(180,160,80,.25);border-left:2px solid #d0b040;color:#e6d5a0;font-weight:700}
.log-line.sys{background:rgba(20,28,36,.5);color:#6a7a8a}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.act-btn{background:rgba(26,36,47,.9);border:1px solid #2a3a4a;border-radius:10px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:.2s;position:relative;min-height:80px}
.act-btn:hover{border-color:#e6d5a0;background:rgba(30,47,62,.95)}
.act-btn[disabled]{opacity:.4;pointer-events:none}
.act-btn.ult{border-color:#8a6a1a;background:linear-gradient(180deg,rgba(26,36,47,.9),rgba(40,30,15,.5))}
.act-btn.ult:hover{border-color:#d0b040}
.a-icon{font-size:22px}
.a-name{font-size:9px;font-family:'JetBrains Mono',monospace;color:#e6d5a0;font-weight:700;text-align:center}
.a-meta{font-size:6px;color:#6a7a8a;font-family:'JetBrains Mono',monospace;text-align:center}
.cooldown{position:absolute;top:6px;right:6px;background:#b33030;color:#fff;font-size:10px;font-weight:900;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.battle-controls{display:flex;justify-content:space-between;margin-top:8px}
.ctrl-btn{background:rgba(20,14,14,.6);border:1px solid #3a2a2a;color:#8a6a6a;padding:8px 14px;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:8px;cursor:pointer}
.ctrl-btn:hover{border-color:#e05050;color:#e0a0a0}

/* VICTORY MODAL - VOLAND STYLE */
.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.victory-box{width:100%;max-width:420px;background:linear-gradient(180deg,rgba(26,36,47,.98),rgba(16,22,30,.98));border:1px solid #3a4a2a;border-radius:16px;padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 0 40px rgba(230,213,160,.15),0 20px 60px rgba(0,0,0,.8);position:relative;overflow:hidden}
.victory-box.defeat{border-color:#4a2a2a;box-shadow:0 0 40px rgba(224,80,80,.15),0 20px 60px rgba(0,0,0,.8)}
.victory-box:before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#e6d5a0,transparent);opacity:.6}
.trophy{font-size:48px;filter:drop-shadow(0 0 12px rgba(230,213,160,.4))}
.v-title{font-family:'Cinzel Decorative',serif;font-size:22px;color:#e6d5a0;letter-spacing:.25em;font-weight:900;text-shadow:0 0 12px rgba(230,213,160,.3)}
.v-sub{font-size:9px;font-family:'JetBrains Mono',monospace;color:#8a9a6a;letter-spacing:.1em}
.v-stats{display:flex;gap:12px;width:100%;margin-top:4px}
.v-stat{flex:1;background:rgba(10,14,20,.7);border:1px solid #1e2a32;border-radius:10px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.v-stat-icon{font-size:18px}
.v-stat-val{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:#e6d5a0}
.v-stat-label{font-size:7px;color:#6a7a8a;font-family:'JetBrains Mono',monospace;letter-spacing:.1em}
.v-stat.gold .v-stat-val{color:#d0b040}
.v-stat.xp .v-stat-val{color:#a080ff}
.v-stat.loot .v-stat-val{color:#6ab0ff}
.v-bonus{font-size:8px;color:#8a9a6a;font-family:'JetBrains Mono',monospace;background:rgba(0,0,0,.3);padding:4px 8px;border-radius:12px;border:1px solid #1e2a32}
.v-actions{display:flex;gap:10px;width:100%;margin-top:6px}
.v-btn{flex:1;padding:12px 10px;border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.08em;cursor:pointer;transition:.2s;border:1px solid;display:flex;align-items:center;justify-content:center;gap:6px}
.v-btn-again{background:rgba(30,42,50,.9);border-color:#2a3a4a;color:#8a9a8a}
.v-btn-again:hover{border-color:#6a7a8a;color:#d8d2b8}
.v-btn-cont{background:linear-gradient(180deg,#d0b040,#8a6a1a);border-color:#d0b040;color:#0a0e14;box-shadow:0 0 12px rgba(208,176,64,.3)}
.v-btn-cont:hover{box-shadow:0 0 18px rgba(208,176,64,.5);transform:translateY(-1px)}
.chat{position:fixed;right:12px;bottom:12px;width:220px;background:rgba(16,22,30,.7);border:1px solid #1e2a32;border-radius:10px;z-index:5;display:flex;flex-direction:column;overflow:hidden}
.chat-head{padding:8px 10px;font-size:8px;font-family:'JetBrains Mono',monospace;color:#6a7a8a;border-bottom:1px solid #1e2a32;display:flex;justify-content:space-between}
.chat-body{height:100px;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:4px}
.chat-msg{font-size:7px;font-family:'JetBrains Mono',monospace;color:#8a9a6a}
.sys-msg{font-size:7px;color:#4a5a6a;font-family:'JetBrains Mono',monospace}
.chat-in{display:flex;border-top:1px solid #1e2a32}
.chat-in input{flex:1;background:transparent;border:0;color:#d8d2b8;padding:8px;font-size:8px;font-family:'JetBrains Mono',monospace;outline:none}
.chat-in button{background:#1e2a32;border:0;color:#6a7a8a;padding:0 10px;cursor:pointer;font-size:10px}
</style>
</head>

<script>
let heroData = VOLAND_HEROES[volandGetHeroId()] || VOLAND_HEROES['mage-f-new'];
let profileName = volandGetName();
let currentLoc = null;
let currentStage = null;
let lastEnemyData = null;
function getHeroStats(){ const {cur} = volandCalcStats(); return cur; }
function renderHeroStats(){
  const cur = getHeroStats();
  document.getElementById('heroStats').innerHTML = heroData.n + ' • ' + profileName.toUpperCase() + '<br>HP '+cur.HP+' • DMG '+cur.DMG+' • DEF '+cur.DEF+'<br>MANA '+cur.MANA+' • CRIT '+cur.CRIT+'% • '+(cur.PARRY>0 ? 'PARRY '+cur.PARRY+'%' : 'DODGE '+cur.DODGE+'%');
}
renderHeroStats(); setInterval(renderHeroStats, 1000);

function renderLocations(){
  currentLoc = null; currentStage = null;
  document.getElementById('locView').style.display='grid';
  document.getElementById('enemyView').style.display='none';
  document.getElementById('battleView').style.display='none';
  document.getElementById('btnToHero').style.display='block';
  document.getElementById('btnToLocs').style.display='none';
  document.getElementById('mainTitle').textContent='BATTLEFIELD';
  document.getElementById('mainSub').textContent='3 ЛОКАЦИИ • ВЫБЕРИ КУДА ИДТИ • PARRY + IMMUNE + BLOCK';
  const grid = document.getElementById('locView');
  grid.innerHTML = VOLAND_LOCATIONS.filter(l=>l.active).map(l=>`
    <div class="loc-card" onclick="selectLocation(${l.id})">
      <div class="card-num">LOC ${l.id}</div>
      <div class="card-icon">${l.icon}</div>
      <div class="card-name">${l.name}</div>
      <div class="card-desc">${l.type} • 4 моба • клик → мобы</div>
    </div>
  `).join('');
}

function selectLocation(id){
  currentLoc = id;
  const loc = VOLAND_LOCATIONS.find(x=>x.id===id);
  document.getElementById('locView').style.display='none';
  document.getElementById('enemyView').style.display='grid';
  document.getElementById('mainTitle').textContent='BATTLEFIELD • '+(loc?loc.name:'LOC '+id);
  document.getElementById('mainSub').textContent=(loc?loc.name:'')+' • 4 МОБА • КЛИК ПО МОБУ = БОЙ';
  document.getElementById('btnToHero').style.display='none';
  document.getElementById('btnToLocs').style.display='block';
  const enemies = VOLAND_ENEMIES[id] || [];
  const grid = document.getElementById('enemyView');
  grid.innerHTML = enemies.map(e=>`
    <div class="loc-card ${e.boss?'boss':''}" onclick="startBattle(${e.stage})">
      <div class="card-num">STAGE ${e.stage}</div>
      <div class="card-lvl">${e.lvl}</div>
      <div class="card-icon">${e.icon}</div>
      <div class="card-name">${e.name}</div>
      <div class="card-desc">${e.desc}</div>
      <div class="card-hp"><div class="card-hp-fill" style="width:${e.hp}%; background:${e.boss?'linear-gradient(90deg,#8a6a1a,#d0b040)':''}; background-color:${e.hpColor}"></div></div>
    </div>
  `).join('');

let battle = null;
function parseSkillMultiplier(desc){ const m = desc.match(/(\d+)% урона/); if (m) return parseInt(m[1])/100; return 2; }
function parseManaCost(meta){ const m = meta.match(/Мана:\s*(\d+)/i); return m ? parseInt(m[1]) : 10; }
function parseCooldown(meta){ const m = meta.match(/КД:\s*(\d+)/i); return m ? parseInt(m[1]) : 3; }

function startBattle(stage){
  hideVictory();
  currentStage = stage;
  const enemies = VOLAND_ENEMIES[currentLoc];
  const eData = enemies.find(x=>x.stage===stage);
  if (!eData){ logChat('Моб не найден'); return; }
  lastEnemyData = eData;
  const hStats = getHeroStats();
  const scaleHp = [0.4, 0.7, 1.0, 1.6][stage-1] || 0.5;
  const scaleDmg = [0.4, 0.6, 0.85, 1.15][stage-1] || 0.5;
  const scaleDef = [0.3, 0.5, 0.7, 0.9][stage-1] || 0.5;
  battle = {
    hero: {
      name: heroData.n,
      baseMaxHp: hStats.HP,
      baseDmg: hStats.DMG,
      maxHp: hStats.HP,
      hp: hStats.HP,
      maxMana: hStats.MANA,
      mana: hStats.MANA,
      dmg: hStats.DMG,
      def: hStats.DEF,
      crit: hStats.CRIT,
      dodge: hStats.DODGE||0,
      parry: hStats.PARRY||0,
      immune:0,
      dmgBuff:0,
      dmgBuffTurns:0,
      hpBuff:0,
      hpBuffTurns:0,
      block:0,
      blockTurns:0,
      reflect:0,
      reflectTurns:0,
      skills: heroData.sk,
      cooldowns: [0,0,0,0,0],
      manaCosts: heroData.sk.map(s=>parseManaCost(s[5])),
      cdMax: heroData.sk.map(s=>parseCooldown(s[5])),
      mult: heroData.sk.map(s=>parseSkillMultiplier(s[4]))
    },
    enemy: {
      name: eData.name,
      icon: eData.icon,
      maxHp: Math.floor(hStats.HP * scaleHp + 50),
      hp: Math.floor(hStats.HP * scaleHp + 50),
      dmg: Math.floor(hStats.DMG * scaleDmg + 10),
      def: Math.floor(hStats.DEF * scaleDef + 5),
      crit: 5 + stage*2,
      dodge: 3 + stage*2,
      parry: eData.boss ? 15 : 0,
      stunned:0,
      stage: stage,
      lvl: eData.lvl,
      boss: !!eData.boss
    },
    turn: 'hero',
    log: []
  };
  document.getElementById('locView').style.display='none';
  document.getElementById('enemyView').style.display='none';
  document.getElementById('battleView').style.display='flex';
  document.getElementById('btnToHero').style.display='none';
  document.getElementById('btnToLocs').style.display='none';
  document.getElementById('mainTitle').textContent = 'BATTLE • ' + eData.name;
  document.getElementById('mainSub').textContent = 'STAGE '+stage+' • '+eData.eng+' • БОЙ ИДЕТ • PARRY '+battle.enemy.parry+'%';
  document.getElementById('bHeroName').textContent = battle.hero.name + ' • ' + profileName.toUpperCase();
  document.getElementById('bHeroSub').textContent = heroData.role + ' • HP '+battle.hero.maxHp+' • DMG '+battle.hero.dmg;
  document.getElementById('bHeroImg').src = heroData.img;
  document.getElementById('bEnemyName').textContent = battle.enemy.name;
  document.getElementById('bEnemySub').textContent = eData.eng + ' • ' + eData.lvl + (eData.boss?' • BOSS • PARRY 15%':'');
  document.getElementById('bEnemyImgWrap').innerHTML = '<div style="font-size:64px">'+battle.enemy.icon+'</div>';
  clearBattleLog();
  addBattleLog('Бой начался: '+battle.hero.name+' vs '+battle.enemy.name, 'sys');
  addBattleLog('Твои статы: HP '+battle.hero.maxHp+' DMG '+battle.hero.dmg+' DEF '+battle.hero.def+' MANA '+battle.hero.maxMana+' CRIT '+battle.hero.crit+'% '+(battle.hero.parry>0 ? 'PARRY '+battle.hero.parry+'%' : 'DODGE '+battle.hero.dodge+'%'), 'hero');
  addBattleLog('Враг: HP '+battle.enemy.maxHp+' DMG '+battle.enemy.dmg+' DEF '+battle.enemy.def+' PARRY '+battle.enemy.parry+'%', 'enemy');
  renderBattleUI(); renderActions();
}

function clearBattleLog(){ document.getElementById('battleLog').innerHTML=''; if (battle) battle.log=[]; }
function addBattleLog(text, type){
  const div = document.createElement('div'); div.className='log-line '+(type||'sys'); div.textContent=text;
  document.getElementById('battleLog').appendChild(div);
  document.getElementById('battleLog').scrollTop=9999;
  if (battle) battle.log.push({text, type});
}
function renderBattleUI(){
  if (!battle) return;
  const hPct = Math.max(0, Math.floor(battle.hero.hp / battle.hero.maxHp * 100));
  const ePct = Math.max(0, Math.floor(battle.enemy.hp / battle.enemy.maxHp * 100));
  const mPct = Math.max(0, Math.floor(battle.hero.mana / battle.hero.maxMana * 100));
  // HP/MANA bars in numbers (request) + pct small label
  document.getElementById('hHpBar').style.width = hPct + '%';
  document.getElementById('hHpBar').textContent = Math.max(0,battle.hero.hp) + ' / ' + battle.hero.maxHp;
  document.getElementById('hHpPct').textContent = hPct + '%';
  document.getElementById('hManaBar').style.width = mPct + '%';
  document.getElementById('hManaBar').textContent = battle.hero.mana + ' / ' + battle.hero.maxMana;
  document.getElementById('hManaPct').textContent = mPct + '%';
  document.getElementById('eHpBar').style.width = ePct + '%';
  document.getElementById('eHpBar').textContent = Math.max(0,battle.enemy.hp) + ' / ' + battle.enemy.maxHp;
  document.getElementById('eHpPct').textContent = ePct + '%';
  document.getElementById('heroBox').classList.toggle('active', battle.turn==='hero');
  document.getElementById('enemyBox').classList.toggle('active', battle.turn==='enemy');
}
function renderActions(){
  if (!battle) return;
  const actionsDiv = document.getElementById('actions');
  let html = '';
  html += `<div class="act-btn" onclick="heroAction('attack')"><div class="a-icon">⚔️</div><div class="a-name">АТАКА</div><div class="a-meta">100% урона • без маны</div></div>`;
  for (let i=1;i<battle.hero.skills.length;i++){
    const s = battle.hero.skills[i];
    const sName = s[0]; const sBadge = s[1]; const sIconRaw = s[2][0];
    const cd = battle.hero.cooldowns[i]; const manaCost = battle.hero.manaCosts[i]; const mult = battle.hero.mult[i];
    const isUlt = sBadge==='4';
    const disabled = cd>0 || battle.hero.mana < manaCost || battle.turn!=='hero';
    html += `<div class="act-btn ${isUlt?'ult':''}" ${disabled?'disabled':''} onclick="heroAction('skill', ${i})">
      ${cd>0?`<div class="cooldown">${cd}</div>`:''}
      <div class="a-icon"><img src="${sIconRaw}" style="width:36px;height:36px;border-radius:6px;object-fit:cover" onerror="this.style.display='none'"></div>
      <div class="a-name">${sName} [${sBadge}]</div>
      <div class="a-meta">${Math.round(mult*100)}% урона • ${manaCost} маны • КД ${battle.hero.cdMax[i]}</div>
    </div>`;
  }
  actionsDiv.innerHTML = html;
}
function calcDamage(attacker, defender, multiplier){
  if ((defender.immune||0)>0){
    return {dmg:0, crit:false, dodge:false, parry:false, immune:true};
  }
  const effectiveDmg = attacker.dmg * (1 + (attacker.dmgBuff||0));
  const base = effectiveDmg * (multiplier||1);
  const defReduce = defender.def * 0.5;
  let dmg = Math.max(5, base - defReduce);
  const isCrit = Math.random()*100 < attacker.crit;
  if (isCrit) dmg *= 1.5;
  const isDodge = Math.random()*100 < (defender.dodge||0);
  if (isDodge) return {dmg:0, crit:false, dodge:true, parry:false, immune:false};
  const isParry = Math.random()*100 < (defender.parry||0);
  if (isParry) return {dmg:0, crit:false, dodge:false, parry:true, immune:false};
  dmg *= (0.9 + Math.random()*0.2);
  return {dmg: Math.floor(dmg), crit:isCrit, dodge:false, parry:false, immune:false};
}
function heroAction(type, skillIdx){
  if (!battle || battle.turn!=='hero') return;
  if (type==='attack'){
    const res = calcDamage(battle.hero, battle.enemy, 1.0);
    if (res.immune){ addBattleLog(battle.enemy.name + ' неуязвим! Урон 0 🛡️', 'sys'); }
    else if (res.dodge){ addBattleLog(battle.enemy.name + ' увернулся от атаки!', 'enemy'); }
    else if (res.parry){ addBattleLog(battle.enemy.name + ' парировал атаку ' + battle.hero.name + '! 🛡️', 'enemy'); }
    else { battle.enemy.hp -= res.dmg; addBattleLog(battle.hero.name + ' бьет на ' + res.dmg + (res.crit?' CRIT!':'') + ' • HP врага ' + Math.max(0,battle.enemy.hp) + '/' + battle.enemy.maxHp, res.crit?'crit':'hero'); }
  } else if (type==='skill'){
    const i = skillIdx;
    if (battle.hero.cooldowns[i]>0){ addBattleLog('Скил на КД: '+battle.hero.cooldowns[i]+' ходов', 'sys'); return; }
    if (battle.hero.mana < battle.hero.manaCosts[i]){ addBattleLog('Не хватает маны для '+battle.hero.skills[i][0], 'sys'); return; }
    const mult = battle.hero.mult[i];
    const res = calcDamage(battle.hero, battle.enemy, mult);
    battle.hero.mana -= battle.hero.manaCosts[i];
    battle.hero.cooldowns[i] = battle.hero.cdMax[i];
    if (res.immune){ addBattleLog(battle.enemy.name + ' неуязвим к скилу ' + battle.hero.skills[i][0] + '!', 'sys'); }
    else if (res.dodge){ addBattleLog(battle.enemy.name + ' увернулся от скила ' + battle.hero.skills[i][0] + '!', 'enemy'); }
    else if (res.parry){ addBattleLog(battle.enemy.name + ' парировал скил ' + battle.hero.skills[i][0] + ' 🛡️', 'enemy'); }
    else { battle.enemy.hp -= res.dmg; addBattleLog(battle.hero.name + ' кастует ' + battle.hero.skills[i][0] + ' ['+battle.hero.skills[i][1]+'] на ' + res.dmg + (res.crit?' CRIT!':'') + ' • '+battle.hero.skills[i][4].slice(0,60), res.crit?'crit':'hero'); }
    const sName = battle.hero.skills[i][0];
    // LION WARDEN specific mechanics
    if (sName.includes('Удар Льва')){
      battle.enemy.stunned = 1;
      addBattleLog('🌀 ' + battle.enemy.name + ' оглушен Ударом Льва на 1 раунд!', 'crit');
    }
    if (sName.includes('Имперский Бастион') || sName.includes('Бастион')){
      battle.hero.block = 0.5;
      battle.hero.blockTurns = 3;
      battle.hero.reflect = 0.25;
      battle.hero.reflectTurns = 3;
      addBattleLog('🛡️ Имперский Бастион: блок 50% урона 3 раунда + отражение 25%!', 'crit');
    }
    if (sName.includes('Аватар Империи')){
      const hpAdd = Math.floor(battle.hero.baseMaxHp * 0.5);
      battle.hero.hpBuff = hpAdd;
      battle.hero.maxHp = battle.hero.baseMaxHp + hpAdd;
      battle.hero.hp += hpAdd;
      battle.hero.hpBuffTurns = 3;
      battle.hero.immune = 2;
      battle.hero.dmgBuff = 3;
      battle.hero.dmgBuffTurns = 3;
      battle.hero.dmg = battle.hero.baseDmg * (1 + battle.hero.dmgBuff);
      addBattleLog('🛡️ ' + battle.hero.name + ' Аватар Империи: +50% HP ['+battle.hero.baseMaxHp+' → '+battle.hero.maxHp+'] • Неуязвим 2 раунда • +300% урона 3 раунда!', 'crit');
    }
  }
  for (let j=0;j<battle.hero.cooldowns.length;j++){ if (battle.hero.cooldowns[j]>0) battle.hero.cooldowns[j]--; }
  renderBattleUI(); renderActions();
  if (battle.enemy.hp<=0){
    addBattleLog('ПОБЕДА! ' + battle.enemy.name + ' повержен!', 'crit');
    logChat('Победа над ' + battle.enemy.name + ' Stage '+battle.enemy.stage);
    battle.turn = 'ended';
    setTimeout(()=> showVictory(true), 600);
    return;
  }
  battle.turn = 'enemy'; renderBattleUI(); renderActions(); setTimeout(enemyTurn, 800);
}
function enemyTurn(){
  if (!battle || battle.enemy.hp<=0) return;
  // check stun
  if (battle.enemy.stunned>0){
    addBattleLog('🌀 ' + battle.enemy.name + ' оглушен! Пропускает ход!', 'sys');
    battle.enemy.stunned--;
    battle.turn='hero'; renderBattleUI(); renderActions(); return;
  }
  const res = calcDamage(battle.enemy, battle.hero, 1.0);
  let finalDmg = res.dmg;
  let blocked = 0;
  let reflected = 0;
  if (!res.immune && !res.dodge && !res.parry){
    if (battle.hero.blockTurns>0 && battle.hero.block>0){
      blocked = Math.floor(finalDmg * battle.hero.block);
      finalDmg -= blocked;
      addBattleLog('🛡️ Бастион блокирует ' + blocked + ' урона ('+Math.round(battle.hero.block*100)+'% ) 3р', 'hero');
    }
    if (battle.hero.reflectTurns>0 && battle.hero.reflect>0 && finalDmg>0){
      reflected = Math.floor(finalDmg * battle.hero.reflect);
      if (reflected>0){
        battle.enemy.hp -= reflected;
        addBattleLog('↩️ Отражение ' + reflected + ' урона обратно в ' + battle.enemy.name + '!', 'crit');
      }
    }
  }

  if (res.immune){ addBattleLog(battle.hero.name + ' неуязвим! 🛡️ Урон 0', 'hero'); }
  else if (res.dodge){ addBattleLog(battle.hero.name + ' увернулся от атаки ' + battle.enemy.name + '!', 'hero'); }
  else if (res.parry){ addBattleLog(battle.hero.name + ' парировал атаку ' + battle.enemy.name + '! 🛡️', 'hero'); }
  else { 
    battle.hero.hp -= finalDmg; 
    let txt = battle.enemy.name + ' бьет на ' + finalDmg;
    if (blocked>0) txt += ' (блок '+blocked+')';
    txt += (res.crit?' CRIT!':'') + ' • Твое HP ' + Math.max(0,battle.hero.hp) + '/' + battle.hero.maxHp;
    addBattleLog(txt, res.crit?'crit':'enemy'); 
  }
  renderBattleUI();
  if (battle.enemy.hp<=0){
    addBattleLog('ПОБЕДА! ' + battle.enemy.name + ' повержен отражением!', 'crit');
    battle.turn='ended';
    setTimeout(()=> showVictory(true), 600);
    return;
  }
  if (battle.hero.hp<=0){
    addBattleLog('ПОРАЖЕНИЕ! Ты пал в бою против ' + battle.enemy.name, 'enemy');
    logChat('Поражение от ' + battle.enemy.name);
    battle.turn = 'ended'; renderActions();
    setTimeout(()=> showVictory(false), 600);
    return;
  }
  // decrement buffs
  if (battle.hero.immune>0){ battle.hero.immune--; if (battle.hero.immune===0) addBattleLog('Неуязвимость спала', 'sys'); }
  if (battle.hero.blockTurns>0){ battle.hero.blockTurns--; if (battle.hero.blockTurns===0){ battle.hero.block=0; battle.hero.reflect=0; addBattleLog('Имперский Бастион спал', 'sys'); } }
  if (battle.hero.reflectTurns>0){ battle.hero.reflectTurns--; }
  if (battle.hero.dmgBuffTurns>0){
    battle.hero.dmgBuffTurns--;
    if (battle.hero.dmgBuffTurns===0){
      battle.hero.dmgBuff=0;
      battle.hero.dmg = battle.hero.baseDmg;
      addBattleLog('Баф +300% урона закончился', 'sys');
    }
  }
  if (battle.hero.hpBuffTurns>0){
    battle.hero.hpBuffTurns--;
    if (battle.hero.hpBuffTurns===0){
      battle.hero.maxHp = battle.hero.baseMaxHp;
      if (battle.hero.hp > battle.hero.maxHp) battle.hero.hp = battle.hero.maxHp;
      battle.hero.hpBuff=0;
      addBattleLog('Баф +50% HP закончился', 'sys');
    }
  }
  battle.turn = 'hero'; renderBattleUI(); renderActions();
}

function showVictory(isWin){
  const modal = document.getElementById('victoryModal');
  const box = document.getElementById('victoryBox');
  const title = document.getElementById('vTitle');
  const sub = document.getElementById('vSub');
  const trophy = document.getElementById('vTrophy');
  const goldEl = document.getElementById('vGold');
  const xpEl = document.getElementById('vXp');
  const lootEl = document.getElementById('vLoot');
  const goldBonus = document.getElementById('vGoldBonus');
  const xpBonus = document.getElementById('vXpBonus');
  if (isWin){
    box.classList.remove('defeat');
    trophy.textContent='🏆';
    title.textContent='¡VICTORIA!';
    sub.textContent='Has triunfado en el combate • ' + (lastEnemyData?lastEnemyData.name:'');
    const baseGold = (currentStage||1)*20 + (currentLoc||1)*10 + (lastEnemyData&&lastEnemyData.boss?100:0);
    const baseXp = (currentStage||1)*500 + (currentLoc||1)*200 + (lastEnemyData&&lastEnemyData.boss?2000:0);
    goldEl.textContent='+'+baseGold;
    xpEl.textContent='+'+baseXp.toLocaleString('es-ES');
    lootEl.textContent=(lastEnemyData&&lastEnemyData.boss?'1':'0');
    goldBonus.textContent='+'+Math.floor(baseGold*0.05)+' (5%)';
    xpBonus.textContent='+'+Math.floor(baseXp*0.26)+' (26%)';
  } else {
    box.classList.add('defeat');
    trophy.textContent='💀';
    title.textContent='DERROTA';
    sub.textContent='Ты пал в бою против ' + (lastEnemyData?lastEnemyData.name:'врага');
    goldEl.textContent='+0';
    xpEl.textContent='+0';
    lootEl.textContent='0';
    goldBonus.textContent='+0';
    xpBonus.textContent='+0';
  }
  modal.classList.add('show');
}
function hideVictory(){ document.getElementById('victoryModal').classList.remove('show'); }
function fightAgain(){
  hideVictory();
  if (currentLoc && currentStage){ startBattle(currentStage); }
}
function continueToMobs(){
  hideVictory();
  closeBattle();
}
function closeBattle(){
  hideVictory();
  document.getElementById('battleView').style.display='none';
  document.getElementById('enemyView').style.display='grid';
  document.getElementById('btnToHero').style.display='none';
  document.getElementById('btnToLocs').style.display='block';
  document.getElementById('mainTitle').textContent = 'BATTLEFIELD • '+(VOLAND_LOCATIONS.find(x=>x.id===currentLoc)?.name||'');
  document.getElementById('mainSub').textContent = 'ВЫБЕРИ МОБА • PARRY + IMMUNE + BLOCK';
  battle = null; 
  if (currentLoc) {
    const enemies = VOLAND_ENEMIES[currentLoc];
    if (enemies) {
      const grid = document.getElementById('enemyView');
      grid.innerHTML = enemies.map(e=>`
        <div class="loc-card ${e.boss?'boss':''}" onclick="startBattle(${e.stage})">
          <div class="card-num">STAGE ${e.stage}</div>
          <div class="card-lvl">${e.lvl}</div>
          <div class="card-icon">${e.icon}</div>
          <div class="card-name">${e.name}</div>
          <div class="card-desc">${e.desc}</div>
          <div class="card-hp"><div class="card-hp-fill" style="width:${e.hp}%; background:${e.boss?'linear-gradient(90deg,#8a6a1a,#d0b040)':''}; background-color:${e.hpColor}"></div></div>
        </div>
      `).join('');
    }
  }
  logChat('Возврат к выбору мобов');
}
function runBattle(){
  if (battle){ addBattleLog('Ты сбежал из боя с ' + battle.enemy.name, 'sys'); logChat('Сбежал из боя Stage '+battle.enemy.stage); }
  closeBattle();
}
function logChat(msg){ const d=document.createElement('div'); d.className='sys-msg'; d.textContent=msg; document.getElementById('chatBody').appendChild(d); document.getElementById('chatBody').scrollTop=9999; }
const chatIn=document.getElementById('chatIn'); const chatBtn=document.getElementById('chatBtn');
chatBtn.onclick=()=>{ if (chatIn.value.trim()){ const d=document.createElement('div'); d.className='chat-msg'; d.textContent=profileName+': '+chatIn.value; document.getElementById('chatBody').appendChild(d); chatIn.value=''; } };
chatIn.addEventListener('keydown',e=>{ if (e.key==='Enter') chatBtn.click(); });

renderLocations();
</script>
