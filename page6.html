<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BATTLEFIELD</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=JetBrains+Mono:wght@400&family=Inter:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:url("./assets/heroes/bg-battlefield.webp") center/cover no-repeat fixed #0a0e14}
.bg{position:fixed;inset:0;z-index:0}
.bg img{width:100%;height:100%;object-fit:cover;display:block}
.bg:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,0)}
.wrap{position:fixed;inset:0;display:flex;z-index:2}
.left-nav{width:68px;min-width:68px;background:rgba(18,24,30,.35);border-right:1px solid rgba(30,42,50,.5);display:flex;flex-direction:column;align-items:center;padding:12px 6px;gap:18px;backdrop-filter:blur(2px)}
.nav-group{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.nav-item{width:48px;height:48px;background:#1a252f;border:1px solid #2a3a4a;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;opacity:.6;cursor:pointer;transition:.2s}
.nav-item.active{background:#1e2f3e;border-color:#e6d5a0;opacity:1}
.nav-label{font:7px 'JetBrains Mono',monospace;letter-spacing:.12em;color:#8ea0b0;text-transform:uppercase}
.nav-group.active .nav-label{color:#e6d5a0}
.center{flex:1;padding:28px 24px;overflow:auto;background:rgba(16,22,30,.08);backdrop-filter:blur(1px);display:flex;flex-direction:column;align-items:center}
.title{font:900 32px 'Cinzel Decorative',serif;color:#e6d5a0;letter-spacing:.06em;text-align:center}
.sub{margin-top:6px;font:8px 'JetBrains Mono',monospace;letter-spacing:.32em;color:#7a90a8;text-transform:uppercase}
.loc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:32px;width:100%;max-width:1100px}
.loc-card{background:rgba(20,26,34,.82);border:1px solid rgba(122,144,168,.18);border-radius:12px;padding:32px 20px;text-align:center;backdrop-filter:blur(10px);box-shadow:0 12px 40px rgba(0,0,0,.4);cursor:pointer;transition:.2s}
.loc-card:hover{border-color:#e6d5a0;transform:translateY(-2px)}
.loc-icon{font-size:32px;margin-bottom:14px}
.loc-name{font:700 13px Inter,sans-serif;letter-spacing:.08em;color:#e6d5a0;text-transform:uppercase}
.loc-name span{display:block;font:400 10px 'JetBrains Mono',monospace;color:#7a90a8;margin-top:4px;letter-spacing:.12em}
.loc-type{margin-top:12px;font:7px 'JetBrains Mono',monospace;color:#8ea0b0;letter-spacing:.2em;text-transform:uppercase}
.loc-lvl{margin-top:10px;font:600 9px 'JetBrains Mono',monospace;color:#e6d5a0;letter-spacing:.1em}
.right{width:200px;min-width:200px;background:rgba(14,20,26,.9);border-left:1px solid rgba(30,42,50,.6);display:flex;flex-direction:column;backdrop-filter:blur(6px)}
.chat-head{height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid rgba(30,42,50,.5)}
.dot{width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80}
.chat-title{font:7px 'JetBrains Mono',monospace;letter-spacing:.2em;color:#e6d5a0}
.chat-body{flex:1;padding:12px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.sys-msg{font:10px 'JetBrains Mono',monospace;color:#5a6e80;line-height:1.4;background:rgba(122,144,168,.08);border-radius:6px;padding:8px}
.chat-input{border-top:1px solid rgba(30,42,50,.5);display:flex;gap:6px;padding:8px}
.chat-input input{flex:1;background:rgba(20,26,34,.8);border:1px solid rgba(42,58,74,.6);border-radius:6px;padding:7px 8px;font:10px 'JetBrains Mono',monospace;color:#c9d6e2;outline:none}
.chat-input button{background:#1e2f3e;border:1px solid #e6d5a0;border-radius:6px;padding:0 10px;font:10px 'JetBrains Mono',monospace;color:#e6d5a0;cursor:pointer}
@media(max-width:900px){.loc-grid{grid-template-columns:1fr}.right{display:none}}
</style>
</head>
