        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap');
        :root{--safe-area-inset-top:0px}
        html,body{height:100%;background: #0a0e14;color:#d8d2b8;font-family:Inter,Arial,sans-serif;overflow:hidden;margin:0}
        *{box-sizing:border-box}

        /* left nav */
        .left-nav{width:68px;min-width:68px;background:rgba(18,24,30,.35);border-right:1px solid rgba(30,42,50,.5);display:flex;flex-direction:column;align-items:center;padding:12px 6px;gap:18px;backdrop-filter:blur(2px)}

        .nav-item.active{background:#1e2f3e;border-color:#e6d5a0;opacity:1;box-shadow:0 0 12px rgba(230,213,160,.2);color:#e6d5a0}
        .nav-item:hover{opacity:0.9;border-color:#4a5a6a}
        .nav-wrapper{cursor:pointer;pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:4px}
        .nav-label{font-size:6px;letter-spacing:0.15em;color:#6a7a8a;font-family:JetBrains Mono,monospace;text-align:center}

        .bf-title{font-family:'Cinzel Decorative',serif;font-size:20px;letter-spacing:.35em;color:#e6d5a0;font-weight:900;text-transform:uppercase}
        .bf-subtitle{font-family:JetBrains Mono,monospace;font-size:9px;color:#7a8a9a;margin-top:6px;letter-spacing:0.2em}

        .locs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;padding:18px}
        .loc-card{background:#1a242f;border:1px solid #2a3a4a;border-radius:10px;padding:16px;cursor:pointer;transition:.2s;text-align:center}
        .loc-card:hover{border-color:#e6d5a0;box-shadow:0 0 12px rgba(230,213,160,.15);transform:translateY(-2px)}
        .loc-icon{font-size:32px;margin-bottom:8px}
        .loc-name{font-family:Cinzel Decorative,serif;color:#e6d5a0;font-size:13px;letter-spacing:0.15em;font-weight:700}
        .loc-sub{font-family:JetBrains Mono,monospace;font-size:8px;color:#6a7a8a;margin-top:4px;letter-spacing:0.2em}
        .loc-desc{font-size:9px;color:#9aaabc;margin-top:8px;font-family:Inter,sans-serif}
        .loc-active{margin-top:10px;font-size:7px;color:#4ecb6a;font-family:JetBrains Mono;letter-spacing:0.2em}

        .enemies-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;padding:18px}
        .enemy-card{background:#1a242f;border:1px solid #2a3a4a;border-radius:10px;padding:14px;cursor:pointer;transition:.2s;text-align:center}
        .enemy-card:hover{border-color:#e6d5a0}

        .enemy-name{font-size:11px;color:#d8d2b8;margin-top:6px;font-weight:700;letter-spacing:0.05em}
        .enemy-lvl{font-family:JetBrains Mono;font-size:7px;color:#e6d5a0;margin-top:4px}
        .enemy-stats{font-family:JetBrains Mono;font-size:7px;color:#7a8a9a;margin-top:6px}

        .battle-arena{flex:1;display:flex;flex-direction:column;gap:12px;padding:12px;min-height:0}

        .skill-btn{background:#1a242f;border:1px solid #2a3a4a;border-radius:8px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;min-height:84px;transition:.2s;position:relative}
        .skill-btn:hover{border-color:#e6d5a0;box-shadow:0 0 8px rgba(230,213,160,.2)}
        .skill-btn:disabled{opacity:0.4;cursor:not-allowed}
        .skill-btn img{width:48px;height:48px;border-radius:6px;object-fit:cover;background:#0a0e14;border:1px solid rgba(42,58,74,.5)}
        .skill-btn .sk-name{font-size:8px;letter-spacing:.1em;color:#e6d5a0;margin-top:6px;font-family:JetBrains Mono;text-align:center;line-height:1.2;min-height:18px}
        .skill-btn .sk-meta{font-size:6px;color:#6a7a8a;margin-top:3px;font-family:JetBrains Mono;text-align:center}
        .skill-btn .cd-badge{position:absolute;top:4px;right:4px;background:#b33030;color:#fff;font-size:8px;font-family:JetBrains Mono;padding:1px 4px;border-radius:3px;font-weight:700}
        .skill-btn .mana-badge{position:absolute;top:4px;left:4px;background:#1a4a9a;color:#8ab0e0;font-size:7px;font-family:JetBrains Mono;padding:1px 3px;border-radius:3px}

        .chat-messages{flex:1;padding:10px;display:flex;flex-direction:column;gap:8px;overflow:auto}

        .chat-send{background:#1e2f3e;border:1px solid #2a3a4a;border-radius:4px;padding:4px 8px;font-size:10px;color:#e6d5a0;cursor:pointer}
