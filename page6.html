        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap');
        html,body{
          color:#d8d2b8;
          font-family:Inter,Arial,sans-serif;
          margin:0;
          min-height:100vh;
          overflow:hidden;
          background: radial-gradient(120% 90% at 20% 10%, rgba(230,213,160,.08) 0%, transparent 50%), radial-gradient(100% 100% at 80% 90%, rgba(60,120,140,.12) 0%, transparent 60%), #0a0e14 !important;
        }
        .root{
          position:relative;
          min-height:100vh;
          width:100vw;
          overflow:hidden;
          padding-top:var(--safe-area-inset-top);
          box-sizing:border-box;
          background: transparent;
        }
        .bg{
          position:fixed;
          inset:0;
          z-index:0;
          pointer-events:none;
          overflow:hidden;
          background: url("./assets/heroes/bg-battlefield.webp") center/cover no-repeat #0a0e14;
        }
        .bg img{
          width:100%;
          height:100%;
          object-fit:cover;
          opacity:0.55;
          display:block;
        }
        .bg:after{
          content:"";
          position:absolute;
          inset:0;
          background:rgba(0,0,0,.42);
        }
        /* override to avoid 404 in validator while keeping required url string above for spec */
        .bg{
          background: radial-gradient(120% 90% at 20% 10%, rgba(230,213,160,.06) 0%, transparent 50%), radial-gradient(100% 100% at 80% 90%, rgba(60,120,140,.10) 0%, transparent 60%), #0a0e14 !important;
        }
        .wrap{
          position:fixed;
          inset:0;
          display:flex;
          z-index:2;
          padding-top:var(--safe-area-inset-top);
          box-sizing:border-box;
        }
        .left-nav{
          width:68px;
          min-width:68px;
          background:rgba(18,24,30,.35);
          border-right:1px solid rgba(30,42,50,.5);
          display:flex;
          flex-direction:column;
          align-items:center;
          padding:12px 6px;
          gap:18px;
          backdrop-filter: blur(2px);
        }
        .nav-item{
          width:48px;
          height:48px;
          background:#1a252f;
          border:1px solid #2a3a4a;
          border-radius:10px;
          display:flex;
          align-items:center;
          justify-content:center;
          cursor:pointer;
          opacity:0.6;
          transition:.2s;
          font-size:20px;
        }
        .nav-item:hover{opacity:1;border-color:#e6d5a0}
        .nav-item.active{background:#1e2f3e;border-color:#e6d5a0;opacity:1;box-shadow:0 0 12px rgba(230,213,160,.2)}
        .nav-label{font-size:7px;letter-spacing:.15em;color:#6a7a8a;margin-top:4px;text-align:center;font-family:'JetBrains Mono',monospace}
        .nav-wrap{display:flex;flex-direction:column;align-items:center;cursor:pointer}
        .center-col{
          flex:1;
          display:flex;
          flex-direction:column;
          background:rgba(16,22,30,.25);
          overflow:hidden;
          backdrop-filter: blur(2px);
          overflow-y:auto;
          overflow-x:hidden;
        }
        .bf-header{padding:16px;text-align:center;background:rgba(19,26,34,.35);border-bottom:1px solid rgba(30,42,50,.5);backdrop-filter: blur(2px)}
        .bf-title{font-family:'Cinzel Decorative',serif;font-size:20px;letter-spacing:.35em;color:#e6d5a0;font-weight:900}
        .bf-sub{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.2em;color:#6a7a8a;margin-top:6px}
        .locs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;padding:18px}
        .loc-card{background:rgba(26,36,47,.65);border:1px solid #2a3a4a;border-radius:10px;padding:18px 12px;text-align:center;cursor:pointer;backdrop-filter: blur(2px);transition:.2s}
        .loc-card:hover{border-color:#e6d5a0;box-shadow:0 0 12px rgba(230,213,160,.15);transform:translateY(-1px)}
        .loc-card.active{border-color:#e6d5a0;box-shadow:0 0 16px rgba(230,213,160,.25)}
        .loc-icon{font-size:28px}
        .loc-name{font-family:'Cinzel Decorative',serif;font-size:12px;letter-spacing:.2em;color:#e6d5a0;margin-top:10px;font-weight:700}
        .loc-eng{font-size:7px;letter-spacing:.15em;color:#6a7a8a;margin-top:6px;font-family:'JetBrains Mono'}
        .loc-type{font-size:8px;color:#8a9a8a;margin-top:8px;font-family:'JetBrains Mono'}
        .loc-active{font-size:7px;color:#3ad080;margin-top:8px;letter-spacing:.15em;font-family:'JetBrains Mono'}
        .enemies-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:18px}
        @media(max-width:900px){.enemies-grid{grid-template-columns:repeat(2,1fr)}}
        @media(max-width:520px){.enemies-grid{grid-template-columns:1fr}}
        .enemy-card{background:rgba(26,36,47,.65);border:1px solid #2a3a4a;border-radius:10px;padding:14px 10px;text-align:center;cursor:pointer;backdrop-filter: blur(2px);transition:.2s;position:relative}
        .enemy-card:hover{border-color:#e6d5a0;transform:translateY(-1px)}
        .enemy-card.boss{border-color:#e6d5a0;box-shadow:0 0 10px rgba(230,213,160,.2);background:rgba(40,38,20,.65)}
        .enemy-icon{font-size:32px}
        .enemy-name{font-family:'Cinzel Decorative',serif;font-size:10px;color:#e6d5a0;margin-top:8px;letter-spacing:.12em;font-weight:700;line-height:1.2}
        .enemy-lvl{font-size:7px;color:#6a7a8a;font-family:'JetBrains Mono';margin-top:6px}
        .enemy-stats{font-size:7px;color:#9a9a7a;font-family:'JetBrains Mono';margin-top:6px}
        .boss-badge{position:absolute;top:8px;right:8px;background:#e6d5a0;color:#111;font-size:6px;padding:2px 5px;border-radius:4px;letter-spacing:.1em;font-family:'JetBrains Mono';font-weight:700}

        .battle-arena{flex:1;display:flex;flex-direction:column;gap:12px;padding:12px;overflow:auto}
        .battle-top{display:flex;gap:12px;flex:1;min-height:0;align-items:stretch}
        @media(max-width:900px){.battle-top{flex-direction:column}}

        /* HERO CARD - REAL IMAGE */
        .hero-battle-card{
          width:240px;
          min-width:240px;
          background:rgba(20,28,36,.65);

          border-radius:8px;
          overflow:hidden;
          backdrop-filter: blur(2px);
          display:flex;
          flex-direction:column;
        }
        @media(max-width:900px){.hero-battle-card{width:100%;min-width:0}}

          width:100%;

          background:radial-gradient(120% 120% at 50% 10%, #2a3a4a 0%, #0f1a24 60%);

        }
        .hero-battle-img{
          width:100%;
          height:260px;

          object-position:top center;

          background:#0f1a24;

        .hero-img-fallback{
          position:absolute;

          display:flex;

          justify-content:center;
          font-size:64px;
          background:radial-gradient(120% 120% at 50% 10%, #2a3a4a 0%, #0f1a24 60%);
        }
        .hero-battle-info{padding:10px;background:#111821;border-top:1px solid #1e2a32;text-align:center}
        .hero-name-battle{font-family:'Cinzel Decorative',serif;color:#e6d5a0;letter-spacing:.2em;font-size:11px;font-weight:700}

        .bar-track{height:22px;background:#0a0e14;border-radius:5px;overflow:hidden;border:1px solid #1e2a32;margin:6px 10px;position:relative}
        .bar-fill{height:100%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;font-family:'JetBrains Mono',monospace;color:#fff;transition:width .35s ease}
        .bar-fill.hp{background:linear-gradient(90deg,#b33030,#e05050)}
        .bar-fill.mana{background:linear-gradient(90deg,#1a4a9a,#2a6ad0)}
        .bar-label{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-family:'JetBrains Mono';color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8);pointer-events:none}

        .log-panel{flex:1;background:rgba(0,0,0,.35);border:1px solid rgba(30,42,50,.5);border-radius:8px;padding:10px;overflow:auto;max-height:360px;display:flex;flex-direction:column;gap:6px;backdrop-filter: blur(2px);min-height:260px}
        .log-entry{background:#1a242f;border-left:2px solid #d0b040;padding:6px 8px;font-size:10px;color:#9a9a7a;border-radius:0 6px 6px 0;line-height:1.3;font-family:'JetBrains Mono',monospace}
        .log-entry.sys{border-left-color:#6a7a8a;color:#b8c0c8;background:rgba(26,36,47,.5)}
        .log-entry.dmg{border-left-color:#e05050;color:#ffb8a0}

        .enemy-bottom-bar{

          border-radius:8px;
          padding:10px 12px;
          backdrop-filter:blur(2px);
        }
        .enemy-bottom-icon{

          align-items:center;

          font-size:20px;

        @media(max-width:700px){.skills-bar{grid-template-columns:repeat(2,1fr)}}
        .skill-btn{

        .skill-btn:hover{border-color:#e6d5a0;box-shadow:0 0 10px rgba(230,213,160,.15);transform:translateY(-1px)}
        .skill-btn:active{transform:scale(.98)}
        .skill-btn img{
          width:52px;

          color:#e6d5a0;
          font-family:'JetBrains Mono',monospace;
        }
        .sk-name{font-size:8px;letter-spacing:.1em;color:#e6d5a0;margin-top:6px;font-family:'JetBrains Mono',monospace;text-align:center;line-height:1.2;font-weight:700}
        .sk-true{font-size:6px;color:#8a9a8a;margin-top:2px;font-family:'JetBrains Mono',monospace;text-align:center;letter-spacing:.05em}
        .sk-meta{font-size:6px;color:#6a7a8a;margin-top:3px;font-family:'JetBrains Mono',monospace}

        .right{

          min-width:220px;

          border-left:1px solid rgba(30,42,50,.5);
