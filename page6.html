<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOLAND - BATTLE</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:url("./assets/heroes/bg-battlefield.webp") center/cover no-repeat fixed #0a0e14;color:#d8d2b8;font-family:Inter,Arial,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0}.bg img{width:100%;height:100%;object-fit:cover;display:block}
.wrap{position:fixed;inset:0;display:flex;z-index:2}
.left-nav{width:68px;min-width:68px;background:rgba(18,24,30,.35);border-right:1px solid rgba(30,42,50,.5);display:flex;flex-direction:column;align-items:center;padding:12px 6px;gap:18px;backdrop-filter:blur(2px)}
.nav-group{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.nav-item{width:48px;height:48px;background:#1a252f;border:1px solid #2a3a4a;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;opacity:.6;transition:.2s}
.nav-item.active{background:#1e2f3e;border-color:#e6d5a0;opacity:1;box-shadow:0 0 12px rgba(230,213,160,.2)}
.nav-label{font-size:7px;letter-spacing:.12em;color:#6a7a8a;margin-top:4px;text-align:center;font-family:'JetBrains Mono',monospace}
.nav-group.active .nav-label{color:#e6d5a0}
.center{flex:1;padding:24px;overflow:auto;background:rgba(16,22,30,.08);backdrop-filter:blur(1px);display:flex;flex-direction:column;align-items:center}
.title{font:900 32px 'Cinzel Decorative',serif;color:#e6d5a0;letter-spacing:.06em;text-align:center}
.sub{margin-top:6px;font:8px 'JetBrains Mono',monospace;letter-spacing:.32em;color:#7a90a8;text-transform:uppercase}
.loc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;width:100%;max-width:1100px;margin-top:24px}
.loc-card{background:rgba(20,26,34,.82);border:1px solid rgba(122,144,168,.18);border-radius:12px;padding:30px 18px;text-align:center;backdrop-filter:blur(10px);box-shadow:0 12px 40px rgba(0,0,0,.4);cursor:pointer;transition:.2s}
.loc-card:hover{border-color:#e6d5a0;transform:translateY(-2px)}
.loc-card.soon{opacity:.45;cursor:default;border-style:dashed;background:rgba(20,26,34,.5);pointer-events:none}
.loc-icon{font-size:36px;margin-bottom:12px}
.loc-name{font:700 13px Inter,sans-serif;letter-spacing:.08em;color:#e6d5a0;text-transform:uppercase}
.loc-name span{display:block;font:400 10px 'JetBrains Mono',monospace;color:#7a90a8;margin-top:4px}
.loc-type{margin-top:10px;font:7px 'JetBrains Mono',monospace;color:#8ea0b0;letter-spacing:.2em;text-transform:uppercase}
.loc-lvl{margin-top:10px;font:600 9px 'JetBrains Mono',monospace;color:#e6d5a0}
.soon-badge{margin-top:12px;font:900 11px 'JetBrains Mono',monospace;letter-spacing:.25em;color:#5a6e80;border:1px solid #3a4a5a;border-radius:6px;padding:4px 8px;display:inline-block;background:rgba(0,0,0,.2)}
.right{width:200px;min-width:200px;background:rgba(14,20,26,.9);border-left:1px solid rgba(30,42,50,.6);display:flex;flex-direction:column;backdrop-filter:blur(6px)}
.chat-head{height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid rgba(30,42,50,.5)}
.dot{width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80}
.chat-title{font:7px 'JetBrains Mono',monospace;letter-spacing:.2em;color:#e6d5a0}
.chat-body{flex:1;padding:12px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.sys-msg{font:10px 'JetBrains Mono',monospace;color:#5a6e80;line-height:1.4;background:rgba(122,144,168,.08);border-radius:6px;padding:8px}
.chat-input{border-top:1px solid rgba(30,42,50,.5);display:flex;gap:6px;padding:8px;background:#12181e}
.chat-input input{flex:1;background:rgba(20,26,34,.8);border:1px solid rgba(42,58,74,.6);border-radius:6px;padding:7px 8px;font:10px 'JetBrains Mono',monospace;color:#c9d6e2;outline:none}
.chat-input button{background:#1e2f3e;border:1px solid #e6d5a0;border-radius:6px;padding:0 10px;font:10px 'JetBrains Mono',monospace;color:#e6d5a0;cursor:pointer}
@media(max-width:900px){.loc-grid{grid-template-columns:1fr}.right{display:none}}

.main,.center,.center-col,.hero-panel{
  position:relative !important;
  z-index:1 !important;
}


/* VOLAND NAV FIX - 60px / 52x52 / gap 4 / no scroll / hover label */
.left-nav{
  width:60px !important;
  min-width:60px !important;
  max-width:60px !important;
  flex:0 0 60px !important;
  background:rgba(18,24,30,.94) !important;
  border-right:1px solid #2a3a4a !important;
  display:flex !important;
  flex-direction:column !important;
  justify-content:flex-start !important;
  align-items:center !important;
  height:100vh !important;
  height:100dvh !important;
  padding:6px 4px !important;
  gap:0 !important;
  overflow:visible !important;
  position:relative !important;
  z-index:20 !important;
  backdrop-filter:blur(6px) !important;
}
.nav-top{
  display:flex !important;
  flex-direction:column !important;
  gap:4px !important;
  align-items:center !important;
  width:100% !important;
}
.nav-bottom{
  margin-top:auto !important;
  padding-top:8px !important;
  border-top:1px solid rgba(255,255,255,.08) !important;
  width:100% !important;
  display:flex !important;
  flex-direction:column !important;
  align-items:center !important;
  gap:4px !important;
}
.nav-group{
  cursor:pointer !important;
  display:flex !important;
  flex-direction:column !important;
  align-items:center !important;
  gap:0 !important;
  width:100% !important;
  position:relative !important;
}
.nav-item{
  width:52px !important;
  height:52px !important;
  min-width:52px !important;
  min-height:52px !important;
  background:#1a252f !important;
  border:1px solid #2a3a4a !important;
  border-radius:9px !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  opacity:.75 !important;
  transition:.2s !important;
  flex-shrink:0 !important;
  padding:0 !important;
  overflow:hidden !important;
}
.nav-item.active{
  border-color:#e6d5a0 !important;
  opacity:1 !important;
  background:#1e2f3e !important;
  box-shadow:0 0 10px rgba(230,213,160,.3) !important;
}
.nav-item:hover{
  opacity:1 !important;
  border-color:#e6d5a0 !important;
}
.nav-item img{
  width:100% !important;
  height:100% !important;
  object-fit:cover !important;
  display:block !important;
  border-radius:8px !important;
}
.nav-label{
  position:absolute !important;
  left:64px !important;
  top:50% !important;
  transform:translateY(-50%) translateX(-6px) !important;
  background:rgba(20,26,34,.96) !important;
  border:1px solid #e6d5a0 !important;
  color:#e6d5a0 !important;
  padding:5px 9px !important;
  border-radius:6px !important;
  font:700 8px 'JetBrains Mono',monospace !important;
  letter-spacing:.15em !important;
  white-space:nowrap !important;
  opacity:0 !important;
  pointer-events:none !important;
  transition:.18s !important;
  z-index:30 !important;
  box-shadow:0 4px 16px rgba(0,0,0,.5) !important;
}
.nav-group:hover .nav-label{
  opacity:1 !important;
  transform:translateY(-50%) translateX(0) !important;
}
.wrap{
  display:flex !important;
  position:fixed !important;
  inset:0 !important;
}

</style>
</head>
<body>
<div class="bg"><img src="./assets/heroes/bg-battlefield.webp"></div>
<div class="wrap">
  <div class="left-nav">
  <div class="nav-top">
    <div class="nav-group " onclick="location.href='./page3.html'"><div class="nav-item " data-page="page3"><img src="./assets/ui/nav/hero.webp" alt="HERO"></div><div class="nav-label">HERO</div></div>
    <div class="nav-group " onclick="location.href='./page4.html'"><div class="nav-item " data-page="page4"><img src="./assets/ui/nav/bag.webp" alt="BAG"></div><div class="nav-label">BAG</div></div>
    <div class="nav-group " onclick="location.href='./page5.html'"><div class="nav-item " data-page="page5"><img src="./assets/ui/nav/skills.webp" alt="SKILLS"></div><div class="nav-label">SKILLS</div></div>
    <div class="nav-group active" onclick="location.href='./page6.html'"><div class="nav-item active" data-page="page6"><img src="./assets/ui/nav/battle.webp" alt="BATTLE"></div><div class="nav-label">BATTLE</div></div>
    <div class="nav-group " onclick="location.href='./page9.html'"><div class="nav-item " data-page="page9"><img src="./assets/ui/nav/missions.webp" alt="MISSIONS"></div><div class="nav-label">MISSIONS</div></div>
    <div class="nav-group " onclick="location.href='./page10.html'"><div class="nav-item " data-page="page10"><img src="./assets/ui/nav/market.webp" alt="MARKET"></div><div class="nav-label">MARKET</div></div>
    <div class="nav-group " onclick="location.href='./page11.html'"><div class="nav-item " data-page="page11"><img src="./assets/ui/nav/pvp.webp" alt="PVP"></div><div class="nav-label">PVP</div></div>
    <div class="nav-group " onclick="location.href='./page12.html'"><div class="nav-item " data-page="page12"><img src="./assets/ui/nav/workshop.webp" alt="WORKSHOP"></div><div class="nav-label">WORKSHOP</div></div>
    <div class="nav-group " onclick="location.href='./page13.html'"><div class="nav-item " data-page="page13"><img src="./assets/ui/nav/pass.webp" alt="PASS"></div><div class="nav-label">PASS</div></div>
  </div>
  <div class="nav-bottom">
    <div class="nav-group" onclick="location.href='./index.html'"><div class="nav-item" data-page="index"><img src="./assets/ui/nav/start.webp" alt="START"></div><div class="nav-label">START</div></div>
  </div>
</div>

  

  


<main class="center">
<div class="title">BATTLEFIELD</div>
<div class="sub">VOLAND • 6 ACTIVE + 2 SOON</div>
<div class="loc-grid" id="locGrid"></div>
</main>
<aside class="right">
<div class="chat-head"><div class="dot"></div><div class="chat-title">VOLAND • COMMS</div></div>
<div class="chat-body" id="chatBody"><div class="sys-msg">SYS: Battlefield — LVL 1 / 5 / 10 fixed</div></div>
<div class="chat-input"><input id="chatIn" placeholder="transmit..."><button id="sendBtn">›</button></div>
</aside>
</div>
<script src="./assets/js/lang.js"></script>
<script src="./assets/js/config.js"></script>
<script src="./assets/js/db/heroes.js"></script>
<script src="./assets/js/db/tiers.js"></script>
<script src="./assets/js/db/resources.js"></script>
<script src="./assets/js/db/items.js"></script>
<script src="./assets/js/db/starter.js"></script>
<script src="./assets/js/db/locations.js"></script>
<script src="./assets/js/db/enemies.js"></script>
<script src="./assets/js/db/missions.js"></script>
<script src="./assets/js/storage.js"></script>
<script>
const LVLS=[1,5,10,15,20,25];
function render(){
 const g=document.getElementById('locGrid');
 let a=[],s=[];
 try{
  if(window.VOLAND_LOCATIONS){
   a=VOLAND_LOCATIONS.filter(l=>l.active).slice(0,6);
   s=VOLAND_LOCATIONS.filter(l=>!l.active).slice(0,2);
  }
 }catch(e){}
 if(!a.length) a=[{id:1,name:volandT('ПУСТЫНЯ', 'DESERT'),eng:'DESERT',icon:'🏜️',img:'./assets/enemies/bg-desert-dark.jpg',type:volandT('Жара • Песок', 'Heat • Sand')},{id:2,name:volandT('ТЕМНЫЙ ЛЕС', 'DARK FOREST'),eng:'DARK FOREST',icon:'🌲',img:'./assets/enemies/bg-dark-forest.webp',type:volandT('Тень • Яд', 'Shadow • Poison')},{id:3,name:volandT('ЛЕДЯНЫЕ ЗЕМЛИ', 'FROSTLANDS'),eng:'FROSTLANDS',icon:'❄️',img:'./assets/enemies/bg-frostlands.webp',type:volandT('Холод • Лед', 'Cold • Ice')},{id:4,name:volandT('БОЛОТО', 'SWAMP'),eng:'SWAMP',icon:'🐊',img:'./assets/enemies/bg-swamp.webp',type:volandT('Токсин • Вода', 'Toxin • Water')},{id:5,name:volandT('ВУЛКАН', 'VOLCANO'),eng:'VOLCANO',icon:'🌋',img:'./assets/enemies/bg-volcano.webp',type:volandT('Огонь • Лава', 'Fire • Lava')},{id:6,name:volandT('РУИНЫ', 'RUINS'),eng:'RUINS',icon:'🏛️',img:'./assets/enemies/bg-ruins.webp',type:volandT('Кость • Камень', 'Bone • Stone')}];
 if(!s.length) s=[{id:7,name:volandT('НЕБЕСА', 'HEAVENS'),eng:'SKY ISLANDS',icon:'☁️'},{id:8,name:volandT('БЕЗДНА', 'ABYSS'),eng:'ABYSS',icon:'🕳️'}];
 try{  }catch(e){}
 const top=a.map((l,i)=>{
  let fallback = l.id==1 ? './assets/enemies/bg-desert-dark.jpg' : l.id==2 ? './assets/enemies/bg-dark-forest.webp' : l.id==3 ? './assets/enemies/bg-frostlands.webp' : null;
  let img = l.img || fallback;
  let hasBg = !!img;
  let bgStyle = hasBg ? `background: linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.65)), url('${img}') center/cover no-repeat` : '';
  let iconHtml = hasBg ? '' : `<div class="loc-icon">${l.icon}</div>`;
  return `<div class="loc-card ${hasBg?'has-bg':''}" style="${bgStyle}" onclick="pickLoc('${l.id}')">${iconHtml}<div class="loc-name">${(volandGetLang()==='en'?l.eng:l.name)}</div><div class="loc-lvl">LVL ${LVLS[i]} • ENTER</div></div>`;
 }).join('');
 const bottom=s.map(l=>`<div class="loc-card soon"><div class="loc-icon">${l.icon}</div><div class="loc-name">${(volandGetLang()==='en'?l.eng:l.name)}</div><div class="loc-type">SOON</div><div class="soon-badge">SOON</div></div>`).join('');
 g.innerHTML=top+bottom;
}
function pickLoc(id){try{localStorage.setItem('voland_location',id);}catch(e){}location.href='./page7.html?loc='+id;}
function sendChat(){const i=document.getElementById('chatIn'),b=document.getElementById('chatBody');if(!i.value.trim())return;const d=document.createElement('div');d.className='sys-msg';d.style.color='#c9d6e2';d.textContent='YOU: '+i.value;b.appendChild(d);i.value='';b.scrollTop=9999;}
document.getElementById('sendBtn').onclick=sendChat;
document.getElementById('chatIn').onkeydown=e=>{if(e.key==='Enter')sendChat();};
render();
</script>
</body>
</html>
