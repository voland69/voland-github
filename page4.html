<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>VOLAND — Сумка</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"><style>
:root{--bg:#080a08;--p:#0e100e;--c:#0a0c0a;--l:#1e2e1e;--l2:#2a5a3a;--g:#d0b040;--gr:#3ad080;--t:#c8d0c8;--d:#5a7a5a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,sans-serif;display:flex;min-height:100vh}
.nav{width:64px;background:#0c0e0c;border-right:1px solid var(--l);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:12px;flex-shrink:0}
.ni{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#121412;border:1px solid var(--l);font-size:20px;text-decoration:none;color:#6a8a6a}
.ni.a{background:#1a2a1a;border-color:var(--l2);color:#e0e8e0;box-shadow:0 0 12px rgba(58,208,128,.18)}
.main{flex:1;display:flex;flex-direction:column;padding:14px;gap:12px;overflow:auto}
.top{display:flex;gap:12px;align-items:stretch}
.sp{width:280px;flex-shrink:0;background:var(--p);border:1px solid var(--l);border-radius:10px;padding:12px;display:flex;flex-direction:column}
.sg{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:8px;flex:1}
.sb{background:#121412;border:1px solid var(--l);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;justify-content:center}
.sb.b{border-color:var(--gr);box-shadow:0 0 8px rgba(58,208,128,.22)}
.sl{font-family:'JetBrains Mono';font-size:9px;color:var(--d);text-transform:uppercase;letter-spacing:.08em}
.sv{font-family:'JetBrains Mono';font-size:16px;font-weight:700;color:#e0e8e0;margin-top:2px}
.ez{flex:1;background:var(--p);border:1px solid var(--l);border-radius:10px;padding:12px;display:flex;flex-direction:column}
.eh{font-family:'JetBrains Mono';font-size:11px;letter-spacing:.12em;color:var(--d);text-transform:uppercase;margin-bottom:10px;display:flex;justify-content:space-between}
.eg{display:flex;gap:8px;flex:1}
.ec{display:flex;flex-direction:column;gap:8px;flex:1}.ec.ct{flex:1.15}
.es{background:#121412;border:1px solid var(--l);border-radius:6px;display:flex;align-items:center;padding:0 10px;gap:10px;cursor:pointer}
.es:hover{border-color:var(--l2)}.es.cs{height:78px}.es.ss{height:136px}.es.f{background:#141e14;border-color:var(--l2)}
.si{width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--c);border-radius:4px;border:1px solid var(--l)}
.sn{font-family:'JetBrains Mono';font-size:11px;text-transform:uppercase;color:#8aaa8a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb2{font-family:'JetBrains Mono';font-size:10px;color:var(--gr);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp{width:250px;flex-shrink:0;background:var(--p);border:1px solid var(--l);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:12px}
.bl{font-family:'JetBrains Mono';font-size:9px;color:var(--d);text-transform:uppercase;display:flex;justify-content:space-between}
.bt{height:8px;background:#121412;border:1px solid var(--l);border-radius:999px;overflow:hidden;margin-top:4px}
.bf{height:100%;background:linear-gradient(90deg,var(--gr),#2aaa60);transition:width .3s}.bf.gold{background:linear-gradient(90deg,#d0b040,#a08020)}.bf.xp{background:linear-gradient(90deg,#6a8aff,#4a5ad0)}
.inv{background:var(--p);border:1px solid var(--l);border-radius:10px;padding:12px}
.it{font-family:'JetBrains Mono';font-size:12px;letter-spacing:.08em;color:#8aaa8a;text-transform:uppercase;margin-bottom:12px}
.ig{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.ic{aspect-ratio:1;background:var(--c);border:1px solid var(--l);border-radius:6px;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;transition:.15s}
.ic:hover{border-color:var(--l2)}.ic.hi{background:#121412;border-color:#2a3a2a}.ic.hi.resource{border-color:#2a5a3a}.ic.hi.gold{border-color:#d0b040;box-shadow:0 0 10px rgba(208,176,64,.35),inset 0 0 8px rgba(208,176,64,.1)}.ic.hi.equip{border-color:#3a4a6a}
.ii{font-size:20px;line-height:1;pointer-events:none}
.ict{position:absolute;bottom:2px;right:3px;font-family:'JetBrains Mono';font-size:8px;font-weight:700;color:#e0e8e0;background:rgba(0,0,0,.75);padding:1px 3px;border-radius:3px;line-height:1.2;min-width:10px;text-align:center}
@media(max-width:1100px){.top{flex-direction:column}.sp,.bp{width:100%}.ig{grid-template-columns:repeat(5,1fr)}}
</style></head><body>
<div class="nav"><a class="ni" href="page3.html">🧙</a><a class="ni a" href="page4.html">🎒</a><a class="ni" href="page6.html">🗺️</a><a class="ni" href="page7.html">👹</a><a class="ni" href="page8.html">⚔️</a><a class="ni" href="page9.html">🎯</a></div>
<div class="main"><div class="top"><div class="sp"><div class="eh"><span>ХАРАКТЕРИСТИКИ</span><span id="lv">LVL1</span></div><div class="sg" id="sg"></div></div>
<div class="ez"><div class="eh"><span>ЭКИПИРОВКА 11</span><span style="font-size:9px">КЛИК СНЯТЬ</span></div><div class="eg"><div class="ec" id="cL"></div><div class="ec ct" id="cC"></div><div class="ec" id="cR"></div></div></div>
<div class="bp"><div><div class="bl"><span>HP</span><span id="hpT">100/100</span></div><div class="bt"><div class="bf" id="hpB" style="width:100%"></div></div></div>
<div><div class="bl"><span>ЗОЛОТО</span><span id="gT">0</span></div><div class="bt"><div class="bf gold" id="gB" style="width:10%"></div></div></div>
<div><div class="bl"><span>XP</span><span id="xT">0/1000</span></div><div class="bt"><div class="bf xp" id="xB" style="width:0%"></div></div></div>
<div style="font-family:'JetBrains Mono';font-size:9px;color:var(--d);line-height:1.4" id="summ"></div></div></div>
<div class="inv"><div class="it" id="it">ИНВЕНТАРЬ - 0/50 - 0 GOLD - 0 RES - КЛИК НАДЕТЬ</div><div class="ig" id="ig"></div></div></div>
<script src="assets/js/config.js?v=6"></script><script src="assets/js/db.js?v=6"></script><script src="assets/js/storage.js?v=6"></script>
<script>
const RO=['quartz','wood','diamond','fang','essence'],RI={quartz:'🔷',wood:'🪵',diamond:'💎',fang:'🦷',essence:'💧'};
const SL=[{i:'head',n:'Шлем',c:'cC',h:'cs',ic:'🪖'},{i:'amulet',n:'Амулет',c:'cC',h:'cs',ic:'📿'},{i:'armor',n:'Броня',c:'cC',h:'cs',ic:'🦺'},{i:'gloves',n:'Перчатки',c:'cC',h:'cs',ic:'🧤'},{i:'boots',n:'Сапоги',c:'cC',h:'cs',ic:'🥾'},{i:'ear1',n:'Серьга L',c:'cL',h:'ss',ic:'💍'},{i:'weapon',n:'Оружие',c:'cL',h:'ss',ic:'🗡️'},{i:'ring1',n:'Кольцо L',c:'cL',h:'ss',ic:'💍'},{i:'ear2',n:'Серьга R',c:'cR',h:'ss',ic:'💍'},{i:'shield',n:'Щит',c:'cR',h:'ss',ic:'🛡️'},{i:'ring2',n:'Кольцо R',c:'cR',h:'ss',ic:'💍'}];
const ST=['atk','def','hp','mp','spd','crit'];
function GG(){try{if(typeof volandGetGold==='function')return volandGetGold()}catch(e){}return parseInt(localStorage.getItem('voland_gold')||'0')||0}
function GR(){try{if(typeof volandGetResources==='function')return volandGetResources()}catch(e){}try{return JSON.parse(localStorage.getItem('voland_resources')||'{}')}catch(e){return{}}}
function GI(){try{if(typeof volandGetInventory==='function')return volandGetInventory()}catch(e){}try{return JSON.parse(localStorage.getItem('voland_inventory')||'[]')}catch(e){return[]}}
function GE(){try{if(typeof volandGetEquipped==='function')return volandGetEquipped()}catch(e){}try{return JSON.parse(localStorage.getItem('voland_equip')||'{}')}catch(e){return{}}}
function GX(){try{if(typeof volandGetXp==='function')return volandGetXp()}catch(e){}return parseInt(localStorage.getItem('voland_xp')||'0')||0}
function GL(){try{if(typeof volandGetLevelInfo==='function')return volandGetLevelInfo()}catch(e){}let x=GX(),th=[0,1000,3000,6000];for(let i=4;i<50;i++)th.push(th[i-1]+3000+(i-3)*1000);let lv=1;for(let i=0;i<th.length;i++){if(x>=th[i])lv=i+1;else break}let c=th[lv-1]||0,n=th[lv]||c+4000;return{level:lv,cur:x-c,need:n-c,total:x}}
function SE(o){try{if(typeof volandSaveEquipped==='function'){volandSaveEquipped(o);return}}catch(e){}localStorage.setItem('voland_equip',JSON.stringify(o))}
function SI(a){try{if(typeof volandSaveInventory==='function'){volandSaveInventory(a);return}}catch(e){}localStorage.setItem('voland_inventory',JSON.stringify(a))}
function BT(){let s=document.getElementById('sg');s.innerHTML='';ST.forEach(k=>{let d=document.createElement('div');d.className='sb';d.id='s-'+k;d.innerHTML='<div class=sl>'+k+'</div><div class=sv id=v-'+k+'>0</div>';s.appendChild(d)});['cL','cC','cR'].forEach(id=>document.getElementById(id).innerHTML='');SL.forEach(x=>{let p=document.getElementById(x.c),e=document.createElement('div');e.className='es '+x.h;e.dataset.s=x.i;e.innerHTML='<div class=si>'+x.ic+'</div><div style="flex:1;min-width:0"><div class=sn>'+x.n+'</div><div class=sb2 id=b-'+x.i+'>— пусто —</div></div>';e.onclick=()=>UQ(x.i);p.appendChild(e)})}
function UE(){let e=GE();SL.forEach(s=>{let it=e[s.i],b=document.getElementById('b-'+s.i),el=document.querySelector('.es[data-s="'+s.i+'"]');if(it){el.classList.add('f');b.textContent=(it.bonus||'')+' '+(it.name||'');el.querySelector('.si').textContent=it.icon||s.ic}else{el.classList.remove('f');b.textContent='— пусто —';el.querySelector('.si').textContent=s.ic}})}
function US(){let e=GE(),base={atk:10,def:10,hp:100,mp:50,spd:10,crit:5},ad={atk:0,def:0,hp:0,mp:0,spd:0,crit:0};Object.values(e).forEach(it=>{if(!it)return;if(it.stats){for(let k in it.stats)ad[k]=(ad[k]||0)+it.stats[k]}else if(it.bonusValue&&it.bonusStat)ad[it.bonusStat]=(ad[it.bonusStat]||0)+it.bonusValue});ST.forEach(k=>{let v=(base[k]||0)+(ad[k]||0);document.getElementById('v-'+k).textContent=v;let box=document.getElementById('s-'+k);if((ad[k]||0)>0)box.classList.add('b');else box.classList.remove('b')});document.getElementById('hpT').textContent=(base.hp+(ad.hp||0))+'/'+(base.hp+(ad.hp||0))}
function UB(){let g=GG(),li=GL();document.getElementById('gT').textContent=g;document.getElementById('gB').style.width=Math.min(100,g/5)+'%';document.getElementById('xT').textContent=li.cur+'/'+li.need;document.getElementById('xB').style.width=Math.min(100,li.need?li.cur/li.need*100:0)+'%';document.getElementById('lv').textContent='LVL '+li.level;let r=GR(),sum=Object.values(r).reduce((a,b)=>a+(b||0),0);document.getElementById('summ').textContent='Ресурсов '+sum+' • Типов '+(Object.keys(r).filter(k=>r[k]>0).length)+' • Экип '+Object.keys(GE()).filter(k=>GE()[k]).length+'/11'}
function RB(){let grid=document.getElementById('ig');grid.innerHTML='';let g=GG(),r=GR(),inv=GI(),all=[];if(g>0)all.push({id:'gold',icon:'🪙',name:'Золото',isGold:1,count:g,type:'gold'});RO.forEach(id=>{let c=r[id]||0;if(c>0){let def=(typeof VOLAND_RESOURCES!=='undefined'&&VOLAND_RESOURCES[id])?VOLAND_RESOURCES[id]:{icon:RI[id],name:id};all.push({id,icon:def.icon||RI[id],name:def.name||id,isRes:1,count:c,type:'res'})}});inv.forEach(it=>{if(it)all.push({...it,isEq:1,type:'eq'})});all=all.slice(0,50);let filled=all.length,rt=Object.keys(r).filter(k=>r[k]>0).length;document.getElementById('it').textContent='ИНВЕНТАРЬ - '+filled+'/50 - '+g+' GOLD - '+rt+' RES - КЛИК НАДЕТЬ';for(let i=0;i<50;i++){let cell=document.createElement('div');cell.className='ic';if(i<all.length){let it=all[i];cell.classList.add('hi');if(it.isGold)cell.classList.add('gold');else if(it.isRes)cell.classList.add('resource');else cell.classList.add('equip');cell.innerHTML='<div class=ii>'+(it.icon||'📦')+'</div>'+(it.count>1||it.isGold?'<div class=ict>'+(it.count>99?'99+':it.count)+'</div>':'');cell.title=it.name+' '+(it.count>1?'x'+it.count:'');if(it.isEq)cell.onclick=()=>EQ(it); }grid.appendChild(cell)}}
function EQ(item){if(!item.slot){let g=SL.find(s=>item.id&&item.id.includes(s.i))||SL.find(s=>s.i==='weapon');item.slot=g.i}let eq=GE(),old=eq[item.slot];eq[item.slot]=item;SE(eq);let inv=GI(),idx=inv.findIndex(x=>x&&x.id===item.id);if(idx>=0){inv.splice(idx,1);SI(inv)}if(old){let inv2=GI();inv2.push(old);SI(inv2)}RF()}
function UQ(sid){let eq=GE(),it=eq[sid];if(!it)return;delete eq[sid];SE(eq);let inv=GI();inv.push(it);SI(inv);RF()}
function RF(){UE();US();UB();RB()}
BT();RF();try{localStorage.setItem('voland_version','6')}catch(e){}
</script></body></html>
