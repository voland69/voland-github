*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background: url("./assets/heroes/bg-battlefield.webp") center/cover no-repeat fixed #0a0e14;color:#d8d2b8;font-family:Inter,Arial,sans-serif;overflow:hidden}.bg{position:fixed;inset:0;z-index:0}.bg img{width:100%;height:100%;object-fit:cover}.wrap{position:fixed;inset:0;display:flex;z-index:2}.center-col{flex:1;display:flex;flex-direction:column;background:transparent;overflow:hidden;backdrop-filter:none}.top-row{flex:0 0 480px;display:flex;gap:16px;background:rgba(19,26,34,.35);border-bottom:1px solid rgba(30,42,50,.5);overflow:hidden;align-items:stretch}.stats-panel{width:250px;min-width:250px;max-width:250px;background:transparent;border-right:none;padding:12px 16px 16px 16px;display:flex;flex-direction:column;justify-content:flex-start;gap:0;height:100%}.bars-panel{width:250px;min-width:250px;max-width:250px;background:transparent;border-left:none;padding:24px 16px;display:flex;flex-direction:column;justify-content:center;gap:8px}.panel-title{font-size:7px;letter-spacing:.2em;color:#6a7a8a;font-family:'JetBrains Mono',monospace;text-align:center;margin-bottom:8px}.stats-grid-inner{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:10px;flex:1;margin-top:8px;height:100%}.stat-card{background:#1a242f;border:1px solid #2a3a4a;border-radius:10px;padding:8px 6px;text-align:center;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%}.stat-card.boosted{border-color:#3ad080;box-shadow:0 0 12px rgba(58,208,128,.3)}.stat-label{font-size:8px;letter-spacing:.15em;color:#6a7a8a;font-family:'JetBrains Mono',monospace}.stat-value{margin-top:4px;font-size:18px;font-weight:800;color:#e6d5a0;font-family:'JetBrains Mono',monospace}.stat-bonus{font-family:'JetBrains Mono',monospace;margin-top:6px;min-height:36px;font-weight:800;line-height:1.3;display:flex;flex-direction:column;gap:1px;align-items:center;justify-content:center}.stat-bonus-gear{font-size:11px;color:#3ad080;font-weight:800;white-space:nowrap}.stat-bonus-guild{font-size:11px;color:#4a9aff;font-weight:800;white-space:nowrap}.stat-bonus-points{font-size:11px;color:#FFD700;font-weight:800;white-space:nowrap}.equip-zone{flex:1;padding:12px 16px 16px 16px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;background:transparent}.equip-grid{width:100%;max-width:680px;display:flex;gap:14px;align-items:stretch;justify-content:center;margin-top:6px}.equip-col{display:flex;flex-direction:column;gap:10px}.equip-col.left-col,.equip-col.right-col{width:120px;flex:0 0 120px}.equip-col.center-col-grid{flex:1;max-width:260px}.equip-col.center-col-grid .equip-slot{height:78px}.equip-col.left-col .equip-slot,.equip-col.right-col .equip-slot{height:136px}.equip-slot{background:#1a242f;border:1px dashed #2a3a4a;border-radius:12px;display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;column-gap:10px;row-gap:2px;align-items:center;cursor:pointer;width:100%;padding:8px 10px;justify-items:start}.equip-slot.filled{border-style:solid;border-color:#e6d5a0;background:#1e2f3e;box-shadow:0 0 14px rgba(230,213,160,.28)}.equip-slot .slot-icon{grid-column:1;grid-row:1 / span 2;font-size:28px;justify-self:center;align-self:center}.equip-slot .slot-name{grid-column:2;grid-row:1;font-size:11px;letter-spacing:.06em;color:#8a9a8a;font-family:'JetBrains Mono',monospace;text-align:left;text-transform:uppercase;font-weight:800;line-height:1.1;margin-top:0}.equip-slot.filled .slot-name{color:#e6d5a0}.equip-slot .slot-empty{grid-column:2;grid-row:2;font-size:14px;color:#3ad080;font-family:'JetBrains Mono',monospace;text-align:left;line-height:1.15;margin-top:0;font-weight:800}.equip-slot.head{width:100%;height:62px}.equip-slot.amulet{width:100%;height:62px}.equip-slot.ear-l{width:100%;height:110px}.equip-slot.ear-r{width:100%;height:110px}.equip-slot.weapon{width:100%;height:110px}.equip-slot.armor{width:100%;height:62px;background:#1e2a32}.equip-slot.shield{width:100%;height:110px}.equip-slot.ring1{width:100%;height:110px}.equip-slot.gloves{width:100%;height:62px}.equip-slot.ring2{width:100%;height:110px}.equip-slot.boots{width:100%;height:62px}.bar-row{display:flex;flex-direction:column;gap:5px}.bar-label{font-size:7px;letter-spacing:.15em;color:#ffffff;font-family:'JetBrains Mono',monospace;display:flex;justify-content:flex-start}.bar-track{height:24px;background:#0a0e14;border-radius:5px;overflow:hidden;border:1px solid #1e2a32;position:relative;display:flex;align-items:center;justify-content:center}.bar-fill{position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;justify-content:flex-start;font-size:9px;font-weight:700;font-family:'JetBrains Mono',monospace;transition:width .3s ease}.bar-fill.hp{background:linear-gradient(90deg,#b33030,#e05050)}.bar-fill.mana{background:linear-gradient(90deg,#1a4a9a,#2a6ad0)}.bar-fill.stamina{background:linear-gradient(90deg,#1a7a4a,#3ad080)}.bar-fill.xp{background:linear-gradient(90deg,#8a6a1a,#d0b040)}.bar-text{position:relative;z-index:2;font-size:9px;font-weight:700;font-family:'JetBrains Mono',monospace;color:#fff;text-align:center;pointer-events:none;width:100%;text-shadow:0 1px 2px rgba(0,0,0,.8)}.bars-inner{display:flex;flex-direction:column;gap:10px}.inventory-zone{flex:1;background:transparent;padding:10px 12px;display:flex;flex-direction:column;overflow:auto;margin-top:4px}.inv-grid{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin-top:6px}.inv-cell{aspect-ratio:1;background:#1a242f;border:1px solid #2a3a4a;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;min-height:32px;position:relative;overflow:hidden}.inv-cell.has-item{background:#121a26;border-color:#2a3a4a}.inv-cell.has-item:hover{border-color:#e6d5a0;box-shadow:0 0 8px rgba(230,213,160,.15)}.inv-cell .item-icon{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:absolute;inset:0}.inv-cell .item-icon img{width:100%;height:100%;object-fit:cover;display:block;border-radius:6px}.inv-cell .item-icon .emoji-fallback{font-size:18px}.inv-cell .badge{position:absolute;right:2px;bottom:2px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:rgba(0,0,0,.85);color:#fff;font:800 9px 'JetBrains Mono',monospace;display:flex;align-items:center;justify-content:center;z-index:2;border:1px solid rgba(255,255,255,.12);box-shadow:0 2px 6px rgba(0,0,0,.5)}.inv-cell.empty{opacity:.25}/* modal for gear */
.gear-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}.gear-modal-overlay.show{display:flex}.gear-modal{width:360px;background:linear-gradient(180deg,#1e2a3a,#121a26);border:1px solid rgba(230,213,160,.25);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 32px rgba(0,0,0,.6)}.gear-modal-top{display:flex;gap:14px;align-items:flex-start}.gear-modal-icon{width:72px;height:72px;min-width:72px;border-radius:10px;background:#0a0e14;border:1px solid #2a3a4a;overflow:hidden;display:flex;align-items:center;justify-content:center}.gear-modal-icon img{width:100%;height:100%;object-fit:cover;display:block}.gear-modal-info{flex:1;display:flex;flex-direction:column;gap:6px}.gear-modal-name{font:800 13px Inter,sans-serif;color:#e6d5a0;letter-spacing:.04em;text-transform:uppercase}.gear-modal-rarity{font:700 7px 'JetBrains Mono',monospace;letter-spacing:.15em;padding:3px 6px;border-radius:4px;width:fit-content}.gear-modal-rarity.green{background:rgba(58,208,128,.15);border:1px solid #3ad080;color:#3ad080}.gear-modal-rarity.blue{background:rgba(106,176,255,.15);border:1px solid #6ab0ff;color:#6ab0ff}.gear-modal-rarity.legend{background:rgba(208,176,64,.15);border:1px solid #d0b040;color:#d0b040}.gear-modal-rarity.common{background:rgba(122,144,168,.12);border:1px solid #2a3a4a;color:#7a90a8}.gear-modal-slot{font:400 8px 'JetBrains Mono',monospace;color:#6a7a8a;letter-spacing:.12em}.gear-modal-bonuses{display:flex;flex-direction:column;gap:4px;background:rgba(0,0,0,.25);border:1px solid rgba(42,58,74,.5);border-radius:8px;padding:10px}.gear-modal-bonus{font:700 11px 'JetBrains Mono',monospace;color:#3ad080}.gear-modal-btns{display:flex;gap:8px;margin-top:4px}.gear-modal-btn{flex:1;height:38px;border-radius:8px;border:1px solid #2a3a4a;background:#1a242f;color:#8a9a8a;font:700 9px 'JetBrains Mono',monospace;cursor:pointer;letter-spacing:.12em;transition:.15s}.gear-modal-btn:hover{border-color:#e6d5a0;color:#e6d5a0}.gear-modal-btn.equip{background:linear-gradient(180deg,#e6d5a0,#c0a860);color:#0a0e14;border-color:#e6d5a0;font-weight:800}.gear-modal-btn.equip:hover{filter:brightness(1.1)}.right{width:200px;min-width:200px;background:rgba(14,20,26,1);border-left:1px solid rgba(30,42,50,.5);display:flex;flex-direction:column}.chat-header{padding:12px;border-bottom:1px solid #1e2a32;display:flex;align-items:center;gap:8px;background:#141c24}.dot{width:8px;height:8px;border-radius:50%;background:#3ad080;box-shadow:0 0 6px #3ad080}.chat-title{font-size:9px;letter-spacing:.2em;color:#6a7a8a;font-family:'JetBrains Mono',monospace}.chat-body{flex:1;padding:10px;overflow:auto;display:flex;flex-direction:column;gap:8px}.sys-msg{background:#1a242f;border-left:2px solid #d0b040;padding:8px;font-size:9px;color:#9a9a7a;line-height:1.3;border-radius:0 6px 6px 0}.chat-input{padding:8px;border-top:1px solid #1e2a32;display:flex;gap:6px;background:#12181e}.chat-input input{flex:1;background:#0a0e14;border:1px solid #1e2a32;border-radius:6px;padding:8px;font-size:11px;color:#d8d2b8}.chat-input button{width:32px;background:#e6d5a0;border:none;border-radius:6px;cursor:pointer;font-weight:800}.main,.center,.center-col,.hero-panel{
  position:relative !important;
  z-index:1 !important;
}</style>

<script>
if (!volandHasSave()){ location.href='./page2.html'; }
let equipped = volandGetEquippedItems();
let inv = [];
function rebuildInv(){
  const ids = new Set(Object.values(equipped).map(i=>i.id));
  const equippedBaseIds = new Set(Object.values(equipped).map(i=>i.baseId || (i.id||'').split('-')[0]));
  let heroId = null;
  let allowedWeaponBases = new Set(['staff']); // default mage
  try{
    heroId = (typeof volandGetHeroId==='function') ? volandGetHeroId() : 'necro-f-new';
    const classMap = {'necro-f-new':'mage','necro-m':'tank','archer-f':'archer','archer-m':'archer','archmage-m':'mage','warrior-f':'warrior','warrior-m':'warrior','mage-f-new':'mage'};
    const heroClass = classMap[heroId] || 'mage';
    const mapBases = {'mage':['staff'],'archer':['bow'],'warrior':['sword'],'tank':['shield','sword']};
    allowedWeaponBases = new Set(mapBases[heroClass] || ['staff']);
    if(typeof VOLAND_BASE_CLOTHING_IDS!=='undefined'){
      VOLAND_BASE_CLOTHING_IDS.forEach(cid=>{
        try{ let it = VOLAND_ITEMS.find(x=>x.id===cid); if(it) allowedWeaponBases.add(it.baseId); }catch(e){}
      });
    }
  }catch(e){
    allowedWeaponBases = new Set(['staff']);
  }
  inv = [];
  let droppedGearMap = {};
  try{
    if(typeof volandCleanupNonClassWeapons==='function'){ try{ volandCleanupNonClassWeapons(); }catch(e){} }
    // FORCE REMOVE bow/sword/shield for mage from inventory immediately
    try{
      let saves = volandGetSaves();
      let idx = volandGetActiveIndex();
      if(saves[idx] && saves[idx].inventory){
        let before = saves[idx].inventory.length;
        saves[idx].inventory = saves[idx].inventory.filter(it=>{
          let id = it.id || it;
          if(typeof id!=='string') return true;
          let b = id.split('-')[0];
          // for mage, remove bow, sword, shield
          if(['bow','sword','shield'].includes(b)) return false;
          return true;
        });
        if(saves[idx].inventory.length !== before){
          
          volandSaveSaves(saves);
          localStorage.setItem('voland_v1_inventory', JSON.stringify(saves[idx].inventory));
        }
      }
    }catch(e){  }
    
    if(typeof volandGetInventory==='function'){
      let dropped = volandGetInventory();
      for(let d of dropped){
        let item = null;
        try{ item = VOLAND_ITEMS.find(i=>i.id===d.id); }catch(e){}
        if(!item) continue;
        if(ids.has(item.id)) continue;
        let base = item.baseId || item.id.split('-')[0];
        if(equippedBaseIds.has(base)) continue; // FIX: skip if base already equipped (e.g. red helmet when gold helmet equipped)
        
        // HARD FILTER for mage - only staff
        let heroClassForFilter = 'mage';
        try{
          let hid = (typeof volandGetHeroId==='function') ? volandGetHeroId() : 'necro-f-new';
          const cmap = {'necro-f-new':'mage','necro-m':'tank','archer-f':'archer','archer-m':'archer','archmage-m':'mage','warrior-f':'warrior','warrior-m':'warrior','mage-f-new':'mage'};
          heroClassForFilter = cmap[hid] || 'mage';
        }catch(e){}
        if(heroClassForFilter==='mage' && ['bow','sword','shield'].includes(base)){
          
          continue;
        }
        if(allowedWeaponBases && ['bow','staff','sword','shield'].includes(base) && !allowedWeaponBases.has(base)){
          continue;
        }
        let existing = droppedGearMap[base];
        if(!existing){
          droppedGearMap[base] = {...item, isDropped:true, dropTime:d.time, isEquip:true};
        } else {
          if(typeof volandCompareItemLevel==='function'){
            if(volandCompareItemLevel(item.id, existing.id)>0){
              droppedGearMap[base] = {...item, isDropped:true, dropTime:d.time, isEquip:true};
            }
          } else {
            const order={bw:0,green:1,blue:2,red:3,gold:4};
            let ta=order[existing.tier]||0, tb=order[item.tier]||0;
            if(tb>ta || (tb===ta && (item.level||0)>(existing.level||0))){
              droppedGearMap[base] = {...item, isDropped:true, dropTime:d.time, isEquip:true};
            }
          }
        }
      }
    }
  }catch(e){  }
  Object.values(droppedGearMap).forEach(it=>{
    if(inv.length<50) inv.push(it);
  });
  try{
    let starterIds = [];
    if(heroId && typeof VOLAND_GET_STARTER_GEAR_FOR_HERO==='function'){
      starterIds = VOLAND_GET_STARTER_GEAR_FOR_HERO(heroId);
    } else if(typeof VOLAND_BASE_CLOTHING_IDS!=='undefined' && typeof VOLAND_HERO_WEAPON_TYPE!=='undefined' && typeof VOLAND_WEAPON_SETS!=='undefined'){
      let wType = VOLAND_HERO_WEAPON_TYPE[heroId] || 'sword';
      let weapons = VOLAND_WEAPON_SETS[wType] || ['sword-bw-lvl1','shield-bw-lvl1'];
      starterIds = [...VOLAND_BASE_CLOTHING_IDS, ...weapons];
    } else if(typeof VOLAND_BASE_CLOTHING_IDS!=='undefined'){
      starterIds = [...VOLAND_BASE_CLOTHING_IDS, 'sword-bw-lvl1','shield-bw-lvl1'];
    }
    starterIds.forEach(sid=>{
      if(inv.length>=50) return;
      try{
        let it = VOLAND_ITEMS.find(x=>x.id===sid);
        if(!it) return;
        let base = it.baseId || it.id.split('-')[0];
        if(equippedBaseIds
