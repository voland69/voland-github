<!DOCTYPE html>
<html lang="ru">
<head>

<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/nav.css">
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#0a0e14;color:#d8d2b8;font-family:Inter,Arial,sans-serif;overflow:hidden}.bg{position:fixed;inset:0;z-index:0;background:url("./assets/heroes/bg-battlefield.webp") center/cover no-repeat fixed}.bg:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.65)}.wrap{position:fixed;inset:0;display:flex;z-index:2}.wrap{display:flex !important;position:fixed !important;inset:0 !important}.center{flex:1;display:flex;flex-direction:column;overflow:hidden;background:rgba(16,22,30,.18)}.top-bar{height:48px;background:rgba(18,24,33,.85);border-bottom:1px solid rgba(30,42,50,.5);display:flex;align-items:center;justify-content:space-between;padding:0 16px}.top-title{font:900 16px 'Cinzel Decorative',serif;letter-spacing:.2em;color:#e6d5a0}.top-sub{font:700 9px 'JetBrains Mono',monospace;color:#8a9aaa;letter-spacing:.15em}.main{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:16px}.lobby{width:100%;max-width:1000px;display:flex;flex-direction:column;gap:16px}.section{background:linear-gradient(180deg,#1e2a3a,#121a26);border:1px solid rgba(230,213,160,.2);border-radius:14px;padding:14px;box-shadow:0 12px 32px rgba(0,0,0,.5)}.section-title{font:900 12px 'Cinzel Decorative',serif;color:#e6d5a0;letter-spacing:.15em;text-align:center;margin-bottom:12px}.diff-bar{display:flex;gap:8px;justify-content:center}.diff-btn{flex:1;max-width:200px;padding:10px;background:#1a242f;border:1px solid #2a3a4a;border-radius:10px;font:700 10px 'JetBrains Mono',monospace;color:#8a9aaa;cursor:pointer;transition:.15s;text-align:center}.diff-btn.active{border-color:#e6d5a0;background:#1e2f3e;color:#e6d5a0;box-shadow:0 0 10px rgba(230,213,160,.2)}.diff-btn.easy.active{border-color:#3ad080;color:#3ad080}.diff-btn.hard.active{border-color:#e05050;color:#e08080}.diff-btn .pct{font:900 14px 'Cinzel Decorative',serif;display:block;margin-top:4px}.hero-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(140px,1fr));gap:10px}.hero-card{background:#1a242f;border:1px solid #2a3a4a;border-radius:10px;padding:10px;cursor:pointer;transition:.15s;text-align:center}.hero-card:hover{border-color:#e6d5a0;transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.4)}.hero-card.selected{border-color:#e6d5a0;background:#1e2f3e;box-shadow:0 0 15px rgba(230,213,160,.3)}.hero-card img{width:80px;height:80px;border-radius:8px;object-fit:cover;object-position:top;display:block;margin:0 auto 8px;background:#0a0e14}.hero-name{font:700 11px Inter,sans-serif;color:#e6d5a0;text-transform:uppercase}.hero-role{font:700 7px 'JetBrains Mono',monospace;color:#8a9aaa;margin-top:2px}.hero-stats{font:700 8px 'JetBrains Mono',monospace;color:#6a7a8a;margin-top:6px;line-height:1.4}.preview{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}.preview-card{flex:1;min-width:220px;background:#0a0e14;border:1px solid #2a3a4a;border-radius:10px;padding:12px;display:flex;gap:10px;align-items:center}.preview-card img{width:56px;height:56px;border-radius:8px;object-fit:cover;object-position:top}.preview-info{flex:1}.preview-name{font:700 12px Inter,sans-serif;color:#e6d5a0}.preview-role{font:700 7px 'JetBrains Mono',monospace;color:#8a9aaa}.preview-stats{font:700 8px 'JetBrains Mono',monospace;color:#d0b040;margin-top:4px}.fight-btn{width:100%;max-width:400px;margin:0 auto;display:block;padding:14px;background:linear-gradient(180deg,#1e3a2a,#123a22);border:1px solid #2a6a4a;border-radius:12px;font:900 14px 'Cinzel Decorative',serif;letter-spacing:.2em;color:#3ad080;cursor:pointer;transition:.2s;text-align:center}.fight-btn:hover{background:#1e4a32;border-color:#3ad080;box-shadow:0 0 20px rgba(58,208,128,.3)}.fight-btn:disabled{opacity:.4;cursor:not-allowed}.battle-area{width:100%;max-width:1100px;display:none;flex-direction:column;gap:12px}.battle-area.active{display:flex}.battle-top{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fighter{background:linear-gradient(180deg,#1e2a3a,#121a26);border:1px solid rgba(230,213,160,.2);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center}.fighter.enemy{border-color:rgba(224,80,80,.3)}.fighter img{width:64px;height:64px;border-radius:10px;object-fit:cover;object-position:top;background:#0a0e14}.fighter-info{flex:1}.fighter-name{font:700 13px Inter,sans-serif;color:#e6d5a0}.fighter-role{font:700 7px 'JetBrains Mono',monospace;color:#8a9aaa}.hp-bar-wrap{margin-top:8px;height:12px;background:#0a0e14;border:1px solid #2a3a4a;border-radius:6px;overflow:hidden;position:relative}.hp-bar{height:100%;background:linear-gradient(90deg,#3ad080,#2a8a5a);width:100%;transition:.4s}.hp-bar.enemy{background:linear-gradient(90deg,#e05050,#8a2a2a)}.mana-bar-wrap{margin-top:4px;height:6px;background:#0a0e14;border:1px solid #2a3a4a;border-radius:4px;overflow:hidden}.mana-bar{height:100%;background:linear-gradient(90deg,#5abaff,#2a5a8a);width:100%;transition:.4s}.bar-text{font:700 8px 'JetBrains Mono',monospace;color:#d8d2b8;margin-top:2px;display:flex;justify-content:space-between}.battle-log{height:280px;background:rgba(10,14,20,.8);border:1px solid #2a3a4a;border-radius:10px;padding:10px;overflow:auto;font:400 10px 'JetBrains Mono',monospace;line-height:1.6}.log-line{margin-bottom:4px}.log-line.hit{color:#d8d2b8}.log-line.crit{color:#e6d5a0;font-weight:700}.log-line.skill{color:#5abaff}.log-line.lose{color:#e08080}.log-line.enemy-hit{color:#ff9a5a}.log-line.win{color:#3ad080;font-weight:700}.skill-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.skill-btn{min-width:90px;padding:10px 12px;background:#1a242f;border:1px solid #2a3a4a;border-radius:10px;cursor:pointer;transition:.15s;text-align:center}.skill-btn:hover{border-color:#e6d5a0;transform:translateY(-1px)}.skill-btn.disabled{opacity:.4;cursor:not-allowed}.skill-btn .key{font:900 14px 'JetBrains Mono',monospace;color:#e6d5a0}.skill-btn .name{font:700 9px Inter,sans-serif;color:#d8d2b8;margin-top:2px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.skill-btn .meta{font:700 7px 'JetBrains Mono',monospace;color:#8a9aaa;margin-top:2px}.result-modal{position:fixed;inset:0;background:rgba(0,0,0,.12);backdrop-filter:blur(1px);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}.result-modal.show{display:flex}.result-box{width:100%;max-width:380px;background:linear-gradient(180deg,rgba(30,42,58,.82),rgba(18,26,38,.82));border:1px solid rgba(230,213,160,.3);border-radius:16px;padding:20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.7)}.result-icon{font-size:48px;margin-bottom:8px}.result-title{font:900 20px 'Cinzel Decorative',serif;color:#e6d5a0;letter-spacing:.1em}.result-sub{font:700 9px 'JetBrains Mono',monospace;color:#8a9aaa;margin-top:8px}.result-actions{display:flex;gap:8px;margin-top:16px}.btn{flex:1;padding:10px;border-radius:8px;border:1px solid #2a3a4a;background:#1a242f;color:#d8d2b8;font:700 9px 'JetBrains Mono',monospace;letter-spacing:.1em;cursor:pointer}.btn.primary{background:#1e2f3e;border-color:#e6d5a0;color:#e6d5a0}.right{width:200px;min-width:200px;background:rgba(14,20,26,1);border-left:1px solid rgba(30,42,50,.5);display:flex;flex-direction:column;margin-top:48px;height:calc(100% - 48px)}.chat-header{padding:12px;border-bottom:1px solid #1e2a32;display:flex;align-items:center;gap:8px;background:#141c24}.chat-title{font-size:9px;letter-spacing:.2em;color:#6a7a8a;font-family:'JetBrains Mono',monospace}.chat-body{flex:1;padding:10px;overflow:auto;display:flex;flex-direction:column;gap:8px}.chat-input{padding:8px;border-top:1px solid #1e2a32;display:flex;gap:6px;background:#12181e}.chat-input input{flex:1;background:#0a0e14;border:1px solid #1e2a32;border-radius:6px;padding:8px;font-size:11px;color:#d8d2b8}.chat-input button{width:32px;background:#e6d5a0;border:none;border-radius:6px;cursor:pointer;font-weight:800}.dot{width:8px;height:8px;border-radius:50%;background:#3ad080;box-shadow:0 0 6px #3ad080}.sys-msg{background:#1a242f;border-left:2px solid #d0b040;padding:8px;font-size:9px;color:#9a9a7a;line-height:1.3;border-radius:0 6px 6px 0}</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
<div class="left-nav" id="voland-nav"></div>
<div class="center">
  <div class="top-bar">
    <div class="top-title">ПВП АРЕНА • ТЕСТ БОТА</div>
    <div class="top-sub">8 ГЕРОЕВ • 3 СЛОЖНОСТИ • УМНЫЕ СКИЛЫ • HP x5</div>
  </div>
  <div class="main" id="mainArea">
    <div class="lobby" id="lobby">
      <div class="section">
        <div class="section-title">1 • ВЫБЕРИ СЛОЖНОСТЬ</div>
        <div class="diff-bar">
          <button class="diff-btn easy" data-diff="easy" onclick="selectDiff('easy')"><span>ЛЕГКО</span><span class="pct">70%</span><span style="font:400 7px JetBrains Mono;margin-top:4px;display:block">Слабый • Рандом скилы</span></button>
          <button class="diff-btn active" data-diff="medium" onclick="selectDiff('medium')"><span>СРЕДНЕ</span><span class="pct">100%</span><span style="font:400 7px JetBrains Mono;margin-top:4px;display:block">Как ты • Умные скилы</span></button>
          <button class="diff-btn hard" data-diff="hard" onclick="selectDiff('hard')"><span>ТЯЖЕЛО</span><span class="pct">130%</span><span style="font:400 7px JetBrains Mono;margin-top:4px;display:block">+30% статы • Идеальный AI</span></button>
        </div>
      </div>
      <div class="section">
        <div class="section-title">2 • ВЫБЕРИ ПРОТИВНИКА • 8 ГЕРОЕВ</div>
        <div class="hero-grid" id="heroGrid"></div>
      </div>
      <div class="section" id="previewSection" style="display:none">
        <div class="section-title">3 • ПРОСМОТР И БОЙ</div>
        <div class="preview" id="previewArea"></div>
        <button class="fight-btn" id="fightBtn" onclick="startFight()" disabled>ВЫБЕРИ ГЕРОЯ</button>
      </div>
    </div>
    <div class="battle-area" id="battleArea">
      <div class="battle-top">
        <div class="fighter">
          <img id="pImg" src="" alt="">
          <div class="fighter-info">
            <div class="fighter-name" id="pName">ТЫ</div>
            <div class="fighter-role" id="pRole">ИГРОК</div>
            <div class="hp-bar-wrap"><div class="hp-bar" id="pHpBar"></div></div>
            <div class="bar-text"><span id="pHpText">0/0</span><span>HP</span></div>
            <div class="mana-bar-wrap"><div class="mana-bar" id="pManaBar"></div></div>
            <div class="bar-text"><span id="pManaText">0/0</span><span>MANA</span></div>
          </div>
        </div>
        <div class="fighter enemy">
          <img id="bImg" src="" alt="">
          <div class="fighter-info">
            <div class="fighter-name" id="bName">БОТ</div>
            <div class="fighter-role" id="bRole">БОТ</div>
            <div class="hp-bar-wrap"><div class="hp-bar enemy" id="bHpBar"></div></div>
            <div class="bar-text"><span id="bHpText">0/0</span><span>HP</span></div>
            <div class="mana-bar-wrap"><div class="mana-bar" id="bManaBar"></div></div>
            <div class="bar-text"><span id="bManaText">0/0</span><span>MANA</span></div>
          </div>
        </div>
      </div>
      <div class="battle-log" id="battleLog"></div>
      <div class="skill-bar" id="skillBar"></div>
      <button class="btn" onclick="backToLobby()" style="width:100%;max-width:300px;margin:0 auto">← НАЗАД В ЛОББИ</button>
    </div>
  </div>
</div>
<div class="right">
<div class="chat-header"><div class="dot"></div><div class="chat-title">CHAT</div></div>
<div class="chat-body" id="chatBody"><div class="sys-msg">Система: Общий чат — заглушка. Мультиплеер будет с сервером.</div></div>
<div class="chat-input"><input id="chatIn" placeholder="..."><button id="chatBtn">▶</button></div>
</div>
</div>
<script>(function(){var b=document.getElementById('chatBtn'),i=document.getElementById('chatIn'),body=document.getElementById('chatBody');if(!b||!i||!body)return;function send(){var v=i.value.trim();if(!v)return;var d=document.createElement('div');d.className='sys-msg';d.textContent='Ты: '+v;body.appendChild(d);body.scrollTop=9999;i.value='';}b.onclick=send;i.addEventListener('keydown',function(e){if(e.key==='Enter')send();});})();</script>
<div class="result-modal" id="resultModal">
  <div class="result-box">
    <div class="result-icon" id="resultIcon">🏆</div>
    <div class="result-title" id="resultTitle">ПОБЕДА!</div>
    <div class="result-sub" id="resultSub">Ты победил бота</div>
    <div class="result-actions">
      <button class="btn primary" onclick="rematch()">РЕВАНШ</button>
      <button class="btn" onclick="backToLobby()">ЛОББИ</button>
    </div>
  </div>
</div>
<script src="./assets/js/lang.js"></script>
<script src="./assets/js/config.js"></script>
<script src="./assets/js/db/heroes.js"></script>
<script src="./assets/js/db/tiers.js"></script>
<script src="./assets/js/db/resources.js"></script>
<script src="./assets/js/db/items.js"></script>
<script src="./assets/js/db/starter.js"></script>
<script src="./assets/js/db/locations.js"></script>
<script src="./assets/js/db/enemies.js"></script>
<script src="./assets/js/db/missions.js"></script>
<script src="./assets/js/storage.js"></script>
<script src="./assets/js/battle/pvp-engine.js"></script>
<script>
let selectedHero = null;
let selectedDiff = 'medium';
window.CURRENT_DIFF = 'medium';
function getAllHeroes(){
  let list = [];
  try{
    let VH = (typeof VOLAND_HEROES!=='undefined' ? VOLAND_HEROES : (window.VOLAND_HEROES||{}));
    Object.keys(VH).forEach(id=>{
      let h = VH[id];
      list.push({id, n:h.n, role:h.role, img:h.img, st:h.st});
    });
  }catch(e){  }
  return list;
}
function renderHeroGrid(){
  let grid = document.getElementById('heroGrid');
  let heroes = getAllHeroes();
  grid.innerHTML = '';
  heroes.forEach(h=>{
    let div = document.createElement('div');
    div.className = 'hero-card' + (selectedHero===h.id ? ' selected':'');
    div.innerHTML = `<img src="${h.img}" onerror="this.style.display='none'"><div class="hero-name">${h.n}</div><div class="hero-role">${h.role}</div><div class="hero-stats">HP ${h.st.HP} • DMG ${h.st.DMG}<br>DEF ${h.st.DEF} • MANA ${h.st.MANA}</div>`;
    div.onclick = ()=> selectHero(h.id);
    grid.appendChild(div);
  });
}
function selectDiff(diff){
  selectedDiff = diff;
  window.CURRENT_DIFF = diff;
  document.querySelectorAll('.diff-btn').forEach(b=> b.classList.toggle('active', b.dataset.diff===diff));
  updatePreview();
}
function selectHero(id){
  selectedHero = id;
  renderHeroGrid();
  updatePreview();
}
function updatePreview(){
  let section = document.getElementById('previewSection');
  let area = document.getElementById('previewArea');
  let btn = document.getElementById('fightBtn');
  if(!selectedHero){ section.style.display='none'; return; }
  section.style.display='block';
  let heroes = getAllHeroes();
  let botHero = heroes.find(x=>x.id===selectedHero);
  let playerHeroId = 'necro-f-new';
  try{ if(typeof volandGetHeroId==='function') playerHeroId = volandGetHeroId(); }catch(e){}
  let playerHero = heroes.find(x=>x.id===playerHeroId) || heroes[0];
  let mult = selectedDiff==='easy'?0.7 : selectedDiff==='hard'?1.3 : 1.0;
  let botHp = Math.floor(botHero.st.HP * mult);
  let botDmg = Math.floor(botHero.st.DMG * mult);
  let botDef = Math.floor(botHero.st.DEF * mult);
  let diffRU = selectedDiff==='easy'?'ЛЕГКО':selectedDiff==='hard'?'ТЯЖЕЛО':'СРЕДНЕ';
  let diffLabel = (typeof volandT==='function' ? volandT(diffRU, selectedDiff.toUpperCase()) : diffRU);
  let aiRU = selectedDiff==='easy'?'Слабый AI':selectedDiff==='hard'?'Умный AI +30%':'Умный AI';
  let aiEN = selectedDiff==='easy'?'Weak AI':selectedDiff==='hard'?'Smart AI +30%':'Smart AI';
  let aiLabel = (typeof volandT==='function' ? volandT(aiRU, aiEN) : aiRU);
  area.innerHTML = `<div class="preview-card"><img src="${playerHero.img}"><div class="preview-info"><div class="preview-name">${(typeof volandT==='function' ? volandT('ТЫ','YOU') : 'ТЫ')} • ${playerHero.n}</div><div class="preview-role">${playerHero.role}</div><div class="preview-stats">HP ${playerHero.st.HP} • DMG ${playerHero.st.DMG} • DEF ${playerHero.st.DEF}<br>100% • ${(typeof volandT==='function' ? volandT('Твои статы из инвентаря','Your stats from inventory') : 'Твои статы из инвентаря')}</div></div></div><div style="font:900 20px Cinzel Decorative;color:#e6d5a0">VS</div><div class="preview-card" style="border-color:${mult<1?'#3ad080':mult>1?'#e05050':'#e6d5a0'}"><img src="${botHero.img}"><div class="preview-info"><div class="preview-name">${(typeof volandT==='function' ? volandT('БОТ','BOT') : 'БОТ')} • ${botHero.n} • ${diffLabel}</div><div class="preview-role">${botHero.role}</div><div class="preview-stats">HP ${botHp} • DMG ${botDmg} • DEF ${botDef}<br>${Math.round(mult*100)}% • ${aiLabel}</div></div></div>`;
  btn.disabled = false;
  btn.textContent = `${(typeof volandT==='function' ? volandT('БОЙ ПРОТИВ','FIGHT vs') : 'БОЙ ПРОТИВ')} ${botHero.n} • ${diffLabel} ${Math.round(mult*100)}% HPx5`;
  btn.style.display='block';
}
function startFight(){
  if(!selectedHero) return;
  let playerHeroId = 'necro-f-new';
  try{ if(typeof volandGetHeroId==='function') playerHeroId = volandGetHeroId(); }catch(e){}
  document.getElementById('lobby').style.display='none';
  document.getElementById('battleArea').classList.add('active');
  document.getElementById('resultModal').classList.remove('show');
  window.CURRENT_DIFF = selectedDiff;
  if(window.pvpInit) window.pvpInit(playerHeroId, selectedHero, selectedDiff);
}
function backToLobby(){
  document.getElementById('battleArea').classList.remove('active');
  document.getElementById('lobby').style.display='flex';
  document.getElementById('resultModal').classList.remove('show');
  document.getElementById('battleLog').innerHTML='';
}
function rematch(){
  document.getElementById('resultModal').classList.remove('show');
  document.getElementById('battleLog').innerHTML='';
  let playerHeroId = 'necro-f-new';
  try{ if(typeof volandGetHeroId==='function') playerHeroId = volandGetHeroId(); }catch(e){}
  if(window.pvpInit) window.pvpInit(playerHeroId, selectedHero, selectedDiff);
}
document.addEventListener('DOMContentLoaded', ()=>{
  renderHeroGrid();
  updatePreview();
});
setTimeout(()=>{ renderHeroGrid(); }, 200);
</script>
<script src="./assets/js/nav.js"></script>
</body>
</html>
